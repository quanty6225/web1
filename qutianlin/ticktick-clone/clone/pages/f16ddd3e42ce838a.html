。\\n\\n实用功能+1！\\n\\n话不多说，一起来看看如何使用～\\n\\n\\n\\n\\n# 开启课表视图\\n点击「设置」-「导入与关联应用」，找到「课表」，点击按钮即可体验「课表」功能。\\n\\n![l--98.39%](/dida-assets/s3.cn-north-1.amazonaws.com.cn/dida-hc/hc/all/b4b7ea89050449df8be159f5a63ca8f8.png)\\n\\n# 查看课表视图\\n当开启课表视图后，在日历模块中会增加一个课表视图的入口，找到点击即可切换。\\n\\n![m--216.42%](/dida-assets/s3.cn-north-1.amazonaws.com.cn/dida-hc/hc/all/b6a16d1f12dea08b9b5cf6e51efbab07.png)\\n\\n# 添加课程\\n\\n在课表视图点击加号键，输入课程相关信息即可添加课程。课程信息包含课程名称、周数、节数、教室以及老师。\\n\\n![l--101.63%](/dida-assets/s3.cn-north-1.amazonaws.com.cn/dida-hc/hc/all/d78914ab7d1954986670d7e7e2460453.png)\\n\\n# 导入课程\\n\\n## 方式一：图片导入\\n\\n**操作步骤**\\n\\n1. 在日历的课表视图，选择 「立即导入」-「图片导入」。\\n\\n2. 点击 「立即开始」，选择或拍摄一张课表图片进行识别。\\n\\n3. 等待识别完成后，在 「课表预览」 页面检查并修改结果。\\n\\n4. 确认无误后，点击 「导入」 完成操作。\\n\\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/ef656997384258cd28571492e7533860.png)\\n\\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/46fb7d356e10725d43b675754eb2d67d.png)\\n\\n\\n\\n**上传图片要求**\\n\\n为确保系统能够准确识别课表，请在上传前注意以下事项：\\n\\n1. **拍摄**\\n\\n- 确保照片亮度充足、均匀，避免阴影或反光。\\n\\n- 保持画面清晰，避免模糊。\\n\\n- 课表在照片中保持正向，避免过度倾斜或扭曲。\\n\\n- 照片完整呈现课表内容，不遗漏边缘。\\n\\n2. **截图**\\n\\n- 截图内容清晰，文字完整、可读，避免模糊。\\n\\n- 完整截入课表信息，不遗漏上下或左右部分。\\n\\n- 避免截入通知栏、聊天窗口等无关信息。\\n\\n- 确保截图中的课表内容直立、规范，不出现扭曲或倾斜。\\n\\n**推荐课表样式**\\n\\n1. **标准表格型**\\n\\n课表以表格形式呈现，列为星期（如周一至周五）、行为节数，每个单元格包含相应的课程信息（课程名称、教师或教室等）。表格边界清晰，内容完整且排列整齐，便于系统识别。\\n\\n![--63.98%](/dida-assets/cdn.dida365.cn/hc/all/c5beea5d2bf2215dc5c212c9ae8bf532.png)\\n\\n2. **标准列表型**\\n\\n课表以列表形式呈现，第一行为表头，包含课程名称、上课周次、上课节次、上课地点等信息，后续每行对应一堂课程，确保每条课程信息完整且排版整齐，便于系统识别。\\n\\n![--43.2%](/dida-assets/cdn.dida365.cn/hc/all/5194f41e93e84212628ff302e052ff02.png)\\n\\n**常见识别失败原因**\\n\\n以下情况的图片可能无法被系统准确识别：\\n\\n1. **非课表图片**：不是课表图片，图片中没有课程名称、上课周数、上课节次等关键字段的。\\n\\n2. **关键信息缺失**：课程名称、上课周数、上课节次等其他关键信息不完整，被遮挡或截断的。\\n\\n3. **多余或干扰信息**：图片中包含与课表无关的内容。\\n\\n4. **课表方向不正确**：课表旋转或倒置，未保持正向的。\\n\\n5. **非常规样式或样式不规范**：课表布局过于特殊或文字排版混乱。\\n\\n\\n::: spoiler 一次可以识别多张课表图片吗？\\n目前不支持批量识别。请一次上传一张完整的课表图片进行识别。如果您的课表分多张图，请尝试将它们拼接成一张完整的图片后再上传。\\n:::\\n::: spoiler 导入的课程会包含哪些信息？\\n通常包括课程名称、上课周次、上课节次、上课地点和上课老师。系统会尽可能地从图片中提取这些字段，最终导入取决于课表是否包含该信息以及系统能否准确识别和匹配。\\n:::\\n\\n::: spoiler 识别出来的课程信息有误、不完整怎么办？\\n识别完后，请确认识别到的内容是否正确，若发现有识别错误的信息，可以修改后再导入。\\n:::\\n\\n::: spoiler 课程导入成功后，如果课表有变动怎么办？\\n如果后续课表有调整，您可以在课表视图点击课程进入「编辑课程」页面，手动修改相应的信息。\\n:::\\n::: spoiler 我的课表图片上传后会被保存吗？隐私如何保障？\\n请放心，您的课表图片仅用于本次识别过程。识别完成后，图片数据不会被我们存储或用于任何其他用途。所有处理均在安全的环境下进行。\\n:::\\n\\n\\n## 方法二：教务网导入\\n\\n在日历课表视图，点击「立即导入」-「教务网导入」-「立即开始」，选择你的学校，登录教务网站，打开课表界面，点击「确定导入」添加课程。\\n\\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/96e2eea729127731fada047de7326cd1.png)\\n\\n![l--103.89%](/dida-assets/s3.cn-north-1.amazonaws.com.cn/dida-hc/hc/all/da76df46ba4fdba8d5a4a82d07dae4da.png)\\n\\n> 目前我们已经支持近1000所学校课表导入，但是由于教务系统更新等原因，部分学校的课表需要适配才能导入成功，你可以在导入过程中申请适配。\\n\\n# 智能清单中显示课程\\n在课表视图中，点击右上角「...」-「课表管理」中开启「在智能清单中显示课程」。\\n\\n你就能够在“今天”、“明天”、“最近7天”清单中看到课程。\\n\\n![--101.54%](/dida-assets/cdn.dida365.cn/hc/all/695c757a394ef0eb499966b4bef55a40.png)\\n\\n# 在日历中显示课表\\n除了在课表视图查看课程，你也可以开启「在日历中显示课表」，这样就可以在日历中，同时看到课程和任务，方便你更好地管理日程。\\n\\n在「课表视图」中，点击右上角「...」-「课程管理」-「在日历中显示课表」，开启此功能，就能够在周视图中看到课程与任务。\\n\\n\\n\\n![--65.88%](/dida-assets/s3.cn-north-1.amazonaws.com.cn/dida-hc/hc/all/307b6556a78690bc5b8f0abdacbb79b3.png)\\n\\n# 常见问题\\n\\n\\n::: spoiler 如何添加上课提醒？\\n在课表视图界面，点击右上角「...」-「课表管理」-「编辑课表」，可根据自己的习惯设置上课提醒。\\n还能够根据课程情况设置课表名称、开学日期、周数、上课时间等属性。\\n\\n![--65.88%](/dida-assets/s3.cn-north-1.amazonaws.com.cn/dida-hc/hc/all/7230807d1d27e3e98174e809bd3bd5b2.png)\\n:::\\n\\n::: spoiler 如何在日历中显示课表？\\n点击右上角「...」-「课表管理」中开启，在日历中显示课表。\\nPS.此功能为付费功能\\n\\n![--65.88%](/dida-assets/s3.cn-north-1.amazonaws.com.cn/dida-hc/hc/all/307b6556a78690bc5b8f0abdacbb79b3.png)\\n:::\\n\\n\\n\\n::: spoiler 如何在桌面端日历中显示课表？\\n只要你在「课表管理」开启了「在日历中显示课程」功能就能够直接在「显示设置」开启。\\n![--70.93%](/dida-assets/cdn.dida365.cn/hc/all/a79b1104f94e0e13e38ee9679a912831.png)\\n\\n:::\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":228,\"order\":5497558138880,\"status\":0,\"sectionId\":\"special\",\"createdTime\":\"2022-07-06T08:59:47.422Z\",\"modifiedTime\":\"2026-09-29T09:34:25.076Z\",\"postId\":\"6950372717036044288\",\"__v\":0,\"parentId\":null,\"pinInSearch\":false,\"area\":\"help-center\",\"shortTitle\":\"\"},{\"_id\":\"62c6655e1e3a8b2ac64c858c\",\"author\":\"\",\"description\":\"\",\"title\":\"📔 笔记与摘要\",\"content\":\"# 笔记\\n笔记功能，极简、轻巧、易用，你可以用它随时随地收集信息，保存灵感、备忘记事，与待办日程实现深度关联，也可以结合「模板」与「摘要」智能生成周报，高效复盘，不知不觉省下大把时间。\\n\\n### 笔记的适用场景有哪些？\\n这里安利几个常见的应用场景，供大家参考：\\n- 📝「学科素材」——设置独立的清单，专门用于储存某一门课的资料\\n- 📝「每日总结」——可与待办任务混排，用于记录当天的见闻和感悟\\n- 📝「工作复盘」—— 结合强大的任务摘要，追踪工作中的进展与得失\\n\\n\\n## 创建笔记清单\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n在侧边栏点击「添加清单」 - 在「清单类型」一栏中选择「笔记」即可创建一个笔记类型的清单了。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/44ff6f6877dac71c5823a78003e518e7.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n\\n在侧边栏点击清单旁边的「+」选项，之后在「类型」一栏选择「笔记清单」即可成功添加一个笔记类型清单。\\n\\n![--64.31%](/dida-assets/cdn.dida365.cn/hc/all/230c25a3d661517e31ac1a2aa89f7c61.png)\\n::::\\n\\n:::::\\n##  添加笔记\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n在「笔记清单」中，点击右下角添加按钮即可直接添加笔记。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/55d014d3812a04c7d3067912303d0712.png)\\n\\n然后你就可以在笔记界面随心码字了。你可以使用键盘上方的样式菜单，给内容设置加粗、高亮等样式。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/d73cfc88972589f3a45d8b160df80b39.png)\\n\\n\\n在此基础上，还能为笔记添加日期、提醒、标签和模板，就像管理任务一样方便。\\n\\n\\n\\n::::\\n\\n::::tab [desktop]\\n在「笔记清单」中，点击「输入框」编辑笔记名称按「回车键」，即可直接添加笔记。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/dbb90910335aceef9ca69eaaf74f6c8c.png)\\n::::\\n\\n:::::\\n\\n## 用看板视图管理笔记\\n\\n**笔记分类**\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n\\n如何对笔记进行更好地分类管理？\\n\\n在笔记清单列表中点击右上角「...」-「视图」，切换成「看板视图」即可。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/98794d59d685c62cea2921a53a7dc875.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n\\n为了更好地对笔记进行分类管理，你可以在列表中点击右上角「...」-「视图」-「看板视图」，并且按类别设置好分组。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/4df13c38ebf7fdf51de0f1d98ddfab59.png)\\n\\n\\n::::\\n\\n:::::\\n\\n\\n**自定义排序**\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n\\n「分组」和「笔记」都可以自由调整顺序。\\n\\n调整「分组」排序，只需要在列表中点击右上角「...」-「管理分组」，长按分组右侧「 ≡ 」并拖拽即可自定义分组的排序。\\n\\n![40%](/dida-assets/cdn.dida365.cn/hc/all/1927d1891b3471a6b5889e83d5dab861.gif)\\n\\n而修改「笔记」排序，只需要长按「笔记」拖动到对应位置即可。\\n\\n![40%](/dida-assets/cdn.dida365.cn/hc/all/27b97dabb22e460446cc7907d924d917.gif)\\n\\n::::\\n\\n::::tab [desktop]\\n\\n「分组」和「笔记」可以自由拖动，点击并拖拽它们即可自由定义它们的排序。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/1880a9646c65dae356f900065c67de2c.gif)\\n\\n\\n::::\\n\\n:::::\\n\\n\\n\\n## 用模板高效记笔记\\n想更高效地记笔记？一定别错过「模板」这个宝藏功能。\\n\\n你可以将一系列常用流程保存为模板，使之标准化、固定化，如：阅读笔记、会议纪要、每周工作总结等，之后再次用到时，无需手动录入，一键调用即可。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/01f37c5351f059644cbfa1d691b74203.png)\\n\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n进入笔记详情页，点击「使用模板」，已经为大家提前准备了三个预设模板：选中任意一个即可自动添加到笔记中。\\n\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/be81bdbe5d964bef7fefc83cbf918bf3.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n点击输入框右侧「 ⌄ 」，选择从模板添加，选中任意一个，就自动添加到笔记中了。\\n\\n![--73.2%](/dida-assets/cdn.dida365.cn/hc/all/7e860435e2306eaae4609d643f7e70dd.png)\\n>  还可以在「设置」- 「模板」 - 「笔记模板」中可以管理已有的笔记模板。\\n\\n::::\\n\\n:::::\\n\\n\\n你也可以够根据自己的需求不断优化，也可以自定义新的模板。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/9523ebe8a43f70778858ed857ac4970b.png)\\n\\n\\n\\n\\n\\n## 常见问题\\n\\n\\n::: spoiler 笔记和任务是什么关系？\\n\\n任务和笔记是并列的关系，你除了可以创建任务清单（就像你之前熟悉的那样），还能够创建专门的笔记清单，二者主要区别如下：\\n\\n✅ 「任务」：支持勾选完成，用于时间安排、目标拆分、项目管理等。\\n\\n📃 「笔记」：无已完成概念，用于备忘记事、反思总结、知识储存等。\\n\\n![l--71.68%](/dida-assets/cdn.dida365.cn/hc/all/08d0dd24f2bf578986e0e0629e876231.png)\\n\\n:::\\n\\n\\n\\n:::::: spoiler 如何转化任务为笔记？\\n\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n进入任务详情页- 点击右上角「···」 - 「转换为笔记」，可以将当前任务转换为笔记。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/cd15db5e0d222bb3b19212f18073fbda.png)\\n\\n\\n> 任务转换为笔记之后不会自动去到笔记清单内，仍然会保留在原来的清单当中，且带有「子任务」的任务无法转换为笔记。\\n::::\\n\\n::::tab [desktop]\\n进入任务详情页- 点击右下角「···」 - 「转换为笔记」，可以将当前任务转换为笔记。\\n\\n![--73.2%](/dida-assets/cdn.dida365.cn/hc/all/3ce1aab3d250f4eda66683b3e97bc54c.png)\\n\\n\\n> 任务转换为笔记之后不会自动去到笔记清单内，仍然会保留在原来的清单当中，且带有「子任务」的任务无法转换为笔记。::::\\n\\n:::::\\n:::::: \\n\\n\\n\\n\\n\\n# 摘要\\n\\n还在为日报、周报苦恼，任务「摘要」\\n有了这个复盘必备神器，配合笔记功能使用，让工作事半功倍！\\n\\n滴答清单的「摘要功能」能够帮助你了解和总结一段时间内的任务完成情况，并生成可编辑的文本，你可以将其直接添加至笔记页面或拷贝至其他平台。\\n\\n\\n## 显示摘要\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n在笔记清单中点击 「+」图标来创建新的笔记，输入笔记标题后将光标移动到下方笔记描述区域，再点击图中的「摘要预览」图标。\\n\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/04a426e82885df821647d3dc253435e8.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n单击页面左上角头像，进入「设置」-「智能清单」-「摘要」，将摘要状态改为“显示”。设置成功后，「摘要」将出现在左侧边栏顶部。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/9ba16c31c2ffee87a45f77ece2387cd2.png)\\n\\n\\n::::\\n\\n:::::\\n\\n\\n## 插入摘要\\n点击笔记内容区域，选择中间的摘要 icon，进入任务摘要预览页面，点击插入即可。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/801f56cc4ba48766a52ad0bfe9cd97f0.png)\\n\\n\\n\\n> 注：我们支持在摘要中显示专注数据和多级任务的完成情况，并增加了排序规则的种类。需注意的是，移动端有且只有「笔记」支持添加摘要。\\n\\n\\n\\n## 设置内容和格式\\n\\n你可以通过我们提供的功能，快速设置摘要中插入什么内容和格式。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n\\n\\n\\n\\n*  时间区间：你可以选择插入哪个时间段内的任务；\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/0c53b280f197cd9f76e58031fc319078.png)\\n\\n\\n* 显示内容：按照清单、标签、指派人进行筛选；\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/4de96944234fdcf59809d22410dc131f.png)\\n\\n- 显示排序：设置任务的排序方式；\\n\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/f97b1998efc37116acc833e255b5c94b.png)\\n\\n\\n\\n- 显示更多：或者设置显示“完成日期”、“进度”等更多信息；\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/9a888843fbf467827e3dcef3e0c23bcd.png)\\n\\n\\n最后点击「插入」就可以将摘要内容插入笔记了。\\n\\n::::\\n\\n::::tab [desktop]\\n\\n你可以通过以下方式筛选任务：日期、清单、状态；\\n \\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/ac99a11b2a7b0b1f8d592512247f6222.png)\\n\\n\\n\\n在 **更多** 中，还可以根据以下条件筛选：标签、优先级、指派人\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/f70620710676ba1a948298e109d39e99.png)\\n\\n\\n在 **显示设置** 中，你可以：\\n- 选择分组方式（如：按完成状态、按清单）\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/6c6cc89429edab880f2d7a45f95abbb7.png)\\n\\n- 自定义显示内容（如：任务状态、进度等）\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/00ffe84d431567e32790241a49555e56.png)\\n\\n**保存为模板**\\n\\n当你完成筛选条件的配置后，可以一键将其保存为模板，方便下次直接使用。\\n\\n点击模板区域下方的 **「+」** 按钮即可创建新模板。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/d623b02cc61295d815c0a256b417d1a6.png)\\n\\n\\n:::::\\n\\n## 导出摘要\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n如果需要导出摘要，您可以在该笔记中点击右上角「...」- 「分享」来以文本或图片的形式导出摘要。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/fdf4d76387b2176c61c29097cd795c6e.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n打开左侧边栏「摘要」，确定好筛选条件后，点击「保存为」，选择你想要导出的样式即可。\\n\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/5855dd9b1cac25cbeb8ff5c13bb663a2.png)\\n\\n\\n::::\\n\\n::::::\\n\\n\\n# AI 摘要（公测）\\nAI 摘要功能可以帮助你更高效地整理和回顾任务内容。系统会根据已完成的任务，自动提取重点信息并优化表达，生成结构清晰、易于阅读的总结内容。\\n\\n无论是项目收尾、日报撰写，还是每周任务回顾，AI 摘要都能减少手动整理的工作量，提升总结效率。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/a3979c03ee0ef1dea72260dbd41c44f3.png)\\n> 仅 Web 网页端上线\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":138,\"order\":6047313952768,\"status\":0,\"sectionId\":\"special\",\"createdTime\":\"2022-07-07T04:47:26.762Z\",\"modifiedTime\":\"2026-10-07T00:01:42.921Z\",\"postId\":\"6950671600370843648\",\"__v\":0,\"parentId\":null,\"pinInSearch\":false,\"area\":\"help-center\",\"shortTitle\":\"\"},{\"area\":\"help-center\",\"_id\":\"66a8624747c89fff9258f50b\",\"author\":\"\",\"description\":\"\",\"title\":\"👑 成就值与勋章\",\"content\":\"滴答清单的“成就值与勋章”功能，让你的任务管理充满乐趣和成就感。通过积累成就值和解锁勋章，你会发现，完成任务不仅仅是完成，更是一次次的成长和进步。\\n\\n\\n\\n每当你完成一个任务，就能获得成就值，直观地看到自己在时间管理上的进步。[👉 成就值：记录每一个努力的脚步](/dida-help/articles/7223931708330999808)\\n\\n\\n除了成就值，滴答清单还为你准备了各种勋章。每个勋章都是对你出色表现的认可，让你在任务管理之路上充满动力。[👉 勋章：展示你的辉煌成就](/dida-help/articles/7223931722771988480)\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":21,\"order\":6047313952768,\"status\":0,\"pinInSearch\":false,\"sectionId\":\"feature\",\"createdTime\":\"2024-07-30T03:47:19.803Z\",\"modifiedTime\":\"2026-09-21T07:21:20.534Z\",\"postId\":\"7223896922350682112\",\"__v\":0,\"parentId\":null},{\"area\":\"help-center\",\"_id\":\"62c41b4ec3bb3bd197e6e94b\",\"author\":\"\",\"description\":\"\",\"title\":\"从其他应用导入\",\"content\":\"如果你原来在使用其他应用，现在希望转到滴答清单。你可以将原来的使用数据，一键导入滴答清单，目前我们已经支持的产品有：\\n\\n\\n![--73.2%](/dida-assets/cdn.dida365.cn/hc/all/f9860ab180b988fb060a8eec0fcac27d.png)\\n\\n你可以登录网页端，在「设置」 - 「关联与导入」中操作即可。\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":6,\"order\":6597069766656,\"status\":0,\"sectionId\":\"feature\",\"createdTime\":\"2022-07-05T11:06:54.566Z\",\"modifiedTime\":\"2026-09-03T12:14:25.365Z\",\"postId\":\"6950042319731032064\",\"__v\":0,\"parentId\":\"6949998557218734080\",\"pinInSearch\":false},{\"_id\":\"69cb8ecb614517bfb8a8b476\",\"author\":\"\",\"description\":\"\",\"title\":\"🤖️ AI 功能\",\"content\":\"任务任务的效率，不仅在于快速捕捉，也在于智能整理与自动化执行。使用滴答清单的 AI 功能，帮助你从“手动输入”转向“自然表达”——无论是随口说出的待办、会议中的录音，还是让AI直接接管任务操作，都能轻松完成：\\n\\n# 在滴答清单内使用\\n\\n[👉 AI 助手：用自然语言管理任务与时间](/dida-help/articles/7502990612036059136)\\n\\n[👉 AI 语音添加：用自然语言快速创建任务](/dida-help/articles/7444666114547646464)\\n\\n[👉 AI 录音：录音转写与智能总结](/dida-help/articles/7444668968427585536)\\n\\n# 结合外部工具使用\\n\\n[👉 滴答清单 MCP：通过外部 AI 工具管理任务](/dida-help/articles/7438132116019216384)\\n\\n[👉 DIDA CLI：在终端中管理你的任务和项目](/dida-help/articles/7464976698707017728)\\n\\n[👉 AI 实践场景：看看 AI 如何帮你管理任务与时间](/dida-help/articles/7475108284236562432)\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":18,\"order\":7146825580544,\"status\":0,\"pinInSearch\":false,\"sectionId\":\"feature\",\"area\":\"help-center\",\"createdTime\":\"2026-03-31T09:07:23.532Z\",\"modifiedTime\":\"2026-10-01T11:22:34.055Z\",\"postId\":\"7444671678778441728\",\"__v\":0,\"parentId\":null,\"shortTitle\":\"\"},{\"_id\":\"62c3f44e0223aebb27da25ac\",\"author\":\"\",\"description\":\"\",\"title\":\"在第三方日历中订阅滴答清单\",\"content\":\"滴答清单支持生成「URL 链接」，你可以通过这个方式将滴答清单日历同步到 Google、Outlook 等其他日历中。\\n\\n\\n\\n登录滴答清单桌面端， 点击「头像」-「设置」-「关联与导入」，找到「其他」-「订阅滴答清单」。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/975f47ab526de258be9aa144206038e7.png)\\n\\n\\n点击「获取 URL」选择需要订阅的清单，生成对应的 URL 链接，在其他应用输入链接即可完成订阅。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/eb17096a9737fc053ca669fdb5ad9703.png)\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/6820743cb31b0a8b10bd2a9276f5cdf4.png)\\n\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":16,\"order\":7696581394432,\"status\":0,\"sectionId\":\"feature\",\"createdTime\":\"2022-07-05T08:20:30.639Z\",\"modifiedTime\":\"2026-05-08T06:49:12.517Z\",\"postId\":\"6950000444106080256\",\"__v\":0,\"parentId\":\"6949998599191134208\",\"pinInSearch\":false,\"area\":\"help-center\",\"shortTitle\":\"\"},{\"_id\":\"67e1143947c89fff925914d1\",\"author\":\"\",\"description\":\"\",\"title\":\"导入 Apple 健康数据\",\"content\":\"滴答清单现已支持导入 **Apple 健康数据**，你可以在日历视图中查看相关健康信息，以更好地管理时间与健康。\\n\\n> 健康数据同步仅支持 iOS 平台（iOS 16 及以上版本），并且应用版本请更新到v7.5.20或以上。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/df15a84dc2b84b12fae96dbfb61f6cdc.png)\\n\\n\\n\\n# 导入健康数据\\n进入 **「设置」**，选择 **「导入与关联应用」**，点击 **「Apple 健康数据」**，选择需要同步至滴答清单的健康数据。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/c50ed59fc05d780c35692dc9f95489a3.png)\\n\\n# 显示健康数据\\n授权后，数据将在 日历视图 中显示。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/df15a84dc2b84b12fae96dbfb61f6cdc.png)\\n\\n点击单个事件可以查看具体的数据情况。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/ce183514586e0504ae09a8538e1adf15.png)\\n\\n\\n# 专注时间同步到 Apple 健康\\n开启 「专注时间」 功能后，滴答清单的专注时间可同步至 Apple 健康正念中。\\n\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/9cfdfff354e24d3ae469574b7eaae7b8.png)\\n\\n\\n\\n# 常见问题\\n::: spoiler 为什么在电脑端看不到同步数据？\\n目前健康数据仅支持在 iOS 平台显示，暂不支持多端同步。\\n:::\\n\\n::: spoiler 未显示 Apple 健康数据？\\n1. 确保在「苹果系统设置 > 隐私与安全 > 健康」中，已授予滴答清单访问权限。\\n2. 重新授权：在「苹果系统设置 > 健康 > 数据访问与设备」中，移除滴答清单的访问权限，然后重新授权。\\n:::\\n\\n::: spoiler 是否支持同步所有的健康数据？\\n目前支持自动同步“前6个月~最新”的记录。\\n:::\\n\\n::: spoiler 是否可以调整健康数据的显示方式？\\n不支持自定义显示方式，数据默认按 Apple 健康中的记录进行同步和展示。\\n:::\\n\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":3,\"order\":7696581394432,\"status\":0,\"pinInSearch\":false,\"sectionId\":\"feature\",\"createdTime\":\"2025-03-24T08:13:45.553Z\",\"modifiedTime\":\"2026-09-20T08:57:50.001Z\",\"postId\":\"7309849895597244416\",\"__v\":0,\"area\":\"help-center\",\"shortTitle\":\"\",\"parentId\":\"6949998557218734080\"}]"}, "__N_SSP": true}, "page": "/articles/[id]", "query": {"article": {"_id": "638d4bc7a078ed9016ad3b41", "author": "", "description": "", "title": "习惯数据统计", "content": "# 详情页的数据统计\n在习惯详情页的统计中，我们提供了「月度打卡表」和「打卡数据」，你可以随时查看自己的打卡情况。\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n在单个习惯页面中向上滑动就能够看到这个习惯整体的打卡数据。\n![--100%](/dida-assets/cdn.dida365.cn/hc/all/01b70380df1b976437d728b8f6876d37.gif)\n\n::::\n\n::::tab [desktop]\n点击当个习惯就能在右侧查看到习惯整体的打卡数据。\n\n![--58.83%](/dida-assets/cdn.dida365.cn/hc/all/705156aedbf8b669045edce67df3779d.png)\n::::\n\n:::::\n\n## 习惯年度热力图\n在打卡数据中点击「更多」，还能够进入到该习惯的年度热力统计页，方便你回顾这一年的完成情况。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/0b7fdbed441d429a76de6fd88fb0dd05.png)\n\n# 回顾习惯打卡情况\n点击习惯页面中的统计图标，就能够查看到所有习惯的打卡情况。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/5645b386ca6a82b7a32890c7801ed86a.png)\n\n## 周、月视图\n你可以快速查看这周的习惯打卡统计，高级会员还能够直接查看你这一整个月的习惯打卡进度。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/d5ff8be5087693c5f0c890b7ba50b6d3.png)\n\n::: spoiler 如何在电脑端查看周、月视图？\n目前仅支持手机端查看。\n\n:::\n\n## 记录回顾\n在记录中你可以更好的查看到每天习惯的完成情况，点击「>」还能够查看到具体完成的时间轴。\n如果你记录了打卡日志，在时间轴中也能展示出来。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/1f78e2e1a9528358d2d0f5aa0db25573.png)\n", "tags": [""], "hideIndex": true, "favs": 19, "order": 2748779069440, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2022-12-05T01:39:19.483Z", "modifiedTime": "2026-10-09T04:04:12.066Z", "postId": "7005344825801179136", "__v": 0, "parentId": "6950361641582067712", "area": "help-center", "shortTitle": ""}, "isFaved": null, "isSaded": false, "articles": [{"_id": "6a9fb888035abcbe8d77de71", "author": "", "description": "", "title": "AI 助手", "content": "![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/7a0401ea943fcb4a0e75af2b431d2296.png)\n\n面对一件复杂的事情，我们会先列出目标，再一步步拆解需要完成的任务。每天开始工作前，我们会看看今天有哪些事情要做，安排时间和优先级。一段时间之后，也会回顾哪些事情完成了，哪些还需要继续推进。这些计划、执行和复盘，看似简单，却常常需要花费不少时间整理。\n\n现在，你可以把这些事情交给 AI 助手。\n\nAI 助手能够理解你用自然语言描述的需求，并结合滴答清单中的任务、习惯、专注等信息，帮助你规划目标、拆解任务、安排计划和复盘总结，让一切变得更加简单高效。\n\n看看如何使用 👇\n\n# 开启 AI 助手\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n进入「设置」-「功能模块」，找到「AI」，点击前方的加号即可开启 AI 助手。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/eb4448a0c948ab3ff4be1e767505b296.png)\n\n::::\n\n::::tab [desktop]\n\n点击头像进入「设置」-「功能模块」，找到「AI」，点开开关即可开启 AI 助手。\n\n![--80.67%](/dida-assets/cdn.dida365.cn/hc/all/4e65e01698d38b2bd4a21a7e0813b478.png)\n\n开启后，你可以从侧边导航栏进入 AI 助手。\n\n![--67.23%](/dida-assets/cdn.dida365.cn/hc/all/b1dc4075ede80180d102290b16f44db9.png)\n\n在电脑端，你还可以点击页面右下角的悬浮球使用 AI 助手。\n\n![--67.23%](/dida-assets/cdn.dida365.cn/hc/all/21ebc407f2f7d2f1e1a8b15f759e61f3.png)\n\n> 右键点击悬浮球，可以设置贴边隐藏。\n\n::::\n\n:::::\n\n# 使用 AI 助手\n\n你可以随时向 AI 助手发送消息，让 AI 助手为你提供建议，并直接执行滴答清单中的相关操作。无论是拆解项目、创建任务、查询任务或调整计划等，AI 助手都可以帮你完成。\n\n## 发送消息\n\n在输入框描述你的想法或直接输入指令，并点击发送即可。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/d6cf1fcc755374bec80a139e801c1448.png)\n\n\n不知道从哪里开始？点击页面中的「建议操作」，快速体验 AI 助手。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/761275b454b9bef425fd603d59fa233c.png)\n\n## 重新生成回复\n\n如果对 AI 助手的回复不满意，或者之前发送的内容有误，可以通过以下方式重新生成回复。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n- 重试\n\n点击回复下方的「重试」按钮，即可重新生成回复。\n\n![m--216.54%](/dida-assets/cdn.dida365.cn/hc/all/ce0d44d90b5e57d53f8ed1a760efafe8.png)\n\n\n- 编辑\n\n长按已发送的消息，选择「编辑」。修改内容后重新发送，AI 会根据新内容重新生成回复。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/edac664346a559fa5513e38e8b6fc321.png)\n\n::::\n\n::::tab [desktop]\n\n- 重试\n\n点击回复下方的「重试」按钮，即可重新生成回复。\n\n![--67.23%](/dida-assets/cdn.dida365.cn/hc/all/a4905326517e67196146ebddf5e51b89.png)\n\n- 编辑\n\n将光标悬停在已发送的消息上，点击「编辑」按钮修改内容并发送，AI 会根据新内容重新生成回复。\n\n![--67.23%](/dida-assets/cdn.dida365.cn/hc/all/eb86d36c32e0d78741fa464a2e992f8b.png)\n\n::::\n\n:::::\n\n# 管理对话\n\n你与 AI 助手的交流会以“对话”的形式保存。对于不同的话题，你可以分别创建对话，让内容彼此分开，方便回顾与管理。\n\n## 新建对话\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n刚刚聊完工作计划，现在想规划一次旅行？点击右上角「新建会话」按钮，或者点击左上角按钮进入侧边栏，接着点击左下角的「新会话」即可开启一个新对话。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/7fde1c5bd8d495df7c21efc0797adb56.png)\n\n::::\n\n::::tab [desktop]\n\n刚刚聊完工作计划，现在想规划一次旅行？点击左上角「展开」按钮后，点击顶部「新会话」即可开启一个新对话。\n\n![--67.23%](/dida-assets/cdn.dida365.cn/hc/all/af8e9130bd7a75b61948b6009c8d0b4c.png)\n\n::::\n\n:::::\n\n\n## 重命名和删除对话\n\n对话越来越多，列表显得有些杂乱？你可以重命名重要的对话，并删除不再需要的对话。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n点击左上角按钮进入侧边栏，在侧边栏长按某个对话，即可选择「重命名」或「删除」。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/14331bd58a77a15d4e0e1e93750d0669.png)\n\n::::\n\n::::tab [desktop]\n\n将光标悬停在某个对话上，点击右侧的「...」，即可选择「重命名」或「删除」。\n\n![--67.23%](/dida-assets/cdn.dida365.cn/hc/all/ce31210d5977a8304e4f166e39db2410.png)\n\n::::\n\n:::::\n\n# 使用示例\n\n## 清理长期未完成的任务\n\n“僵尸任务”越积越多，清单变得越来越杂乱？\n\n对于长期未完成、反复延期或已经过期的任务，可以让 AI 助手帮你重新审视这些任务，判断哪些应该继续、延期或删除，并整理出下一步真正需要处理的事情。\n\n**尝试以下指令，让 AI 助手帮你清理长期未完成的任务：**\n\n```\n帮我清理一下长期未完成的任务。\n\n1. 找出以下任务：\n - 已经过期的任务\n - 延期多次的任务\n - 很久没有处理的任务\n\n2. 帮我判断这些任务是否还值得继续：\n - 已经不重要的，建议删除\n - 暂时不适合处理的，建议延期\n - 仍然重要的，根据优先级建议合适的时间重新安排\n\n3. 先给我整理结果和处理建议，等我确认后再进行任何修改。\n```\n\n## 整理清单结构\n\n对现有清单不太满意，想重新规划一下结构？ \n\n你可以让 AI 助手根据现有清单与任务，帮你设计更合理的文件夹和清单结构。\n\n**尝试以下指令，让 AI 助手帮你重新整理清单结构：**\n\n> 提示：将「XXX」替换为你想要整理的清单名称，例如“工作”清单。\n\n```\n我想重新整理「XXX」清单中的任务。请分析现有任务的内容和类型，并帮我设计一个更合理的文件夹和清单结构。\n\n1. 找出适合归类到一起的任务。\n2. 根据任务内容和实际使用场景，建议如何创建、合并或调整文件夹和清单。\n3. 告诉我现有任务分别应该归入哪些清单，并说明调整的理由。\n4. 尽量保持结构简单、清晰，避免过多的分类和层级。\n\n请先告诉我具体的调整方案，等我确认后再执行任何修改。\n```\n\n==💡  清单、习惯等内容删除后将无法恢复，请谨慎操作。==\n\n## 制定目标并拆解行动路径\n\n有一个目标，却不知道该从哪里开始？\n\n你可以告诉 AI 助手想要实现的目标，让它帮你从整体目标出发，拆解阶段性目标，再进一步细化为具体任务和长期习惯并添加到滴答清单中。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/537699ed574d50330690402e9668e87b.png)\n\n**尝试以下指令，让 AI 助手帮你拆解目标并制定执行计划：**\n\n> 提示：将「XXX 时间」、「XXX 目标」替换为具体的时间范围和目标，例如“一年内将英语提升到能够用于工作沟通的水平”。\n\n```\n我希望在「XXX 时间」内实现「XXX 目标」。请帮我把这个目标转化为一个清晰、可执行的计划。\n\n1. 明确整体目标和预期结果。\n2. 根据目标拆解出几个循序渐进的阶段，并说明每个阶段的重点。\n3. 选择第一个阶段，进一步拆解成具体、可执行的任务和每周计划。\n4. 根据计划，建议需要建立哪些任务和习惯，并安排合理的时间。\n5. 根据目标的规模和内容，判断是否适合用清单或文件夹来组织。如果适合，请按照合理的结构创建；如果现有结构已经足够，则不需要创建新的清单或文件夹。\n\n请先向我展示完整的目标、阶段和执行计划，并说明建议的清单或文件夹结构。等我确认后，再将确定的任务、习惯和其他内容添加到滴答清单中。\n```\n\n## 制定日 / 周 / 月计划\n\n事情很多，不想一件一件手动安排？\n\n告诉 AI 助手你的计划周期，它可以结合已有任务、优先级等，帮你快速完成时间安排。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/e5cd6a6931690b471d8d48d882ec4522.png)\n\n**尝试以下指令，让 AI 助手帮你规划一段时间内的任务：**\n\n> 提示：将「XXX 时间范围」替换为你想规划的时间范围，例如“明天”“下周”或“下月”。\n\n```\n根据我的未完成任务和优先级，帮我规划「XXX 时间范围」的任务安排。\n\n1. 查询已过期任务，判断哪些删除、哪些延期。\n2. 查询「XXX 时间范围」内已安排时间的任务，算出剩余可用时间。\n3. 查询未安排时间的任务，加上需要延期的任务，综合分析它们的优先级，按优先级确定处理顺序，并将它们合理安排到剩余可用时间中。\n4. 注意：整体安排要注意平衡每天的工作压力，避免任务过于集中。\n\n请先展示哪些已过期任务需要删除或延期，以及完整的任务计划。等我确认后再修改任务。\n```\n\n## 复盘与总结\n\n一段时间过去了，想知道自己做得怎么样？ \n\n你可以让 AI 助手分析你的任务完成情况、习惯和专注记录，从完成情况出发发现问题，并进一步制定下一步计划。\n\n**尝试以下指令，让 AI 助手帮你完成一次复盘：**\n\n> 提示：将「XXX 时间范围」替换为你想复盘的时间范围，例如“今天”“本周”或“本月”。\n\n```\n根据「XXX 时间范围」内的任务完成情况、习惯记录和专注记录，帮我做一次复盘。\n\n1. 总结这段时间完成得比较好的地方，以及值得保持的做法。\n2. 分析未完成的任务和未坚持的习惯，结合任务安排、优先级和专注记录，找出可能的原因。\n3. 总结这段时间最值得关注的问题，以及可以继续保持和需要改进的地方。\n4. 根据复盘结果，给出具体的改进和优化建议，可以从任务安排、工作节奏、工作方法等方面向我提出建议。\n```\n\n# 常见问题\n::: spoiler AI 助手是否有使用额度？\n有。AI 相关功能共用 AI 额度，额度按月计算。你可以前往「设置」-「AI 功能」查看当前额度使用情况。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/8a14f1ed776e770d2fd3de0ea64c96a8.png)\n\n当达到当月额度上限后，AI 功能将暂时无法使用，额度会在下个月恢复。\n:::\n\n::: spoiler AI 助手和滴答清单 MCP / CLI 有什么区别？\n\nAI 助手主要用于在滴答清单应用内，直接借助 AI 更方便地管理任务、习惯、专注记录等内容，无需额外配置。\n\nMCP 和 CLI 则更适合希望在其他 AI 平台或工具中使用滴答清单的用户。通过滴答清单 MCP / CLI，你可以在第三方平台中使用滴答清单，并根据自己的需求搭建自定义工作流。\n\n简单来说：\n\n- AI 助手：在滴答清单内使用，更方便、更直接。\n\n- MCP / CLI：在第三方平台或工具中使用，更自由。\n\n> 我们将持续优化 AI 助手的使用体验，推出更多功能。\n\n:::\n\n::: spoiler 为什么我找不到 AI 助手入口？\n\n如果找不到 AI 助手入口，请先确认滴答清单是否已更新至最新版本，因为当前版本可能尚未支持 AI 助手。\n\n如果更新后仍找不到 AI 助手入口，可能是因为当前设备的系统版本不支持 AI 助手。目前以下版本暂不支持：\n\n- iOS 15 及以下\n\n- Android 8 及以下\n\n- macOS 13.3 及以下\n\n- Windows 10 以下\n\n:::\n\n", "tags": [""], "hideIndex": true, "favs": 2, "order": -108851651149824, "status": 0, "pinInSearch": false, "sectionId": "feature", "area": "help-center", "createdTime": "2026-09-08T07:26:00.733Z", "modifiedTime": "2026-10-11T14:14:55.404Z", "postId": "7502990612036059136", "__v": 0, "shortTitle": "", "parentId": "7444671678778441728"}, {"_id": "69cb899c614517bfb8a8b43b", "author": "", "description": "", "title": "AI 语音添加任务", "content": "使用语音添加任务时，你可以开启「**AI 模式**」。开启后，只需自然地说出你的想法，AI 就能自动提取任务标题，并识别日期、时间、清单、标签、优先级等信息。当一段话中包含多件事情时，还会自动拆分为多条任务，**让记录和整理任务变得更轻松**。\n\n# 开启 AI 模式\n\n语音添加「长按模式」和「录音模式」均支持开启 AI 模式，你可以根据使用习惯自由选择。\n\n## 在「长按模式」中开启\n\n长按「+」输入语音后松手将进入任务保存页面，此时你可以在页面右上角开启「AI 模式」。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/fe6bca0122c03d58543a10317844f1f8.png)\n\n## 在「录音模式」中开启\n\n长按「+」按钮后向左拖动进入录音模式，进入录音模式后，即可在页面左上角点击开启「AI 模式」。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/a7c53d7b85d83916258d1a64713023de.png)\n\n> 💡 AI 模式的开关状态会被自动保存，下次使用时会保持上一次的设置，无需重复开启。\n\n# 添加单条任务\n\n开启 AI 模式后，你只需要自然地说出一句话，AI 就会帮你整理成一条完整的任务。例如：\n\n> “明天上午九点提醒我回复重要客户的邮件，对方今天已催促。”\n\nAI 会自动识别任务内容、时间、优先级等信息，并生成对应的任务，确认无误后，点击「保存」即可完成创建。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/c701d75e058cbfd6823dd0a250d4b1e6.png)\n\n# 添加多条任务\n\n当你脑子里有很多零散想法时，也可以直接说出来，AI 会自动理解语义并拆分为多条任务，并提取对应的时间、优先级等信息，在保存页面统一展示。例如，在睡前整理思绪，或在会议结束后集中记录待办事项，都可以通过 AI 模式一次性完成输入。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/03744c4951472e0526fd0178e07f0cc5.png)\n\n你可以逐条检查识别结果，长按删除不需要的任务。确认无误后，点击「保存」，即可一次性完成添加。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/49fbd45d6b081cd2f6a2d4cf59a8b572.png)\n\n\n> 💡 如果 AI 对是否拆分任务存在不确定，可能会提供两个版本供你选择。此时你可以左右滑动切换，选择符合期望的版本保存。\n\n# 长语音记录灵感\n\n当你有一段较长的灵感或者其他需要记录的内容时，你可以直接说出来。AI 会帮你智能提炼一个简洁的标题，并将完整内容转写后保存到任务描述中，便于后续回顾与整理。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/db69ac7c0989efb58e694c3912271375.png)\n\n# 常见问题\n\n\n::: spoiler AI 处理需要多久？\n通常在 1～2 秒内完成。如果语音内容较长或结构较复杂，可能需要 3～5 秒。\n:::\n\n::: spoiler AI 处理失败怎么办？\n当出现网络异常或服务繁忙时，AI 可能处理失败。此时会自动回退到普通模式，并显示原始语音文本，你仍然可以正常保存任务，也可以再次开启「AI 模式」进行重试。\n:::\n\n::: spoiler AI 模式有使用次数的限制吗？\nAI 模式每月提供一定的使用额度。当月额度用完后，会提示「已达到本月 AI 使用上限」，额度将在次月自动恢复。\n:::\n\n::: spoiler 我的语音数据安全吗？\n你的语音数据仅用于当前任务的处理，不会被保存，也不会用于 AI 模型训练，请放心使用。\n:::", "tags": [""], "hideIndex": true, "favs": 8, "order": -107752139522048, "status": 0, "pinInSearch": false, "sectionId": "feature", "area": "help-center", "createdTime": "2026-03-31T08:45:16.910Z", "modifiedTime": "2026-08-27T10:06:09.837Z", "postId": "7444666114547646464", "__v": 0, "shortTitle": "", "parentId": "7444671678778441728"}, {"area": "help-center", "_id": "66a882ad47c89fff9258f5a9", "author": "", "description": "", "title": "成就值", "content": "\n有时候，仅仅知道这周比上周多完成了几个任务远远不够，您无法只根据两个数字判断效率是否提升。这次，滴答清单想要帮助您了解效率的变化，所以丰富了统计的内容，并引入“成就值”来展示结果。\n\n成就值与完成任务、任务拖延直接相关，能科学、直观地反馈出效率提升与否，在一定程度上激励你合理规划每天的任务并按时完成。你完成的越多，成就值越高；你产生了拖延，成就值就会降低。随着成就值的增长，成就等级对应提升，你也能为自己的付出获得相应的奖励。\n\n# 成就等级\n\n![--68.52%](/dida-assets/cdn.dida365.cn/hc/all/98b9e75b6bdb1652c94877d104ffa785.png)\n\n滴答清单将成就等级精简划分为了 12 个等级。一切与达成目标无关的行为，将不会对成就值产生影响，因此提升成就值的难度变高了，但同时努力的人也会更容易与其他人拉开差距。\n\n接下来，你将了解到成就值是如何变化的。\n\n- 当你达成目标时，能挣得相应的成就值，如添加任务/完成任务时。\n\n- 当你产生怠惰时，会损失掉一部分成就值，如有未处理的已过期的任务时。\n\n🌟 按时完成任务将获得更多的成就提升；成就值并非实时更新，滴答清单会于每天凌晨00:00更新成就值。\n\n为了让成就值只与你个人行为相关，滴答清单规避了共享清单中他人对你的影响。如果被指派给他人的任务产生拖延，你的成就值不会损耗。同样的，他人在共享清单中添加任务、完成任务等，也不会提升你的成就值。\n\n\n# 任务完成趋势&完成率\n\n你可以直观地看到本日/本周/本月的任务完成数量的变化趋势。\n\n为了帮你追踪效率变化，完成率统计则能帮助你了解目标达成情况。你在本日/本周/本月实际完成的任务，和你原本安排在对应时间的任务的比值，即是你完成率。\n\n滴答清单希望用一个相对精准的数字帮助你做好本周总结，而不是不痛不痒地看着“今天”里有多少已完成和已过期任务。你可以明确地看到上周完成率是80%、这周完成率是90%，从而督促自己认真规划、按时完成。", "tags": [""], "hideIndex": true, "favs": 359, "order": -72567767433216, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2024-07-30T06:05:33.427Z", "modifiedTime": "2026-10-13T04:02:07.677Z", "postId": "7223931708330999808", "__v": 0, "parentId": "7223896922350682112"}, {"_id": "66a882b047c89fff9258f5b2", "author": "", "description": "", "title": "勋章", "content": "勋章是对你某一项成就的嘉奖，让你在使用滴答的过程中每一份坚持都有迹可循。你在滴答付费的时长、将滴答推荐给好友、使用滴答的时长、完成的任务、养成的习惯、专注的时长就都可以自动兑换成勋章。\n\n共有以下几种类型的勋章：\n\n![--69.8%](/dida-assets/cdn.dida365.cn/hc/all/5ab4c78333c6b4481c0a29119ab96c96.png)\n\n## VIP\n累计充值会员时长达到1、12、24、36、72、144个月，即可获得对应等级的勋章。\n\n![--37.91%](/dida-assets/cdn.dida365.cn/hc/all/bf1593c452600c81343393fa2410a6a6.png)\n\n## 天天向上\n\n累计使用滴答3、7、21、50、200、1000天，即可获得对应等级的勋章。每天打开滴答清单，即视为使用。\n\n![--37.73%](/dida-assets/cdn.dida365.cn/hc/all/1c27785e45992734b3f1f2d075a98f87.png)\n\n## 雷厉风行\n\n累计完成任务5、10、50、200、1000、5000个即可获得对应等级的勋章。每日上限为50个，超过上限不计入勋章统计。\n\n![--42.91%](/dida-assets/cdn.dida365.cn/hc/all/4a87380d9bc53a29602667945f3496cb.png)\n\n## 心无旁骛\n\n累计专注时长25、100、500、2000、10000、50000分钟即可获得对应等级的勋章。番茄专注和正计时的时长都可算作有效时长，无效的番茄时长不计入。\n\n![--42.91%](/dida-assets/cdn.dida365.cn/hc/all/b5167264bac0248ccf5270376826d6f4.png)\n\n\n## 严于律己\n\n累计打卡3、7、21、100、500、2000次即可获得对应等级的勋章。每日上限为10次，超过上限不计入勋章统计。\n\n![--42.91%](/dida-assets/cdn.dida365.cn/hc/all/8a1494f310bf07d37bb27d6ff1b64753.png)\n\n\n## 助人为乐\n\n累计成功邀请1、5、20、100、500、1000人即可获得对应等级的勋章。好友注册滴答清单即可算作成功邀请。\n\n![--38.24%](/dida-assets/cdn.dida365.cn/hc/all/dc7a9e99d9c1e612d725c7e022ff79c5.png)", "tags": [""], "hideIndex": true, "favs": 78, "order": -71468255805440, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2024-07-30T06:05:36.870Z", "modifiedTime": "2026-10-12T23:07:07.040Z", "postId": "7223931722771988480", "__v": 0, "parentId": "7223896922350682112", "area": "help-center", "shortTitle": ""}, {"area": "help-center", "_id": "63bf6c2ba078ed9016ad4064", "author": "", "description": "", "title": "⏳ 时间线视图", "content": "![100%](/dida-assets/cdn.dida365.cn/hc/all/09d3e02e9a6a11a0fad546ddaa87eebb.jpeg)\n\n\n**时间线视图**是一个简单的可视化图表，项目中所有的任务按照制定的时间顺序展示。当你在清单中开启了时间线视图，任务就会显示在横向的时间线中。\n\n使用「时间线视图」，你可以在项目管理中非常直观地看到各任务到来的时间和截止的时间、各任务在整个项目中所处的位置，还可以快速了解每个人的工作进度，以便及时调整工作计划。也可以在一个更长的时间范围内，规划安排工作和生活。\n\n现在，让我们来看看如何使用它吧👇\n\n# 开启时间线视图\n\n:::::tabContainer [desktop|mobile]\n\n::::tab [desktop]\n点击任意一个「普通清单」、「文件夹」或者「过滤器」，找到右上角「...」-「视图」-「时间线视图」即可开启。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/222c9a99f99b849b9cacfc9f2d82c169.jpg)\n::::\n\n::::tab [mobile]\n点击任意一个「普通清单」、「文件夹」或者「过滤器」，找到右上角「...」-「视图」-「时间线视图」即可开启。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/ada6522fc362108d3d06e36fe022dba1.png)\n\n\n::::\n\n:::::\n\n\n::: spoiler 为什么找不到「时间线视图」？\n\n只有普通清单才支持切换视图，「今天」、「明天」、「最近7天」等智能清单暂不支持时间线视图。\n\n:::\n\n\n# 常用操作与技巧\n\n## 创建与修改任务\n\n:::::tabContainer [desktop|mobile]\n\n::::tab [desktop]\n\n**创建任务**\n\n在时间线视图中，添加任务非常简单，你可以单击空白区域，直接添加任务，任务会根据你点击的日期，自动带上时间。\n\n例如，图中在4月2日添加的任务，会自动设置4月2日。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/c0808464223b90e206ab99bc65ce9e63.gif)\n\n**安排任务**\n\n时间线视图只能显示有时间的任务，没有时间的任务会显示在右侧的安排任务中。\n\n你可以通过拖动，直接将任务安排到时间线中，设置好时间。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/1a7c74dab98a562ec42e66093fd81450.gif)\n\n**修改任务时长**\n\n在时间线视图中，任务的长度，代表了任务的时长。 \n\n如果你想对任务的时长进行调整，只需要将鼠标移动到任务边缘拖动即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/ee1fb577ef646c851c4462da4a50600d.gif)\n\n**修改任务时间**\n\n任务的位置，代表着任务的开始时间和结束时间。 \n\n当任务时间需要调整时，你只需要单击按住任务，将任务拖动到对应的位置即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/74a8a1f709767ab41667213eff215ca2.gif)\n\n拖动后，任务会根据你松手的位置自动对应的时间。\n\n::::\n\n::::tab [mobile]\n\n**创建任务**\n\n在时间线视图中，你可以通过长按空白区域，直接添加任务。\n\n任务会根据你点击的日期，自动带上时间。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/586bfe5d4d4bc148c0b485021b75e3d7.gif)\n\n\n**修改任务时长**\n\n任务的长度，代表了任务的时长。 如果你想对任务的时长进行调整，只需要长按任务后拖动任务边缘即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/cf794b634e5cdfd9efb7b4a07dd2e6b0.gif)\n\n\n\n**修改任务时间**\n\n任务的位置，代表着任务时间。 当任务时间需要调整时，你只需要按住任务，将任务拖动到对应的位置即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/a188ab9a663495939a54fca708dd0e3e.gif)\n\n\n\n::::\n\n:::::\n\n\n## 查看任务\n\n:::::tabContainer [desktop|mobile]\n\n::::tab [desktop]\n\n**滑动查看**\n\n按住鼠标左右滑动，即可拉动时间线，在时间线中查看数周、数月的任务。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/41e61c6793bb087807ffa58425468796.gif)\n\n**切换显示比例**\n\n当任务时间跨度较大时，你可以通过点击视图右上角的「日」、「周」、「月」来调整显示比例。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/f72695e1f27655dc15a6b9eaa056125c.gif)\n\n\n::::\n\n::::tab [mobile]\n\n**滑动查看**\n\n轻触屏幕左右滑动，即可拉动时间线，在时间线中查看数周、数月的任务。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/72ab4a4eba839fddb770dd99f6769eb4.gif)\n\n\n\n\n**切换显示比例**\n\n当任务时间跨度较大时，你可以通过点击视图右上角的「日」、「周」、「月」来调整显示比例。\n\n也可以双指捏和放大时间跨度，双指外划缩小时间跨度。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/c9c34eb65d48100199d10a931cd78b16.gif)\n\n\n\n\n::::\n\n:::::\n\n\n\n# 使用场景推荐\n\n**安排个人工作**\n\n将「💪🏻 工作」设置成一个文件夹，再将常规的工作按类别分为几个清单。\n\n将每月、每天的任务分配在各个清单板块中，即可让你对每天、每月的工作有清晰的了解，做到真正的心中有数！\n\n![](/dida-assets/cdn.dida365.cn/hc/all/a3f271ebf06ea2bb55d2465dd3abbf84.jpg)\n\n\n\n\n**管理复杂项目**\n\n先建立一个项目清单，再将所有需要参与到此项目中的团队都建立一个分组，然后开启时间线视图，即可让你迅速了解各团队的工作进度。\n\n为了更好的团队协作，你还可以将这个任务清单共享给各团队负责人并且将对应的任务直接指派给他。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/886a24b0ba19dcbc8f748917d9395d1b.jpg)\n\n\n\n\n**制定生活计划**\n\n我们还可以使用时间线视图来做月度计划、复习计划、备婚计划、装修计划等等等等。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/d3f2839c461577f291112fe449d12d96.jpg)\n\n\n\n\n# 常见问题\n::: spoiler 移动端时间线视图支持横屏吗？\n支持，旋转手机至横屏即可。\n:::\n::: spoiler 如何修改视图中任务块的颜色？\n在时间线视图中，找到右上角「...」-「显示设置」即可设置任务块颜色。\n:::\n\n\n\n\n\n\n", "tags": [""], "hideIndex": true, "favs": 50, "order": -57174604644352, "status": 0, "pinInSearch": false, "sectionId": "special", "createdTime": "2023-01-12T02:10:51.948Z", "modifiedTime": "2026-08-26T12:46:58.884Z", "postId": "7019123502271692800", "__v": 0}, {"_id": "62c676211e3a8b2ac64c85d0", "author": "", "description": "", "title": "👋 新手指南", "content": "![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/b01e1123f5f733b89f33b1f2ba53dd90.jpg)\n# 滴答清单是什么？\n滴答清单是一款简单好用的时间管理工具。包括任务、日历、四象限、番茄专注、习惯打卡等功能模块，你可以用它管理自己的工作、生活。用更少的时间达成目标，从冗杂的待办事项中解脱出来。\n\n入门小视频\n:::::tabContainer [iOS|Android]\n\n::::tab [iOS]\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/05aae659918b26319fc8dd16dade4b3f.mp4\n:::\n\n::::\n\n::::tab [Android]\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/a3bd0b1f4b00a12cb97a9ba92354fea7.mp4\n:::\n\n::::\n:::::\n\n\n## 待办清单，节省脑力\n把脑子里的事情都写下来，让你每天都能够清楚知道自己一天所需要完成的任务。\n\n![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/7b52ea2411cb8c8407f7b459913dbe0e.jpg)\n\n\n## 日程安排，一目了然\n你可以直观地查看各月、各天的日程，不会再为“接下来做什么”而迷茫。\n\n![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/1e29d2b607e71b556fea2e46830ec0a5.jpg)\n\n\n## 象限管理，效率倍增\n四象限能够帮助你将任务按照重要和紧急两个程度划分，帮助你更高效。\n\n![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/40da317475a79b0e0067cad4f3f8992f.jpg)\n\n\n## 高效专注，拯救拖延\n开启番茄计时，以25分钟为一个维度来进行专注，帮助你集中精力搞定一件事情。\n\n![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/09432fb3da82e277b74dd77e48ee8e5e.jpg)\n\n\n## 坚持习惯，提升自我\n习惯库中准备了60多个习惯，你可以从中选择你需要的习惯，设定一个小目标！\n\n![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/e5fddd11efd212bd87ac89fca0e923f2.jpg)\n\n\n# 我可以如何使用？\n\n## 📝 收集任务\n\n### 从添加一个任务开始\n\n\n大脑是处理器，而不是存储器。把所有你要做的任务添加进「收集箱」中，清空大脑。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/d0556075f525094cc239e8f5830e2284.mp4\n:::\n\n- 在添加任务时，请确保你的任务是清晰、可执行的。例如你应该尽量写“晚上8点阅读《小王子》60分钟”，而不是只写“阅读”。\n\n### 搭建你的清单体系\n\n\n建立清单可以让你的任务被有序分类，这样你就能快速区分不同项目的任务了。\n\n点击侧边栏左下角的「添加清单」可以自由创建清单，创建清单时你可以选择清单的图标、颜色以及查看它的视图。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/4891664a9ae05d3512757aae25a4451c.mp4\n:::\n\n- 在搭建清单体系时，你可以按照项目将清单设置为“工作”、“生活”、“成长”等，也可以按照时间将清单设置为“本周”、“下周”、“本月”、“下月”，或者其他实用的清单划分方式。\n\n## 🎯 整理任务并组织为行动\n\n### 移动任务至具体清单\n\n如果你习惯将任务暂放在「收集箱」中，则需要定期检查收集箱中的任务。检查时，你可以将要执行的任务移动至具体的清单项目中，对不再执行的任务进行「删除」或者「放弃」操作。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/829c301ccd66323146e1fd8deaaf46de.mp4\n:::\n\n- 你也可以在收集任务时直接将任务添加进对应的项目清单中，这一步即可忽略。\n\n### 拆解任务为子任务\n\n任务的可执行性与任务的具体程度呈正相关，在整理任务时，你可以将任务拆解为若干子任务以提高你的执行程度。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/c33a130d0e84c115915e2f982ec0643a.mp4\n:::\n\n- 子任务下还能添加子任务，最高可以有 5 级。\n\n### 设置任务日期&时间、提醒&重复\n\n如何让自己更好地知道什么时候该做什么事？现在，给任务设置好日期与时间吧！\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/a9355bd516789079aae52be191f8697e.mp4\n:::\n\n\n滴答清单也提供提醒功能以及丰富多样的重复方式，再也不怕遗忘重要事项了。比如，你可以将“部门例会”设置为每周四重复，一次设置一劳永逸。\n\n- 在添加任务时输入时间可以智能识别，例如“明天早上 9 点开会”将会自动添加明天早上9点的时间。\n\n### 安排你的一天\n\n在每天工作开始前，你不需要再刻意查看项目清单，只需要打开「今天」智能清单即可快速浏览今日任务。\n\n在「今天」清单中，你还可以选择不同的分组排序方式，让你最邻近或者优先级最高的任务呈现在顶部，这样你就知道该把时间花在哪里了。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/d59fca7a6ea96d81a1a23eff513cccc8.mp4\n:::\n\n- 清单分为「智能清单」和「普通清单」，“今天”、“明天”、“最近七天”等「智能清单」将智能呈现符合条件的任务。\n\n## 💪 执行并且回顾\n\n### 四象限：让你效率翻倍\n\n如果你经常很忙碌觉得时间不够用，回过头发现做了很多没有那么重要的事情，那么强烈建议你试试「四象限」把任务按照优先等级进行分配。\n\n- 把80%的精力给重要且紧急的事情\n\n- 有时间再完成不重要不紧急的事情\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/2f860d5a5e73c0db1cb140b7ed88e92b.mp4\n:::\n\n- 你可以根据自己的需求，随心所欲定制每个象限的规则。\n\n### 番茄专注：高效利用时间\n\n事情一拖再拖，无法开始行动？推荐你使用番茄工作法帮助你在工作或学习中暂时远离手机，静心沉浸在高效氛围中。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/ab3e94bd6261ab46a7a70bb5c9909a4f.mp4\n:::\n\n- 点击屏幕进入全屏模式，向左滑动可切换「翻页钟」或者「像素时钟」样式。\n\n### 日历：做好时间规划\n\n在「日历视图」中规划近期的日程计划，用不同的颜色区分各事项能够方便你查看到各个时间段的任务安排，你也能够通过视图帮助你更好地回顾复盘。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/97e6e2b5379501e7a996ddf689742587.mp4\n:::\n\n- 将不同的清单设置成不同的颜色，即可在日历视图中实现不同颜色区分哦。\n\n### 时间线与看板视图：进行项目管理\n\n如果你是产品经理或者项目经理，你可以使用「时间线视图」帮助你更好地规划项目周期，更加清晰地了解项目进度。\n\n你想要更好的管理这个项目，还可以将这个任务清单共享给各团队负责人并且将对应的任务直接指派给他。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/93a338a3c31ecdc32421d0c30a5961a8.mp4\n:::\n\n同样在我们的日常工作中你也可以使用时间线视图来进行婚礼筹备、装修管理、健身计划等等时间周期较长的项目。\n\n当然你也可以通过「看板视图」一目了然的查看到各任务进程，比如：打开工作文件夹中选择看板视图，一眼看去就能清楚知道近期有哪些重点工作，有哪些在跟进的任务，具体都有哪些，以及各任务的完成状况。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/48a6614f2f452f2a87306ab59551591a.mp4\n:::\n\n- 在「今天」「最近7天」等智能清单、文件夹以及标签中使用看板，帮助你更好地分类管理任务。\n\n\n# 大家都在怎么用？\n\n想了解更多大家都是怎么使用滴答清单的，可以看这里。\n\n[ 👉 最佳实践](/articles/6950689216619610112)\n\n\n这里汇集了不同年龄、不同职业的用户，在工作、生活、学习上的使用心得。\n\n![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/a018cd28a02675a2659f6b9b9fe94e07.jpg)\n\n\n# 关注滴答清单\n想获取更多应用更新消息和时间管理方法，可以在社交媒体上关注我们。\n* 微信公众号：滴答清单\n* 微信订阅号：滴答清单君\n* 小红书：滴答清单\n* 微博：[@滴答清单](https://weibo.com/u/3495327284)\n\n\n", "tags": [""], "hideIndex": true, "favs": 690, "order": -36283883716608, "status": 0, "sectionId": "faq", "createdTime": "2022-07-07T05:58:57.870Z", "modifiedTime": "2026-10-13T01:42:05.011Z", "postId": "6950689598586486784", "__v": 0, "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c675c61e3a8b2ac64c85c3", "author": "", "description": "", "title": "🏅 最佳实践", "content": "![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/a018cd28a02675a2659f6b9b9fe94e07.jpg)\n\n\n#  ⏰ 时间管理方法论\n\n\n[1. 如何告别拖延症？](/dida-help/external/articles/7391652139233181696)\n\n[2. 如何科学提升专注力？](/dida-help/external/ar qq.com/s/CzBgQG_knE8z6Kc8_GxuJQ)\n\n\n# ✨ 其他实用场景安利\n\n在这里也给大家准备了一些具体的使用场景，快速查看[👉🏻 [🗂 实用模板]](/dida-help/external/articles/7065212931289382912)", "tags": [""], "hideIndex": true, "favs": 1233, "order": -35184372088832, "status": 0, "sectionId": "faq", "createdTime": "2022-07-07T05:57:26.803Z", "modifiedTime": "2026-10-12T14:56:39.361Z", "postId": "6950689216619610112", "__v": 0, "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c663ff1e3a8b2ac64c8556", "author": "", "description": "", "title": "🔍 常见问题", "content": "![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/afe4ec5d22de3ceb3ede766ea6b598f8.jpg)\n# 🔥 热点问题\n::: spoiler 如何备份数据？\n你可以登录 Web 端进行数据备份。\n\n- 登录帐号 - 点击左上角「头像」 -「设置」-「账户与安全」-「备份与还原」-「生成备份」，即可将数据备份保存至本地。\n\n![--66.87%](/dida-assets/cdn.dida365.cn/hc/all/83ef4d38d1583037fe4a8d34782165a4.png)\n\n:::\n\n::: spoiler 如何合并账号数据？\n如果你想合并两个账号的数据，可以先备份一个账号的数据，然后将备份好的数据导入另一个账号。\n1. 备份数据：登录 Web 端 ，点击头像 -「设置」-「账户与安全」-「备份与还原」-「生成备份」来保存备份数据；\n2. 导入备份：在 Web 端登录需要导入数据的账号，点击头像 -「设置」-「账户与安全」-「备份与还原」-「导入本地备份」完成合并。\n:::\n\n::::: spoiler 如何在任务中添加图片或附件？\n滴答清单支持在任务中添加图片和附件。附件上传成功后会自动同步到各个平台，普通会员上传的每个图片或附件的大小限制为 10 MB，高级会员的为 20 MB。\n> 高级会员一天最多可上传 99 个附件或图片，普通用户一天限制上传 1 个。\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击任务 - 右上角「···」-「附件」，即可添加图片或附件。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/42d89a95052c086f48f9770ce7e69663.png)\n\n::::\n\n::::tab [desktop]\n- 方式一：点击任务 - 右下方「···」-「上传附件」，即可添加附件。\n- 方式二：通过粘贴复制快捷键（ Ctrl + C / Ctrl + V ）可直接在任务详情页添加图片。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/da6d931d37930c94ef0763b0c87b7548.png)\n\n\n\n::::\n:::::\n\n:::::spoiler 如何将手表连接滴答清单？\n:::::tabContainer [iOS|华为|小米]\n\n::::tab [iOS]\n在手机中下载安装「滴答清单」，在手表上即可同步显示。\n::::\n\n::::tab [华为]\n1. 手机、手表都在「华为应用市场」中下载「滴答清单」\n2. 打开应用，成功登录账号后，应用内会出现一个「连接智能设备」的选项，点击连接即可。\n::::\n\n::::tab [小米]\n1. 在小米手机的应用商店中下载「滴答清单」，然后使用小米运动健康 APP。\n2. 在手表上下载安装「滴答清单」。\n3. 分别打开手机上和手表上的滴答清单就可以正常使用。\n::::\n:::::\n\n\n\n::::: spoiler 如何在日历中查看打卡、专注记录？\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n在日历视图，点击右上角「···」-「显示设置」，开启「显示习惯」、「显示专注记录」，即可在日历中查看记录。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/d001cead51b9b4aadf3fda999778dffc.png)\n\n::::\n\n::::tab [desktop]\n在日历视图，点击右侧「显示设置」，开启「显示习惯」、「显示专注记录」，即可在日历中查看记录。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/3b2c937fa072c15d6c9dba1ba5924dd6.png)\n\n:::::\n\n\n::: spoiler 滴答清单是否有教育优惠？\n我们始终相信教育事业能给个人、给世界带来美好的变化，并希望能帮助更多学生和教职工管理好学习和生活、迎接挑战、达成目标。\n\n为此，我们特意推出教育优惠：在校学生和教职工可以获得滴答清单高级会员七五折优惠。\n\n你可以使用尾缀为 edu.cn、csss.cn 和 ucas.ac.cn 的教育邮箱注册，或将当前账号切换为你的教育邮箱，再进行申请。\n\n了解具体步骤和详细内容请点击 [教育优惠](https://www.dida365.com/education) 查看。\n:::\n\n\n\n::: spoiler 如何在使用微信创建任务？\n1. 使用微信快捷方式登录滴答清单。\n2. 微信扫描下方二维码，或者搜索“滴答清单”公众号，关注“滴答清单”。\n3. 关注成功后，向公众号发送信息或语音，即可轻松创建成功。\n\n![s](/dida-assets/cdn.dida365.cn/hc/all/6c813e24aacd976ae6064c2689d5b0d4.jpg)\n:::\n\n::::: spoiler 任务到期不提醒?\n:::::tabContainer [Android|iOS]\n\n::::tab [Android]\n由于 Android 系统安全服务和第三方安全应用可能会影响滴答清单的提醒功能，请先根据以下步骤进行检查： \n1. 滴答清单是否已经获得通知权限？ \n请确保滴答清单已经获得通知权限，否则滴答清单将无法正常提醒。 \n2. 手机系统是否自带安全服务？ \n如果有，请允许滴答清单自启动并在待机时保持后台运行。 \n3. 是否安装第三方安全应用？ \n如果有，请确保在每个安全软件中，将滴答清单加入自启动白名单和内存加速白名单。 \n你也可以在 app 内点击「设置 」- 「声音、提醒与通知」-「提醒没有生效？」，在该页面查看更多解决办法。\n::::\n\n::::tab [iOS]\n请先确认系统设置中，是否已经允许滴答清单的提醒通知。具体步骤为：点击手机系统中的「设置」-「通知」-「滴答清单」，即可查看通知提醒状况。\n::::\n:::::\n\n\n\n::::: spoiler 如何设置一周开始于？\n\n\n:::::tabContainer [mobile|macOS|Windows|Web]\n\n\n\n::::tab [mobile]\n\n点击「设置」-「日期与时间」-「星期开始于」，你可以选择“周日”、“周一”、或”周六“任意一天为一周的开始。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/f9d0bb18dcc908ff2a28df290002d092.png)\n\n\n::::\n\n::::tab [macOS]\n\n点击「头像」-「设置」-「日期与时间」-「每周开始于」，你可以选择“周日”、“周一”、或”周六“任意一天为一周的开始。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/aae982be6d7022c2d26c1239990a9b2a.png)\n\n\n::::\n\n::::tab [Windows]\n\n点击「头像」-「设置」-「日期与时间」-「一周开始于」，你可以选择“周日”、“周一”、或”周六“任意一天为一周的开始。\n\n![--64.24%](/dida-assets/cdn.dida365.cn/hc/all/dfdf44e80fac3f242815727176826ff6.png)\n::::\n\n::::tab [Web]\n\n点击「头像」-「设置」-「日期与时间」-「每周开始于」，你可以选择“周日”、“周一”、或”周六“任意一天为一周的开始。\n\n![--66.05%](/dida-assets/cdn.dida365.cn/hc/all/f4c821431fb2ba05b4118adf17d982c2.png)\n\n\n\n::::\n\n:::::\n\n\n::: spoiler 如果被滴答小助手删除好友怎么办？\n由于添加小助手有人数限制，太久没有使用会被系统清理，如果需要使用需要再次添加。\n\n具体操作步骤如下：\n\n1.删除滴答小助手联系人；\n\n2.确认是否删除成功，微信中搜索滴答小助手，没有对应的联系人；\n\n3.重新扫码添加滴答小助手（免验证通过的，无需我们做任何操作）。\n\n![s](/dida-assets/cdn.dida365.cn/hc/all/fcba0321b52710ff3b7c93f8e20f538f.png)\n\nPS.滴答小助手为高级会员功能\n:::\n\n\n::: spoiler 如何关闭拼写检查？\n\n在任务详情页的文本处右键即可关闭拼写检查。\n\n![--57.06%](/dida-assets/cdn.dida365.cn/hc/all/601db587bae1480b37188b5fecd3728d.png)\n\n:::\n\n::: spoiler 为什么在滴答清单中订阅企业微信日程失败了？\n\n1. 订阅请选择 **CalDAV** 而不是 Exchange 订阅\n2. 订阅时，服务器地址一栏请填写：**caldav.wecom.work**，而不是\"wecom.work\"\n\n> 具体订阅步骤请参照企业微信文档：https://open.work.weixin.qq.com/help2/pc/18890?person_id=1\n\n:::\n\n\n::: spoiler 如何自定义主题？以及进行字体大小等外观设置？\n个性主题和外观不仅能提升使用体验，还能让每次打开应用都更加愉悦，你只需要进入「设置」-「外观」即可进行设置。\n\n获取详细操作指南：[🎨 外观](/dida-help/external/articles/7254741588264353792)\n\n:::\n\n\n::: spoiler 为什么 Markdown 语法输入后没有触发对应格式？\n\n部分 Markdown 语法需要在格式符号后输入**空格**，才能触发对应的文本样式。\n\n例如：\n\n\n1. `*斜体*` + 空格 → *斜体*\n2.  `**加粗**` + 空格 → **加粗**\n3. `~删除线~` + 空格 → ~~文字~~\n4. `==文字==`+ 空格 → ==文字==\n\n\n如果直接输入 Markdown 符号后继续输入文字，没有触发对应格式，可以在符号后增加一个空格再继续输入。\n:::\n\n::: spoiler 为什么详情突然显示很多符号？\n\n如果详情内容突然显示较多 Markdown 符号，可能是当前版本的编辑器兼容问题。\n\n请将滴答清单**更新至最新版本**后再查看。\n\n:::\n\n\n# 🔑 账户&数据\n:::::: spoiler 如何修改密码？\n\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n进入「设置页」，点击「头像」-「昵称」进入账户信息页，点击「修改密码」。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/5e7935f1f791576212a9df7b81e010ba.png)\n\n::::\n\n::::tab [desktop]\n点击「头像」-「设置」-「账户与安全」，选择修改密码。\n\n![--64.24%](/dida-assets/cdn.dida365.cn/hc/all/be9ee4a98d50ae0be06dc16b51067c45.png)\n:::::::::\n\n\n::::: spoiler 如何绑定手机号、邮箱？\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n进入「设置」，点击「头像」-「昵称」进入账户信息页，点击「设置手机号」、「设置邮箱」，点击按照引导操作即可成功绑定。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/b5fe71401bd9b722c5edc94ffadaf0e0.png)\n::::\n\n::::tab [desktop]\n点击「头像」-「设置」-「账户与安全」，点击「设置手机号」、「设置邮箱」，按照引导操作即可成功绑定。\n\n\n![--64.24%](/dida-assets/cdn.dida365.cn/hc/all/24e9eda0150f8ccacf692ea9a2caeac0.png)\n::::\n:::::\n\n\n:::::::: spoiler 如何解绑微信或 QQ?\n:::::tabContainer [mobile|Web]\n\n::::tab [mobile]\n点击「设置」- 「头像栏」 - 「昵称」 进入账户信息页，有绑定微信或QQ的话点击微信/QQ旁边的账号名称，选择「解除绑定」即可解绑。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/b5fe71401bd9b722c5edc94ffadaf0e0.png)\n::::\n\n:::::tab [Web]\n点击头像-「设置」-「账户与安全」，点击微信/QQ旁边的「解除绑定」即可解绑。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/9397d853dbd1e46061219f37d670d73f.png)\n\n:::::::::::\n\n::::: spoiler 如何注销账户？\n如果你不想继续使用滴答清单，并希望清理掉全部的数据记录，可以注销账号。\n\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n进入「设置」，点击「头像」-「昵称」进入账户信息页，点击「删除账号」，完成操作引导即可注销账号。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/f6752beb088c3fc5e2f656c2f8738227.png)\n::::\n::::tab [desktop]\n点击头像 - 「设置」-「账户与安全」-「账号管理」-「删除账号」，完成操作引导即可注销账号。\n\n![--64.24%](/dida-assets/cdn.dida365.cn/hc/all/1fff505bd65e6af9ef05580d57d976b0.png)\n::::\n如果你有多个滴答清单账号，只想保留一个账号并合并数据，可以先备份注销账号的数据，然后将备份好的数据导入到保留账号。\n:::::\n\n\n::: spoiler 如何清空账号中的所有内容和记录？\n目前还没有一键清空账号内容的快捷操作。建议普通用户可以尝试注销账号后重新注册（参考上一条），如果是高级用户则需要在「设置」-「帮助与反馈」中联系我们迁移会员。\n:::\n\n\n\n::: spoiler 成就值是如何计算的？\n成就值和你每天使用滴答清单的情况有关，例如创建任务、完成任务、专注、打卡等。添加任务和完成任务都会增加成就值。随着成就值的增长，成就等级会对应提升。\n\n成就值还可以兑换专属主题👇\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/b66bbe483a5fa498992f92bd8a714660.png)\n\n:::\n\n\n::: spoiler 如何开具发票？\n\n您可以在 Web 端对近 1 年的订单记录申请开具、查看并下载电子发票。\n\n具体操作步骤如下：登录 Web 端  - 「设置」-「高级会员」- 在最新订单右上角点击「发票/退款」，即可查看近期订单记录并开具发票。\n\n申请开票成功后，我们将在 3 个工作日内向你开具电子发票。你可在开具发票页面了解开票进度、查看及下载发票。\n\n**注意事项：**\n\n- 如果是礼品卡或兑换码，请在应用内提交反馈，并提供订单号、开票抬头和税号等信息。\n\n- 通过 App Store 订阅的会员，由于款项由美国苹果公司收取，我们无法为您开具发票，需前往苹果应用商店开具电子收据，具体请联系苹果客服(400-666-88005)。\n\n> 已退款的订单不支持开具发票。\n\n:::\n\n::: spoiler 如何购买和使用滴答清单礼品卡？\n时间是最宝贵的礼物。为他人或者自己购买一张礼品卡，享受一年高级会员权益，认真过好每一天吧。\n\n你可以在滴答清单的官方网站上购买礼品卡，参考[Gift Cards - DIDA](https://www.dida365.com/card)\n\n- 如何使用礼品卡兑换会员？\n\n礼品卡邮件中的兑换码可用于兑换高级会员。你可以通过以下途径来兑换：\n1. 邮件中：复制兑换码 - 点击「在滴答清单中兑换」 - 「兑换」页面 - 输入兑换码；\n2. Android：进入「设置」页面 -「升级到高级账户」- 页面底部「兑换」- 输入兑换码；\n3. 网页端：点击「头像」-「设置」-「高级会员」-「兑换」- 输入兑换码。\n\n兑换成功后，会员权益立即生效。\n:::\n\n::: spoiler iOS 如何取消自动续费或订阅？\n由于苹果平台的官方限制，开发者无权取消订阅，需要用户自己更改。如果你需要取消订阅，可以参考以下步骤： \n\n1. 进入 App Store 中，点击 Apple ID 头像； \n3. 在「账户」页面中点击「订阅」； \n4. 在「订阅中」点击需要管理的订阅，点击「取消订阅」即可。\n:::\n\n\n::: spoiler 如何为整个团队购买高级会员？\n为团队成员购买礼品卡，使用兑换码以兑换高级会员。\n\n你可以在滴答清单官网[Gift Cards - DIDA](https://www.dida365.com/card)购买礼品卡。选择要购买的数量- 「发送给自己/企业团购」 - 然后在邮件里接收兑换码。\n\n:::\n\n::: spoiler 高级会员和普通用户的清单/任务数量限制分别是多少？\n高级会员和普通用户的清单/任务数量限制如下所示：\n\n![--62.34%](/dida-assets/cdn.dida365.cn/hc/all/159687746e747716ba57bac4977d7b09.png)\n\n:::\n\n\n# ✅ 清单&任务\n::: spoiler 如何设置农历生日？\n你可以通过设置“重复任务”的方式，轻松实现农历生日的提醒。\n- 方式一：以农历日期进行设置\n\n\t在移动端打开了「设置」-「更多设置」-「快速添加任务」和「智能识别」-「智能识别日期」的情况下， 可以直接输入“农历x月x日”，我们会进行智能识别，再点击「日期&重复」，设置重复选择「每年（农历）」即可。\n\t\n- 方式二：以阳历日期进行设置\n\t \n\t 在设置好阳历日期后，点击「设置重复」，选择「农历每年」即可。\n\t \n![l](/dida-assets/cdn.dida365.cn/hc/all/c041ccf563404fe4d7a9e74a5ee2356a.png)\n\n\n\n:::\n\n:::::::: spoiler 如何查看任务动态？\n任务动态是指任务从创建之初到被完成时的所有改动记录。\n- 点击任务，在任务详情页右上角点击「···」 -「更多」-「任务动态」，即可查看任务动态。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n![](/dida-assets/cdn.dida365.cn/hc/all/d740202fd67ca87b21caa3e7f375db9a.png)\n\n::::\n\n::::tab [desktop]\n![](/dida-assets/cdn.dida365.cn/hc/all/7e7124119667654dd5ac0d71b9947084.png)\n::::\n::::::::::\n\n\n\n::::::spoiler 为什么看不到某些智能清单？\n滴答清单提供多个智能清单，包括「所有」、「今天」、「明天」、「最近7天」、「指派给我」、「已放弃」、「已完成」和「垃圾桶」。你可以查看智能清单的显示和隐藏状况并按需调整，如果你看不到某些智能清单，需要自己手动调整清单显示状况。\n:::::tabContainer [移动端|桌面端]\n\n::::tab [移动端]\n在左侧边栏中点击「管理清单和标签」-「智能清单」，即可查看所有智能清单显示与隐藏状况，并按需调整。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/83faed9b1a2ed76ebeb6042ac44cba9b.png)\n\n\n::::\n\n\n::::tab [桌面端]\n点击头像 -「设置」，在左侧边栏中点击「智能清单」，即可查看所有智能清单显示与隐藏状况并按需调整。\n\n![--70.67%](/dida-assets/cdn.dida365.cn/hc/all/a8e508771c3b9aecbb2a37b600285f3f.png)\n\n::::\n\n>- 「显示」是指将智能清单显示在左侧边栏;\n> \n> - 「隐藏」是指将智能清单从左侧边栏中隐藏；\n> \n> - 「自动」状态下，若智能清单内存在未完成的任务，则会显示在左侧边栏；若智能清单内没有待完成的任务，则会隐藏。\n:::::::\n\n\n::: spoiler 怎么恢复删除的任务？\n删除的任务可以在「垃圾桶」中找回，「垃圾桶」的启用方式可参考上一条。\n:::\n\n::::::::: spoiler 如何快速进入侧边栏？\n\n:::::tabContainer [iOS|Android]\n\n::::tab [iOS]\n在清单详情页，向右滑动即可快速打开侧边栏。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/2e6c0e90f8629a5dda028fe6c06ff29a.png)\n\n::::\n\n::::tab [Android]\n在清单详情页底部的 Tab 区域向右滑动，即可进入侧边栏。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/a05449aa7b218e5cb84f202ada1fa191.png)\n\n::::\n\n:::::\n\n:::::::::\n\n\n::::: spoiler 如何添加任务模板和创建模板？\n滴答清单支持将「任务」、「笔记」保存为模板以及从模板添加任务。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n**应用模板**\n- 新建任务时，点击输入弹窗左下角「···」- 「模板」，选择你想使用的模板即可。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/18133fd52b7930305461e1cdd9d886a2.png)\n\n**保存模板**\n- 点击已有任务 - 右上角「···」-「保存为模板」，即可将任务的内容和标签保存为模板。 \n\n![](/dida-assets/cdn.dida365.cn/hc/all/f0fb9f60884a8268d891dccde4c28151.png)\n::::\n\n::::tab [desktop]\n**应用模板**\n- 新建任务时，点击任务添加栏右侧按钮 -「从模板中添加」，选择你想使用的模板即可。\n\n![--66.93%](/dida-assets/cdn.dida365.cn/hc/all/520457d482813a206a7f5697c883f77f.png)\n\n**保存模板**\n- 点击已有任务，点击屏幕下方最右侧「···」-「保存为模版」，即可将任务的内容和标签保存为模板。 \n\n![--66.51%](/dida-assets/cdn.dida365.cn/hc/all/6fd24eba8e27ebbf7472d35aa4e21703.png)\n::::\n\n:::::\n\n::: spoiler 管理任务总共有哪些层级？\n滴答清单拥有清晰的任务层级：「文件夹」-「清单」-「分组」-「任务」-「子任务」，能够帮助你高效地管理任务。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/24e2e38b5a96cdc1ca500f5de2f3082c.png)\n\n\n- 文件夹：文件夹常被用来管理清单。如果你的同类清单数量较多，例如：会议、报告、差旅，你可以创建一个“工作”文件夹去整理它们。\n- 清单：清单可以被用来对任务进行分类整理。你可以根据个人的生活和工作安排创建常用清单，将同类任务放入同一个清单。另外，清单还可以被共享出去，与他人进行协作。\n- 任务：任务是进行日程管理的基础层级。\n- 子任务：子任务是比任务低一级的层级，任务可以被拆分成几个子任务，一 一达成。\n:::\n\n::::: spoiler 可以批量编辑或删除任务吗？\n滴答清单支持任务的批量编辑，可批量修改任务的日期、优先级、所属清单、标签，或者完成、合并、删除、分享所有任务。 \n\n如果你有较多任务且需要进行相同的操作时，可以通过批量编辑来完成。 \n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n点击任务列表右上角「···」-「批量编辑」，然后勾选需要进行批量编辑的任务进行批量编辑即可。 \n\n![](/dida-assets/cdn.dida365.cn/hc/all/55a4c9a71e74d2820549c2f6532cbc9a.png)\n\n\n::::\n::::tab [desktop]\n在任务列表页上，按住「Ctrl 」或「Shfit 」键（macOS 为「Command」键），鼠标选中多条任务，然后「右键」进行批量编辑。 \n\n![--63.56%](/dida-assets/cdn.dida365.cn/hc/all/7e783b2f3e46cf7151d21964026097a8.png)\n::::\n:::::\n\n\n::::: spoiler 如何在任务中添加图片或附件？\n滴答清单支持在任务中添加图片和附件。附件上传成功后会自动同步到各个平台，普通会员每个图片或附件的大小限制为 10 MB，高级会员的为 20 MB。\n> 高级会员一天最多可上传 199 个，每个任务内最多可以上传 39 个。\n> \n> 普通用户一天最多可上传 1 个，每个任务内最多可以上传 20 个。\n> \n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n方式一：点击任务右下角「附件」图标，选择「图片」添加图片。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/4716838241fc526fb029f789b62b535b.png)\n\n\n方式二：点击弹窗中右上角「···」-「附件」，即可添加图片或其他附件。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/6edf336dae57c2e102d8318f3d0d8f89.png)\n\n\n\n\n\n\n::::\n::::tab [desktop]\n- 方式一：点击任务 - 右下方「···」-「上传附件」，即可添加附件； \n- 方式二：通过粘贴复制（ Ctrl + C / Ctrl + V ）可直接在任务详情页添加图片。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/da6d931d37930c94ef0763b0c87b7548.png)\n\n\n::::\n:::::\n\n\n::::: spoiler 如何跳过重复任务的当前周期吗？\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n右滑重复任务，在日期弹窗中点击「跳过此周期」即可。 \n\n![l](/dida-assets/cdn.dida365.cn/hc/all/3f636d157b99ab61e14d1a1ea4843601.png)\n\n\n\n::::\n::::tab [desktop]\n右键点击重复任务，在「日期」图标中点击「跳过此周期」即可。 \n\n![--76.61%](/dida-assets/cdn.dida365.cn/hc/all/55eaa0e953f7fc703807668986ddbe36.png)\n\n::::\n:::::\n\n\n::::: spoiler 如何开启倒数日？\n\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n1. 在「设置」-「日期与时间」中开启「倒数日模式」。\n2. 在任务列表页，点击任务下方的日期即可进行切换。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/0854dde0d64d1a3fd372d82a85380489.png)\n::::\n::::tab [desktop]\n进入任务列表页，点击右上角「···」，选择「显示设置」-「日期显示为」倒数日。\n\n![--76.61%](/dida-assets/cdn.dida365.cn/hc/all/c06d42b666628baccd3fbdd2be880b4b.png)\n![--76.61%](/dida-assets/cdn.dida365.cn/hc/all/23f75017c5db2158da48f83c4346e366.png)\n\n\n\n::::\n:::::\n\n:::::: spoiler 如果出现“任务已隐藏，因为日历中未显示所属清单”，该如何恢复？\n\n如果任务提示“任务已隐藏，因为日历中未显示所属清单”，通常是因为该任务所属的清单未设置为在日历中显示。\n\n你可以按以下步骤检查：\n\n**方法一：在日历中开启清单显示**\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入日历视图，点击右上角的「···」→「显示范围」。\n勾选需要显示的清单。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/af9e5157c10bfb452c358fe045ca685e.png)\n::::\n\n::::tab [desktop]\n进入日历视图，点击左上角的「展开」按钮。\n在左侧勾选需要显示的清单。\n\n![--66.89%](/dida-assets/cdn.dida365.cn/hc/all/46d1e48040673a83f43c0d77cad9024b.png)\n::::\n\n:::::\n\n**方法二：检查清单的智能清单设置**\n\n如果开启日历显示后任务仍未出现，可以在侧边栏找到该任务所属的清单，右键点击并选择「编辑」，检查是否开启了「不在智能清单中显示」。\n::::::\n\n# 🔔 任务提醒\n::: spoiler 如何开启位置提醒？\n目前仅 iOS 用户支持「位置提醒」，可以进入任务详情页，点击右上角「···」-「更多」「位置提醒」即可。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/2f34ff9bfa25c765fcd673f3548a8bdc.png)\n\n> 安卓端考虑到开启位置提醒后会导致手机耗电增加，以及当前位置提醒精度不够高等技术限制原因，暂时没有计划支持 「到达地点提醒」。\n:::\n\n::::: spoiler 任务到期不提醒怎么办？\n:::::tabContainer [iOS|Android]\n::::tab [iOS]\n如果你是 iOS 用户，请先确认系统设置中，是否已经允许滴答清单的提醒通知。具体步骤为：点击手机系统中的「设置」-「通知」-「滴答清单」，即可查看通知提醒状况。\n::::\n::::tab [Android]\n由于 Android 系统安全服务和第三方安全应用可能会影响滴答清单的提醒功能，如果你是 Android 用户，请先根据以下步骤进行检查：\n1. 滴答清单是否已经获得通知权限？\n请确保滴答清单已经获得通知权限，否则滴答清单将无法正常提醒。\n2. 手机系统是否自带安全服务？\n如果有，请允许滴答清单自启动并在待机时保持后台运行。\n3. 是否安装第三方安全应用？\n如果有，请确保在每个安全软件中，将滴答清单加入自启动白名单和内存加速白名单。\n你也可以在 app 内点击「设置 」- 「声音、提醒与通知」-「提醒没有生效？」，在该页面查看更多解决办法。\n::::\n\n> 如果上述方法仍没有解决你的问题，请在滴答清单 app 内点击「设置」-「反馈与建议」，向我们提交问题反馈，我们会尽快为你处理。\n:::::\n\n::::: spoiler 如何在应用图标上显示任务数量？\n:::::tabContainer [iOS|macOS]\n\n::::tab [iOS]\n点击「设置」-「外观」-「应用图标」-「应用程序角标计数」来设置角标上显示的任务数量。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/f13ad969e6c962aea19f148f402a2ece.png)\n\n\n::::\n\n::::tab [macOS]\n点击头像-「设置」- 「外观」-「应用图标」-「应用程序角标计数」来设置角标上显示的任务数量。\n\n![--76.61%](/dida-assets/cdn.dida365.cn/hc/all/b218c85f83dba677658f79dbb4d7dd77.png)\n\n::::\n\n>  由于安卓系统的特殊性，目前华为/荣耀/vivo 三个手机型号支持设置角标，其他手机型号暂时不支持。\n:::::\n\n::: spoiler 如何开启持续提醒？\n持续提醒是移动端独有功能，启用后，所有任务都会持续提醒直到你对其做出处理。\n\n点击「设置」-「声音、提醒与通知」-「持续提醒」- 打开全局持续提醒。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/263c6c42498588f8590c1b0862a66b3b.png)\n\n\n- 你可以只为某些特定任务开启持续提醒，此持续提醒不受持续提醒开关影响。\n\n进入一个任务的详情页，点击「日期&重复」-「提醒」即可开启持续提醒或者闹钟提醒。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/f1377ff3eb79d9de42bc4824ed77b4e7.png)\n\n\n:::\n\n::: spoiler 如何设置提醒常驻栏状态？\n点击「设置」- 「声音、提醒与通知」 - 「通知语状态栏」 - 开启「提醒常驻状态栏」即可。\n\n![--68.32%](/dida-assets/cdn.dida365.cn/hc/all/abeda36477bdc1f213ec5659947fc15b.png)\n\n\n:::\n\n\n\n# 📆 日历\n\n:::::: spoiler 如何调整日历视图中的时间轴？\n在滴答清单日历视图中，时间轴覆盖全天时间，只是在默认模式下隐藏了「00:00-07:00」和「21:00-00:00」两个时间段。\n\n::::tabContainer [mobile|desktop]\n- 展开时间：点击两个时间段即可将隐藏的时间段展开。\n- 调整时间：在时间段全部展开的情况下，你可以通过拖拽时间轴条来调整隐藏的时间段。 \n:::tab [mobile]\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/ef7e5cb30252f55640275e103405f01f.png)\n\n:::\n\n:::tab [desktop]\n\n![--63.24%](/dida-assets/cdn.dida365.cn/hc/all/af92ef28e6841c9d89ee80e3f1b0975f.png)\n::::\n::::::\n\n::: spoiler 为什么在日历视图中会遇到不能给重复任务打勾的情况？\n目前滴答清单中的重复任务，在没有完成之前的重复周期时，是不能对之后的重复周期进行操作的，所以需要对之前的重复周期进行处理。具体操作如下： \n1. 若已完成，可以点击之前周期的重复任务 - 打勾。 \n2. 若未完成，可以在日历视图中的「列表」或「月」视图中，右滑未完成周期的重复任务，在日期弹窗中点击「跳过此周期」即可。\n:::\n\n\n::: spoiler 滴答清单支持订阅哪些日历？\n滴答清单支持的日历包括 Google、Outlook、iCloud 日历、钉钉、飞书、QQ 邮箱等等。\n\n想了解更多，可以查看这篇文章 👉[在滴答清单中订阅第三方日历](/dida-help/articles/6949998599191134208)\n\n:::\n\n:::::spoiler 如何让日历视图上的任务显示为不同的颜色？\n\n任务支持选择「按清单」、「按标签」、「按优先级」显示颜色。选择「按清单」或「按标签」时，可在下方直接自定义清单/标签的颜色，「按优先级」则使用固定优先级颜色。\n\n\n\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击日历视图右上方「···」-「显示设置」-「颜色」-「显示方式」，即可选择任务块按照清单、优先级或者是标签显示颜色。\n\n![--68.32%](/dida-assets/cdn.dida365.cn/hc/all/ca378667819a8db52b4fb77ff2a3c4c2.png)\n::::\n\n::::tab [desktop]\n点击日历视图右上角「···」-「显示设置」-「颜色」-「显示方式」，点击清单这一栏，即可选择任务块按照清单、优先级或者标签显示颜色。\n\n![--75.04%](/dida-assets/cdn.dida365.cn/hc/all/920089cc50b699abf6f07b9ad6e1480b.png)\n\n![--73.3%](/dida-assets/cdn.dida365.cn/hc/all/9d99624922aa336bb23cfebc7f7548f1.png)\n\n![--77.54%](/dida-assets/cdn.dida365.cn/hc/all/660d5d46eb2263444f279661d397a7e4.png)\n::::\n\n:::::\n\n\n\n::: spoiler 如何在日历中显示特定的清单内容？\n\n进入日历视图，点击右上角的「···」符号，随后点击「显示设置」 -「显示范围」- 勾选你所希望展示的「清单」。\n\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/838320eed056b8e475707274fba73a7b.png)\n\n:::\n\n::::: spoiler 如何在日历视图中安排任务?\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入日历视图，点击右上角的「···」符号，随后点击「安排任务」，拖动目标任务到具体的日期里即可安排任务。  \n\n![](/dida-assets/cdn.dida365.cn/hc/all/c21a7b722afff6713306479040497f34.png)\n\n::::\n\n::::tab [desktop]\n进入日历视图，点击右上角的「···」-「安排任务」符号，随后拖动目标任务到具体的日期里即可安排任务。  \n\n\n\n![--75.31%](/dida-assets/cdn.dida365.cn/hc/all/a3cbad60b6fb557932a06abd7a4ac41a.png)\n::::\n:::::\n\n\n\n# 🍅 番茄专注\n::::: spoiler 桌面端如何开启专注计时？\n:::::tabContainer [macOS|Windows]\n\n::::tab [macOS]\n\n点击头像-「设置」-「功能模块」-启用「番茄专注」即可。\n\n![--65.64%](/dida-assets/cdn.dida365.cn/hc/all/26acf39e26087c69ff94c22addd9f2b7.png)\n\n::::\n\n::::tab [Windows]\n\n点击头像-「设置」-「功能模块」-启用「番茄专注」即可。\n\n![--63.24%](/dida-assets/cdn.dida365.cn/hc/all/2e378952b85885f094a109fe5167b6ff.png)\n::::\n:::::\n\n::::: spoiler 如何补记/删除专注记录？\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n可以在「设置」-「功能模块」中开启「番茄专注」。然后前往「专注统计」-「专注记录」中补记和删除番茄记录。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/d4b28ce959e6aac19b17be4f009f5849.png)\n::::\n\n::::tab [desktop]\n点击头像，在「统计」-「专注」-「专注记录」中补记番茄记录。\n> 桌面端不支持删除番茄记录\n\n![](/dida-assets/cdn.dida365.cn/hc/all/39b05a1561865e2d53b8005c98791606.png)\n::::\n:::::\n\n::: spoiler 如何设置番茄结束提醒铃声？\n点击专注界面右上角的「专注设置」-「番茄专注设置」中选择一个喜欢的「番茄结束铃声」。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/c0c11986b918ea3a0bd368d59e3c2526.png)\n:::\n\n:::::::: spoiler 如何设置预计番茄/预计时长？\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入任务详情页，点击右上角「···」，选择「开始专注」-「预计番茄/时长」，点击空白处返回，即可在任务列表页以及任务详情页查看。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/b9b4eed8e606d480c1972ef6bf05a909.png)\n\n\n::::\n\n:::::tab [desktop]\n右键任务，在菜单中选择「开始专注」 -「预计番茄/时长」即可设置番茄预计时长。\n\n![--63.24%](/dida-assets/cdn.dida365.cn/hc/all/ef173a37e5cc1599e7f128454def2c7f.png)\n:::::::::::::::\n\n\n\n::: spoiler 番茄专注如何开启屏幕常亮?\n进入番茄专注页面，开始一个番茄后，点击右上角的「屏幕常亮」符号，开启后即可进行屏幕常亮。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/4387986e0f862a9b1e21ce83a9d5c4b8.png)\n:::\n\n::: spoiler 如何设置应用白名单？\n进入番茄计时页面，点击右上角的「专注设置」符号 - 将「严格模式」打开 - 点击「白名单」以「编辑白名单」 -「完成」。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/6b4b3271df6e2ca077ea399b35a92a83.png)\n:::\n\n\n# ⏰ 习惯打卡\n::::: spoiler 如何在日历中显示打卡？\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n在日历视图的右上角「···」-「显示设置」中，点击「显示打卡」，可以在日历的任务栏里显示打卡。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/7b7ae062ca8d14ad8e997aa3b02fb592.png)\n::::\n::::tab [desktop]\n在日历视图的右上角「···」-「显示设置」中，点击「显示打卡」，可以在日历的任务栏里显示打卡。\n\n![--63.24%](/dida-assets/cdn.dida365.cn/hc/all/afff4b1cc43471725a221869eb62b854.png)\n:::::\n:::::spoiler 如何查看习惯统计？\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n- 查看总习惯打卡统计：进入习惯打卡页面 - 点击左上角「统计」图标 - 按照「周、月、记录」即可查看所有习惯打卡统计。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/9fd4124370a9eaa075b1def2d22c590b.png)\n- 查看单个习惯打卡统计：进入习惯打卡页面 - 点击想要查看的目标习惯打卡，进入该习惯打卡详情页 - 上滑即可查看单个习惯打卡的统计记录。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/ea95a929b86075694d0a4f6bff7d6a4e.png)\n::::\n::::tab [desktop]\n进入打卡页面 - 点击想要查看的打卡 - 进入该打卡详情页即可查看统计。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/5c061e3b758c74a6d5a91441f7ae23ea.png)\n::::\n:::::\n::::: spoiler 如何补记打卡日志？\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n在「习惯打卡」页面 ，点击单个习惯，进入「习惯详情页」 并上滑页面，在月视图中点击需要补记打卡的「日期」，即可补记打卡日志。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/52048534926b38a9ed9a1ca809193b78.png)\n::::\n::::tab [desktop]\n在「打卡」页面 ，点击单个打卡，在右侧「详情页」中点击日历中的「日期」即可进行补记。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/a840bd5e904a635ec7651e584a3a2302.png)\n::::\n:::::\n::::: spoiler 如何设置打卡提醒？\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n进入单个打卡的习惯打卡详情页 - 点击右上角「···」 - 「编辑」- 按照需求设置「频率」和「提醒」即可。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/7ed60fe591c4e736e9afc262c345dd86.png)\n::::\n::::tab [desktop]\n点击单个打卡 - 在右侧的打卡详情页中点击右上角「···」- 「编辑」- 按照需求设置「频率」和「提醒」即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/4bd19b50771554008bb76e6cab87c10a.png)\n::::\n:::::\n::::: spoiler 如何在“今天”、“最近7天”中显示打卡习惯？\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n进入习惯打卡页面 - 点击右上角「打卡设置」图标 - 打开「在 “今天”、“最近7天”中显示」即可。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/bf724127ca6ec3aa650dbb89c6f560be.png)\n::::\n::::tab [desktop]\n进入打卡页面 - 点击右上角「···」 - 「设置」- 打开「在 “今天”、“最近7天”中显示」即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/bc8001fcecd26c94e7c9e511fb3049e6.png)\n::::\n:::::\n::::: spoiler 如何专注打卡习惯？\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n进入习惯打卡页面 - 点击单个打卡，进入习惯打卡详情页 - 点击右上角「···」- 「开始专注」即可。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/c5535ec59de0a9821a5706e4cf5ee3b3.png)\n::::\n::::tab [desktop]\n点击单个打卡，进入打卡详情页 - 点击右上角「···」- 「开始专注」即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/963f6c07ca7c505ac84b0952af29e0a1.png)\n::::\n:::::\n# 🤝 共享协作\n::::: spoiler 如何与他人共享清单？\n滴答清单不仅能帮助您管理您的个人事务，还可以让您和他人共享协作。将清单共享给其他成员，所有成员都可以在清单内查看、编辑、添加和删除任务。\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n点击某个清单进入任务列表页，点击右上角「···」-「共享协作」，选择「添加新成员」即可。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/e65145ae1954a280196f4144fc5e98e1.png)\n\n\n邀请新成员有以下三种方式：\n- 联系人邀请：输入联系人电子邮箱或名字，回车即可发送邀请，未注册过滴答清单的邮箱可以通过点击邮箱内的链接来激活共享。您也可以从最近邀请和团队成员里显示的联系人中选择一个或者多个进行邀请。\n- 共享链接邀请：点击即可创建一个共享链接，可复制链接发送给其他人。若其他成员确认加入该清单，您将会收到申请加入的通知，在您确认同意后，该成员即可共享此清单。\n- 微信好友邀请：可点击「邀请微信好友」直接转跳至微信进行邀请，也可以通过二维码邀请好友加入。\n> 以上三种邀请方式均可以对被邀请人进行权限设置，权限分为可评论、只读和可编辑三个层级。\n::::\n::::tab [desktop]\n在清单页，点击右上角「···」-「共享」，即可邀请新成员。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/37c9b5ac27e6afe83bb074722338c31a.png)\n\n邀请新成员有以下两种方式：\n- 联系人邀请：输入联系人电子邮箱或名字，回车即可发送邀请，未注册过滴答清单的邮箱可以通过点击邮箱内的链接来激活共享。您也可以从最近邀请和团队成员里显示的联系人中选择一个或者多个进行邀请。\n- 共享链接邀请：点击即可创建一个共享链接，可复制链接发送给其他人。若其他成员确认加入该清单，您将会收到申请加入的通知，在您确认同意后，该成员即可共享此清单。\n> 加入共享清单的用户都可以对该清单的内容进行编辑，在清单编辑界面或共享界面可以看到清单共享者的用户名。\n::::\n:::::\n\n\n::: spoiler 为什么我找不到共享协作功能？\n「今天」、「明天」、「最近7天」等智能清单不支持共享协作，需要在自己建立的普通清单中使用共享协作功能。\n\n具体操作为：点击某个清单进入任务列表页，点击右上角「···」-「共享协作」。\n:::\n\n\n\n::: spoiler 共享成员都要高级会员吗？\n不需要。付费用户和免费用户都可分享以及加入共享清单，但是付费用户每个共享清单可加入29位成员，免费用户的共享清单只可加入1位共享成员。\n:::\n\n\n::::: spoiler 如何为他人指派、分配任务？\n共享清单中的任何成员都可以对任务进行分配，指派任务给执行者。任务的指派人会在「通知中心」收到通知提醒。\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n你可以进入任务详情页，点击右上角「指派」图标指派任务。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/cddec7906b3850ed78941bb06e318f22.jpg)\n\n::::\n::::tab [desktop]\n你可以进入任务详情页，点击右上角「指派」图标指派任务。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/3b286e530cc2317439a3db93588e184a.png)\n::::\n:::::\n:::::: spoiler 不想收到共享清单中指派给别人的任务提醒怎么办?\n你可以开启「勿扰」，共享清单中如果没有指派给自己的任务时，你将不会收到提醒。\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n在左侧边栏中左滑共享清单，点击「编辑」进入清单编辑界面，选择「通知」即可开启勿扰模式。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/9fb19a33b47c5ae75509e7a2fb14ca25.png)\n\n\n\n::::\n::::tab [desktop]\n在左侧边栏中右键共享清单，点击「编辑」进入清单编辑界面，即可开启勿扰模式。\n\n![--75.17%](/dida-assets/cdn.dida365.cn/hc/all/7ac1371c555188b346636b7d47038997.png)\n::::\n::::::\n:::::spoiler 如何评论任务？\n:::::tabContainer [mobile|desktop]\n::::tab [mobile]\n进入任务详情页 - 点击右上角「···」- 「评论」即可。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/56120d67f59a33540eb913c3bf3023ae.png)\n\n::::\n::::tab [desktop]\n进入任务详情页 - 点击右下角「评论」图标，即可评论任务。\n\n![--86.02%](/dida-assets/cdn.dida365.cn/hc/all/fd58ec3e57d4c757be4cfa27f048699d.png)\n::::", "tags": [""], "hideIndex": true, "favs": 115, "order": -34909494181888, "status": 0, "sectionId": "faq", "createdTime": "2022-07-07T04:41:35.790Z", "modifiedTime": "2026-10-09T02:48:36.785Z", "postId": "6950670128287580160", "__v": 0, "pinInSearch": false, "parentId": null, "area": "help-center", "shortTitle": ""}, {"_id": "62c6764b1e3a8b2ac64c85ef", "author": "", "description": "", "title": "💎 设计理念", "content": "![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/f2aa5c3db3a33a49aba8c6c62fc01c6e.jpg)\n\n如何打造一款全球千万用户喜爱的产品？这并不是一个简单的问题。\n\n# 只有经典的设计才能穿越时间\n\n可能了解过效率类产品的用户会发现，我们的产品和其他产品有很大的不同，其中一个很大的区别就在于任务详情的呈现。\n\n很多产品会在任务的详情页放很多功能按钮，看上去很丰富。但是在我们看来，这并不是好的设计，因为这些功能并非用户必须的。\n\n于是我们大胆地做了减法，只留下最核心的功能，把更大的空间留给用户来书写。因为我们认为，只有简单的设计，才能接近经典，才能穿越时间，经受住岁月考验。\n\n除了简洁之外，我们在很多设计上，也尽可能符合用户的直觉。\n在现实生活中，我们可以把一个物体拿起，放到不同的位置。而在我们的产品中，你也可以通过长按拖动调整任务的位置，无论是在任务列表、日历，还是四象限。\n\n所有的操作，都非常的自然，自然到你都没有意识到这是我们的设计。\n\n# 不打扰用户，和用户做朋友\n\n在我们看来，用户使用我们的产品，某种程度上，就是在和我们进行对话。\n我们希望我们和用户的关系，不是客户，不是流量，而更像是朋友。\n\n因为用户把他的事情，记录到我们产品中，本身就是对我们的一种信任。\n所以我们希望在用户眼里，我们是一个善良、诚实、值得信赖的形象。\n\n这是为什么我们没有做“开屏广告”的原因，即便这可以给我们带来非常可观的收入。我们也保持了这个行业少有的「克制」，没有关不掉的小红点和眼花缭乱的营销活动。\n\n而在和用户的相处中，用户也会在不经意间，感受到我们的用心。举一个很小的例子。\n\n“你觉得上午12点半是凌晨，还是中午？”\n\n当被问到这个问题时，很多人会困惑，但实际上在12小时制中，上午12点半是凌晨。所以当用户选择上午12:30时，我们会有一个小提示，避免他选了错误的时间。\n\n而这样的设计，在产品中其实还有很多。\n\n# 帮用户管理生活中的一切\n\n现在我们在全球有将近2000万的用户，而最早使用我们产品的用户，已经陪伴我们走过了9年的时间。\n从最开始的任务和提醒，到之后推出日历功能，再到番茄计时、习惯打卡和四象限。\n\n非常感谢这些用户，正是因为他们的支持，帮助我们不断打磨产品，持续精进。同时也让我们更加深刻地认识到“用户需要的不只是管理任务，而是生活中的一切”。\n\n所以针对不同用户的场景，我们提供了不同的解决方案，例如：\n- 针对白领，我们提供了共享协作、时间线视图的功能，来满足项目管理的需求。\n- 针对学生，我们也有课表导入、自习室等特色功能。\n\n当然，与此同时，一个新的课题 摆在了我们面前：\n如何在功能越来越强大，满足更多用户需求的同时，还能够保证产品的易用和简洁。\n\n我们的答案是，尊重用户选择的权利。\n\n在我们的产品中，用户可以根据自己喜好，选择自己需要哪些功能，不需要哪些。用户还可以调整功能的顺序，甚至可以将不常用的功能收到更多按钮中。\n\n# 写在最后\n\n最后，非常感谢大家的阅读，也希望我们的产品能帮助你：达成更多，用心生活。", "tags": [""], "hideIndex": true, "favs": 403, "order": -34634616274944, "status": 0, "sectionId": "faq", "createdTime": "2022-07-07T05:59:39.997Z", "modifiedTime": "2026-09-12T23:37:29.059Z", "postId": "6950689775275737088", "__v": 0, "parentId": null, "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c676331e3a8b2ac64c85dd", "author": "", "description": "", "title": "🚀 更新动态", "content": "\n# 🤖 AI 助手重磅上线！开启高效新体验（10月8日）\n\n这次更新，我们带来**全新的 AI 助手**，让你可以用更智能的方式管理任务；同时适配 iOS 27，带来更丰富的小组件和更便捷的使用体验。\n\n## 全新 AI 助手\n\n![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/d319798b2c7e21a5f2765deff29f2f0d.png)\n\n现在，你可以直接用自然语言向 AI 助手发出指令，**无论是创建任务、拆解项目、整理清单，还是进行阶段性复盘**，都可以交给 AI 完成，省去一步步操作和整理的时间，让任务管理更加简单高效。\n\n> 如何开启 AI 助手： 进入「设置」 → 「功能模块」 → 开启「AI」\n\n[点击查看 AI 助手使用指南 👉](/dida-help/articles/7502990612036059136)\n\n## 适配 iOS 27 新特性\n\n升级 iOS 27 后，滴答清单也带来了几项全新的体验：\n\n- 超大小组件\n\n![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/ac451c935b2d26d50023adbb64bb30f4.png)\n\n新增超大小组件，在更大的空间中展示更多内容，让你一眼掌握当天安排。\n\n- 实时活动支持横屏与待机界面\n\n实时活动现已支持横屏和待机界面显示，让重要任务与进度信息随时可见。\n\n> 体验以上新特性前，请将 iPhone 系统升级至 **iOS 27**，并将滴答清单更新至最新版本。\n\n\n# ✨ 编辑与任务管理体验优化（9月15日）\n\n这次，我们优化了编辑、整理和浏览任务的体验，让记录内容、整理任务和查找信息都更加顺手。\n\n## 编辑体验优化\n\n![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/e3226797deabd012034edf89f5d59338.png)\n\n- Markdown 编辑更清爽\n\n现在，编辑 Markdown 内容时，格式符号会自动隐藏，你不会再被 `#`、`*` 等符号干扰，可以更专注于正在记录的内容。\n\n- 更多高亮颜色\n\n现在，已支持更多高亮颜色，你可以用不同颜色标记区分不同信息，让重要内容更加醒目。\n\n- 长内容阅读更轻松\n\n任务详情内容较多时，你可以通过标题暂时折叠不需要查看的章节，也可以随时展开查看，让长篇笔记、会议记录或项目资料更容易浏览。\n\n## 分组与排序体验优化\n\n![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/13c4457d6ddcdb0d4da3b501686ec9d9.png)\n\n新增按**创建时间分组**，以及按**创建时间、修改时间排序**，你还可以自由选择排序从新到旧还是从旧到新，方便快速找到最近添加或更新的任务，整理清单中的任务更加方便。\n\n## 其他更新\n\n- 新增视图多端独立配置\n\nAndroid、Web 已支持分别设置清单视图，手机和电脑可以使用不同的视图配置。\n\n- 更多字号选项\n\niOS、Android 已支持更小的应用字号，一屏可以展示更多任务。\n\n> 调整方式： 设置 → 外观 → 显示 → 字体大小\n\n# ✨ 体验升级｜持续提醒、搜索等功能升级（6月3日）\n\n最近，我们对提醒、搜索、模板和日历体验进行了一些优化，希望能让日常使用更加顺手。\n\n## 持续提醒升级\n\n现在， 支持为任务、习惯、纪念日分别开启持续提醒，所有未处理的提醒都会持续重复提醒，直到任务被完成、延后或处理为止。\n\n## 搜索支持筛选\n\n现在，搜索结果支持按任务、清单和标签筛选，帮助你更快定位所需内容。\n\n![--56.3%](/dida-assets/cdn.dida365.cn/hc/all/dcb9917b2e17462cd38cc76fff6a8ea6.png)\n\n## 年视图支持任务预览\n\n年视图现已支持查看每日任务，点击具体日期即可快速查看当天任务，无需切换视图。\n\n![--56.26%](/dida-assets/cdn.dida365.cn/hc/all/46b17b87d80340c3a7433144a51d4945.png)\n\n## 模板体验升级\n\n模板功能迎来多项优化。现已支持搜索模板、拖动排序，并新增「从模板添加」快捷入口，让模板查找和使用更加便捷。\n\n![--56.3%](/dida-assets/cdn.dida365.cn/hc/all/8efecc8ca8db9abae76c4b70e36d6c1b.png)\n\n## 浏览器标签页计时\n\n在网页端开始专注后，浏览器标签页将实时显示专注时长。无需返回滴答清单，也能随时了解当前专注进度。\n\n![--56.26%](/dida-assets/cdn.dida365.cn/hc/all/bbfa28ae162e59aa11aaee4edc5b4677.png)\n\n\n# 滴答清单✖️AI｜让任务管理更智能 🚀（4月29日）\n\n![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/5ccb2a802826b19d2c433094b07c3ef4.png)\n\n最近，我们带来了几项 AI 能力更新，帮助你更轻松地记录、整理并管理任务，让整个工作流更加流畅。\n\n## 滴答清单 MCP\n\n滴答清单现已支持 MCP，可连接 ChatGPT、Claude 等 AI 工具。连接后，你可以直接在 AI 对话中管理任务，无需切换应用，让 AI 成为你的任务助手。\n\n[查看详细使用方法](/dida-help/articles/7438132116019216384)\n\n## AI 语音添加\n\n语音添加新增「AI 模式」。现在，你只需要自然说出你的想法，任务时间、清单、标签、优先级等信息将被自动识别，多个任务也能自动拆分，让记录和整理一步完成。\n\n> 仅移动端\n\n[查看详细使用方法](/dida-help/articles/7444666114547646464)\n\n## AI 录音总结\n\n录音附件现已支持转写原文，并可一键生成结构化总结，帮助你快速提炼重点内容，更高效地回顾信息，不再反复听录音。\n\n[查看详细使用方法](/dida-help/articles/7444668968427585536)\n\n# 倒数纪念日体验优化｜记录更加灵活 ✨（3月9日）\n\n为了让重要日子的记录方式更加灵活，本次更新为纪念日新增了多项功能：\n\n## 新增天数计算方式\n\n在添加纪念日时，现在支持选择是否将当天计为第 1 天，让天数计算方式更加符合不同场景的需求。\n\n![--56.3%](/dida-assets/cdn.dida365.cn/hc/all/e18ac9d0137f70a1c6e0aa6ed7ac23fb.png)\n\n> 使用方式：添加纪念日 → 选择日期 → 在「天数计算方式」中选择「标准」或「标准 +1 天」。\n\n## 新增自定义重复\n\n倒数纪念日现在支持更灵活的重复规则，例如每年 X 月第 X 个星期几、每月的 X 日 等，可以满足更多纪念日提醒场景的需求。\n\n![--56.3%](/dida-assets/cdn.dida365.cn/hc/all/8514ac0a9fcd17f7bf49061f6c192e39.png)\n\n> 使用方式：进入一个纪念日 → 点击右上角「...」进入「编辑」 → 点击「重复」 → 选择「自定义重复」。\n\n## 新增备注功能\n\n现在，你还可以为每一个纪念日添加备注，用来记录属于这一天的提醒信息或独特记忆。\n\n![--56.3%](/dida-assets/cdn.dida365.cn/hc/all/48f8c28808d48370b2659cfe22489edf.png)\n\n> 使用方式：进入倒数纪念日详情页 → 点击左下角备注图标 → 添加备注。\n\n## 其他功能更新\n\n- PC 端新增习惯桌面小部件\n\nPC 端现已支持习惯打卡桌面小组件，无需打开应用，即可在桌面查看习惯并完成打卡，日常记录更加方便。\n\n- 日历支持自定义图标显示\n\n现在，你可以自由选择是否在「日历」中显示内容的类型图标。点击日历右上角「…」 → 「显示设置」 → 「样式」 → 「显示类型图标」即可设置。\n\n- iOS 与电脑端支持暗色主题\n\n现在，iOS 与电脑端也已经支持自定义暗色主题颜色。你可以进入【设置】 → 【外观】 → 【主题】 → 选择【夜间】主题，并挑选喜欢的主题色即可。\n\n\n# 8.0 重磅更新｜任务与日历体验全面升级 🚀（1月8日）\n这次更新，我们重点升级了任务规划与日历体验，希望通过更清晰的信息结构与视觉呈现，帮助你在不同时间尺度下，更轻松地安排事情、回顾时间。\n\n## 全新推荐任务\n\n「今天」清单新增「**推荐任务**」功能，根据任务创建时间、延期情况与到期节点等维度整理未完成任务，辅助你快速确定优先事项并添加到「今天」，减少规划成本。\n\n![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/e0f14b8f4cb0280f90aa6057ae8ad2c0.png)\n\n\n[查看详细使用方法](/dida-help/articles/7401559568137846784)\n\n## 个性化清单背景\n\n现在，你可以为不同清单设置专属背景，通过不同的视觉标识，在多场景切换时一眼区分工作、生活与个人。\n\n![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/74e90d6815a3797ab75274eeb5029403.png)\n\n> 仅手机端\n\n[查看详细使用方法](/dida-help/articles/6950654234933067776#%E6%B8%85%E5%8D%95%E8%83%8C%E6%99%AF)\n\n## 全新年视图 + 热力图\n\n新增年视图，提供年度级时间视角，帮助你更清晰地进行长期规划与重要事项安排。同时支持开启热力图，直观展示全年任务密度，方便回顾一整年的忙闲分布。\n\n![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/b2488ba6e27ae520aad0678eaecc7e52.png)\n\n[查看详细使用方法](/dida-help/articles/7397517843383713792)\n\n## 月视图自由缩放\n\n月视图支持双指捏合缩放，可调整显示的周数，在单个日期中直接查看更多任务，减少折叠显示，提升任务的浏览体验。\n\n![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/05de0b5736214a4cc58dbdc1bdfd22a9.png)\n\n> 仅移动端。\n\n## 日历显示设置优化\n\n**颜色**\n\n现在，任务的颜色显示设置入口更加集中了。在选择按清单或标签显示颜色后，可直接在下方为对应清单或标签设置颜色。\n\n同时，习惯与纪念日也支持自定义显示颜色，你可以选择统一颜色或单独配色，进一步强化不同内容的分类识别。\n\n[查看详细使用方法](/dida-help/articles/6950647988939128832#%E9%A2%9C%E8%89%B2)\n\n**样式**\n\n日历新增现代样式，你可以在**日历右上角「…」-「显示设置」-「样式」中选择「现代」样式**，获得更简洁、清爽的视觉体验。\n\n![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/4b0bc233287c620621b5392368375312.png)\n\n## 电脑端界面优化\n\n电脑端新增**卡片样式**，卡片化布局让信息结构更加清晰，浏览更直观。你可以在 **「设置」-「外观」-「主题」-「界面样式」** 中进行切换。\n\n![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/af4a4318daaf2cb866eeab00cb6efb6f.png)\n\n这次，我们还对电脑端界面细节进行了统一优化，整体层次与视觉表现更加一致。\n\n# 更多\n\n[2025年更新](/dida-help/external/articles/7505894191243722752)\n\n[2024年更新](/dida-help/external/articles/7301066376716746752)\n\n[2023年更新](/dida-help/external/articles/7155122706650759168)\n", "tags": [""], "hideIndex": true, "favs": 36, "order": -32985348833280, "status": 0, "sectionId": "faq", "createdTime": "2022-07-07T05:59:15.977Z", "modifiedTime": "2026-10-08T08:17:45.507Z", "postId": "6950689674532749312", "__v": 0, "parentId": null, "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62df50a3336d236a95d761f4", "author": "", "description": "", "title": "用文件夹管理任务", "content": "随着清单数量越来越多，可以使用文件夹来整理你的清单。 例如你可以创建「生活」文件夹，将「生活日常」、「购物」、「运动」等清单放入其中。\n\n# 创建文件夹\n\n\n\n::::tab [mobile]\n- 方式一：拖动清单到另一清单上方，松手后，在弹窗内输入名称即可创建文件夹。\n\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/c1411bbe0e22e25ed1ebb59e366c6c33.png)\n\n\n- 方式二：点击右下角「添加」-「清单」，在清单编辑页「更多设置」-「文件夹」-「添加文件夹」，输入文件夹名称，点击完成即可创建成功。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/168545be5481a6a2d070aa38a1c1536e.png)\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/ba1031ab186b4a66eda02bcda7c29a27.png)\n\n::::\n\n\n\n# 解散文件夹\n\n在移动端可通过左滑、长按的方式，解散文件夹。在桌面端可通过右键，解散文件夹。\n\n\n\n\n\n", "tags": [""], "hideIndex": true, "favs": 16, "order": -27487790694400, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2022-07-26T02:25:39.289Z", "modifiedTime": "2026-05-30T13:25:42.812Z", "postId": "6957521286893404160", "__v": 0, "parentId": "6950652964327391232", "area": "help-center", "shortTitle": ""}, {"_id": "62c655321e3a8b2ac64c82d4", "author": "", "description": "", "title": "用清单管理任务", "content": "「清单」是一种常用的任务整理归类方式，养成清单思维不仅可以让我们学会把注意力放到重要的事情上，还可以提高生产力和执行力。\n\n清单思维关键在于以实现目标为导向，你可以根据使用目标创建，如：工作、学习、运动、阅读等清单，以提高对人生的掌控感。\n\n目前，滴答清单支持「智能清单」、「普通清单」两种清单类型。\n\n\n\n#  智能清单\n## 什么是智能清单？\n\n「智能清单」功能，能帮你快速拎清今天、明天需要做什么， 智能清单就是“根据一定条件对任务进行筛选及显示的清单”。\n\n我们准备了五个最高效的智能清单：「今天」、「明天」、「最近七天」、「收集箱」、「指派给我」。\n- 「今天」、「明天」、「最近七天」智能清单中，会显示到期日为今天、明天和最近七天的任务。\n- 「收集箱」是一个临时的任务中转站，所有暂时来不及整理的任务都可以放在收集箱中。（收集箱是不可以被隐藏或删除。）\n- 「指派给我」是收集来自不同共享清单中分配给你的任务，你可以在这个清单中查看你在不同共享清单中的任务。\n\n\n## 如何开启智能清单？\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击侧边栏「添加清单」右边的「设置」，即可打开「智能清单管理」页面，设置你需要显示的智能清单。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/a3761c4d29f087838e242684bbc9de1b.png)\n\n\n::::\n\n::::tab [desktop]\n点击头像，进入「设置」-「智能清单」，即可设置你需要显示的智能清单。\n\n![--70.67%](/dida-assets/cdn.dida365.cn/hc/all/1275c1e94fc0d734e795f1965882cf63.png)\n\n::::\n\n:::::\n\n> 我们提供了三种显示状态：「显示」、「隐藏」、「有内容时显示」，你可以根据你的实际需要设置。\n\n\n# 普通清单\n除了我们提供的智能清单，你还可以自由创建你的专属清单。你可以创建「工作」、「个人」、「生活」等不同的清单，用来对任务进行归类。\n\n\n##  新建清单\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击侧边栏底部「添加」-「清单」，即可创建一个清单。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/25174ceef1c7b5b0d689000a96d8e417.png)\n\n\n::::\n\n::::tab [desktop]\n将光标覆盖在「清单」上，点击右侧的+号，即可新建清单。\n\n![--68.42%](/dida-assets/cdn.dida365.cn/hc/all/9bee04dbe324f093f4b26da240098239.png)\n\n::::\n\n:::::\n\n你可以设置清单的「名称」、「颜色」、「所属文件夹」及「在智能清单中显示/隐藏」。\n\n\n\n## 编辑清单\n在侧边栏左滑某个清单，会出现「置顶」、「编辑」和「删除」3个选项。点击中间「编辑」图标，即可进入清单编辑页面。\n\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/87748fec0b16b81f5a8866e5464ac6ae.png)\n\n## 清单图标\n不同颜色、样式的 Emoji 可以帮助更加直观、个性化的定制自己的清单；当需要找到某一清单时，也可以更加快速的做到。\n\n- 方式一：在清单编辑页面，点击名称前面的「图标」，选择需要的 Emoji 表情，点击「完成」即可创建成功。\n- 方式二：清单名称最前面输入 Emoji 表情，可自动设置为清单的图标。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/77e66ff5fd6d0f8f7d9bc1ba462d9fa6.png)\n\n\n# 清单背景\n\n当你在不同清单之间切换时，是否希望能一眼分辨工作、生活与个人？通过为清单设置不同背景，你可以让每个清单都有独特的视觉标识。\n\n进入你想设置的清单详情页，点击右上角的「**...**」-「**背景**」即可设置你的清单背景。\n\n> 仅限移动设备使用。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/073e945d4316bc6bd5fda3ddef027520.png)\n\n\n你可以选择以下几种背景样式：\n\n- **跟随应用主题**：保持简单统一的界面。\n\n- **颜色背景**：单色背景让视觉体验更清爽。\n\n- **渐变背景**：柔和渐变让视觉体验更丰富。\n\n- **图片背景**：图片背景让你的清单更加个性化。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/dcdf19b17c2ae3781b7327ff2b53abf8.png)\n\n\n::: spoiler 所有的清单都支持设置背景吗？\n并非所有清单都支持设置背景，以下清单暂不支持设置背景：「**已完成**」、「**已放弃**」、「**垃圾桶**」。\n:::\n", "tags": [""], "hideIndex": true, "favs": 41, "order": -26388279066624, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T03:38:26.518Z", "modifiedTime": "2026-09-10T08:58:39.731Z", "postId": "6950654234933067776", "__v": 0, "parentId": "6950652964327391232", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "643f4c0191756bb588468491", "author": "", "description": "", "title": "用分组和排序管理任务", "content": "随着清单中的任务越来越多，如何快速找到需要关注的内容变得越来越重要。\n\n滴答清单支持自定义「分组」和「排序」，帮助你按照不同维度整理任务，无论是规划接下来的安排，还是回顾近期新增和修改的内容，都可以更高效地管理。\n\n# 什么是分组？什么是排序？\n\n**分组**可以将清单中的任务按照不同规则进行分类。\n\n例如：\n\n- 按时间分组，可以查看今天、明天、未来安排；\n- 按优先级分组，可以快速找到重要任务；\n- 按标签分组，可以整理不同类型的事项。\n\n**排序**可以调整同一分组内任务的排列方式。\n\n例如：\n\n- 按时间排序，优先查看临近截止日期的任务；\n- 按优先级排序，优先处理重要事项；\n- 按创建时间排序，查看最近添加的任务；\n- 按修改时间排序，回顾近期更新过的内容。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/2f310ed82218bbb43e756c69fcfe732d.png)\n\n\n\n\n# 如何使用分组？\n\n在普通清单中，你可以添加自定义分组，将任务按照自己的方式分类。\n\n例如创建一个「阅读清单」，可以添加「小说」「历史」「职场」等分组，方便管理不同类型的书籍。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入任务列表页，点击右上角「...」-「管理分组」-「添加分组」。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/906b1a6f5fb9318f3ae1bf42888c55e8.png)\n\n\n::::\n\n::::tab [desktop]\n进入一个普通清单，点击清单详情区域右上角「...」-「添加分组」。\n\n![--68.81%](/dida-assets/cdn.dida365.cn/hc/all/ddef5f7c1c5049947fad3581e1a6b8e4.png)\n::::\n\n:::::\n\n# 智能分组\n除了自定义分组外，滴答清单还提供多种智能分组方式：\n\n## 按清单分组\n当你查看智能清单或文件夹时，可以选择按清单分组。\n\n选择后，任务会按照所属清单进行分类。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/c5dd3f8ccc6fe260956e775093441044.png)\n\n## 按时间分组\n任务会按照时间范围进行分类：\n\n- 今天\n- 明天\n- 最近 7 天\n- 以后\n- 已过期\n\n适合快速查看近期安排和逾期任务。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/ea4dc44a8bc0cac829a190ab44e6524b.png)\n\n## 按优先级分组\n\n任务会按照优先级进行分类：\n\n- 高优先级\n- 中优先级\n- 低优先级\n- 无优先级\n\n适合快速找到需要优先处理的事项。\n\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/69b12295834bc65b4e2864c838deca3c.png)\n\n## 按标签分组\n\n任务会按照添加的标签进行分类。\n\n适合管理不同项目、场景或任务类型。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/1abd91efacd22c4f85597a3cb80e34c1.png)\n\n\n## 按指派人分组\n\n在共享清单中，可以按照任务负责人进行分类。\n\n适合团队协作时查看不同成员负责的任务。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/b514426859be098db8550ff68d6992dc.png)\n\n\n## 按创建时间分组（新增）\n\n任务会按照创建时间进行分类，帮助你快速查看最近新增的内容。\n\n适合：\n\n- 整理刚添加到 Inbox 的任务；\n- 回顾近期记录的想法和事项。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/7f4f5224d9235aa6143c7e3d2e9e0c3b.png)\n\n\n\n\n\n::: spoiler 为什么我找不到管理分组？\n\n目前只有**普通清单**支持自定义管理分组。\n\n智能清单暂不支持创建自定义分组。\n:::\n\n\n# 如何使用排序\n打开清单，点击右上角「...」-「分组排序」，即可选择排序方式。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/5554587e869e0d07f9b70fafee147ade.png)\n\n\n你可以根据需要选择：\n\n## 按时间排序\n\n按照任务截止时间排列。\n\n适合：\n\n- 查看接下来需要完成的事项；\n- 制定每日任务计划。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/6e56d9c1bd41fbd7da2fcb177c6ea099.png)\n\n\n\n## 按优先级排序\n\n按照任务重要程度排列。\n\n适合：\n\n- 快速处理重要任务；\n- 管理工作重点。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/37d1656bf4e36cef0aeb7c50217b93d0.png)\n\n\n\n## 按创建时间排序（新增）\n\n按照任务创建时间排列。\n\n支持：\n\n- 从旧到新；\n- 从新到旧。\n\n适合：\n\n- 查看最近新增的任务；\n- 检查刚记录的事项。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/95b9d064333d31ee1c5431faad5d0e65.png)\n\n\n## 按修改时间排序（新增）\n\n按照任务最近更新时间排列。\n\n支持：\n\n- 从旧到新；\n- 从新到旧。\n\n适合：\n\n- 回顾近期调整过的任务；\n- 跟踪任务状态变化。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/94a33467ce1c182c3cc1458d353cb7e3.png)\n\n\n\n::: spoiler 电脑端如何使用分组排序？\n在任意清单中选择右上角「排序」图标进行设置。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/32a144340c619c5d4a6bcca7b9aaec92.png)\n\n:::\n\n\n# 常见使用场景\n## 查看最近新增的任务\n\n如果你刚整理了一批任务，可以选择：\n\n**分组：创建时间**\n\n**排序：创建时间（从新到旧）**\n\n快速查看刚添加的内容。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/3ded93c1b25501acf07f5337bfee97ad.png)\n\n\n## 查看清单中的任务 Deadline\n\n如果你想查看文件夹中不同清单里的任务安排：\n\n**分组：清单**\n\n**排序：时间**\n\n可以快速了解每个清单接下来的截止任务。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/9061c832b997c2365fc2c014178dee4c.png)\n\n## 检查目标清单的完成重点\n\n如果你想按照重要程度查看任务：\n\n\n**分组：自定义分组**\n\n**排序：优先级**\n\n任务会按照高、中、低优先级排列，方便集中处理。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/9a289da03aa5cc558b3dc8c5ae00126b.png)\n\n\n## 查看团队成员负责事项\n\n在共享清单中：\n\n\n**分组：指派人**\n\n**排序：时间**\n\n可以快速查看每个人负责的任务和截止时间。\n\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/3e30bef3b6e53770c8c98b7914d85a9e.png)\n\n\n# 看板视图支持分组排序\n除了可以自定义分组，你也可以直接选择相应的分组就能实现不同分组的看板视图。\n\n![--61.42%](/dida-assets/cdn.dida365.cn/hc/all/a8383d8b34893af2149a3b76d5f2ddfe.png)\n\n在日常工作中分组选择时间，就能够以看板的形式查看自己今天、明天、最近7天的任务显示，方便自己快速查看近期重点工作任务。\n\n\n::::: spoiler 如何恢复默认时间顺序？\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n在排序页面中点击这个按钮恢复到默认顺序。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/9efafa41c2577a560ba778a5afc628a2.png)\n\n::::\n\n::::tab [desktop]\n点击排序页面中-「恢复默认时间顺序」即可恢复。\n\n![--68.66%](/dida-assets/cdn.dida365.cn/hc/all/4ba889bc67f88ef6a9b7d3ddad57383c.png)\n\n::::\n\n:::::\n\n", "tags": [""], "hideIndex": true, "favs": 358, "order": -16492674416640, "status": 0, "pinInSearch": true, "sectionId": "feature", "createdTime": "2023-04-19T02:03:45.382Z", "modifiedTime": "2026-09-28T23:30:42.273Z", "postId": "7054273336087412736", "__v": 0, "parentId": "6950652964327391232", "area": "help-center", "shortTitle": ""}, {"_id": "62c6571e1e3a8b2ac64c82ff", "author": "", "description": "", "title": "用标签管理任务", "content": "给任务添加「标签」可以更加快捷的进行任务管理。一个任务可以添加多个标签，标签常常和类别、状态或者地点关联。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n- 使用前，确认侧边栏中是否已经开启显示标签，开启后，标签将显示智能清单下面。\n\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/3faa4645b3bdfc8475c327e0e29c6e8d.png)\n\n\n如果标签未在侧边栏中显示，点击侧边栏右下角「设置」进入清单管理页，点击「标签」，选择「显示」即可。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/e35a9290c099b3c6bf29fadc5a90dfea.png)\n\n::::\n\n::::tab [desktop]\n使用前，确认侧边栏中是否已经开启显示标签，开启后，标签将显示在清单下面。\n\n![--68.81%](/dida-assets/cdn.dida365.cn/hc/all/5864a7db109ecbaad5722acc22f04b21.png)\n\n如果标签未在侧边栏中显示，点击头像进入「设置」-「智能清单」，找到「标签」设置为「显示」即可。\n\n![--68.81%](/dida-assets/cdn.dida365.cn/hc/all/40c70624cf1c93efb4266abcadf54889.png)\n\n::::\n\n:::::\n\n\n\n\n\n\n# 为任务添加标签\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n- 方式一：在创建任务时，点击任务输入栏下方的「标签」图标，选择添加已有标签或创建新标签。\n\n- 方式二：创建任务时输入「#」快速创建标签。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/4f5529e99e8606a255de6288ee83f28a.png)\n\n\n::::\n\n::::tab [desktop]\n\n- 方式一：右键单击任务，选择「标签」添加已有标签或创建新标签。\n\n![--71.11%](/dida-assets/c
