uthor": "", "description": "", "title": "打造专属纪念页", "content": "每个倒数纪念日都承载着独特的意义，为重要的日子设计专属的视觉印记，让每一天的等待都充满温度与期待。\n\n# 设置样式入口\n\n倒数纪念日支持设置样式，你可以为你每个倒数纪念日挑选一款心仪的样式，让它在你的列表中更加醒目、有仪式感。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入一个倒数纪念日页面，点击右下角的「样式」按钮，即可开始为这个纪念日挑选样式。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/987d5c8a6a4ca038ed1ba999deb57f0e.png)\n\n\n::::\n\n::::tab [desktop]\n将鼠标悬停在某个倒数纪念日卡片上，点击右上角的「...」-「样式」按钮，即可进入样式设置界面。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/9c8c63a9251b0ae70127e843a4ecea86.png)\n\n\n\n::::\n\n:::::\n\n# 超多样式\n滴答清单提供了丰富多样的样式选项，满足你对不同重要日子的表达需求。无论是简洁大方、温暖治愈，或者是萌趣卡通、热情多巴胺......都可以找到契合心情的风格。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/0a6e46a4c8822469b996a31a40f929cf.png)\n\n\n\n# 自定义颜色\n\n挑选样式后，还可以为它配置专属颜色。 通过自定义颜色，让每个倒数纪念日更具个人特色，也更容易一眼识别。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n![](/dida-assets/cdn.dida365.cn/hc/all/037f34b4a2be374353816a1290f1d866.png)\n\n::::\n\n::::tab [desktop]\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/9c1be8d2adab288df2c96000fbcd2ef2.png)\n\n\n\n::::\n\n:::::\n\n# 自定义图片\n\n当你选择了「图片样式」后，还可以进一步替换背景图片，赋予每个纪念日独一无二的故事和情感。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n选择图片样式后，切换到「图片」选项，即可替换图片或者上传心仪的背景图，让每一个纪念日更加生动有趣。\n\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/18f99e3f02e5d71247cd24dc9087b2ca.png)\n\n::::\n\n::::tab [desktop]\n\n在样式编辑窗口，点击「切换图片」，可以上传新的背景图片，让每一个纪念日更加生动有趣。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/3393ec38036fdecceed5d78f3dd179cf.png)\n\n\n\n\n为每个倒数纪念日设置样式后，你的页面会变得更加丰富而有温度。\n\n::::\n\n:::::\n\n## 天周年显示切换\n当你看到「已经恋爱 2000 天」，是不是也想知道这是多少年，或是多少周？\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点进一个倒数纪念日，在倒数纪念日详情页中，点击中间的天数，就能在**天、年、周**三种单位间快速切换，用不同的单位更直观地感受时间的流逝。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/784e823b98a662369220bb5a62bf123b.mp4\n:::\n\n\n::::\n\n::::tab [desktop]\n点击倒数纪念日卡片上的天数，就能在**天、年、周**三种单位间快速切换，用不同的单位更直观地感受时间的流逝。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/4bdb06441f15809607d5a83729d6fc2b.png)\n::::\n\n:::::\n\n# 添加备注\n想记录关于这一天的小故事，或者留下一些提醒信息？在纪念日详情页中，你可以点击左下角的「备注」按钮，为这个日子添加一段文字记录。\n\n写备注时，点击左下角的「**插入时间**」按钮可以快速插入当前时间；你还可以设置备注是否「**在详情页中显示**」，让重要信息一眼就能看到。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/67d568a445fe4f6c376a89678ede8794.png)\n", "tags": [""], "hideIndex": true, "favs": 2, "order": 549755813888, "status": 0, "pinInSearch": false, "sectionId": "feature", "area": "help-center", "createdTime": "2025-04-28T06:15:03.177Z", "modifiedTime": "2026-05-08T06:47:32.360Z", "postId": "7322503597483098112", "__v": 0, "shortTitle": "", "parentId": "7322192298849075200"}, {"_id": "62c3ef210223aebb27da24ce", "author": "", "description": "", "title": "玩转微信", "content": "# 微信公众号\n通过绑定滴答清单的微信服务号，你可以直接与服务号对话，无论是输入文字还是发送语音，滴答清单都能自动识别并保存为任务，并可设置提醒，确保你的待办不被遗漏。\n\n这一方式省去了在应用间切换和复制粘贴的麻烦，让你随时随地快速记录灵感与事务。\n\n## 操作说明\n\n**1. 关注滴答清单服务号（didalist）**\n\n微信扫描下方二维码，或者搜索“滴答清单”公众号。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/e34dda37b796acd4b76f151b560de294.png)\n\n\n**2. 绑定滴答清单账号**\n\n你需要先在滴答清单中绑定微信账号，操作方法如下：\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入「账户信息」页面，在「第三方账户」中绑定微信。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/ef06d3a65f8c57a506a77b84ef8aca50.png)\n\n\n::::\n\n::::tab [desktop]\n前往网页版滴答清单的「设置 > 账户安全」，完成微信绑定。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/eb06f9308fd09e78cb421da5ce99debc.png)\n\n\n::::\n\n:::::\n\n**3. 在服务号中直接输入任务内容**，支持文字、图片、语音、网页（文件暂不支持）\n\n**4. 建议将服务号置顶，便于随手添加任务**\n> 例如输入 “买牛奶 🥛” 或发送一张购物清单截图，即可自动保存为任务，默认保存在「收集箱」中。\n\n\n## 配置滴答清单公众号\n1. 关注「滴答清单」微信公众号\n2. 进入公众号菜单栏，点击「更多功能」 > 「配置公众号」\n3. 按照页面提示，完成相关功能配置\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/da2c67fd93bcf7c62993c63f246d3f2d.png)\n\n\n\n::: spoiler 如何解绑/更换？\n进入「账户信息」页面，在「第三方账户」栏目中，点击「微信」旁的解除绑定按钮，即可完成解绑操作。\n\n解绑后，你可以使用新的微信账号重新绑定。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/47274892350fb0e0ff1be11705474ad3.png)\n\n\n:::\n\n\n# 滴答小助手\n你可以在微信聊天中，将需要保存的文字、图片、网页等信息转发给「滴答小助手」，内容将自动同步到滴答清单 App 中，帮你快速收集待办，轻松管理琐事灵感。\n\n## 绑定滴答小助手\n- 进入「设置 > 导入与关联应用 > 微信」\n- 选择「添加小助手」并保存二维码 → 添加为微信好友即可。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/1b684b4968c7d4a054610c061e954abf.png)\n\n\n>💡 若尚未绑定滴答清单账号，请先关注公众号「滴答清单」，在「更多功能 > 我的账户」中完成账号绑定。\n\n\n## 使用方法\n成功添加并绑定后，只需将微信中的文字、图片、网页、聊天记录等转发给「滴答小助手」，内容会自动采集至滴答清单 App。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/3fac01f079494067111fad67dadb984a.png)\n\n\n## 在滴答清单中查看\n所有转发内容会统一保存至标签：#微信采集，你可以：\n- 进入任务后进一步编辑内容\n- 对不再需要的任务进行删除整理\n- 重新归类或添加更多标签，便于后续管理\n\n\n# 常见问题\n::: spoiler 微信公众号和滴答小助手有什么区别？\n\n\n滴答清单服务号更加适合用于**创建任务**，可支持文字/语音并且自动识别时间创建任务，同时也会回复你：创建任务成功。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/331ff981f94a6d7c84bb4de25bbb33f5.png)\n\n\n而「滴答小助手」则更适合「转发消息」，你可以将所有想要收藏的内容转发给ta，小助手会将你所有发送的消息都将直接保存至滴答清单中，不会给你任何回复。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/de1727a8f8cd9864fc239be46f31239a.png)\n\nPS. 助手不支持语音识别的哦，会将语音文件保存至滴答清单中。\n\n\n:::\n\n::: spoiler 如果被滴答小助手删除好友怎么办？\n由于添加小助手有人数限制，太久没有使用会被系统清理，如果需要使用需要再次添加。\n\n具体操作步骤如下：\n\n1.删除滴答小助手联系人；\n\n2.确认是否删除成功，微信中搜索滴答小助手，没有对应的联系人；\n\n3.重新扫码添加滴答小助手（免验证通过的，无需我们做任何操作）。\n\n\n\n![s](/dida-assets/cdn.dida365.cn/hc/all/fcba0321b52710ff3b7c93f8e20f538f.png)\n\nPS.滴答小助手为高级会员功能\n:::\n", "tags": [""], "hideIndex": true, "favs": 22, "order": 1099511627776, "status": 0, "sectionId": "feature", "createdTime": "2022-07-05T07:58:25.283Z", "modifiedTime": "2026-05-08T06:49:17.644Z", "postId": "6949994885164302336", "__v": 0, "parentId": "6949998557218734080", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c544ab5084b6294bef6109", "author": "", "description": "", "title": "📆 日历 ", "content": "![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/1e29d2b607e71b556fea2e46830ec0a5.jpg)\n\n时间管理的关键，不仅在于高效地利用眼前的每分每秒，更在于有一个好的规划。我们应该清楚地知道，在一段的时间里应该做哪些事、完成哪些长远的目标 🎯。\n\n所以，我们为你提供了多个日历视图，方便你更好的安排规划。 \n\n👉 [周视图：轻松安排周计划](/articles/6950641140068515840)\n\n👉 [月视图：这个月做了什么一目了然](/articles/6950640298334617600)\n\n👉 [年视图：查看年度任务完成情况](/articles/7397517843383713792)\n\n👉 [列表视图：按天查看任务](/articles/6950643979079647232)\n\n\n除此之外，我们也提供了丰富的显示设置，包括农历、节假日、筛选部分清单等功能。\n👉 [日历显示设置](/articles/6950647988939128832)\n\n你可以订阅第三方日历，在滴答清单的日历中显示。\n👉 [订阅第三方日历](/articles/6949998599191134208)\n", "tags": [""], "hideIndex": true, "favs": 72, "order": 1099511627776, "status": 0, "sectionId": "feature", "createdTime": "2022-07-06T08:15:39.683Z", "modifiedTime": "2026-09-08T00:17:07.294Z", "postId": "6950361611617959936", "__v": 0, "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c549145084b6294bef619c", "author": "", "description": "", "title": "🌍 玩转微信 ", "content": "![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/ddf1835695f07d630b6571ed4439c0ff.png)\n\n# 微信公众号\n通过绑定滴答清单的微信服务号，你可以直接与服务号对话，无论是输入文字还是发送语音，滴答清单都能自动识别并保存为任务，并可设置提醒，确保你的待办不被遗漏。\n\n这一方式省去了在应用间切换和复制粘贴的麻烦，让你随时随地快速记录灵感与事务。\n\n## 操作说明\n\n**1. 关注滴答清单服务号（didalist）**\n\n微信扫描下方二维码，或者搜索“滴答清单”服务号。\n\n![s](/dida-assets/cdn.dida365.cn/hc/all/e34dda37b796acd4b76f151b560de294.png)\n\n\n**2. 绑定滴答清单账号**\n\n你需要先在滴答清单中绑定微信账号，操作方法如下：\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入「账户信息」页面，在「第三方账户」中绑定微信。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/ef06d3a65f8c57a506a77b84ef8aca50.png)\n\n\n::::\n\n::::tab [desktop]\n前往网页版滴答清单的「设置 > 账户安全」，完成微信绑定。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/eb06f9308fd09e78cb421da5ce99debc.png)\n\n\n::::\n\n:::::\n\n**3. 在服务号中直接输入任务内容**，支持文字、图片、语音、网页（文件暂不支持）\n\n**4. 建议将服务号置顶，便于随手添加任务**\n> 例如输入 “买牛奶 🥛” 或发送一张购物清单截图，即可自动保存为任务，默认保存在「收集箱」中。\n\n\n## 配置滴答清单公众号\n1. 关注「滴答清单」微信公众号\n2. 进入公众号菜单栏，点击「更多功能」 > 「配置公众号」\n3. 按照页面提示，完成相关功能配置\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/da2c67fd93bcf7c62993c63f246d3f2d.png)\n\n\n\n::: spoiler 如何解绑/更换？\n进入「账户信息」页面，在「第三方账户」栏目中，点击「微信」旁的解除绑定按钮，即可完成解绑操作。\n\n解绑后，你可以使用新的微信账号重新绑定。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/47274892350fb0e0ff1be11705474ad3.png)\n\n\n:::\n\n\n# 滴答小助手\n你可以在微信聊天中，将需要保存的文字、图片、网页等信息转发给「滴答小助手」，内容将自动同步到滴答清单 App 中，帮你快速收集待办，轻松管理琐事灵感。\n\n## 绑定滴答小助手\n- 进入「设置 > 导入与关联应用 > 微信」\n- 选择「添加小助手」并保存二维码 → 添加为微信好友即可。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/1b684b4968c7d4a054610c061e954abf.png)\n\n\n>💡 若尚未绑定滴答清单账号，请先关注公众号「滴答清单」，在「更多功能 > 我的账户」中完成账号绑定。\n\n\n## 使用方法\n成功添加并绑定后，只需将微信中的文字、图片、网页、聊天记录等转发给「滴答小助手」，内容会自动采集至滴答清单 App。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/3fac01f079494067111fad67dadb984a.png)\n\n\n## 在滴答清单中查看\n所有转发内容会统一保存至标签：#微信采集，你可以：\n- 进入任务后进一步编辑内容\n- 对不再需要的任务进行删除整理\n- 重新归类或添加更多标签，便于后续管理\n\n\n# 常见问题\n::: spoiler 微信公众号和滴答小助手有什么区别？\n\n\n滴答清单服务号更加适合用于**创建任务**，可支持文字/语音并且自动识别时间创建任务，同时也会回复你：创建任务成功。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/331ff981f94a6d7c84bb4de25bbb33f5.png)\n\n\n而「滴答小助手」则更适合「转发消息」，你可以将所有想要收藏的内容转发给ta，小助手会将你所有发送的消息都将直接保存至滴答清单中，不会给你任何回复。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/de1727a8f8cd9864fc239be46f31239a.png)\n\nPS. 助手不支持语音识别的哦，会将语音文件保存至滴答清单中。\n\n\n:::\n\n::: spoiler 如果被滴答小助手删除好友怎么办？\n由于添加小助手有人数限制，太久没有使用会被系统清理，如果需要使用需要再次添加。\n\n具体操作步骤如下：\n\n1.删除滴答小助手联系人；\n\n2.确认是否删除成功，微信中搜索滴答小助手，没有对应的联系人；\n\n3.重新扫码添加滴答小助手（免验证通过的，无需我们做任何操作）。\n\n\n\n![s](/dida-assets/cdn.dida365.cn/hc/all/fcba0321b52710ff3b7c93f8e20f538f.png)\n\nPS.滴答小助手为高级会员功能\n:::\n::: spoiler 为什么合并转发无法获得文章链接？\n目前，不同系统对「合并转发」的支持能力存在差异：\n\n- iOS 用户：支持在合并转发时生成并获取文章链接\n\n- Android 用户：暂不支持通过合并转发获取文章链接\n\n因此，Android 用户如需获取文章链接，需要通过逐条转发的方式进行操作。\n\n我们会持续关注各平台的能力变化，并在条件允许的情况下优化相关体验，感谢你的理解与支持。\n:::\n", "tags": [""], "hideIndex": true, "favs": 845, "order": 1099511627776, "status": 0, "sectionId": "special", "createdTime": "2022-07-06T08:34:28.921Z", "modifiedTime": "2026-10-06T14:37:23.430Z", "postId": "6950366347985420288", "__v": 0, "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c5554a1e3a8b2ac64c7f4c", "author": "", "description": "", "title": "开始坚持一个习惯", "content": "\n# 开启习惯打卡模块\n你可以在移动端或桌面端开启「习惯打卡」功能，开启后即可开始记录和管理你的习惯养成进度。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n前往「设置」>「功能板块」，开启「习惯打卡」功能。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/9c02bcbaae6f9f25f8e110f2f93546b9.png)\n\n::::\n\n::::tab [desktop]\n点击头像进入「设置」>「功能模块」，开启「习惯打卡」功能。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/4e15b7785c28fad113dd2ab503283504.png)\n\n\n::::\n\n:::::\n\n\n#  如何添加一个习惯？\n\n\n## 习惯库添加\n滴答清单习惯库中有超过60+的小习惯，覆盖生话、健康、运动、心态四大场景，你可以在分类中搜索自己想get的新技能，一键添加至打卡页面。\n\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n在下方栏中找到「打卡」，点击「+」，进入习惯库。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/7031961ad5b6fd26d20ca1c8566ce722.png)\n\n::::\n\n::::tab [desktop]\n在左侧边栏找到「打卡」，打开习惯列表页面，点击右上角的「+」，选择习惯图标，在「习惯库」中选择你需要的习惯。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/8223f526d0265f4e97a32eb3e8b48edb.png)\n::::\n\n:::::\n\n\n::::: spoiler 如何管理我的习惯？\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n点击习惯进入详情页，点击右上角「...」，可进行编辑、开始专注、分享、归档或删除等操作。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/2a47740dac047027f599fc1af2dc202d.png)\n\n::::\n\n::::tab [desktop]\n点击习惯进入详情页，点击右上角「...」，可进行编辑、开始专注、分享、归档或删除等操作。\n![](/dida-assets/cdn.dida365.cn/hc/all/350d2f3812206d0f8fbbc5ca7e4e7eef.png)\n::::\n\n:::::\n\n\n## 自定义习惯\n\n如果习惯库中没有你想要的习惯，你也可以自定义习惯！\n在习惯库中点击「自定义习惯」，你可以填写习惯名称、选择图标、还能根据情况写点鼓励自己的话，再点击下一步，就能对习惯进行再编辑。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/30e7a6f9439c0acdbac58c76e6dc8ada.png)\n\n#  编辑你的习惯\n## 保持频率坚持做\n在培养习惯时，我们不可能“一口吃成个胖子”，像健身这个事情，我们就不需要制定为每天都必须要做的一件事，你可以设置为一周完成3次。\n\n你可以根据不同的习惯设置不同的打卡频率，如：健身，我只需要一周完成3次即可。\n\n你可以在「编辑习惯」频率中设置。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/a22cd3304e64f7296ed03f60ac970daf.png)\n\n## 设立一个简单的目标\n在建立习惯的初期，其实我们是在建立「不间断」的习惯，这时，为了让这件事情变得简单且易操作，我们不妨真的把它设置的超级简单，简单到你完全无法找理由不做。\n\n- 你想要养成背单词的习惯，试试将完成目标设置为每天5个。\n- 你想养成读书的习惯，不妨将完成目标设置为每天读2页书。\n\n你可以在建立习惯时，「目标」中选择「当天完成一定量」设置。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/f6b07a633fdf240f56b651ddc5544d36.png)\n\n# 实时跟进打卡进度\n\n你可以使用习惯热力图小组件，将习惯都钉在桌面上方便自己实时跟踪查看。\n\n把它和今日习惯放在一起方便自己查看这一段时间的习惯的坚持情况。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/3bb444604d5489dd955a35408de267af.png)\n\n\n\n::: spoiler 如何添加小组件？\n具体操作可以查看这篇文章：\nhttps://hc.dida365.com/articles/6950366960659988480#%E5%A6%82%E4%BD%95%E6%B7%BB%E5%8A%A0%E5%B0%8F%E7%BB%84%E4%BB%B6%EF%BC%9F", "tags": [""], "hideIndex": true, "favs": 57, "order": 1099511627776, "status": 0, "sectionId": "feature", "createdTime": "2022-07-06T09:26:34.050Z", "modifiedTime": "2026-08-04T10:09:44.548Z", "postId": "6950379455722291200", "__v": 0, "parentId": "6950361641582067712", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c5575d1e3a8b2ac64c7f8b", "author": "", "description": "", "title": "如何编辑四象限规则", "content": "在四象限中，每个象限对应着一种规则。任务会根据你设置的规则，显示到对应的象限中。\n\n为了让你更容易上手，我们默认为你提供了两套常用的规则组合：\n\n* 规则组合1：每个象限，对应优先级。\n* 规则组合2：“重要”对应“优先级”，“紧急”则对应“时间”的维度。\n\n当然你可以根据自己的使用习惯，设置适合的象限规则，从而帮助你更好地管理自己的任务。具体来说：\n\n# 规则组合1：象限 → 优先级\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/b693db3018811892dfe60e62d0cb85d4.png)\n\n在这种规则下：4种优先级，对应4个象限。\n\n只要你在任务中设置了优先级，这个任务就会在对应的象限中显示。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/d597ab9d33a113ec5e6ad4438b5579a8.gif)\n\n\n当你在四象限查看任务，拖动调整任务的象限时，任务的优先级也会发生对应的变化。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/fbf282fe83e825e59fcc3104334e7410.gif)\n\n这个规则非常简单，适合刚入门的新用户。\n\n\n# 规则组合2：象限 → 时间+优先级\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/a96b2031a80fdd3dfc9143affdaa7748.png)\n\n在这种规则下：优先级代表「重要程度」，时间代表「紧急程度」。\n\n举例来说：\n- 当你设置了任务为“今天”、“高优先级”，这个任务会自动出现在「重要且紧急」的象限中。\n- 而当你设置了任务为“1个月后”、“低优先级”，这个任务会自动出现在「不重要不紧急」的象限中。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/6b9dfe38966ccc7f5a407c1592524e06.png)\n\n此时，当你在四象限中，拖动任务调整任务的象限时，任务的时间和优先级也会发生对应的变化。\n\n随着时间的流逝，原来不紧急的任务，因为截止日期的临近，变成紧急的任务。而这些任务也会按照你设定的规则，自动调整到紧急的象限中。\n\n# 自定义象限规则\n除了我们提供的默认规则之外，你也可以根据自己的需求，编辑象限规则。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/bbd6f936838a2658f3abbbe782b03082.png)\n\n\n我们提供了4个维度：\n\n- 清单/标签：你可以选择哪些清单/标签的任务在象限中显示。例如你可以选择只看“工作”的清单，就可以在清单中选择“工作”。\n- 时间：你可以将紧急的时间范围修改成“今天~明天、已过期”，然后将不紧急的时间范围修改成“后天~往后7天”。这样很久以后的任务就不再显示，更加聚焦当前的任务。\n- 优先级：你可以设定设置每个象限显示什么优先级的任务。\n\n与其踌躇不定，不如先选择一套目前最合适自己的规则使用起来。在使用过程中，慢慢地你就会掌握其中要领。而当你成为时间管理大师的时候，相信你已经创造了一个高效又独一无二的四象限。\n\n# 常见问题\n\n::::::: spoiler 如何调整四象限顺序？\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击右上角「...」，选择「编辑」，选中需要更改顺序的象限，拖动调整即可。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/23e72f6b48b2525124bf728527865386.gif)\n\n::::\n\n::::tab [desktop]\n点击单个象限直接拖动调整即可。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/0db624b75b1a73e46433e941deb68074.gif)\n\n\n::::\n\n::::::: \n\n\n\n:::::: spoiler 如何添加四象限桌面小组件？\n:::::tabContainer [Android|iOS|Windows|macOS]\n\n::::tab [Android]\n在窗口小工具中点击添加「四象限」。\n::::\n\n::::tab [iOS]\n长按屏幕，点击左上角「+」，搜索滴答清单选择「四象限」，点击添加。\n::::\n\n::::tab [Windows]\n右键任务栏中滴答清单，选择「添加四象限小部件」，即可添加。\n::::\n\n::::tab [macOS]\n点击屏幕右上角时间区域，点击编辑小组件，搜索滴答清单选择「四象限」，点击添加。\n:::::::\n\n::::::: spoiler 如何自定义四象限名称？\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n选择需要更改标题的象限，点击右上角「...」-「编辑象限」，即可根据个人需求修改象限名称。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/2e9b502db824f2ea59b61cfd658c3e72.png)\n\n\n\n\n::::\n\n::::tab [desktop]\n点击需要更改标题的象限右上角「...」-「编辑象限」，即可根据个人需求修改象限名称。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/5a2c308c1bc9b8f1e43f2c676125a4c4.png)\n\n\n::::\n\n::::::: \n\n\n\n::: spoiler 如何隐藏已完成任务？\n在四象限页面，点击右上角「...」- 隐藏已完成。\n:::\n\n::: spoiler 如何调整四象限的任务顺序？\n选择需要更改的象限，点击右上角「...」-「排序」，可选择排序方式。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/13165a4536ff3a2e98819a045af6de1c.png)\n:::\n\n\n\n\n\n\n", "tags": [""], "hideIndex": true, "favs": 76, "order": 1099511627776, "status": 0, "sectionId": "feature", "createdTime": "2022-07-06T09:35:25.031Z", "modifiedTime": "2026-10-02T03:05:35.721Z", "postId": "6950381682822217728", "__v": 0, "parentId": "6950361734683033600", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c648371e3a8b2ac64c81ae", "author": "", "description": "", "title": "月视图：每月总结复盘", "content": "总结复盘是自我成长的重要法宝。按月对工作、生活、学习做一个总结回顾，可以让我们的成长轨迹更加清晰明确🌲。\n\n滴答清单的「月视图」提供了一整个月的全局概览。\n- 当你需要回顾一整个月做了哪些事情，看一下月视图就能轻松搞定。\n- 当你需要规划某件事时，不妨先看看月视图，合理安排时间。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/2e08ee047a7d43265c44d94b829704b1.png)\n\n\n# 添加任务\n除了常规添加任务的方法，你还可以在月视图中直接创建一个超长时间段任务。\n进入月视图，长按起始日期的单元格，向左/向下拖动至结束日期，松开鼠标即可创建。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/649abb1ae069df0f8647ebd53e3c94c7.png)\n\n\n\n# 回顾任务\n对照当初制定的月目标，回顾这一个月完成任务的情况。\n\n清单太多，任务太多，怎么分门别类地回顾任务呢？很简单，筛选一下清单吧。你可以根据生活中不同的方面，如工作、生活、学习等，来筛选清单。\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击右上角「···」-「显示范围」即可筛选。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/140224add15fcd5bcc30a5b5743bd284.png)\n\n::::\n\n::::tab [desktop]\n\n点击日历视图左上角图标，再选择显示的清单。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/97aecc0aa127de2b0514d9e5e5d4cbde.png)\n\n::::\n\n:::::\n\n未完成的任务和已完成的混在一起，怎样才能只查看被遗漏而未完成的任务呢？\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击右上角「···」-「显示设置」，关闭「显示已完成」即可。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/25141e84b95dabb33c3eec2ace2aae41.png)\n\n::::\n\n::::tab [desktop]\n\n点击日历视图右上角「···」-「显示设置」，关闭「显示已完成」即可。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/4ec96f92180200ef596e90f5612d94fc.png)\n\n\n::::\n\n:::::\n\n\n\n总结上月，放眼下月，我们支持快速切换月份。你可以直接在月视图中上下滑动，查看下个月的日程安排。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/88e9d9251fd176919f409005c6060f04.png)\n\n\n\n**缩放调整显示的周数**\n\n想更灵活地查看近期计划？你还可以使用**双指捏合**手势缩放调整显示的周数：向外张开可放大显示更少的周数、更多任务，向内捏合可缩小恢复整月显示。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/4bbf5b0f07add2c89d9af50e9a68b9f2.png)\n\n\n\n\n缩放至多周视图，你还可以点击右上角「**恢复默认**」图标快速返回整月视图。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/a71de68b6a2812965e7a0bf65182dcdc.png)\n\n\n::::\n\n::::tab [desktop]\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/65428160355967a321c32288cc5a9dc8.mp4\n:::\n\n\n\n\n\n> 点击「今天」可快速跳回本月。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/cbc863036c2f393b2eb507bf5745f926.png)\n\n::::\n\n:::::\n\n\n\n\n# 总结本月\n分析原因并总结，是复盘至关重要的步骤：\n\n- 从经历中找到金子：明确自己的成果\n- 从失败中找到教训：知晓自己的不足\n\n总结规律，能够从中提炼出方法和规律，不仅有助于解决该具体案例中的问题，还能够解决某一类问题。\n记录心得才是这次复盘的关键，用「笔记」保存下来吧👉[笔记](/articles/6950671600370843648)\n\n1. 新建一个“总结复盘”的笔记清单，创建一个笔记“ 8 月复盘”。\n\n![--64.31%](/dida-assets/cdn.dida365.cn/hc/all/64fb4fce27e51240b8c3ae148311e2d3.png)\n\n2. 双击该笔记，打开独立弹窗。\n\n![--64.31%](/dida-assets/cdn.dida365.cn/hc/all/6a15893c08910be7a450ae7a12d9746a.png)\n\n3. 将日历界面显示 8 月，查看这一个月里的任务情况，轻松复盘 ✌️。\n\n![--64.31%](/dida-assets/cdn.dida365.cn/hc/all/e804e5d5532ab36150caca6fa6d0a160.png)\n\n", "tags": [""], "hideIndex": true, "favs": 27, "order": 1099511627776, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T02:43:03.774Z", "modifiedTime": "2026-05-06T10:23:23.617Z", "postId": "6950640298334617600", "__v": 0, "parentId": "6950361611617959936", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c6508f1e3a8b2ac64c8262", "author": "", "description": "", "title": "如何共享清单", "content": "# 共享清单\n**只有你自己创建的普通清单支持共享，「今天」、「明天」等智能清单以及「收集箱」不支持共享协作**。因此，在开始共享前，请先新建一个用于共享的普通清单。\n\n接着，进入该清单详情页面，点击右上角的「**···**」 → 选择「**共享协作**」 → 点击「**添加新成员**」，即可邀请对方加入共享清单。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/e1dad40b2356ad1d27062cc4a8f8b021.png)\n\n::::\n\n::::tab [desktop]\n\n![--77.34%](/dida-assets/cdn.dida365.cn/hc/all/39bdb93383f87f392c70bb0eca8f761d.png)\n\n![--77.34%](/dida-assets/cdn.dida365.cn/hc/all/c5a72993c18d894697c46e64491d1097.png)\n\n::::\n\n:::::\n# 邀请新成员\n邀请新成员有以下三种方式：\n- 联系人邀请：输入联系人电子邮箱，回车即可发送邀请，未注册过滴答清单的邮箱帐户，可以通过点击邮箱内的链接来激活共享。您也可以从最近邀请和团队成员里显示的联系人中选择一个或者多个进行邀请。\n- 共享链接邀请：点击即可创建共享链接，复制发送给其他人。\n- 微信二维码邀请：将二维码发送给好友通过扫一扫加入清单。（仅限 App 端）\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/59dbb78f170764e4032a98415ef173ce.png)\n\n::::\n\n::::tab [desktop]\n\n![--77.34%](/dida-assets/cdn.dida365.cn/hc/all/3b9eeffd0e962781c4b6c06a75a98864.png)\n\n::::\n\n:::::\n# 接受邀请\n 收到邀请后，被邀请人可以进入通知中心查看，选择接受邀请，即可加入共享协作。\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/1a6e6cc3e0ac4f6d7f715f1da9ea7386.png)\n\n::::\n\n::::tab [desktop]\n\n![--77.34%](/dida-assets/cdn.dida365.cn/hc/all/301872ac70b009ab9428a761446f5df2.png)\n\n::::\n\n:::::\n", "tags": [""], "hideIndex": true, "favs": 42, "order": 1099511627776, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T03:18:39.826Z", "modifiedTime": "2026-10-13T12:40:08.354Z", "postId": "6950649257581871104", "__v": 0, "parentId": "6950648827183366144", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c654031e3a8b2ac64c82ad", "author": "", "description": "", "title": "如何管理海量任务", "content": "滴答清单提供了强大的管理任务方式，一共5个层级，包括「文件夹」-「清单」-「分组」-「任务」-「子任务」，能够帮助你高效管理海量任务。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/8c312c0d431478da314a2dfd9dcf9be6.png)\n\n\n- [文件夹](/articles/6957521286893404160)：文件夹常被用来管理清单。如果你的同类清单数量较多，例如：会议、报告、差旅，你可以创建一个“工作”文件夹去整理它们。\n\n- [清单](/articles/6950654234933067776)：清单可以被用来对任务进行分类整理。你可以根据个人的生活和工作安排创建常用清单，将同类任务放入同一个清单。另外，清单还可以被共享出去，与他人进行协作。\n\n- [分组和排序](/articles/7054273336087412736)：每个项目里的小分类，如「部门会议」、「 项目会议」。\n\n- [任务](/articles/6950361599374786560)：任务是进行日程管理的基础层级。\n\n- [子任务](/articles/6950660746367729664)：子任务是比任务低一级的层级，任务可以被拆分成几个子任务，一一达成。\n\n除此之外，我们还提供了「[标签](/articles/6950656299306582016)」、「[过滤器](/articles/6950655961044353024)」，帮助你更好的管理任务。\n\n::: spoiler 清单和标签、过滤器的区别？\n- 清单是任务的归属地，每个任务必须放在某一个清单里。\n- 标签是任务的属性标记，同一个任务可以有多个标签，并且可以跨清单使用。\n- 过滤器是智能筛选器，帮你自动筛选展示符合条件的任务，例如日期为下周 + 高优先级的任务。\n:::\n", "tags": [""], "hideIndex": true, "favs": 19, "order": 1099511627776, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T03:33:23.583Z", "modifiedTime": "2026-05-05T10:32:44.944Z", "postId": "6950652964327391232", "__v": 0, "parentId": "6950361599374786560", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c6574e1e3a8b2ac64c8317", "author": "", "description": "", "title": "看板视图：分类管理任务", "content": "看板是一种可视化的任务管理工具，你可以通过看板获得更多维度的任务分解、更加直观的信息展示、更具象化的进度监控。\n\n你可以用看板随时随地分组管理你的大小事务，项目拆解、信息展示、流程跟踪、团队协作等等。\n- 个人成长（年度规划、职业竞升、技能学习...）\n- 团队协作（招聘管理、办公室采购、销售流程、市场运营...）\n\n\n# 切换看板视图\n\n看板并不是独立的功能模块，它是清单的一种显示方式。区别于其他视图，通过看板视图你能够更加清晰的查看到自己各个分组中的事项。\n::: video /dida-assets/cdn.dida365.cn/hc/all/eec54ed41973f33763571e3161e69eb0.mp4\n:::\n\n\n> 目前已经支持在各智能清单、文件夹以及标签中切换看板视图。\n\n\n\n:::::: spoiler 如何切换看板视图？\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入任务详情页，点击右上角「...」-「切换视图」，选择「看板视图」。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/0a1e8918773be13c2cb6f83fec274e74.png)\n\n\n\n::::\n\n::::tab [desktop]\n你可以在各清单的任务列表页，点击右上角「···」，即可在「切换视图」中选择「看板视图」。\n\n![--63.94%](/dida-assets/cdn.dida365.cn/hc/all/0c207f596c60be2dbef151c0c4c48aa5.png)\n\n\n::::\n\n:::::: \n\n\n# 使用看板视图\n## 管理个人事项\n在「最近7天」中选择看板视图，能够快速查看到自己在近7天中每一天需要完成的事情。\n\n方便自己更加清晰的知道自己每天：有多少任务？具体是什么？以及任务的完成情况。\n\n![--61.82%](/dida-assets/cdn.dida365.cn/hc/all/a99fff00dd6d35feee2505d1dbc1d245.png)\n\n也可以排序中选择**时间+优先级**，这样每天有哪些任务优先级更高清晰可见。\n\n![--61.82%](/dida-assets/cdn.dida365.cn/hc/all/8f4b6984ed20ffa8e867d138be98e0d1.png)\n\n还可以在「今天」排序中选择清单+时间能够更聚焦自己各板块的事项安排以及完成情况，上班时重点关注工作清单，下班后重点关注其他清单。\n\n![--61.82%](/dida-assets/cdn.dida365.cn/hc/all/32feda03b7f7766c80abac26efc0cc14.png)\n\n\n💡 如果计划出现变动时，你可以点击任务直接拖动到其他分组中，方便你灵活地调整任务。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/0f7459bfdbdb69407b442612100db6f3.mp4\n:::\n\n\n\n## 团队项目管理\n你也可以使用看板视图对一个阶段性任务事项进行项目管理，通过看板视图能够帮助我们清楚的知道在各个阶级需要完成的任务有哪些。\n\n![--63.18%](/dida-assets/cdn.dida365.cn/hc/all/bb1d328014f15b5360cbc7cec399a19f.png)\n\n\n\n在排序中选择**指派人+时间**，能够更加清晰追踪各个事项负责人的完成情况。\n\n![--63.18%](/dida-assets/cdn.dida365.cn/hc/all/80003ed63a465ff170ee8a3a66f4c061.png)\n\n\n# 制作个人看板\n个人看板\n\n你可以根据周期来制定看板，用看板将需要执行的任务可视化表现。\n> 可以以一年为周期，也可以选更短的周期，比如一个季度、一个月、一周等等。\n\n如：今年计划\n- 第一列「想要做」，在这一年里，任何想法、需要做的事情都可以写进来。\n- 第二列「准备做」，从第一列的想法里面挑几个放进来，建议控制在三件以内。\n- 第三列「正在做」，这里放的是你正在专注做的事。\n- 第四列「已完成」，如果一件事已经完成了，我们就可以移动到第四列来。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/09b789aa3d58766ff426619c7f29bcf9.png)\n\n\n\n当然，你还可以根据需求创建不同类别的分组：\n- 按主题：英语、政治、专业课…\n- 按进度：未开始、进行中、已完成…\n\n\n## 编辑分组\n:::::tabContainer [mobile|desktop]\n\n\n\n::::tab [mobile]\n在任意清单中点击右上角「...」-「管理分组」进行重命名、新建和删除等操作。\n\n ![l](/dida-assets/cdn.dida365.cn/hc/all/09506ce9ef8ddde05f9c2781209e4095.png)\n \n::::\n::::tab [desktop]\n 点击「分组」右上角的「···」，你可以对分组进行重命名、新建和删除等操作。\n \n![--76.34%](/dida-assets/cdn.dida365.cn/hc/all/edac244deb5c1c182a0a06d42431d9af.png)\n\n\n::::\n:::::\n\n\n\n\n## 拖动排序\n\n无论是在电脑端还是移动端都能点击「分组」或者「任务」自由地拖动到相应位置。\n\n💡如果是在移动端你可以点击顶部 Tab栏切换到分组中。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/9b750cd102fc6b327d52572ecd103b18.gif)\n\n\n\n## 添加任务\n:::::tabContainer [mobile|desktop]\n\n::::tab [desktop]\n点击「分组」右上角的「+」，你可以在分组中添加任务。\n\n![--76.34%](/dida-assets/cdn.dida365.cn/hc/all/947178299abf377d8bebc5a46494f5c9.png)\n\n::::\n\n::::tab [mobile]\n在分组页中点击「+」，就可以添加任务到对应的分组中。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/5ba5840078df01a2e97cd2c8b2f66b0b.png)\n\n::::\n\n:::::\n\n\n\n\n\n# 团队看板\n\n滴答清单的「看板视图」能有效帮助团队：\n- 保持团队专注：目标明确标注在看板上，集中精力专注达成。\n- 提高工作透明度：成员可以看到整个工作流程，明确项目方向并且权责清晰。\n- 提高完成效率：负责人可以通过看板轻松组织任务和排期，\n\n你可以根据团队的情况自由的创建卡片（分组），并将任务分配给团队成员。\n\n拖拽即可灵活排序看板卡片，轻松应对团队工作中的任何变化。\n\n## 指派负责人\n创建好任务，通过「指派」完成任务的分配，成员会收到“任务指派通知”。\n\n\n* 在看板视图右键任务，选择「分配给」即可。\n\n\n![--63.83%](/dida-assets/cdn.dida365.cn/hc/all/58b10b4baf94919ae873ce4cb04005df.png)\n\n\n\n\n\n## 解决信息差\n常规的看板视图是一种「被动」展示项目进展的方式，但在滴答清单中，你可以和你的成员通过「任务评论」进行沟通，有效地解决成员间的“信息差”。\n\n- 当任务有所进展时，可以将动态发在评论区\n- 点击任务，点击弹窗里的「评论」，在输入框里写下你的评论即可。\n\n\n![--66.45%](/dida-assets/cdn.dida365.cn/hc/all/c3fd31edbcbb860268f9de172c775afc.png)\n\n\n\n另外，惊喜的是，每个任务被创建或编辑，滴答清单都帮你自动生成「任务动态」，你可以随时查看整个任务进行过程中的一切变动。\n\n\n- 点击任务，点击弹窗右下角「...」-「任务动态」。\n\n\n![--68.16%](/dida-assets/cdn.dida365.cn/hc/all/b5c1052c5431b358a340d746a4c0310b.png)\n\n# 常见问题\n::: spoiler 智能清单支持看板视图吗？\n智能清单支持看板视图，你可以在电脑端清单右上角「排序」或者手机端「...」-「排序」中选择不同的分组方式，来帮助你更好地在智能清单中使用看板视图。\n:::\n\n::: spoiler 看板视图支持调整宽度吗？\n电脑端看板视图支持调整宽度，有小、中、大三种尺寸供你选择。点击看板视图右上角「...」进入「显示设置」即可调整。\n\n![--57.34%](/dida-assets/cdn.dida365.cn/hc/all/87c815cafcadb8ad562581afb7ab8faa.png)\n\n在「显示设置」中，你还可以设置「显示输入框」，帮助你更快地在看板中添加新任务。\n\n:::\n\n::: spoiler 为什么我无法「编辑分组」或者「管理分组」？\n需要先在清单右上角的「排序」中将「分组」改为「自定义」，才可以管理分组。\n:::\n\n\n\n", "tags": [""], "hideIndex": true, "favs": 540, "order": 1099511627776, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T03:47:26.921Z", "modifiedTime": "2026-09-14T16:36:25.335Z", "postId": "6950656501543337984", "__v": 0, "parentId": "6950656395750408192", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c65b421e3a8b2ac64c83cf", "author": "", "description": "", "title": "多级任务", "content": "\n面对复杂项目无从下手？滴答清单提供了「多级任务」，可以在一个任务中，添加若干个相关子任务，帮助你将总目标化繁为简，拆解为若干个明确可行的小目标，这能大大减小执行难度。 \n\n#  创建子任务\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n方式一：进入任务详情页弹窗点击右上角「...」，选择「添加子任务」。\n\n你可以在输入完第一个子任务之后点击「纸飞机」图标完成创建，或者点击键盘左下角的「换行」来完成创建当前子任务，并且可以继续创建第二个同级的子任务，如此往复。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/32077f77c3d4ab979d44f5f056fd3aa0.png)\n\n\n方式二：通过拖动将现有的任务转化成子任务。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/a816ddfabcb047e47202eca2e7997b28.png)\n\n方式三：通过拖动「+」到任务下方偏右一点的位置来在这个任务下快速创建「子任务」。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/0c2bb3b682e9fef74d8ced31505dd19b.png)\n\n> 这一功能在「今天」、「最近七天」等智能清单中不可用，只可以在「收集箱」以及自己创建的普通清单中可用。\n\n\n每一个层级的子任务在功能上都与普通任务相同，即子任务可以设置时间和时间段、进行专注、在其下写任务详情、删除之后可以在「垃圾桶」中恢复、设置标签和优先级以及分配给其他人。\n\n方式四：进入「子任务详情」，点击「子任务详情」中的右上角的「···」 - 点击「添加子任务」就可以再次在子任务中添加子任务了，最多支持五个不同层级的任务。\n \n![m](/dida-assets/cdn.dida365.cn/hc/all/0066aec79a584e257fd9148361f7e3bb.png)\n\n\n可以在子任务详情中点击子任务标题上方的主任务标题来跳转到主任务详情。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/3557e7a47cba45db93ebe4faaa4560a1.png)\n\n::::\n\n::::tab [desktop]\n\n方式一：点击任务详情区域右下角「...」，选择「添加子任务」。\n\n![--68.81%](/dida-assets/cdn.dida365.cn/hc/all/69dd767878f820ae89083e8b863a6faa.png)\n\n\n方式二：右键单击任务，选择「添加子任务」。\n\n![--68.81%](/dida-assets/cdn.dida365.cn/hc/all/df16a4d2bb124b06213a26525d149c17.png)\n\n\n你可以在输入完第一个子任务之后点击「Enter」来继续创建第二个同级的子任务，如此往复。\n\n![--68.81%](/dida-assets/cdn.dida365.cn/hc/all/988b0699c6b5042d04e12e7de3d62d96.png)\n\n方式三：通过拖动将现有的任务转化成子任务。\n将光标覆盖在一个任务上，按住任务前的图标拖动到另一个任务右下方即可快速转化为子任务。\n\n![--68.81%](/dida-assets/cdn.dida365.cn/hc/all/44ff23aab114fc74924efdfaab987a5e.png)\n\n每一个层级的子任务在功能上都与普通任务相同，即子任务可以设置时间和时间段、进行专注、在其下写任务详情、删除之后可以在「垃圾桶」中恢复、设置标签和优先级以及分配给其他人。\n::::\n\n:::::\n\n\n\n## 展开子任务\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n在任务列表中，可以点击主任务右侧的箭头图标来展开或者收起任务下的所有子任务。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/b0d85c3f36b9e366e4338a320d690b91.png)\n\n::::\n\n::::tab [desktop]\n\n在任务列表中，可以点击主任务左侧的箭头图标来展开或者收起任务下的所有子任务。\n\n![--68.81%](/dida-assets/cdn.dida365.cn/hc/all/db5219ccaed975499f502c7d57a7ba70.png)\n\n::::\n\n:::::\n\n\n## 关联主任务\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点开一个任务进入任务详情页，点击右上角「...」，选择「关联主任务」，你可以将一个任务设置为另一任务的子任务。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/a4c42f47e248124ac8d095390aabb0d6.png)\n\n\n想快速将多个任务整理为同一个任务的子任务？你可以点击清单详情页右上角「...」-「批量操作」或者长按任务来多选任务，然后点击右下角「...」-「关联主任务」来完成快速整理的操作。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/d65112a9dbc58dd85277a5f43293b6ee.png)\n\n\n::::\n\n::::tab [desktop]\n右键单击任务，或者点击任务详情区域右下角「...」选择「关联主任务」，你可以将一个任务设置为另一任务的子任务。\n\n![--68.81%](/dida-assets/cdn.dida365.cn/hc/all/b8a42b2046d28ff5ac0e6fb4cc3a8fd5.png)\n\n想快速将多个任务整理为同一个任务的子任务？你可以多选任务后点击「关联主任务」来完成快速整理的操作。\n\n![--68.81%](/dida-assets/cdn.dida365.cn/hc/all/fbec70dd8c1d7b5c74543bb81d26c5d8.png)\n\n::::\n\n:::::\n\n\n## 取消关联主任务\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n点开一个任务进入任务详情页，点击右上角「...」-「关联主任务」，点击已关联任务右侧的✖️ 即可取消关联。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/1a23f96339096742941a491ee5adc8f5.png)\n\n\n你也可以通过拖动取消关联主任务。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/8970273a51ce7b839ca80c0f483b6618.png)\n\n\n::::\n\n::::tab [desktop]\n右键单击任务，或者点击任务详情区域右下角「...」-「关联主任务」，点击已关联任务右侧的✖️ 即可取消关联。\n\n![--68.81%](/dida-assets/cdn.dida365.cn/hc/all/cacbdb8d9a8cb8604a285e700fa1379e.png)\n\n你也可以将光标覆盖在已关联的主任务上，点击取消关联即可。\n\n![--68.81%](/dida-assets/cdn.dida365.cn/hc/all/8df26a0ba4b806b2cb3cb1c0b46df87d.png)\n\n你也可以通过拖动取消关联主任务。\n\n![--67.05%](/dida-assets/cdn.dida365.cn/hc/all/6f7f3df085aa429e5329f5e4375b7232.png)\n\n::::\n\n:::::\n\n\n## 常见问题\n\n::: spoiler 多级任务支持无限拆分吗?\n现阶段，我们只允许5级任务嵌套，超过该上限则不能继续添加。\n:::\n\n::: spoiler 多级任务的排序规则是怎样的?\n列表的排序不会打破任务的层级结构，只会与同一层级的任务进行比较排序。\n:::\n\n::: spoiler 子任务会显示在日历视图中吗?\n当然，子任务一样可以在时间轴上自由拖动。\n:::\n\n::: spoiler 子任务和检查事项会影响主任务的完成进度吗?\n检查事项和子任务同时存在或只有一个存在时，仅检查事项的完成会影响任务进度。\n检查事项全部完成后，主任务将自动完成。\n:::\n\n", "tags": [""], "hideIndex": true, "favs": 22, "order": 1099511627776, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T04:04:18.966Z", "modifiedTime": "2026-05-05T11:08:36.459Z", "postId": "6950660746367729664", "__v": 0, "parentId": "6950652964327391232", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"area": "help-center", "_id": "62c677e91e3a8b2ac64c8658", "author": "", "description": "", "title": "注册与登录", "content": "# 注册与登录\n注册与登录主要有3种方式：\n1. 手机：使用手机号注册，填写短信验证码，即可完成注册。\n2. 邮箱：使用邮箱注册时，点击邮件链接进行验证，即可完成注册。\n3. 第三方账号：你可以使用通过微信、微博、QQ、Apple ID快捷注册进行登录。\n\n# 账号绑定\n一个账号可以绑定手机、邮箱、微信和QQ。绑定后可以实现更多功能，例如：\n\n* 绑定后微信，除了使用微信快捷登录之外，还可以在微信中创建和查询任务。\n* 绑定手机号或者邮箱后，在忘记密码时，可以通过手机号或者邮箱找回。\n:::::: spoiler 如何绑定？\n\n:::::tabContainer [Web|mobile]\n\n::::tab [Web]\n绑定方法：点击左上角头像 -「设置」-「账号与安全」，按提示绑定即可。想解除绑定的话，将鼠标移动到想解绑的账号上方，点击「解除绑定」。\n\n![--59.06%](/dida-assets/cdn.dida365.cn/hc/all/cae4d861e603ed655e7493c9fd05a099.png)\n\n::::\n\n::::tab [mobile]\n点击「设置」-「头像栏」-「昵称」进入个人信息页，即可绑定。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/b5fe71401bd9b722c5edc94ffadaf0e0.png)\n::::\n\n::::::\n\n\n# 常见问题\n::: spoiler 忘记密码怎么办？\n如果你忘记了登录密码，在登录页面中点击登录框下方的忘记密码，即可进行密码重置。\n\n在网页中输入你的注册邮箱或手机号，点击重置密码后，在注册邮箱中查收重置密码链接或在手机短信中查收验证码，按照提示重新设置密码即可。\n:::\n\n:::::: spoiler 如何退出登录？\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击「设置」，划到底部，点击「退出登录」。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/f66aa8e1e5f93d74620bcf0a15b084a6.png)\n::::\n\n::::tab [desktop]\n点击左上角头像 -「退出登录」。\n\n![--63.59%](/dida-assets/cdn.dida365.cn/hc/all/adfcd85909e861e0f5c811cd5338cd7d.png)\n::::\n\n:::::\n::::::\n\n\n::: spoiler 如何管理登录设备？\n在网页端「账号与安全」-「设备管理」栏可以管理登录设备。\n:::", "tags": [""], "hideIndex": true, "favs": 5, "order": 1099511627776, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T06:06:33.188Z", "modifiedTime": "2025-04-07T13:29:57.309Z", "postId": "6950691508324401152", "__v": 0, "parentId": "6950657111692935168", "pinInSearch": false}, {"_id": "66308f1b47c89fff9258e20d", "author": "", "description": "", "title": "Outlook 日历", "content": "\n如果你想要在滴答清单中显示 Outlook 中的日历事件，你可以通过订阅 Outlook 的方式轻松实现。\n\n# 添加日历\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入「设置」-「导入与关联应用」-「日历」，选择 Outlook，进行授权，授权成功后即订阅成功。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/e45c5c7173408da2ec65a52a90758728.png)\n\n\n::::\n\n::::tab [desktop]\n点击头像 -「设置」-「关联与导入」，选择 Outlook，进行授权，授权成功后即订阅成功。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/ceac230a0ac9b9344848036ec7a4736a.png)\n\n::::\n\n:::::\n\n\n# 查看日历事件\n订阅成功后可以在侧边栏「订阅日历」中查看日历事件。\n\n", "tags": [""], "hideIndex": true, "favs": 2, "order": 1099511627776, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2024-04-30T06:26:35.562Z", "modifiedTime": "2026-05-08T06:48:45.247Z", "postId": "7190959706343473152", "__v": 0, "parentId": "6949998599191134208", "area": "help-center", "shortTitle": ""}, {"area": "help-center", "_id": "66700afd47c89fff9258ec97", "author": "", "description": "", "title": "教育优惠申请", "content": "我们始终相信教育事业能给个人、给世界带来美好的变化，并希望能帮助更多学生和教职工管理好学习和生活、迎接挑战、达成目标。为此，我们特意推出教育优惠：在校学生和教职工可以获得滴答清单高级会员七五折优惠。\n\n您可以使用尾缀为 edu.cn、csss.cn 和 ucas.ac.cn 的教育邮箱注册，或将当前账号切换为您的教育邮箱，再进行申请。\n具体申请流程可以查看 [申请教育优惠](https://www.dida365.com/education)\n\n\n以下是申请教育优惠的注意事项：\n\n::: spoiler 一共可使用多少次教育优惠？\n同一个滴答账户最多可申请 4 次。\n:::\n\n::: spoiler 可以连续申请教育优惠吗？是否有时间间隔？\n* 申请后，以完成验证当天起，这次教育优惠的有效期为 1 年。\n* 本次教育优惠的有效期内，不可重复申请。\n* 本次教育优惠的有效期结束后，可进行下一次申请。\n:::\n\n::: spoiler 申请了但是没有购买，对剩余可用次数有影响吗？\n* 申请了但尚未完成验证，不会影响剩余可用次数。\n* 申请了并且完成验证，那么剩余可用次数减一。若在这次教育优惠的有效期内没有购买，等同于浪费了一次可申请机会。\n:::\n\n::: spoiler 教育优惠只能购买 1 年高级会员吗？\n是的，教育优惠只支持购买 1 年高级会员，购买1个月时无法享受教育优惠。\n:::\n\n::: spoiler 使用教育优惠购买后，可申请退款吗？\n使用教育优惠购买后，可以在 14 天内申请退款。但退款后，教育优惠的剩余可用次数不会返还。\n:::\n\n::: spoiler 教育邮箱不是 .edu 或 edu.cn 格式还能申请吗？\n目前仅支持 .edu 或 edu.cn 的教育邮箱，如果你的教育邮箱后缀不同，暂时无法申请教育优惠。\n:::\n\n最终解释权归滴答清单所有。", "tags": [""], "hideIndex": true, "favs": 21, "order": 1099511627776, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2024-06-17T10:07:57.783Z", "modifiedTime": "2026-09-20T01:09:40.048Z", "postId": "7208410033590108160", "__v": 0, "parentId": "6990517106034868224"}, {"_id": "680dd1461c42a13a390ba033", "author": "", "description": "", "title": "管理倒数纪念日", "content": "管理你的重要日子，让每一个倒数纪念日清晰有序，重要时刻一目了然。\n\n\n# 分组\n当你添加了越来越多的纪念日，为了更好地浏览和管理，可以点击倒数纪念日首页右上角「...」开启「显示分组」。开启后，所有日子将根据类型自动分组：**倒数日、纪念日、生日、节日**。\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n你可以点击顶部分组名称或左右滑动页面切换分组，管理更高效，分类更清晰。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/9492babf96bd2560eda042362c6952c3.png)\n\n::::\n\n::::tab [desktop]\n当你添加了越来越多的纪念日，为了更好地浏览和管理，可以点击倒数纪念日首页右上角「...」开启「显示分组」。开启后，所有日子将根据类型自动分组：**倒数日、纪念日、生日、节日**。\n![](/dida-assets/cdn.dida365.cn/hc/all/364b1c5b1888e53e8dcc128c3ec4f8cf.png)\n\n你可以点击左上角分组名称切换分组，管理更高效，分类更清晰。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/188b10410b1dd0696ced7007e99e5f38.png)\n\n::::\n\n:::::\n\n\n# 编辑\n\n想修改纪念日名称？输入日期有误？需要调整类型或者计时方式？别担心，随时可以轻松编辑，保持信息准确无误。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入对应的倒数纪念日页面，点击右上角「...」-「编辑」，即可修改图标、名称、日期、重复、类型、计时方式、提醒等信息，快速更新内容。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/c288deb7fb0eed3ff7e1eab9c6727c17.png)\n\n\n::::\n\n::::tab [desktop]\n右键单击或者点击倒数纪念日卡片右上角「...」，选择「编辑」，即可修改图标、名称、日期、重复、类型、计时方式、提醒等信息，灵活调整。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/72514f53fb32364d305e6dc05a403ecc.png)\n\n::::\n\n:::::\n\n\n# 置顶\n\n项目截止日期，考试日期，婚礼倒计时...... 想让当前最关心的倒数纪念日始终优先呈现？\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n进入倒数纪念日页面，点击右上角「...」-「置顶」，即可将这个日子固定在列表顶部，随时查看，无需翻找。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/1d1a36a2516d30f4935a2426687a66bc.png)\n\n\n::::\n\n::::tab [desktop]\n\n鼠标悬停在倒数纪念日卡片上，点击右上角「置顶」按钮，即可将其固定在列表第一位，方便随时查看，无需反复寻找。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/297911019e39961ef65095c11b9d102d.png)\n\n::::\n\n:::::\n\n\n# 归档\n\n一些已经完成的倒数纪念日，不舍得删除？可以选择归档，既保留回忆，又让主列表保持清爽。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n进入倒数纪念日页面，点击右上角「...」-「归档」，即可将它收纳到「已归档」列表中，整洁又不丢失重要回忆。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/3498a4559f1ed6ad38860cbe632886aa.png)\n\n\n::::\n\n::::tab [desktop]\n\n右键单击或者点击这个倒数纪念日卡片右上角「...」，选择「归档」，即可将其移入「已归档」列表中，保持主列表清爽。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/b2841976a22ff8ec7a9828f18be7077e.png)\n\n::::\n\n:::::\n\n\n:::::::::::: spoiler 如何查看已归档的倒数纪念日？\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n要查看已归档的倒数日，可以在倒数日页面点击右上角「...」-「已归档」，即可查看所有归档的内容。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/2d56ff28a4d73ae35272a2441dca7848.png)\n\n\n::::\n\n::::tab [desktop]\n点击倒数纪念日页面左上角「倒数纪念日」，切换到「已归档」，即可查看所有归档的内容。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/cc6264886b3781ba7c78b9a0424404e8.png)\n\n::::\n\n:::::\n\n::::::::::::\n\n::::::::: spoiler 如何取消归档？\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入「已归档」页面，找到需要恢复的倒数纪念日，点击右上角「...」-「恢复」，即可取消归档，重新回到主列表。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/874c92d94ed5bb0b77d69142a3b666d6.png)\n\n\n::::\n\n::::tab [desktop]\n将鼠标悬停在需要恢复的倒数纪念日上，点击右上角「...」-「恢复」，即可取消归档，让它重新回到列表中。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/ef2e7036e61dfe1b3e0e81336fccba57.png)\n\n::::\n\n:::::\n:::::::::\n\n\n\n# 删除\n\n已取消的倒计时、不再需要的纪念日，可以选择彻底删除，让你的列表更简洁清爽。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n点进该倒数纪念日，点击右上角「...」-「删除」，轻松清理冗余项目，释放空间。\n\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/8e751a9c1013c6271e9776aa06f77b46.png)\n\n\n::::\n\n::::tab [desktop]\n\n右键单击或者点击倒数纪念日卡片右上角「...」，选择「删除」，让列表保持干净有序。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/0ee2c64ab8de0697a5c10cb98820ed30.png)\n\n::::\n\n:::::\n\n\n# 添加到实时活动（iOS）\n\n有些重要日子想时刻记在心上？可以将倒数纪念日添加到实时活动，直接显示在锁屏上，无需打开 App，也能随时查看。\n\n进入一个倒数纪念日，点击右上角「...」-「添加到实时活动」，即可将它固定到锁屏。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/cf1a90413156b896bec784d870dea170.png)\n\n# 常见问题\n\n::: spoiler 倒数纪念日支持滑动操作吗？\n支持！在倒数纪念日列表中左滑，即可快速进行置顶、归档或删除操作，管理更高效。\n\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/78e5ba8c5c1e54b6518c37e1cc05f5e4.png)\n\n\n:::\n\n\n::: spoiler 可以同时置顶多个纪念倒数日吗？\n目前只支持置顶一个倒数纪念日，其他项目将按照时间自动排序。\n:::\n\n::: spoiler 删除的倒数纪念日可以找回吗？\n删除操作不可恢复，请谨慎操作。如需保留记录，推荐使用「归档」功能代替删除。\n:::\n\n\n\n", "tags": [""], "hideIndex": true, "favs": 1, "order": 1099511627776, "status": 0, "pinInSearch": false, "sectionId": "feature", "area": "help-center", "createdTime": "2025-04-27T06:40:06.394Z", "modifiedTime": "2026-07-06T07:38:50.301Z", "postId": "7322147514604322816", "__v": 0, "shortTitle": "", "parentId": "7322192298849075200"}, {"_id": "69cb8c45614517bfb8a8b457", "author": "", "description": "", "title": "AI 录音总结", "content": "无论是会议记录，还是随口记录的灵感，你都可以通过录音快速保存内容，并用 AI 进行整理。\n\n上传录音附件或录音完成后，你可以选择——\n\n- **转写文本**：将录音转换为带时间戳的文字，轻松回顾内容。\n\n- **生成总结**：基于录音内容生成结构化摘要，快速提炼重点。\n\n# 开始处理录音\n\n在任务详情页中，点击录音附件上的按钮，即可选择两种处理方式：\n\n1. 点击「转写文本」将录音转换为文字；\n\n2. 点击「生成总结」基于录音内容生成摘要。\n\n> ⚠️ 如果录音内容较短，则无法生成总结。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/7794cd0d9bec5a9ceeb5cd5af471a392.png)\n\n处理过程中，录音附件下方会显示状态提示，如「转写中…」或「总结生成中…」。处理完成后，会弹出完成提示，并在附件下方显示「原文」或「总结」的预览内容。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/8df3a9715d91692e3b1abae0e7b82a23.png)\n\n\n# 查看处理结果\n\n处理完成后，你可以点击附件下方的预览内容，即可查看完整的原文或者总结内容。点击录音附件详情页顶部菜单，你还可以切换查看「原文」或「总结」。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/72efb3783bf9550955ae2adfa8623e0d.png)\n\n💡 在查看原文时，你可以点击某段原文直接跳转到对应的时间节点播放。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/40e0fea5e3835dda202bc2a6103bcfde.png)\n\n\n# 文本操作\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n无论是转写文本还是 AI 总结，你都可以点击录音详情页右上角「...」将文本内容进行「复制」、「添加到描述」或者「分享」。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/bbdc717eaf0e5a53c7f49b1833a778f3.png)\n\n::::\n\n::::tab [desktop]\n无论是转写文本还是 AI 总结，你都可以点击录音详情页右上角「...」将文本内容进行「复制」或者「添加到描述」。\n\n\n::::\n\n:::::\n\n# 常见问题\n\n::: spoiler 转写需要多长时间？\n转写时间与录音长度相关。一般来说，1 分钟以内的录音不超过 10 秒，30 分钟的长录音大约需要 1～3 分钟的处理时间。\n:::\n\n::: spoiler 支持哪些语言？\nAI 录音转写与总结支持中文、英语、日语、韩语、法语、德语、西班牙语等 30 多种语言，系统会自动识别录音中的语言。\n:::\n\n::: spoiler 处理过程中可以离开页面吗？\n可以。录音转写和总结在后台进行，处理完成后，重新进入任务即可查看结果。如果处理完成时你不在详情页，会收到提示通知。\n:::\n\n::: spoiler 处理失败可以重试吗？\n可以。如果因为网络问题或服务繁忙导致失败，录音详情页会展示错误提示和「重试」按钮，点击即可重新处理。\n:::\n\n::: spoiler 为什么播放跳转时时间戳不准？\n部分压缩格式（如 MP3）的音频文件，在安卓设备上跳转播放时可能出现轻微的时间偏差，属于已知问题。如需更精确的时间戳对应，建议使用无损格式录音。\n:::\n\n::: spoiler 有使用次数限制吗？\nAI 功能每月有一定的使用额度。如果当月额度用完，会提示「已达到本月 AI 使用上限」，次月自动恢复。\n:::\n\n::: spoiler 我的录音数据安全吗？\n你的录音数据仅用于当次转写和总结处理，不会被保存或用于 AI 模型训练等，请放心使用。\n:::", "tags": [""], "hideIndex": true, "favs": 4, "order": 1099511627776, "status": 0, "pinInSearch": false, "sectionId": "feature", "area": "help-center", "createdTime": "2026-03-31T08:56:37.333Z", "modifiedTime": "2026-08-23T03:04:40.433Z", "postId": "7444668968427585536", "__v": 0, "shortTitle": "", "parentId": "7444671678778441728"}, {"_id": "63575a633e2b49e8e13a3792", "author": "", "description": "", "title": "付费与升级", "content": "\n\n\n\n# 礼品卡\n\n时间是最宝贵的礼物。为他人或者自己购买一张礼品卡，享受一年高级会员权益，认真过好每一天吧。👉[购买入口](https://dida365.com/card)\n\n![--54.3%](/dida-assets/cdn.dida365.cn/hc/all/18f2bd378b32da5a111a98246d5f0b58.jpg)\n\n\n礼品卡邮件中的兑换码可用于兑换高级会员。你可以通过以下途径来兑换：\n\n- 邮件：复制兑换码 - 点击「在滴答清单中兑换」 - 「兑换」页面 - 输入兑换码；\n- Android：进入「设置」页面 -「升级到高级账户」- 页面底部「兑换」- 输入兑换码；\n- 网页端：点击「头像」-「设置」-「高级会员」-「兑换」- 输入兑换码。\n\n兑换成功后，会员权益立即生效。\n\n# 发票\n\n如果你是通过微信、支付宝进行支付的，可以在 Web 端对近1年的订单记录申请开具、查看并下载电子发票。\n\n具体操作步骤如下：\n\n桌面端：\n1. 点击头像 - 「设置」，在左侧边栏中点击「高级会员」；\n2. 点击「历史订单」，即可查看近期订单记录并开具发票。\n\n移动端：\n1. 点击「设置」- 头像，在头像下方点击「高级会员」；\n2. 下滑到页面底部，点击「历史订单」，即可查看近期订单记录并开具发票。\n\n申请开票成功后，我们将在3个工作日内向您开具电子发票。您可在开具发票页面了解开票进度、查看及下载发票。\n\n> 已退款的订单不支持开具发票。\n\n\n如果你是通过苹果App Store进行支付的，在支付后将收到苹果发送到邮箱的订单的电子收据。请注意，由于苹果渠道支付的款项是由美国苹果公司收取的，我们无法为你开具发票，需前往苹果应用商店开具电子收据，具体请联系苹果客服（400-666-8800）。\n\n\n\n# 退款\n:::::tabContainer [iOS|Android|macOS|Web]\n\n::::tab [iOS]\n由于苹果官方限制，开发者无权直接处理退款申请。如果您是在 iOS 或 macOS 平台订阅的滴答清单高级会员，需要直接向苹果申请退款。具体步骤如下：\n1. 前往 reportaproblem.apple.com ；\n2. 使用您的 Apple ID 和密码登录；\n3. 在请求帮助栏内选择「请求退款」；\n4. 按照页面上的说明选择退款原因并提交申请即可。 更多关于向苹果官方申请退款的内容可参考： 针对从 Apple 购买的 App 或内容申请退款 。\n::::\n\n::::tab [Android]\n在 Android 端使用支付宝或微信购买的高级会员，可以在 Android 端对购买 14 天内的订单申请退款，超过 14 天将无法申请退款。\n1. 点击「设置」- 头像，在头像下方点击「高级会员」；\n2. 下滑到页面底部，点击「历史订单」，即可查看符合退款条件的订单，申请退款。申请退款成功后，我们将在3个工作日内为你处理退款。您可在历史订单页面/预留的邮箱中查看退款进度。\n> 已开具发票的订单不支持退款。\n> 使用支付宝连续包月的用户，除了以上的方式外，也可以在支付宝应用中，进入「设置」 - 「支付设置」 - 「免密支付/自动扣款」中取消。\n::::\n\n::::tab [macOS]\n由于苹果官方限制，开发者无权直接处理退款申请。如果您是在 iOS 或 macOS 平台订阅的滴答清单高级会员，需要直接向苹果申请退款。具体步骤如下：\n1. 前往 reportaproblem.apple.com ；\n2. 使用您的 Apple ID 和密码登录；\n3. 在请求帮助栏内选择「请求退款」；\n4. 按照页面上的说明选择退款原因并提交申请即可。 更多关于向苹果官方申请退款的内容可参考： 针对从 Apple 购买的 App 或内容申请退款 。\n::::\n\n::::tab [Web]\n在 Web 端使用支付宝或微信购买的高级会员，可以在 Web 端对购买 14 天内的订单申请退款，超过 14 天将无法申请退款。\n1. 点击头像 - 「设置」，在左侧边栏中点击「高级会员」;\n2. 点击「历史订单」，即可查看符合退款条件的订单，申请退款。申请退款成功后，我们将在3个工作日内为你处理退款。您可在历史订单页面/预留的邮箱中查看退款进度。\n::::\n:::::\n\n\n\n# 取消自动续费\n\n## **取消 Apple 订阅：** \n可以去到 App Store 中 - 点击头像 - 订阅 - 找到滴答清单订阅然后取消即可。具体操作可以参考：\n\nhttps://support.apple.com/zh-cn/HT202039\n\n##  **取消支付宝订阅：**\n  如果你是使用支付宝连续包月的用户，可以在支付宝应用中，进入「设置」 - 「支付设置」 - 「免密支付/自动扣款」中取消滴答清单的订阅。\n\t\n\t\n# 常见问题\n::: spoiler 使用支付宝支付时，为什么没有出现支付宝支付的界面？\n支付宝支付会弹出新的网页进行支付，可能是浏览器阻止了新的页面弹出，请在浏览器设置界面中打开允许弹出窗口的设置。\n:::\n\n\n::: spoiler 高级账户到期后数据会丢吗？\n我们非常注重保护您的数据安全。高级账户到期后，您的数据将被完整保留，您依然可以像免费账户一样正常使用滴答清单，但不能继续享受高级账户对应的特权。\n:::", "tags": [""], "hideIndex": true, "favs": 15, "order": 1649267441664, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2022-10-25T03:39:15.599Z", "modifiedTime": "2026-07-30T07:00:27.657Z", "postId": "6990517106034868224", "__v": 0, "parentId": "6950657111692935168", "area": "help-center", "shortTitle": ""}, {"_id": "64a3eb1f31d66f601dcba008", "author": "", "description": "", "title": "🕑 智能识别", "content": "你可以在“快速添加”中直接输入日期文本，滴答清单会自动识别并为您创建日期和提醒。\n\n\n## 日期和时间\n\n![--118.05%](/dida-assets/cdn.dida365.cn/hc/all/4cb5367f255fc48feff9aa9de236082c.jpg)\n\n\n当你在清单中输入的是模糊日期时，滴答清单会统一识别成最近有效的日期和时间。比如：当前实际时间是下午4点，当输入\"9点提醒我\"时，会被识别成今天晚上9点)\n\n## 重复\n![l--88.6%](/dida-assets/cdn.dida365.cn/hc/all/016be3f71187ff83b6178dee3e2658d1.png)\n\n\n## 提前提醒\n![l--38.94%](/dida-assets/cdn.dida365.cn/hc/all/0fdaef273f5e3a9f8f8d80dc04a19439.png)\n\n## 延后提醒\n![l--37.27%](/dida-assets/cdn.dida365.cn/hc/all/99e378eb9e91e71f52541d8bb8ad27f0.png)\n\n\n\n", "tags": [""], "hideIndex": true, "favs": 110, "order": 1649267441664, "status": 0, "pinInSearch": false, "sectionId": "special", "createdTime": "2023-07-04T09:49:19.473Z", "modifiedTime": "2026-10-12T11:12:28.623Z", "postId": "7081931977951019008", "__v": 0, "parentId": null, "area": "help-center", "shortTitle": ""}, {"_id": "6920035dfd36d294de7a6e5d", "author": "", "description": "", "title": "年视图：查看年度任务完成情况", "content": "**年视图** 让你从全局视角回顾过去一年的任务完成情况。\n通过热力图分布，你能直观地看到哪些月份任务完成度最高，哪些阶段效率相对较低，从而更清晰地了解自己的时间节奏与成长变化。\n\n# 切换年视图\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击左上方的 **视图图标** → 选择 **「年」视图**。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/3099238cf8166c8c66eaf60052654583.png)\n\n\n\n::: spoiler 快速切换技巧：\n长按底部的 **日历图标**，可快速切换到年视图。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/682484b3c1efbc79ebd20fa6ba683227.png)\n\n\n:::\n\n::::\n\n::::tab [desktop]\n点击右上角的 **视图切换按钮** → 选择 **「年」视图**。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/27333ec992987be01b41ecb86d3dbfd4.png)\n\n::: spoiler 快速切换技巧：\n使用快捷键 Y/4，可快速切换到年视图。\n::::\n\n:::::\n\n# 视图跳转\n在年视图中，你可以通过点击不同区域，快速查看详细的任务分布情况。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击月份 → 跳转至对应的月视图。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/165cfb8f369a3aeeefac3acac96bd552.png)\n>系统会默认返回上一次使用的视图页面。 \n\n此为临时操作，左上角会显示返回按钮，可返回年视图。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/8dfdf1017a3949b5e8c85d7fb8431f5d.png)\n\n::::\n\n::::tab [desktop]\n点击月标题 → 跳转至该月的月视图；\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/0df73b145c5560ff38ab1efcd8146a09.png)\n\n\n\n点击日期 → 跳转至周视图，并高亮显示所选日期。\n\n\n\n::::\n\n:::::\n\n\n# 热力图显示\n年视图支持以热力图方式展示任务完成频率，帮助你更直观地了解任务活跃程度。\n\n默认情况下，热力图为关闭状态，可在显示设置中手动开启。\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n右上角「⋯」 → **显示设置 → 样式** → 热力图 → 显示「热力图」。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/026aec094a540278b788ff683c4b3eb7.png)\n\n::::\n\n::::tab [desktop]\n右上角「⋯」 → 显示设置 → 样式 → 热力图 → 显示「热力图」。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/dbb59b173390f342cff688dd8e382958.png)\n\n![](/dida-assets/cdn.dida365.cn/hc/all/890bdc6ca15f070fc0b83db61ca6b83e.png)\n\n::::\n\n:::::\n\n> 颜色越深，代表当天完成的任务越多。\n\n\n# 常见问题\n\n::: spoiler 为什么我在年视图中看不到任务？\n- 若任务较多，数据加载可能稍有延迟，稍等片刻即可加载完成。\n- 年视图仅显示「已设置日期」的任务。如果任务没有设置日期或时间，将不会出现在年视图中。请先为任务添加日期。\n:::\n::: spoiler 年视图能查看过去的任务记录吗？\n可以。你可以切换年份，查看过往年度的任务完成情况与执行趋势。\n\n:::\n\n \n::: spoiler 年视图支持显示哪些内容？\n年视图会根据「显示范围」设置展示内容。\n\n除任务外，还可显示日历事件、习惯、纪念日等项目。\n\n如果隐藏了“已完成任务”，则不会在年视图中显示。\n:::\n\n\n", "tags": [""], "hideIndex": true, "favs": 2, "order": 1649267441664, "status": 0, "pinInSearch": false, "sectionId": "feature", "area": "help-center", "createdTime": "2025-11-21T06:14:53.086Z", "modifiedTime": "2026-06-09T09:42:45.402Z", "postId": "7397517843383713792", "__v": 0, "shortTitle": "", "parentId": "6950361611617959936"}, {"_id": "652e394b188cb9aa10e7bb9e", "author": "", "description": "", "title": "🔜 快捷指令", "content": "**「快捷指令」**\n是 iOS 系统推出的一个自动化工具，它可以通过对各动作的简单排序来实现想象中的各种功能。 你也可以理解为它是一个简易版编程工具，你可以通过它创建和自定义一系列操作序列，以便以更高效的方式执行常见任务。\n\n\n# 如何使用快捷指令\n通过快捷指令设置“查看今日”，使用时无需再打开“滴答清单-清单-今天”的复杂过程，点击指令即可直接在弹窗中查看。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/7ce69a4b4f74bc406205ff99fbac69d0.gif)\n\n::::::spoiler 如何设置快捷指令？\n\n:::::tabContainer [iOS|macOS]\n\n::::tab [iOS]\n打开手机中「快捷指令」软件，如果没有找到快捷指令可在AppStore中搜索进行下载。\n\n打开软件后，点击右上角「＋」-「+添加操作」- 搜索「滴答清单」，你可以根据自己的需要添加需要的指令。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/cb70fdd3827ac2954ebf66ee448ac16e.png)\n\n\n::::\n\n::::tab [macOS]\n在设置中找到「快捷指令」并添加操作方式。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/29d9d281e82f6665c37d03896e84ecd5.png)\n\n你可以在「快捷指令」App中，把常用的操作添加到菜单栏中。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/77c5bebe4ac219294d364ba0db2eb68f.png)\n\n这样，我们就可以在Mac顶部菜单栏进行快速操作，无论是开始一个专注计时，还是添加一个任务，都可以在菜单栏直接操作！\n\n![](/dida-assets/cdn.dida365.cn/hc/all/8c18cddbb69b9b2987d3affada96919c.png)\n\n::::\n\n::::::\n\n我们还可以结合辅助功能，来实现更加便捷的操作方式；比如：添加快捷指令轻敲两下为查看今日待办。\n\n之后我们在和朋友确认时间安排时，只用轻敲两下就能快速确认今天的日程安排。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/89f20cee9a5ccd9fa3eed9e5539da052.png)\n\n\n::: spoiler 设置方法\n在手机设置中「辅助功能」-「触控」-「轻点背面」中设置相应快捷指令。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/aa8a98401687c7007576e690d0753161.png)\n:::\n\n接下来滴答君就和大家介绍一些滴答清单快捷指令和其他App结合的玩法👇👇👇\n\n## 💫 语音记录灵感\n如果你常有小想法，建议试试语音转文字快速创建任务。遇到灵感时，只需快速打开指令，即可将语音转为文字，快速记录并保存到指定的滴答清单中。\n\n具体设置方法：\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/3f3b01d20622c513f496daef33ee49a9.png)\n\n👉 点击[语音记录灵感](https://www.icloud.com/shortcuts/5347d124e8d7454098973a2f9d9c1bbf)保存至快捷指令中\n\n## 💻 自定义工作流\n除了基础操作之外，我们也可以利用「快捷指令」，自己定义工作流。你可以设定一个“进入工作状态”的快捷指令，开启专注时手机直接进入勿扰模式。当我需要进入工作状态时，点击开始打工指令就能够快速进入工作状态。\n具体设置方法：\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/0c1f524c439c3003cb9cdef84cd65a90.png)\n\n👉 点击[自定义工作流](https://www.icloud.com/shortcuts/bad50db29651413d87f98a42b984c389)保存至快捷指令中\n\n\n# 组合多个快捷指令\n将 iPhone 升级至 **iOS 27 或更高版本**，并将滴答清单更新至**最新版本**后，你可以在「快捷指令」App 中组合多个滴答清单快捷指令，让一个快捷指令完成多个操作。\n## 🍅 添加任务后直接开始专注\n\n有时候想到一件事情后，想马上开始处理，但需要先添加任务，再找到任务并开启专注。\n\n现在可以将「添加任务」和「开始专注」两个快捷指令组合起来：\n\n**添加任务 → 开始专注**\n\n**具体设置方法：**\n1.  打开 iPhone 的「快捷指令」App，创建一个新的快捷指令。 \n2.  添加滴答清单的「添加任务」操作。 \n3.  添加滴答清单的「开始专注」操作。 \n4.  将「添加任务」创建的任务作为「开始专注」的任务。 \n5.  根据需要设置专注时长和专注模式。 \n6.  保存快捷指令。 \n\n![l](/dida-assets/cdn.dida365.cn/hc/all/162fbe88131fb8a1143e5df94fb3931a.png)\n\n设置完成后，运行该快捷指令，输入任务内容即可在创建任务后直接开始专注。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/748a996df8f01c282c0995988dbe5e11.png)\n\n## 🏃 开始运动，一键打卡并记录专注\n\n如果你平时会使用滴答清单记录运动习惯，可以将「习惯打卡」和「常用专注」组合起来。\n\n**完成打卡 → 常用专注**\n\n**具体设置方法：**\n1.  添加滴答清单的 「习惯打卡」 操作。 \n2.  选择需要打卡的习惯，例如「健身」或「跳舞」。 \n3.  添加滴答清单的 「开始专注」-「常用专注」 操作。 \n4.  保存快捷指令。\n\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/92f55740ee4923a532f3462a115ad8be.png)\n\n以后开始运动时，只需要运行一次：\n 完成习惯打卡 → 开始计时\n \n![l](/dida-assets/cdn.dida365.cn/hc/all/71ac6d0b95bbcb9f628b8075b89e5479.png)\n\n# 快捷指令自动化\n当然，快捷指令不仅限于以上操作。你可以在快捷指令-自动化中设置不同条件，让你的 iPhone 在指定条件下自动运行操作！\n\n没有get到？没关系，快来看看例子：\n\n## ⏰ 闹铃播报\n\n例如你每天8:15起床后，需要知道当天的天气，同时需要了解今天的待办事项。结合闹钟App轻松播报今天的待办事项。\n\n\n具体设置方法：\n\n![](/dida-assets/cdn.dida365.cn/hc/all/4803cd899903e4d4edfb42ad5a09c349.png)\n\n这样在工作日的8:15闹钟响起时，手机Siri 会自动播放今天的天气情况以及今日待办事项，让你的起床也更加有仪式感！\n\n## 🏋🏻 健身打卡\n如果我们有去健身的运动习惯，你需要在健身时开启手表的某一项运动模式并开启运动的常用专注，并完成一次习惯打卡。\n\n但是常常会忘记开始专注或者打卡，有了这个自动化快捷指令我们再也不用担心会忘记，连上WiFi时已经自动开启这一系列操作。\n\n具体设置方法：\n\n![](/dida-assets/cdn.dida365.cn/hc/all/5832df60b46ae3449b66ceb391cdf485.png)\n\n当我连上健身房的 WiFi时就自动开启了健身模式并且完成了一次健身打卡。\n\n\n## 🍅 开始专注\n\n想随时记录碎片化时间吗？比如通勤路上用读书软件阅读二十多分钟，偶尔也听听播客。但总是忘记点开始专注，丢失了专注记录。现在，设置开始专注的自动化指令就能轻松记录时间。\n\n具体设置方法：\n\n打开快捷指令软件自动化页面，点击「新自动化」按钮（或右上角的「+」），选择「App」，设置当「某读书」App 已打开时，执行滴答清单的「开始专注」指令，可以选择专注的模式、时间，点击完成即可设置成功。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/a9672bfebdb581b0da6adce986355e95.png)\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/3c9f12766078b75644b07dd25fff8621.png)\n\n当我打开读书软件时，就自动开启了滴答清单的专注功能，自动开始专注，记录我的读书时长。\n\n\n\n##  ✉️提取短信\n\n快递在驿站总是忘记取？快来 get 自动将快递信息添加为任务的小技巧吧。收到短信时将自动添加任务到滴答清单中，再也不用担心遗漏快递啦。\n\n具体设置方法：\n\n1. 打开快捷指令软件自动化页面，点击「新自动化」按钮（或右上角的「+」），选择「信息」，点击信息包含「选取」\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/b04771a940ef563742e3b537dd3cd50e.png)\n\n2. 在输入框中输入信息的关键词，如「某驿站」，并且选择「立即执行」，点击下一步页面中的「新建空白自动化」\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/10e7f79a8e4063b4ac52b21b472ba878.png)\n\n3. 在下方输入框中搜索「从输入中获取文本」，点击「输入」-「输入快捷指令的信息」\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/942b40188bbf7d6ea8546b9e798c8e2d.png)\n\n4.  在下方输入框中搜索「滴答清单」，点击「添加任务」- 点击「标题」选择「文本」，点击「清单」选择需要添加任务的清单，点击完成即创建成功\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/798061dc45ab76726ff40813b9a704d3.png)\n\n当我收到信息中包含「菜鸟驿站」的信息时，将会自动添加到滴答清单中。\n\n你还可以设置“话费、水电缴费、银行卡”等相关信息文本的提取。\n\n# URL Scheme\n使用 URL Scheme 可以从其他应用发送指令到滴答清单，配合 iOS 系统「快捷指令」等第三方应用，你可以进行一些自动化操作。\n\n目前滴答清单的 URL Scheme 能执行以下指令，比如：\n\n- 添加任务：添加一个叫“购买鸡蛋”的任务\n- 显示智能清单：显示“今天”智能清单\n- 搜索任务：搜索包含“开会”的任务\n\n这些指令将通过特定的链接来传达，链接的格式为：\n\n> ticktick://v1/command?parameter1=value1&parameter2=value2&…\n\n打开这些链接将启动滴答清单并执行指令。其中：\n\n- command 表示指令的类型，目前滴答清单支持“添加任务”、“显示”、“搜索”三种指令\n- parameter 表示参数，比如添加一个任务，参数包括“任务标题”、“开始时间”、“任务内容”等\n- value 表示具体的值，比如参数“任务标题”的具体值是“购买鸡蛋”。\n\n举个例子，如果你想要显示“今天”智能清单，这个链接就应该是下方这种格式：\n\n> ticktick://v1/show?smartlist=today\n\n接下来，你将了解到三种指令的具体使用方式。\n\n## ✅ 添加任务指令\n“添加任务”的指令支持 [ x-call-back](https://www.twitter.com/xcallbackurl) 的回调约定，即当你通过“添加任务”的指令打开滴答清单应用并成功添加任务后，可以回到发起指令的应用程序中。目前滴答清单支持三种回调：x-success, x-error, x-cancel。\n\n因此，“添加任务”指令的特定链接格式如下：\n\n> ticktick://x-callback-url/v1/add_task?parameter1=value1&parameter2=value2&…&x-success={{下一个app的scheme}}\n\n“添加任务”的指令包括以下参数：\n- title：任务标题（必填）\n- startDate：开始时间\n\t- 格式（带时区）：2018-05-07T18:00:00.000+0000\n\t- 格式（不带时区）：2018-05-07T18:00:00.000（注意：不带时区时，会按照设备的当前时区来解析）\n- endDate：结束时间\n\t- 格式（带时区）：2018-05-07T01:20:00.000+0000\n\t- 格式（不带时区）：2018-05-07T01:20:00.000（注意：不带时区时，会按照设备的当前时区来解析）\n\t\n- allDay：是否是全天任务\n\t- 是全天任务时=true；不是全天任务时=false\n\t- startDate 或 endDate 有值时必填\n\n- priority：优先级\n\t- 无优先级=0；低优先级=1；中优先级=3；高优先级=5\n\t- 默认=0\n\n- content：任务内容\n- list：所属清单名\n\t- 默认=inbox\n- subtasks：检查事项\n\n举例：添加任务“购买鸡蛋”\n\n> ticktick://x-callback-url/v1/add_task?title=buy%20some%20eggs&x-success={{下一个app的scheme}}\n\n举例：添加任务“明天下午6点购买鸡蛋”到“购物”清单\n\n> ticktick://x-callback-url/v1/add_task?title=buy%20some%20eggs&startDate=2018-05-08T18:00:00.000+0000&allDay=false&list=shopping&x-success={{下一个app的scheme}}\n\n添加任务成功后，若回调的是 x-success，则滴答清单会返回以下参数，以供下一个 x-callback-url 指令调用：\n\n- title：任务标题\n- taskID：任务的唯一标识\n\n## “显示”指令\n“显示”指令的特定链接格式如下：\n\n> ticktick://v1/show?parameter=value\n\n“显示”的指令包括以下参数：\n\n- smartlist：智能清单名（必填）\n\t- 所有=all\n\t- 今天=today\n\t- 明天=tomorrow\n\t- 最近7天=next_7_days\n\t- 分配给我=assign_to_me\n\n举例：显示“今天”智能清单\n\n> ticktick://v1/show?smartlist=today\n\n## “搜索”指令\n“搜索”指令的特定链接格式如下：\n\n> ticktick://v1/search?parameter=value\n\n“搜索”的指令包括以下参数：\n- keyword：关键字（必填）\n\n举例：搜索所有包含关键字“shopping”的任务\n\n> ticktick://v1/search?keyword=shopping\n\n", "tags": [""], "hideIndex": true, "favs": 18, "order": 1924145348608, "status": 0, "pinInSearch": false, "sectionId": "special", "createdTime": "2023-10-17T07:35:39.643Z", "modifiedTime": "2026-09-21T09:21:05.833Z", "postId": "7119949066221387776", "__v": 0, "parentId": null, "area": "help-center", "shortTitle": ""}, {"area": "help-center", "_id": "62c544c95084b6294bef612d", "author": "", "description": "探索四象限时间管理法则，一种区分任务紧急和重要性的有效方法，助你专注于真正重要的事务，提升个人和职业生活的生产效率", "title": "🎯 四象限", "content": "![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/40da317475a79b0e0067cad4f3f8992f.jpg)\n\n你是否遇到过这样的情况：\n\n每天都非常忙碌，觉得时间不够用，但是回头看，却发现做的都是没那么重要的事情？又或者有长远的目标，但是一直迟迟没有取得进展？\n\n这个时候，使用我们推出的「四象限」功能，也许可以帮助你更加聚焦重要且紧急的工作：\n\n四象限是一种流行且有效的时间管理方法：根据事情的重要和紧急两个维度，将所有的任务放到四象限中，再根据每个象限的原则处理他们。👉 [如何使用四象限](/articles/6950398710203285504)\n\n我们已经为你准备了常用的象限规则，你也可以根据自己的需求，自定义象限规则。此后，所有的任务将会根据你设定的规则，自动分类到四个象限中。👉 [如何编辑四象限规则](/articles/6950381682822217728)\n", "tags": [""], "hideIndex": true, "favs": 64, "order": 2199023255552, "status": 0, "sectionId": "feature", "createdTime": "2022-07-06T08:16:09.024Z", "modifiedTime": "2026-10-12T09:01:27.594Z", "postId": "6950361734683033600", "__v": 0, "parentId": null, "pinInSearch": false}, {"_id": "62c5559f1e3a8b2ac64c7f5c", "author": "", "description": "", "title": "更好地完成习惯", "content": "# 打卡方式——每种场景都游刃有余\n为了适应不同的打卡场景，滴答清单特意内置了三种不用的记录方式，最大程度的方便大家记录每一次的打卡成就。\n\n## 自动记录\n单次习惯完成量比较固定，推荐你设置自动记录。\n如，喝水，大部分的情况是喝完一杯就打卡一次，完成量都是固定的一杯。\n\n每滑动一次就自动记录完成了一杯。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/79f1eeb20b80a51a0af2d46ca5ce2aad.png)\n\n## 手动记录\n当你的习惯完成量并不固定，推荐你设置手动记录。\n如，背单词，可能早上状态比较好，一次背了3页，晚上有点累背了1页，每次的数量都不固定。\n\n每次打卡时就能够根据当时的情况，手动输入完成的量。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/b8ffe0b773b5399b729abee3408987aa.png)\n\n## 完成全部\n当然我们也有能够一次就能完成目标的习惯。\n比如，早睡，这种习惯当天完成了就直接完成全部，没有完成量的记录。\n\n滑动打卡就直接完成了这个习惯。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/7eee5798cdc27db87c95a68afe95881d.png)\n\n::: spoiler 如何设置打卡方式？\n打卡界面点击右上角「...」-「编辑」-「目标」-「打卡时」中选择打卡方式。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/2f72b9cdd921d5ce6e8d32d83666b94b.png)\n\n:::\n\n# 打卡提示——每次提醒都恰到好处\n你可以根据自己完成习惯的时间来设置提示，如，喝水，提示时间可分在各个时间段9:00、12:00、18:00、21:00，到点都会自动提醒你喝水。\n\n\n另外只要对单独一个习惯设置了时间提醒，在日历对应的时间轴中会出现，帮助你更好地查看日程安排。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/12cd40e69002f5c25bb43ac8ac52dcc6.png)\n\n::: spoiler 如何关闭在日历中显示习惯打卡？\n在日历页面点击右上角「...」>「显示设置」，关闭「显示习惯」即可隐藏习惯打卡记录。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/d3f4c4cef8529dd5cf21483725bbad8e.png)\n\n:::\n\n\n你还能够记录每天，完成习惯的心情以及日志，方便回顾。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/2bc41ebd8e17711b94ad7dbe13856905.png)\n\n::: spoiler 如何关闭打卡日志？\n在「编辑习惯」中底部，可以将打卡日志关闭。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/157b95fa728ef447f6bb770cbffd93d8.png)\n\n:::\n\n如需在智能清单中显示习惯，可在习惯页面右上角点击管理图标，选择「在“今天”、“最近7天”中显示」。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/2c2ec704830f43e2be285953d4aaa1b8.png)\n\n# 回顾习惯——成就付出都一目了然\n\n在习惯统计中，我们提供了「打卡概览」和「月度打卡表」，你可以随时查看自己的打卡情况，即使哪一天没有背够5页的单词，也能记录自己完成3页的付出和努力。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击习惯进入打卡页面，向上滑动即可查看当月打卡情况。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/5da9dd29d754f24773a801d0694cad78.png)\n\n::::\n\n::::tab [desktop]\n点击习惯后，可在右侧查看当月打卡情况。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/52a0e07048a19a9561ba7cbed591b561.png)\n\n::::\n\n:::::\n\n\n::: spoiler 如何补记打卡？\n**移动端 / 桌面端**：在「月度打卡表」中点击任意日期，即可补记打卡。\n:::\n::: spoiler 如何修改打卡样式？\n在习惯详情页点击右上角「...」，选择「打卡样式」即可切换为对勾或打卡图标。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/d44e51ff81a818216f49bb7ed480cf76.png)\n\n:::\n\n# 常见问题\n::: spoiler 当习惯不需要坚持，怎么归档？\n如果你的习惯不需要坚持了，可以点击习惯详情页右上角「...」-「归档」。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/d4503530d2bdfaadb8cb0895287dad94.png)\n\n:::\n\n::: spoiler 怎么设置打卡分组？\n在编辑习惯页面，为习惯按照「上午/下午/晚上/其他」的时间段进行分组，将习惯分类，模块化展示，只需要长按拖动即可快速移动，更容易管理和查看。\n:::\n\n::: spoiler 如何在日历中显示习惯？\n你可以在「显示设置」中开启「显示打卡」，这样日历中就能够显示习惯。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/5bbf223d7afde15f40bc8152ccea9c8d.png)\n\n:::\n::: spoiler 删除和归档有什么区别？\n- 删除：习惯将被永久移除，所有打卡记录也会被清空，无法恢复。\n- 归档：习惯会从主视图中隐藏，但不会被删除，可在「已归档」中随时恢复。\n:::\n\n\n::::::: spoiler 如何恢复已归档习惯?\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n在习惯页面点击右上角的管理图标，进入「已归档」，点击习惯进入详情页，点击右上角「...」选择「恢复」。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/856721036ebfdebd8d5390e35d6c743f.png)\n\n::::\n\n::::tab [desktop]\n点击习惯页面中的习惯按钮，在习惯页面点击「已归档」，右键点击需要恢复的习惯，选择「恢复习惯」即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/4f9183f8446b520e21c564915bdc1c5b.png)\n\n![](/dida-assets/cdn.dida365.cn/hc/all/1ecde9f9a0bd148522e87bd43933c89f.png)\n\n::::\n:::::::\n", "tags": [""], "hideIndex": true, "favs": 24, "order": 2199023255552, "status": 0, "sectionId": "feature", "createdTime": "2022-07-06T09:27:59.989Z", "modifiedTime": "2026-09-17T10:12:22.058Z", "postId": "6950379816176582656", "__v": 0, "parentId": "6950361641582067712", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c56ffd1e3a8b2ac64c80b1", "author": "", "description": "", "title": "如何开始专注", "content": "# 开启功能模块\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入「设置」-「功能模块」中，找到「番茄专注」，点击前方加号即可开启模块。 开启后，你将在底部导航栏看到「番茄专注」功能。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/79e24183d568152982d2d1af995fae01.png)\n\n::::\n\n::::tab [desktop]\n点击头像，进入「设置」-「功能模块」，找到「番茄专注」，点击开关启用模块。 开启后，你将在侧边导航栏看到「番茄专注」功能。\n\n![--66.93%](/dida-assets/cdn.dida365.cn/hc/all/d3d9a38068695d1277cf51de26d9c44a.png)\n\n::::\n\n:::::\n\n# 在专注模块开始专注\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n在开始专注前，你可以先选择一种计时模式：\n\n- 番茄计时：以倒计时方式进行，每轮 25 分钟专注 + 5 分钟休息，有助于保持专注并适度放松。\n\n- 正计时：以正计时的方式持续记录专注时长，适合不希望被打断、希望沉浸式计时的人群。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/e3ceeb5ba5b26ba3a9b03164107ac45e.png)\n\n\n如果你希望追踪每个任务的专注时间，还可以在开始前点击时间上方的「专注」，将此次专注关联到具体任务，方便后续进行数据分析。接着，点击下方的开始按钮，即可进入专注状态。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/1ceb94a82fd2b73f18bfc3b2cc518918.png)\n\n\n::::\n\n::::tab [desktop]\n当你开启番茄专注功能，可以直接在侧边栏点击专注进入页面，点击「开始」快速进入到专注状态。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/ec45f46400bb993856637fcc40bf7824.gif)\n:::::\n\n# 在任务模块开始专注\n\n\n## 在任务列表中开始专注\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n1. 任务滑动操作\n\n在「设置-更多设置」中选择「滑动操作」，再选择「开始专注」。这样你就可以在任务列表中，通过滑动的方式，直接开始专注。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/c6557a6a41ee7da9b80a5d13e5387be7.png)\n\n\n\n2. 任务长按菜单\n\n\n如果你是iOS用户，你也可以在「设置-更多设置」中开启「任务长按菜单」。这样你就通过长按任务的方式，快速开始专注。\n\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/54ab2f7144f66393260c68bb559b1350.png)\n\n\n::::\n\n::::tab [desktop]\n在任务列表页，右键单击需要专注的任务名称，点击「开始专注」后选择计时方式后即可开始专注计时。\n\n![--73.2%](/dida-assets/cdn.dida365.cn/hc/all/25c25d17930d0ace8d9f3b3301a9a97d.png)\n\n:::::\n\n\n\n## 在任务详情中开始专注\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击任务进入详情，点击右上角「...」-「开始专注」进入专注。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/07bd87da347fe1bd2c6a83445c5953fc.png)\n\n::::\n\n::::tab [desktop]\n在任务详情页右下角的「...」中，点击「开始专注」后选择计时方式后即可开始专注计时。\n\n![--73.2%](/dida-assets/cdn.dida365.cn/hc/all/9b05ac1adfb4a80ad8eed6557c58c5c4.png)\n:::::\n\n\n## 提醒弹窗中开始专注\n可以直接在任务提醒弹窗中点击「专注」快速开始。\n\n# 专注多端同步\n\n番茄专注支持多端同步。当你在某一端开启专注时，在其他端也会同步进入专注状态；当你在一端暂停或者结束专注时，其他端也会暂停或者结束。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n如何使用？点击番茄专注页面右上角「 ... 」，在「专注设置」中开启「专注多端同步」即可。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/b34436a57bb266156e0f08324383e652.png)\n\n\n::::\n\n\n::::tab [desktop]\n\n如何使用？点击番茄专注页面中的「 ... 」-「专注设置」，选择开启「专注多端同步」即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/269a9f4e9d18abd7ef52b536f8794d5d.png)\n\n\n::::\n\n:::::\n\n\n\n\n\n# 专注小技巧\n\n## 专注中调整时间\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n在专注页面中以及专注沉浸页面中点击时间区域会出现加减，你可以根据需要点击「+」或「-」调整时间。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/512424cfb9afb699fe30df286a3cb832.jpg)\n\n\n::::\n\n::::tab [desktop]\n\n你可以在专注页面将鼠标移动至时间区域，点击时间两边的「+」「-」号即可调整专注时间。\n\n![--73.2%](/dida-assets/cdn.dida365.cn/hc/all/18de27c971f6a0e8e6233ca93810c849.png)\n\n::::\n\n:::::\n\n## 专注笔记\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n在专注页面中底部点击「记录专注笔记」按钮，就能够在专注时随时记录所思所想。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/5a69f37d26cfeac6019c28ac82411f68.png)\n\n\n::::\n\n::::tab [desktop]\n\n在专注页面右下方「专注笔记」区域可快速记录所思所想。\n\n![--73.2%](/dida-assets/cdn.dida365.cn/hc/all/53db977aa98cd1c1b842803d9858367a.png)\n\n::::\n\n:::::\n\n\n## 专注结束后编辑或补充时间\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n专注计时结束后，如果你仍在继续处理任务，可以点击计时器数字下方的额外时间，将后续时间也计入记录。\n\n如果你提前完成任务却忘记结束计时，也可以在专注结束页面中点击计时器数字或者右上角「...」-「编辑专注时长」手动调整时长，使记录更加准确。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/2696ddd9722c068af931c82e1a286295.png)\n\n::::\n\n::::tab [desktop]\n\n专注计时结束后，如果你仍在继续处理任务，可以点击计时器数字下方的额外时间，将后续时间也计入记录。\n\n![--67.25%](/dida-assets/cdn.dida365.cn/hc/all/afff6543659eed37b500892fc54f5e48.png)\n\n如果你提前完成任务却忘记结束计时，也可以在专注结束页面中点击计时器数字或者右上角「...」-「编辑专注时长」手动调整时长，使记录更加准确。\n\n![--67.25%](/dida-assets/cdn.dida365.cn/hc/all/1023a8000de843fd585b054b11e45caa.png)\n\n::::\n\n:::::\n\n# 常见问题\n:::::: spoiler 如何开启专注模块？\n\n\n:::::tabContainer [mobile|desktop|Web]\n\n\n::::tab [mobile]\n在「设置」-「功能模块」中开启「番茄专注」。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/8e3fc141c68213ca352158632e7e8e43.png)\n::::\n\n::::tab [desktop]\n点击头像-「设置」-「专注」-启用番茄计时。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/a40a381ddef6611f7b78f979cf606a6f.png)\n::::\n\n::::tab [Web]\n点击头像 - 设置 - 功能模块 - 开启「番茄专注」\n\n![--73.2%](/dida-assets/cdn.dida365.cn/hc/all/32bf9c3c67dbed08ffd3e4cc1215bb9b.png)\n::::\n::::::\n\n\n\n::: spoiler 在桌面端开始专注，手机上也会进入专注状态吗？\n会的。你需要先开启专注多端同步功能：在专注页面点击右上角「...」-「专注设置」中开启专注多端同步。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/dd76531b5416c4c675ff154341568b6f.png)\n\n\n:::\n\n", "tags": [""], "hideIndex": true, "favs": 37, "order": 2199023255552, "status": 0, "sectionId": "feature", "createdTime": "2022-07-06T11:20:29.171Z", "modifiedTime": "2026-08-04T13:18:08.287Z", "postId": "6950408124297641984", "__v": 0, "parentId": "6950361797429821440", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c64ba51e3a8b2ac64c81f6", "author": "", "description": "", "title": "列表视图：按天查看任务", "content": "不管你的目标是什么，只要是你想实现的，通往它们的旅程都是由一小步开始的。\n\n滴答清单提供的日历「列表视图」，结合了日历和列表任务，能帮助你更好地聚焦“当天任务”，高效专注并完成它们✅。\n\n在「列表视图」中，任务会以“待办事项”的形式呈现，查看时更轻量。\n\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/37d82c910ea868c1ab3d1d608b278d45.png)\n\n\n\n## 显示时间轴\n\n在日历列表视图中支持显示时间轴，以时间为线，串起一天的日程。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/8f638184635fab51378f6983d8ac52a4.png)\n\n\n打开方式：「日历列表视图」 - 「显示时间轴」图标。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/5627a3ce6ab099063c7416fd02d932c5.png)\n\n", "tags": [""], "hideIndex": true, "favs": 19, "order": 2199023255552, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T02:57:41.332Z", "modifiedTime": "2026-09-15T13:22:14.575Z", "postId": "6950643979079647232", "__v": 0, "parentId": "6950361611617959936", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c6531e1e3a8b2ac64c8298", "author": "", "description": "", "title": "团队如何协作", "content": "# 指派任务（分配任务）\n共享清单建立完成，其中任何成员都可以对任务进行分配，指派任务给执行者。任务的指派人会在「通知中心」收到通知提醒。\n## 分配已有任务\n\n你可以进入任务详情页，点击右上角「指派」图标指派任务。\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/8d5d5a8a230f1389bfebd6ea0bdf53cf.png)\n\n\n你也可以在任务列表页，批量指派任务。点击右上角「···」-「批量编辑」并多选任务，点击右下角「···」 - 选择「分配给」进行指派。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/05ae5c0d9ccab67a3d62c96d43dc44c5.png)\n\n::::\n\n::::tab [desktop]\n\n![--77.34%](/dida-assets/cdn.dida365.cn/hc/all/afe48048907590a4d4e905bfaba29179.png)\n\n::::\n\n:::::\n\n\n## 创建时分配任务\n打开任务输入栏输入任务 - 点击「指派」图标。输入「@」，选择被指派人。\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/a110297925ccdd97b8008383df342587.png)\n\n::::\n\n::::tab [desktop]\n\n![--77.34%](/dida-assets/cdn.dida365.cn/hc/all/ffd81eee1cd416115839a3797a3f7691.png)\n\n::::\n\n:::::\n# 评论任务\n接收到指派任务后，可以使用评论功能来添加备注说明，或和其他团队成员交流表达自己的想法。\n\n进入任务详情界面，点击右上角「···」-  选择「评论」- 输入评论的内容 - 点击「发送」即可添加评论。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/2ffc3f1c478e20a929887642d3331372.png)\n\n您可以留言或在留言中@某人。评论成功后，被您评论或@的用户将会在「通知中心」里收到提醒。\n\n# 共享协作通知\n## 通知中心\n\n想要获取共享清单变更的实时动态，可以选择开启清单的通知权限。当有任务变更时，在左侧边栏，点击通知按钮查看消息通知。\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/2bd552383f5e6d3de968b2290b564035.png)\n\n::::\n\n::::tab [desktop]\n\n![--77.34%](/dida-assets/cdn.dida365.cn/hc/all/8ed9ed4280683a693ff6944f19a337cf.png)\n\n::::\n\n:::::\n\n## 消息通知\n\n滴答清单支持给共享清单设置通知权限。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n左滑或者长按清单进入「**编辑**」→ 点击「**提醒与通知**」，就可以单独给当前清单开启「完成/取消完成了任务」、「添加了任务/笔记」、「删除/移走了任务/笔记」等通知权限。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/34b5221f2c9c14182cf9e6923330eeb2.png)\n\n::::\n\n::::tab [desktop]\n\n点击清单标题旁的「共享」按钮 - 点击「消息通知」，就可以单独给当前清单开启「完成/取消完成了任务」、「添加了任务/笔记」、「删除/移走了任务/笔记」等通知权限。\n\n![--77.34%](/dida-assets/cdn.dida365.cn/hc/all/acf45cd29fcdf18d3e35fe99973d15a1.png)\n\n::::\n\n:::::\n\n## 任务提醒\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n左滑或者长按清单进入「**编辑**」→ 「**提醒与通知**」，点击进入「**任务提醒**」，即可选择接收提醒的任务为所有任务、所有任务（指派给他人的除外）、指派给我的任务或者不提醒。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/3f71ebddbf9b514ddfceb34dad3dcc65.png)\n\n::::\n\n::::tab [desktop]\n右键单击共享清单，进入「**编辑**」，找到「**任务提醒**」，你可以选择接收提醒的任务为所有任务、所有任务（指派给他人的除外）、指派给我的任务或者不提醒。\n\n![--77.34%](/dida-assets/cdn.dida365.cn/hc/all/6373f1767205afa70f00ad7cde68f1d6.png)\n\n::::\n\n:::::\n\n## 在智能清单显示\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n左滑或者长按清单进入「**编辑**」，找到 「**在智能清单中显示**」，可选择需要在「所有」、「今天」、「明天」、「最近7天」等智能清单中显示的任务为：所有任务、所有任务（指派给他人的除外）、指派给我的任务或者不显示。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/504b145c67a435e96a02e6550fb6cb30.png)\n\n::::\n\n::::tab [desktop]\n右键单击共享清单，进入「**编辑**」，找到 「**在智能清单中显示**」，可选择需要在「所有」、「今天」、「明天」、「最近7天」等智能清单中显示的任务为：所有任务、所有任务（指派给他人的除外）、指派给我的任务或者不显示。\n\n![--77.34%](/dida-assets/cdn.dida365.cn/hc/all/54b10c0fd26f1d3bcd475a52545f7301.png)\n\n::::\n\n:::::\n\n\n# 管理成员权限\n在共享清单中，还可以给清单成员设置编辑权限，点击清单标题旁边的「成员」图标，即可查看到该清单下所有成员。点击成员右边的「编辑」即可对该成员进行编辑权限设置。可设置清单成员的可编辑、可评论和只读等权限。\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/f28415d69205b8ab238e56ed65771b19.png)\n\n::::\n\n::::tab [desktop]\n\n![--77.34%](/dida-assets/cdn.dida365.cn/hc/all/c7973917c4bb733aca0ffe3fc8362bba.png)\n\n::::\n\n:::::\n\n# 常见问题\n::::: spoiler 如何查看任务动态？\n:::::tabContainer [mobile|desktop]\n可以在任务动态中找到每一步操作的责任人，同时，也可以查询任务从创建之初到被完成时的所有改动。\n\n- 进入任务详情页，点击右上角「...」，选择任务动态，即可查看。\n\n::::tab [mobile]\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/9d82996fa757a2e9bd241291cf32c671.png)\n\n::::\n\n::::tab [desktop]\n\n![--77.34%](/dida-assets/cdn.dida365.cn/hc/all/e17d69130909825659950a836136a9e8.png)\n\n::::\n:::::\n\n::: spoiler 如何查看清单动态？\n\n目前只支持在电脑端查看清单动态，点击清单右上角「···」-「清单动态」即可查看。\n\n![--77.34%](/dida-assets/cdn.dida365.cn/hc/all/067b964e3f59da104e4d16225c667b75.png)\n\n:::\n::: spoiler 和多人共享清单，需要每个人都是高级会员吗？\n不需要。只需清单所有者是高级会员，此清单即可共享给 29 个成员，但是非高级会员的成员不能使用高级功能。\n:::\n\n::: spoiler 与他人共享清单后，我账号中所有的内容都会跟对方共享吗？\n不是，只有对应的共享清单中的内容会与对方共享，其他内容将不会共享。\n:::\n", "tags": [""], "hideIndex": true, "favs": 14, "order": 2199023255552, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T03:29:34.270Z", "modifiedTime": "2026-05-08T06:48:05.881Z", "postId": "6950652002518958080", "__v": 0, "parentId": "6950648827183366144", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"area": "help-center", "_id": "62c6575a1e3a8b2ac64c8323", "author": "", "description": "", "title": "时间线视图：项目管理的必备神器", "content": "「时间线视图」是一种比甘特图更轻量、更实用的工具。 当你在清单中开启了「时间线视图」，任务就会显示在横向的时间线中。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/216de325df65da53a2c5e60b85734d78.gif)\n\n在清单右上角的菜单选项的视图里，选择时间线视图即可。\n> 所有、收集箱、今天、最近7天 等智能清单不支持时间线视图\n\n\n使用「时间线视图」，你可以在项目管理中，了解每个人的工作进度，及时调整工作计划。 \n\n![](/dida-assets/cdn.dida365.cn/hc/all/723736bce6b02d27f376d87b05d0d45c.png)\n\n也可以在一个更长的时间范围内，规划安排工作和生活。 \n\n![](/dida-assets/cdn.dida365.cn/hc/all/194b1067785c591d5c325bb6f61a8d3b.png)\n\n#  轻松创建和安排任务\n## 添加任务\n\n在时间线视图中，添加任务非常简单，你可以点击空白区域，直接添加任务。 任务会根据你点击的日期，自动带上时间。例如图中在4月2日添加的任务，会自动设置4月2日。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/c0808464223b90e206ab99bc65ce9e63.gif)\n\n\n## 安排任务\n\n和「日历视图」一样，「时间线视图」只能显示有时间的任务。没有时间的任务会显示在右侧的安排任务中，你可以通过拖动，直接将任务安排到时间线中，设置好时间。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/1a7c74dab98a562ec42e66093fd81450.gif)\n\n\n#  高效查看任务\n## 滑动查看\n\n你可以在时间线中查看一周、一个月的任务。只需要按住鼠标，就可以滑动查看。 \n\n![](/dida-assets/cdn.dida365.cn/hc/all/41e61c6793bb087807ffa58425468796.gif)\n\n\n这种横向、连续的任务呈现，其实更加符合我们日常真实情况。相对比日历来说，在跨周、跨月的场景，在时间线视图中查看和安排任务，也会有更好的使用体验。\n\n## 切换显示比例\n\n当任务时间跨度较大时，你还可以通过切换天、周、月，来调整显示比例。 \n\n![](/dida-assets/cdn.dida365.cn/hc/all/f72695e1f27655dc15a6b9eaa056125c.gif)\n\n\n显示比例切换的意义，其实不仅是在于“一屏内看到更多的任务”，而是提供了一个「鸟瞰视角」。帮助我们在一个更加广阔的时间范围，重新审视我们的时间安排。是否在一些小事上耽搁了太多的时间，但是在重要的目标上却投入很少。\n\n这也是我们提倡的时间管理理念，聚焦当下脚踏实地的同时，也要抬头看路。\n\n# 更从容地应对变化\n\n而在做好计划之后，想必很多人都遇到过“计划赶不上变化”的情况：\n- 原本预估2天可以完成的工作，做的过程中却发现时间不够。\n- 临时插入新的任务，导致原本安排好的任务时间需要调整。 正因如此，有的人觉得做计划没用：反正做好的计划都会变，不如不做。\n\n但实际上，制定计划并及时调整，不仅可以将我们的进度可视化；在心理学上，也是“迈出第一步”，对抗拖延和焦虑的方式。\n\n所以我们面临的问题，其实并不是“是否要做计划”，而是“在计划发生变化时，如何从容应对、快速调整调整”。\n\n## 拖动修改时长\n\n在时间线视图中，任务的长度，代表了任务的时长。 如果你想对任务的时长进行调整。只需要将鼠标移动到任务边缘，拖动。两步就可以完成调整。 \n\n![](/dida-assets/cdn.dida365.cn/hc/all/ee1fb577ef646c851c4462da4a50600d.gif)\n\n\n在原来，我们需要通过“选择任务 → 点击时间设置 → 选择结束时间 → 选择日期 → 完成保存”这些步骤才能完成时间的修改。\n\n## 拖动修改时间\n\n而任务的位置，代表的任务的开始时间和结束时间。 当任务时间需要调整时，你只要用鼠标按住任务，拖动到对应的位置即可。 \n\n![](/dida-assets/cdn.dida365.cn/hc/all/74a8a1f709767ab41667213eff215ca2.gif)\n\n\n拖动后，任务的开始时间和结束时间会根据你松手的位置，甚至对应的时间，非常方便。\n\n# 常见问题\n::: spoiler 如何切换列表/看板/时间线视图？\n进进入任务详情页，点击右上角「...」-「切换视图」，即可在清单、看板、时间线三种视图之间进行切换。\n:::\n\n::: spoiler 如何在时间线中显示所有重复周期？\n目前还不支持在时间线中显示任务的所有周期。\n:::\n\n::: spoiler 如何在时间线中显示任务颜色？\n跟日历视图一样，可以在「显示设置」中根据清单、标签以及优先级的颜色显示。\n:::\n\n::: spoiler 移动端是否支持时间线视图？\n目前移动端时间线视图已上线，请更新到 V6.4 以上版本使用。\n:::\n\n\n\n\n\n\n\n \n\n\n\n\n\n\n\n", "tags": [""], "hideIndex": true, "favs": 106, "order": 2199023255552, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T03:47:38.278Z", "modifiedTime": "2026-09-23T13:25:01.138Z", "postId": "6950656549178048512", "__v": 0, "parentId": "6950656395750408192", "pinInSearch": true}, {"area": "help-center", "_id": "62c677f81e3a8b2ac64c8664", "author": "", "description": "", "title": "数据备份与迁移", "content": "\n# 生成与导入备份\n在Web端，点击左上角头像 -「设置」-「账号与安全」-「备份与还原」，你可以对滴答清单的数据进行备份的生成与导入，也可以从其他应用中导入任务。\n> Web端地址：www.dida365.com\n\n点击「生成备份」，你可以备份以 .csv 为后缀的文件。 若你需要导入备份，可以单击「导入备份」，再上传备份文件即可。\n\n![--64.31%](/dida-assets/cdn.dida365.cn/hc/all/ff70a8a13cc635b8c1642e994162ae4e.png)\n# 从其他应用中导入\n若你希望将其他应用的任务移入滴答清单，可以点击左上角头像 -「设置」-「备份与导入」，选择对应的应用上传备份文件到滴答清单。\n:::::tabContainer [iOS|Android|Web]\n\n::::tab [iOS]\n在「设置」-「导入与关联应用」里，可以直接导入提醒事项、Todoist、Microsoft To Do，更多第三方应用导入需要在web端完成。\n::::\n\n::::tab [Android]\n在「设置」-「导入与关联应用」里，可以直接导入Todoist、Microsoft To Do、Any.do 等，更多第三方应用导入需要在web端完成。\n::::\n\n::::tab [Web]\n若你希望将其他应用的任务移入滴答清单，可以点击左上角头像 -「设置」- 「关联与导入」，选择对应的应用（Todoist，Microsoft Todo，Wunderlist，OmniFocus，Toodledo，iCal等）上传备份文件到滴答清单。\n::::\n\n\n\n\n", "tags": ["导出"], "hideIndex": true, "favs": 13, "order": 2199023255552, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T06:06:48.747Z", "modifiedTime": "2026-08-07T08:21:34.830Z", "postId": "6950691573587771392", "__v": 1, "parentId": "6950657111692935168", "pinInSearch": false}, {"_id": "6348c508e1bd73cf6d315806", "author": "", "description": "探索桌面便签如何成为提升效率的得力工具，及其在记录碎片化信息和事项跟进处理中的关键作用", "title": "📝 桌面便签", "content": "![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/0383a9fe16e701d5d49adb7d87cd565a.jpg)\n\n上学时，我们会将每章节中重点内容整理在便利贴上，粘贴在章节最前面方便复习。\n\n工作后，我们会将一天的 todo list 写在便利贴，贴在电脑显示屏上，时刻提醒自己。\n\n从学生到职场，便利贴一直陪伴着我们。\n\n我们的新功能「桌面便签」和传统的便利贴一样，能够用来快速记录你的碎片化信息，或者将一段时间内的重点事项钉在桌面上，方便你跟进处理。 \n\n相信在工作场景中，桌面便签能够帮助你快速记录所思所想。\n\n看看如何使用👇\n\n\n\n# 打开便签\n\n我们提供了两种方法打开便签。\n\n## 方法一：任务打开便签\n\n你可以通过右击任务选择「打开便签」，或者 在任务详情页中，点击右下角「...」-「打开便签」。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/14aa87a583f544d69b65215aab70533a.png)\n\n\n\n\n## 方法二：快捷键打开便签\n\n如果想要能够直接开启便签功能，你只需要设置「添加便签」的快捷键就能快速添加。\n\n**第1步：设置快捷键**\n\n点击头像-「设置」-「快捷键」-「全局操作」-「添加便签」。\n\n你可以根据自己的使用习惯设置快捷键。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/5872f5c1c6d37ab434705cf434ddd0c7.GIF)\n\n**第2步：使用快捷键打开**\n\n设置成功后，你就能够在桌面中或者其他场景快速使用快捷键随时唤起便签功能。\n![](/dida-assets/cdn.dida365.cn/hc/all/9df216cd8a1282dc9fbe8dda6bb6c80a.GIF)\n\n::: spoiler 如何批量打开便签？\n在任务列表页面，按下 “Shift”键点击需要批量打开任务范围，再在右边选择打开便签，所选择的任务就能够一次批量打开。\n![](/dida-assets/cdn.dida365.cn/hc/all/c091af9a18ad202e2b1f067302b09f56.gif)\n:::\n\n:::::: spoiler 如何关闭便签？\n你可以在便签右上角点击关闭按钮关闭便签，也可以使用快捷键关闭。\n:::::tabContainer [Windows|macOS]\n\n::::tab [Windows]\nWindows端：Ctrl+w\n\n::::\n\n::::tab [macOS]\nMac端：⌘+w\n::::\n\n:::::\n\n::::::\n\n\n\n\n\n# 常用的操作与技巧\n\n## 便签设置\n你可以在便签设置中根据自己的偏好，设置：默认颜色、字体大小、默认置顶、默认便签间距、排列恢复默认大小等。\n\n使用方式：打开「设置」-「功能」-「便签」。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/5cab98b7e736669a43a8b5ac90385aaa.png)\n\n::::::: spoiler 如何切换便签颜色？\n对于已打开的便签，你也可以快速切换它的颜色。\n\n使用方法：\n将鼠标移至便签顶部，点击衣服形状按钮，即可选择你喜欢的颜色；\n或者也可以使用颜色快捷键来进行切换。\n:::::tabContainer [Windows|macOS]\n\n::::tab [Windows]\n切换颜色快捷键：Ctrl+Shift+C  \n::::\n\n::::tab [macOS]\n切换颜色快捷键：⇧+⌘+C \n::::\n\n:::::::\n\n\n\n## 置顶便签\n当我们在视频会议或者查找资料时，便签保持在页面最前端，可以方便我们快速记录要点。\n\n使用方法：\n将鼠标移至便签顶部，点击便签右上角「置顶」按钮，即可置顶便签；\n或使用便签置顶快捷键 F12。\n![](/dida-assets/cdn.dida365.cn/hc/all/99d63e011f96a14615d20fe48e7cdbd0.gif)\n\n\n::: spoiler 如何使新建的便签默认置顶？\n使用方法：打开「设置」-「功能」-「便签」- 启用「默认置顶」。\n![](/dida-assets/cdn.dida365.cn/hc/all/8b40a67fe2f7602429eb6c3f927ef5e9.png)\n\n:::\n\n## 一键排列\n如果你一次性打开了多个便签，可以使用一键排列功能来整理它们。\n\n\n使用方法：\n\n❶ 点击便签右下角「...」-「排列」\n\n❷ 使用一键排列快捷键\n\n![](/dida-assets/cdn.dida365.cn/hc/all/884d3505dccc12aa206efa13c0a9c91f.gif)\n\n:::::: spoiler 一键排列快捷键\n:::::tabContainer [Windows|macOS]\n\n::::tab [Windows]\n顶部排列，Alt+↑\n\n居左排列，Alt+←\n\n居右排列，Alt+→\n::::\n\n::::tab [macOS]\n顶部排列，/⌥ + ⌘+↑\n\n居左排列，/⌥ + ⌘+←\n\n居右排列，/⌥ + ⌘+→\n::::\n\n::::::\n\n## 便签单行\n\n将一天的所有任务都打开便利贴钉在桌面上，占据的空间较大；\n这个时候你就可以先双击便签顶部，将便签变成单行，自由拖动它调整位置。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/58e281658bc27108c527dd9314686b1e.png)\n\n当你需要完成一项任务时就再双击放大它，查看任务详情。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/3ec5208ec2b53bd1eb6fe88533a48926.gif)\n\n\n# 常见问题\n\n\n::: spoiler 如何直接建立一个便签？\n可以使用快捷键快速打开一个便签，在「设置」-「快捷键」-「全局操作」中设置「添加便签」快捷键。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/7b437c59169951d46e9b9eda93ddd938.png)\n:::\n\n\n\n::: spoiler 手机上如何同步便签？\n目前便签功能为电脑端功能，无法在手机上打开。\n:::\n::: spoiler 如何关闭便签在Windows状态栏的显示\n目前，Windows用户可以自定义便签是否在状态栏显示窗口。\n\n使用方法：「设置」-「偏好与功能」-「便签」- 「不在任务栏显示」\n启用「不在任务栏显示」后，你可以通过快捷键 Win + Tab 查看所有已打开便签。\n:::\n", "tags": [""], "hideIndex": true, "favs": 116, "order": 2199023255552, "status": 0, "pinInSearch": false, "sectionId": "special", "createdTime": "2022-10-14T02:10:16.197Z", "modifiedTime": "2026-09-22T06:32:43.590Z", "postId": "6986508444417130496", "__v": 0, "parentId": null, "area": "help-center", "shortTitle": ""}, {"_id": "663840fe47c89fff9258e3c5", "author": "", "description": "", "title": "Exchange 日历", "content": "\n如果你想要在滴答清单中显示 Exchange 中的日历事件，你可以通过订阅 Exchange 的方式轻松实现。\n\n# 添加日历\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入「设置」-「导入与关联应用」-「日历」，选择 Exchange，输入账号密码，授权成功后即订阅成功。\n\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/cd63a6b05d32dcfb42c29c1dca8d8579.png)\n::::\n\n::::tab [desktop]\n点击头像 -「设置」-「关联与导入」，选择 Exchange，输入账号密码，授权成功后即订阅成功。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/0c346d0c9fc4bca7a731e095d5b56482.png)\n\n::::\n\n:::::\n\n# 常见问题\n::: spoiler Exchange 为什么订阅企业微信日历不成功？\n由于企业微信限制，第三方应用无法使用 Exchange 方式订阅成功，你可以使用 [CalDav 方式订阅企业微信日历](/articles/7190959806838996992)。\n:::\n", "tags": [""], "hideIndex": true, "favs": 2, "order": 2199023255552, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2024-05-06T02:31:26.619Z", "modifiedTime": "2026-05-08T06:48:49.092Z", "postId": "7193074856341012480", "__v": 0, "parentId": "6949998599191134208", "area": "help-center", "shortTitle": ""}, {"_id": "69b3c45adf6b009a1adc9a31", "author": "", "description": "", "title": "滴答清单 MCP", "content": "# 什么是 MCP？\nMCP（Model Context Protocol）是一种开放协议，允许支持 MCP 的 AI 客户端（如 Claude、ChatGPT、Cursor、VS Code 等）直接与外部服务进行交互。通俗来说，MCP 可以让 AI 直接帮你完成应用里的操作。\n\n**通过接入滴答清单 MCP，AI 助手可以直接读取、创建和管理你的任务，成为你的专属“任务管家”。** 你无需切换应用，直接在 AI 对话框中完成任务管理即可。\n\n例如，你可以直接对 AI 说：\n- 我今天有哪些任务？\n- 帮我创建一个任务：明天下午 3 点准备会议材料，高优先级。\n- 把“买牛奶”这个任务标记为已完成。\n\n**AI 将通过滴答清单 MCP 自动调用对应工具并完成操作。**\n\n# 连接滴答清单 MCP\n\n滴答清单 MCP 支持 Streamable HTTP 远程传输协议，支持 OAuth 和 Bearer Token 两种授权方式。可通过以下 URL 实现连接：\n\n```\nhttps://mcp.dida365.com\n```\n\n你可以在不同的 AI 工具中连接滴答清单 MCP，下面是常见 AI 客户端的配置方法。\n\n::: spoiler Bearer Token 如何获取？\n如需Bearer Token，可前往网页版滴答清单，点击「头像」- 「设置」 -「账户与安全」 - 「API 口令」中创建并复制使用。\n:::\n\n## WorkBuddy\n\n> 目前仅桌面客户端支持自定义连接器，浏览器、移动端暂时无法配置。\n\n1. 打开 WorkBuddy，在左侧菜单中选择**专家 · 技能 · 连接器**。\n\n2. 在右侧页面顶部选择 **连接器**，点击右侧 **自定义连接器**。\n\n3. 点击弹窗右上角 **配置MCP**。\n\n:::::tabContainer [自动授权|Token授权]\n\n::::tab [自动授权]\n\n4. 添加以下内容：\n\n```\n{\n  \"mcpServers\": {\n    \"dida365\": {\n      \"type\": \"http\",\n      \"url\": \"https://mcp.dida365.com\",\n      \"disabled\": false\n    }\n  }\n}\n```\n\n5. 保存配置后返回 MCP 列表，在已安装的 MCP 服务中找到滴答清单，点击右侧 **连接**，在浏览器中完成 OAuth 登录和授权。\n\n::::\n\n::::tab [Token授权]\n\n4. 添加以下内容，并将获取到的 Bearer Token 替换至 `headers` 字段中的 `YOUR_TOKEN_HERE` ：\n\n```\n{\n  \"mcpServers\": {\n    \"dida365\": {\n      \"type\": \"http\",\n      \"url\": \"https://mcp.dida365.com\",\n      \"headers\": {\n        \"Authorization\": \"Bearer YOUR_TOKEN_HERE\"\n      },\n      \"disabled\": false\n    }\n  }\n}\n```\n\n::::\n\n:::::\n\n## 豆包（豆包工作）\n\n> 目前仅桌面客户端支持自定义连接器，浏览器、移动端暂时无法配置。\n\n1. 打开豆包，在左侧菜单中选择 **连接器 · 技能 · 伙伴**。\n\n2. 在页面右上角点击 **添加**，选择 **新建自定义连接器**。\n\n3. 传输类型选择 HTTP，输入 MCP 服务器 URL：\n\n```\nhttps://mcp.dida365.com\n```\n\n4. 保存配置后，根据指引在浏览器中完成 OAuth 登录和授权。\n\n==💡目前推荐使用 [DIDA CLI](/dida-help/articles/7464976698707017728)，使用更稳定。==\n\n## 千问办公\n\n> 目前仅桌面客户端支持自定义连接器，浏览器暂时无法配置。\n\n1. 打开千问办公，在左侧菜单中选择 **连接器**。\n\n2. 在页面右上角点击 **添加**，两种方式选择任意一种。\n\n:::::tabContainer [自动授权|Token授权]\n\n::::tab [自动授权]\n\n3. 选择 **手动填写配置**。\n\n\t1. 服务器类型选择 **Streamable HTTP**，输入 MCP 服务器地址：`https://mcp.dida365.com`\n\n\t2. 保存配置后，根据指引在浏览器中完成 OAuth 登录和授权。\n\n4. 选择 **粘贴 JSON 配置**，添加以下内容：\n\n```\n{\n  \"mcpServers\": {\n    \"dida365\": {\n      \"type\": \"streamable-http\",\n      \"url\": \"https://mcp.dida365.com\"\n    }\n  }\n}\n```\n\n::::\n\n::::tab [Token授权]\n\n3. 选择 **手动填写配置**。\n\n\t1. 服务器类型选择 **Streamable HTTP**，输入 MCP 服务器地址：`https://mcp.dida365.com`\n\n\t2. 点击 Headers 右侧的粘贴，添加以下内容，并将获取到的 Bearer Token 替换至 `YOUR_TOKEN_HERE`：`Authorization: Bearer YOUR_TOKEN_HERE`\n\n\t3. 点击解析后，保存配置即可。\n\n4. 选择 **粘贴 JSON 配置**，添加以下内容，并将获取到的 Bearer Token 替换至 `YOUR_TOKEN_HERE`：\n\n```\n{\n  \"mcpServers\": {\n    \"did
