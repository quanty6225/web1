课表是否包含该信息以及系统能否准确识别和匹配。\n:::\n\n::: spoiler 识别出来的课程信息有误、不完整怎么办？\n识别完后，请确认识别到的内容是否正确，若发现有识别错误的信息，可以修改后再导入。\n:::\n\n::: spoiler 课程导入成功后，如果课表有变动怎么办？\n如果后续课表有调整，您可以在课表视图点击课程进入「编辑课程」页面，手动修改相应的信息。\n:::\n::: spoiler 我的课表图片上传后会被保存吗？隐私如何保障？\n请放心，您的课表图片仅用于本次识别过程。识别完成后，图片数据不会被我们存储或用于任何其他用途。所有处理均在安全的环境下进行。\n:::\n\n\n## 方法二：教务网导入\n\n在日历课表视图，点击「立即导入」-「教务网导入」-「立即开始」，选择你的学校，登录教务网站，打开课表界面，点击「确定导入」添加课程。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/96e2eea729127731fada047de7326cd1.png)\n\n![l--103.89%](/dida-assets/s3.cn-north-1.amazonaws.com.cn/dida-hc/hc/all/da76df46ba4fdba8d5a4a82d07dae4da.png)\n\n> 目前我们已经支持近1000所学校课表导入，但是由于教务系统更新等原因，部分学校的课表需要适配才能导入成功，你可以在导入过程中申请适配。\n\n# 智能清单中显示课程\n在课表视图中，点击右上角「...」-「课表管理」中开启「在智能清单中显示课程」。\n\n你就能够在“今天”、“明天”、“最近7天”清单中看到课程。\n\n![--101.54%](/dida-assets/cdn.dida365.cn/hc/all/695c757a394ef0eb499966b4bef55a40.png)\n\n# 在日历中显示课表\n除了在课表视图查看课程，你也可以开启「在日历中显示课表」，这样就可以在日历中，同时看到课程和任务，方便你更好地管理日程。\n\n在「课表视图」中，点击右上角「...」-「课程管理」-「在日历中显示课表」，开启此功能，就能够在周视图中看到课程与任务。\n\n\n\n![--65.88%](/dida-assets/s3.cn-north-1.amazonaws.com.cn/dida-hc/hc/all/307b6556a78690bc5b8f0abdacbb79b3.png)\n\n# 常见问题\n\n\n::: spoiler 如何添加上课提醒？\n在课表视图界面，点击右上角「...」-「课表管理」-「编辑课表」，可根据自己的习惯设置上课提醒。\n还能够根据课程情况设置课表名称、开学日期、周数、上课时间等属性。\n\n![--65.88%](/dida-assets/s3.cn-north-1.amazonaws.com.cn/dida-hc/hc/all/7230807d1d27e3e98174e809bd3bd5b2.png)\n:::\n\n::: spoiler 如何在日历中显示课表？\n点击右上角「...」-「课表管理」中开启，在日历中显示课表。\nPS.此功能为付费功能\n\n![--65.88%](/dida-assets/s3.cn-north-1.amazonaws.com.cn/dida-hc/hc/all/307b6556a78690bc5b8f0abdacbb79b3.png)\n:::\n\n\n\n::: spoiler 如何在桌面端日历中显示课表？\n只要你在「课表管理」开启了「在日历中显示课程」功能就能够直接在「显示设置」开启。\n![--70.93%](/dida-assets/cdn.dida365.cn/hc/all/a79b1104f94e0e13e38ee9679a912831.png)\n\n:::", "tags": [""], "hideIndex": true, "favs": 228, "order": 5497558138880, "status": 0, "sectionId": "special", "createdTime": "2022-07-06T08:59:47.422Z", "modifiedTime": "2026-09-29T09:34:25.076Z", "postId": "6950372717036044288", "__v": 0, "parentId": null, "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c6655e1e3a8b2ac64c858c", "author": "", "description": "", "title": "📔 笔记与摘要", "content": "# 笔记\n笔记功能，极简、轻巧、易用，你可以用它随时随地收集信息，保存灵感、备忘记事，与待办日程实现深度关联，也可以结合「模板」与「摘要」智能生成周报，高效复盘，不知不觉省下大把时间。\n\n### 笔记的适用场景有哪些？\n这里安利几个常见的应用场景，供大家参考：\n- 📝「学科素材」——设置独立的清单，专门用于储存某一门课的资料\n- 📝「每日总结」——可与待办任务混排，用于记录当天的见闻和感悟\n- 📝「工作复盘」—— 结合强大的任务摘要，追踪工作中的进展与得失\n\n\n## 创建笔记清单\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n在侧边栏点击「添加清单」 - 在「清单类型」一栏中选择「笔记」即可创建一个笔记类型的清单了。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/44ff6f6877dac71c5823a78003e518e7.png)\n\n\n::::\n\n::::tab [desktop]\n\n在侧边栏点击清单旁边的「+」选项，之后在「类型」一栏选择「笔记清单」即可成功添加一个笔记类型清单。\n\n![--64.31%](/dida-assets/cdn.dida365.cn/hc/all/230c25a3d661517e31ac1a2aa89f7c61.png)\n::::\n\n:::::\n##  添加笔记\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n在「笔记清单」中，点击右下角添加按钮即可直接添加笔记。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/55d014d3812a04c7d3067912303d0712.png)\n\n然后你就可以在笔记界面随心码字了。你可以使用键盘上方的样式菜单，给内容设置加粗、高亮等样式。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/d73cfc88972589f3a45d8b160df80b39.png)\n\n\n在此基础上，还能为笔记添加日期、提醒、标签和模板，就像管理任务一样方便。\n\n\n\n::::\n\n::::tab [desktop]\n在「笔记清单」中，点击「输入框」编辑笔记名称按「回车键」，即可直接添加笔记。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/dbb90910335aceef9ca69eaaf74f6c8c.png)\n::::\n\n:::::\n\n## 用看板视图管理笔记\n\n**笔记分类**\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n如何对笔记进行更好地分类管理？\n\n在笔记清单列表中点击右上角「...」-「视图」，切换成「看板视图」即可。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/98794d59d685c62cea2921a53a7dc875.png)\n\n\n::::\n\n::::tab [desktop]\n\n为了更好地对笔记进行分类管理，你可以在列表中点击右上角「...」-「视图」-「看板视图」，并且按类别设置好分组。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/4df13c38ebf7fdf51de0f1d98ddfab59.png)\n\n\n::::\n\n:::::\n\n\n**自定义排序**\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n「分组」和「笔记」都可以自由调整顺序。\n\n调整「分组」排序，只需要在列表中点击右上角「...」-「管理分组」，长按分组右侧「 ≡ 」并拖拽即可自定义分组的排序。\n\n![40%](/dida-assets/cdn.dida365.cn/hc/all/1927d1891b3471a6b5889e83d5dab861.gif)\n\n而修改「笔记」排序，只需要长按「笔记」拖动到对应位置即可。\n\n![40%](/dida-assets/cdn.dida365.cn/hc/all/27b97dabb22e460446cc7907d924d917.gif)\n\n::::\n\n::::tab [desktop]\n\n「分组」和「笔记」可以自由拖动，点击并拖拽它们即可自由定义它们的排序。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/1880a9646c65dae356f900065c67de2c.gif)\n\n\n::::\n\n:::::\n\n\n\n## 用模板高效记笔记\n想更高效地记笔记？一定别错过「模板」这个宝藏功能。\n\n你可以将一系列常用流程保存为模板，使之标准化、固定化，如：阅读笔记、会议纪要、每周工作总结等，之后再次用到时，无需手动录入，一键调用即可。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/01f37c5351f059644cbfa1d691b74203.png)\n\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入笔记详情页，点击「使用模板」，已经为大家提前准备了三个预设模板：选中任意一个即可自动添加到笔记中。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/be81bdbe5d964bef7fefc83cbf918bf3.png)\n\n\n::::\n\n::::tab [desktop]\n点击输入框右侧「 ⌄ 」，选择从模板添加，选中任意一个，就自动添加到笔记中了。\n\n![--73.2%](/dida-assets/cdn.dida365.cn/hc/all/7e860435e2306eaae4609d643f7e70dd.png)\n>  还可以在「设置」- 「模板」 - 「笔记模板」中可以管理已有的笔记模板。\n\n::::\n\n:::::\n\n\n你也可以够根据自己的需求不断优化，也可以自定义新的模板。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/9523ebe8a43f70778858ed857ac4970b.png)\n\n\n\n\n\n## 常见问题\n\n\n::: spoiler 笔记和任务是什么关系？\n\n任务和笔记是并列的关系，你除了可以创建任务清单（就像你之前熟悉的那样），还能够创建专门的笔记清单，二者主要区别如下：\n\n✅ 「任务」：支持勾选完成，用于时间安排、目标拆分、项目管理等。\n\n📃 「笔记」：无已完成概念，用于备忘记事、反思总结、知识储存等。\n\n![l--71.68%](/dida-assets/cdn.dida365.cn/hc/all/08d0dd24f2bf578986e0e0629e876231.png)\n\n:::\n\n\n\n:::::: spoiler 如何转化任务为笔记？\n\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入任务详情页- 点击右上角「···」 - 「转换为笔记」，可以将当前任务转换为笔记。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/cd15db5e0d222bb3b19212f18073fbda.png)\n\n\n> 任务转换为笔记之后不会自动去到笔记清单内，仍然会保留在原来的清单当中，且带有「子任务」的任务无法转换为笔记。\n::::\n\n::::tab [desktop]\n进入任务详情页- 点击右下角「···」 - 「转换为笔记」，可以将当前任务转换为笔记。\n\n![--73.2%](/dida-assets/cdn.dida365.cn/hc/all/3ce1aab3d250f4eda66683b3e97bc54c.png)\n\n\n> 任务转换为笔记之后不会自动去到笔记清单内，仍然会保留在原来的清单当中，且带有「子任务」的任务无法转换为笔记。::::\n\n:::::\n:::::: \n\n\n\n\n\n# 摘要\n\n还在为日报、周报苦恼，任务「摘要」\n有了这个复盘必备神器，配合笔记功能使用，让工作事半功倍！\n\n滴答清单的「摘要功能」能够帮助你了解和总结一段时间内的任务完成情况，并生成可编辑的文本，你可以将其直接添加至笔记页面或拷贝至其他平台。\n\n\n## 显示摘要\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n在笔记清单中点击 「+」图标来创建新的笔记，输入笔记标题后将光标移动到下方笔记描述区域，再点击图中的「摘要预览」图标。\n\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/04a426e82885df821647d3dc253435e8.png)\n\n\n::::\n\n::::tab [desktop]\n单击页面左上角头像，进入「设置」-「智能清单」-「摘要」，将摘要状态改为“显示”。设置成功后，「摘要」将出现在左侧边栏顶部。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/9ba16c31c2ffee87a45f77ece2387cd2.png)\n\n\n::::\n\n:::::\n\n\n## 插入摘要\n点击笔记内容区域，选择中间的摘要 icon，进入任务摘要预览页面，点击插入即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/801f56cc4ba48766a52ad0bfe9cd97f0.png)\n\n\n\n> 注：我们支持在摘要中显示专注数据和多级任务的完成情况，并增加了排序规则的种类。需注意的是，移动端有且只有「笔记」支持添加摘要。\n\n\n\n## 设置内容和格式\n\n你可以通过我们提供的功能，快速设置摘要中插入什么内容和格式。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n\n\n\n*  时间区间：你可以选择插入哪个时间段内的任务；\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/0c53b280f197cd9f76e58031fc319078.png)\n\n\n* 显示内容：按照清单、标签、指派人进行筛选；\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/4de96944234fdcf59809d22410dc131f.png)\n\n- 显示排序：设置任务的排序方式；\n\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/f97b1998efc37116acc833e255b5c94b.png)\n\n\n\n- 显示更多：或者设置显示“完成日期”、“进度”等更多信息；\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/9a888843fbf467827e3dcef3e0c23bcd.png)\n\n\n最后点击「插入」就可以将摘要内容插入笔记了。\n\n::::\n\n::::tab [desktop]\n\n你可以通过以下方式筛选任务：日期、清单、状态；\n \n\n![](/dida-assets/cdn.dida365.cn/hc/all/ac99a11b2a7b0b1f8d592512247f6222.png)\n\n\n\n在 **更多** 中，还可以根据以下条件筛选：标签、优先级、指派人\n\n![](/dida-assets/cdn.dida365.cn/hc/all/f70620710676ba1a948298e109d39e99.png)\n\n\n在 **显示设置** 中，你可以：\n- 选择分组方式（如：按完成状态、按清单）\n\n![](/dida-assets/cdn.dida365.cn/hc/all/6c6cc89429edab880f2d7a45f95abbb7.png)\n\n- 自定义显示内容（如：任务状态、进度等）\n\n![](/dida-assets/cdn.dida365.cn/hc/all/00ffe84d431567e32790241a49555e56.png)\n\n**保存为模板**\n\n当你完成筛选条件的配置后，可以一键将其保存为模板，方便下次直接使用。\n\n点击模板区域下方的 **「+」** 按钮即可创建新模板。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/d623b02cc61295d815c0a256b417d1a6.png)\n\n\n:::::\n\n## 导出摘要\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n如果需要导出摘要，您可以在该笔记中点击右上角「...」- 「分享」来以文本或图片的形式导出摘要。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/fdf4d76387b2176c61c29097cd795c6e.png)\n\n\n::::\n\n::::tab [desktop]\n打开左侧边栏「摘要」，确定好筛选条件后，点击「保存为」，选择你想要导出的样式即可。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/5855dd9b1cac25cbeb8ff5c13bb663a2.png)\n\n\n::::\n\n::::::\n\n\n# AI 摘要（公测）\nAI 摘要功能可以帮助你更高效地整理和回顾任务内容。系统会根据已完成的任务，自动提取重点信息并优化表达，生成结构清晰、易于阅读的总结内容。\n\n无论是项目收尾、日报撰写，还是每周任务回顾，AI 摘要都能减少手动整理的工作量，提升总结效率。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/a3979c03ee0ef1dea72260dbd41c44f3.png)\n> 仅 Web 网页端上线\n", "tags": [""], "hideIndex": true, "favs": 138, "order": 6047313952768, "status": 0, "sectionId": "special", "createdTime": "2022-07-07T04:47:26.762Z", "modifiedTime": "2026-10-07T00:01:42.921Z", "postId": "6950671600370843648", "__v": 0, "parentId": null, "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"area": "help-center", "_id": "66a8624747c89fff9258f50b", "author": "", "description": "", "title": "👑 成就值与勋章", "content": "滴答清单的“成就值与勋章”功能，让你的任务管理充满乐趣和成就感。通过积累成就值和解锁勋章，你会发现，完成任务不仅仅是完成，更是一次次的成长和进步。\n\n\n\n每当你完成一个任务，就能获得成就值，直观地看到自己在时间管理上的进步。[👉 成就值：记录每一个努力的脚步](/dida-help/articles/7223931708330999808)\n\n\n除了成就值，滴答清单还为你准备了各种勋章。每个勋章都是对你出色表现的认可，让你在任务管理之路上充满动力。[👉 勋章：展示你的辉煌成就](/dida-help/articles/7223931722771988480)", "tags": [""], "hideIndex": true, "favs": 21, "order": 6047313952768, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2024-07-30T03:47:19.803Z", "modifiedTime": "2026-09-21T07:21:20.534Z", "postId": "7223896922350682112", "__v": 0, "parentId": null}, {"area": "help-center", "_id": "62c41b4ec3bb3bd197e6e94b", "author": "", "description": "", "title": "从其他应用导入", "content": "如果你原来在使用其他应用，现在希望转到滴答清单。你可以将原来的使用数据，一键导入滴答清单，目前我们已经支持的产品有：\n\n\n![--73.2%](/dida-assets/cdn.dida365.cn/hc/all/f9860ab180b988fb060a8eec0fcac27d.png)\n\n你可以登录网页端，在「设置」 - 「关联与导入」中操作即可。", "tags": [""], "hideIndex": true, "favs": 6, "order": 6597069766656, "status": 0, "sectionId": "feature", "createdTime": "2022-07-05T11:06:54.566Z", "modifiedTime": "2026-09-03T12:14:25.365Z", "postId": "6950042319731032064", "__v": 0, "parentId": "6949998557218734080", "pinInSearch": false}, {"_id": "69cb8ecb614517bfb8a8b476", "author": "", "description": "", "title": "🤖️ AI 功能", "content": "任务任务的效率，不仅在于快速捕捉，也在于智能整理与自动化执行。使用滴答清单的 AI 功能，帮助你从“手动输入”转向“自然表达”——无论是随口说出的待办、会议中的录音，还是让AI直接接管任务操作，都能轻松完成：\n\n# 在滴答清单内使用\n\n[👉 AI 助手：用自然语言管理任务与时间](/dida-help/articles/7502990612036059136)\n\n[👉 AI 语音添加：用自然语言快速创建任务](/dida-help/articles/7444666114547646464)\n\n[👉 AI 录音：录音转写与智能总结](/dida-help/articles/7444668968427585536)\n\n# 结合外部工具使用\n\n[👉 滴答清单 MCP：通过外部 AI 工具管理任务](/dida-help/articles/7438132116019216384)\n\n[👉 DIDA CLI：在终端中管理你的任务和项目](/dida-help/articles/7464976698707017728)\n\n[👉 AI 实践场景：看看 AI 如何帮你管理任务与时间](/dida-help/articles/7475108284236562432)", "tags": [""], "hideIndex": true, "favs": 18, "order": 7146825580544, "status": 0, "pinInSearch": false, "sectionId": "feature", "area": "help-center", "createdTime": "2026-03-31T09:07:23.532Z", "modifiedTime": "2026-10-01T11:22:34.055Z", "postId": "7444671678778441728", "__v": 0, "parentId": null, "shortTitle": ""}, {"_id": "62c3f44e0223aebb27da25ac", "author": "", "description": "", "title": "在第三方日历中订阅滴答清单", "content": "滴答清单支持生成「URL 链接」，你可以通过这个方式将滴答清单日历同步到 Google、Outlook 等其他日历中。\n\n\n\n登录滴答清单桌面端， 点击「头像」-「设置」-「关联与导入」，找到「其他」-「订阅滴答清单」。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/975f47ab526de258be9aa144206038e7.png)\n\n\n点击「获取 URL」选择需要订阅的清单，生成对应的 URL 链接，在其他应用输入链接即可完成订阅。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/eb17096a9737fc053ca669fdb5ad9703.png)\n\n![](/dida-assets/cdn.dida365.cn/hc/all/6820743cb31b0a8b10bd2a9276f5cdf4.png)\n\n", "tags": [""], "hideIndex": true, "favs": 16, "order": 7696581394432, "status": 0, "sectionId": "feature", "createdTime": "2022-07-05T08:20:30.639Z", "modifiedTime": "2026-05-08T06:49:12.517Z", "postId": "6950000444106080256", "__v": 0, "parentId": "6949998599191134208", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "67e1143947c89fff925914d1", "author": "", "description": "", "title": "导入 Apple 健康数据", "content": "滴答清单现已支持导入 **Apple 健康数据**，你可以在日历视图中查看相关健康信息，以更好地管理时间与健康。\n\n> 健康数据同步仅支持 iOS 平台（iOS 16 及以上版本），并且应用版本请更新到v7.5.20或以上。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/df15a84dc2b84b12fae96dbfb61f6cdc.png)\n\n\n\n# 导入健康数据\n进入 **「设置」**，选择 **「导入与关联应用」**，点击 **「Apple 健康数据」**，选择需要同步至滴答清单的健康数据。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/c50ed59fc05d780c35692dc9f95489a3.png)\n\n# 显示健康数据\n授权后，数据将在 日历视图 中显示。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/df15a84dc2b84b12fae96dbfb61f6cdc.png)\n\n点击单个事件可以查看具体的数据情况。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/ce183514586e0504ae09a8538e1adf15.png)\n\n\n# 专注时间同步到 Apple 健康\n开启 「专注时间」 功能后，滴答清单的专注时间可同步至 Apple 健康正念中。\n\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/9cfdfff354e24d3ae469574b7eaae7b8.png)\n\n\n\n# 常见问题\n::: spoiler 为什么在电脑端看不到同步数据？\n目前健康数据仅支持在 iOS 平台显示，暂不支持多端同步。\n:::\n\n::: spoiler 未显示 Apple 健康数据？\n1. 确保在「苹果系统设置 > 隐私与安全 > 健康」中，已授予滴答清单访问权限。\n2. 重新授权：在「苹果系统设置 > 健康 > 数据访问与设备」中，移除滴答清单的访问权限，然后重新授权。\n:::\n\n::: spoiler 是否支持同步所有的健康数据？\n目前支持自动同步“前6个月~最新”的记录。\n:::\n\n::: spoiler 是否可以调整健康数据的显示方式？\n不支持自定义显示方式，数据默认按 Apple 健康中的记录进行同步和展示。\n:::\n\n", "tags": [""], "hideIndex": true, "favs": 3, "order": 7696581394432, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2025-03-24T08:13:45.553Z", "modifiedTime": "2026-09-20T08:57:50.001Z", "postId": "7309849895597244416", "__v": 0, "area": "help-center", "shortTitle": "", "parentId": "6949998557218734080"}], "id": "7005344825801179136"}, "buildId": "xKkVkZrp278ahwihCVLOf", "isFallback": false, "gssp": true, "customServer": true, "appGip": true, "scriptLoader": []}</script><div id="cnzz" style="display:none"></div></body></html>
