a365\": {\n      \"type\": \"streamable-http\",\n      \"url\": \"https://mcp.dida365.com\",\n      \"headers\": {\n        \"Authorization\": \"Bearer YOUR_TOKEN_HERE\"\n      }\n    }\n  }\n}\n```\n\n::::\n\n:::::\n\n## ChatGPT（Codex）\n\n1. 打开 ChatGPT，在侧边栏选择 **插件**。\n\n2. 搜索 **滴答清单**或[点击前往](https://chatgpt.com/plugins/plugin_asdk_app_6a87b30329908191837da812ccda47b6)，点击右侧的+，再点击 **安装插件**。\n\n3. 按照页面提示完成 OAuth 登录和授权。\n\n## Claude\n\n> 此功能适用于 Free、Pro、Plus、Business 及 Enterprise 等套餐，免费用户只能使用一个自定义 MCP 服务器。\n\n1. 打开 Claude，进入 **Settings** > **Connectors**。\n\n2. 点击右上角 Add，选择 **Add Connector**。\n\n3. 输入 MCP 服务器 URL：\n\n```\nhttps://mcp.dida365.com\n```\n\n4. 创建后点击 Connect，按照页面提示完成 OAuth 登录和授权。\n\n## Gemini (Beta)\n\n1. 打开 Gemini，切换到 Spark，选择 **已关联的应用**。\n\n2. 在 **适用于 Spark 的自定义应用** 中，点击 **添加自定义应用**。\n\n3. 输入 MCP 服务器 URL：\n\n```\nhttps://mcp.dida365.com\n```\n\n4. 点击下一步，跟随页面引导完成 OAuth 登录和授权。\n\n## Codex CLI\n\n1. 在终端运行以下命令：\n\n```\ncodex mcp add dida365 --url https://mcp.dida365.com\n```\n\n2. 命令执行后会自动提示完成 OAuth 登录和授权。\n\n## Claude Code\n\n:::::tabContainer [自动授权|Token授权]\n\n::::tab [自动授权]\n\n1. 在终端中运行以下命令：\n\n```\nclaude mcp add --transport http dida365 https://mcp.dida365.com\n```\n\n2. 在 Claude Code 会话中运行 `/mcp` ，按照提示完成 OAuth 授权流程。\n\n::::\n\n::::tab [Token授权]\n\n1. 在终端中运行以下命令，并将获取到的 Bearer Token 替换至 `YOUR_TOKEN_HERE`：\n\n```\nclaude mcp add --transport http dida365 https://mcp.dida365.com --header \"Authorization: Bearer YOUR_TOKEN_HERE\"\n```\n\n::::\n\n:::::\n\n## Cursor\n\n1. 打开 Cursor，进入 **Cursor Settings**。\n\n2. 在左侧菜单中选择 **Tools & MCP**，点击 **Add Custom MCP**。\n\n:::::tabContainer [自动授权|Token授权]\n\n::::tab [自动授权]\n\n3. 编辑 `.cursor/mcp.json` 配置文件，添加以下内容：\n\n```\n{\n  \"mcpServers\": {\n    \"dida365\": {\n      \"url\": \"https://mcp.dida365.com\"\n    }\n  }\n}\n```\n\n4. 保存配置后，重新打开 **Tools & MCP**，在已安装的 MCP 服务中找到滴答清单，点击右侧 **connect**，在浏览器中完成 OAuth 登录和授权。\n\n::::\n\n::::tab [Token授权]\n\n3. 编辑 `.cursor/mcp.json` 配置文件，添加以下内容，并将获取到的 Bearer Token 替换至 `YOUR_TOKEN_HERE`：\n\n```\n{\n  \"mcpServers\": {\n    \"dida365\": {\n      \"url\": \"https://mcp.dida365.com\",\n      \"headers\": {\n        \"Authorization\": \"Bearer YOUR_TOKEN_HERE\"\n      }\n    }\n  }\n}\n```\n\n::::\n\n:::::\n\n## VS Code\n\n:::::tabContainer [自动授权|Token授权]\n\n::::tab [自动授权]\n\n1. 在工作区中创建或编辑 `.vscode/mcp.json` 文件，添加以下内容：\n\n```\n{\n \"servers\": {\n    \"dida365\": {\n      \"type\": \"http\",\n      \"url\": \"https://mcp.dida365.com\"\n    }\n  }\n}\n```\n\n2. 也可以通过命令面板（Ctrl+Shift+P / Cmd+Shift+P）运行 **Add Server**，选择 **HTTP (HTTP or Server-Sent Events)**，输入 MCP 服务器 URL  `https://mcp.dida365.com` 以及 ID，选择作用范围为工作区或全局。\n\n3. 保存配置后，根据指引在浏览器中完成 OAuth 登录和授权。\n\n::::\n\n::::tab [Token授权]\n\n1. 在工作区中创建或编辑 `.vscode/mcp.json` 文件，添加以下内容，并将获取到的 Bearer Token 替换至 `YOUR_TOKEN_HERE`：\n\n```\n{\n  \"servers\": {\n    \"dida365\": {\n      \"type\": \"http\",\n      \"url\": \"https://mcp.dida365.com\",\n      \"headers\": {\n        \"Authorization\": \"Bearer YOUR_TOKEN_HERE\"\n      }\n    }\n  }\n}\n```\n\n::::\n\n:::::\n\n## TRAE\n\n1. 打开 TRAE，进入设置。\n\n2. 在左侧菜单中选择 **MCP**，点击 **添加 > 手动添加**。\n\n:::::tabContainer [自动授权|Token授权]\n\n::::tab [自动授权]\n\n3. 添加以下内容：\n\n```\n{\n  \"mcpServers\": {\n    \"dida365\": {\n      \"url\": \"https://mcp.dida365.com\"\n    }\n  }\n}\n```\n\n4. 保存配置后，在已安装的 MCP Servers 中找到滴答清单，点击右侧**前往验证**，在浏览器中完成 OAuth 登录和授权。\n\n::::\n\n::::tab [Token授权]\n\n3. 添加以下内容，并将获取到的 Bearer Token 替换至 `YOUR_TOKEN_HERE`：\n\n```\n{\n  \"mcpServers\": {\n    \"dida365\": {\n      \"url\": \"https://mcp.dida365.com\",\n      \"headers\": {\n        \"Authorization\": \"Bearer YOUR_TOKEN_HERE\"\n      }\n    }\n  }\n}\n```\n\n::::\n\n:::::\n\n## Antigravity\n\n1. 打开 Antigravity，进入设置。\n\n2. 在左侧菜单中选择 **Customizations**，在 Installed MCP Servers 点击 **Open MCP Config** 并打开 `mcp_config.json`。\n\n3. 添加以下内容，并将获取到的 Bearer Token 替换至 `YOUR_TOKEN_HERE`：\n\n```\n{\n    \"mcpServers\": {\n      \"dida365\": {\n        \"serverUrl\": \"https://mcp.dida365.com\",\n        \"headers\": {\n          \"Authorization\": \"Bearer YOUR_TOKEN_HERE\"\n        }\n      }\n    }\n}\n```\n\n4. 保存配置后，点击刷新即可。\n\n# 可用工具\n\n当你在 AI 对话中提出任务相关的需求时，AI 会自动调用滴答清单 MCP 提供的工具来完成操作。这些工具就像一组“能力”，让 AI 可以查询任务、创建任务或更新任务状态。\n\n> 💡 通常你不需要记住这些工具名称。只需用自然语言描述你的需求，AI 会自动选择合适的工具来执行。\n\n以下是滴答清单 MCP 提供的工具：\n\n## 查询任务\n\n| 工具                              | 介绍                            | 说明                                                               |\n| ------------------------------- | ----------------------------- | ---------------------------------------------------------------- |\n| search_task                     | 使用关键词搜索任务，返回任务 ID、标题和链接等 |                         |\n| get_task_by_id                  | 根据任务 ID 获取任务的完整内容 |                     |\n| list_undone_tasks_by_time_query | 查询一段时间的未完成任务，默认查询今天的未完成任务 | 支持选项：today, last24hour, last7day, tomorrow, next24hour, next7day |\n| list_undone_tasks_by_date       | 查询指定日期范围内的未完成任务 | 日期跨度最大 14 天 |\n| list_completed_tasks_by_date    | 查询指定清单中，在日期范围内的已完成的任务         | |\n| filter_tasks                    | 按日期、清单、优先级、标签、类型、状态等多条件组合查询任务 | |\n\n## 清单管理\n\n| 分类  | 工具                            | 介绍                           | 说明  |\n| --- | ----------------------------- | ---------------------------- | --- |\n| 清单  | list_projects                 | 获取当前账号中的所有清单                 |     |\n|     | create_project                | 创建新清单                        |     |\n|     | update_project                | 修改清单的设置                      |     |\n|     | get_project_by_id             | 根据清单 ID 获取指定清单的详细信息          |     |\n|     | get_project_with_undone_tasks | 获取指定清单的详细信息，同时返回该清单下所有未完成的任务 |     |\n|     | get_task_in_project           | 获取指定清单中的某个特定任务               |     |\n| 分组  | list_columns                  | 获取指定清单下的所有分组                 |     |\n|     | create_column                 | 在指定清单下创建新分组                  |     |\n|     | update_column                 | 在指定清单下修改分组名称                 |     |\n| 文件夹 | list_project_groups           | 获取所有的文件夹                     |     |\n|     | create_project_group          | 创建新的文件夹                      |     |\n|     | update_project_group          | 修改文件夹名称                      |     |\n|     | delete_project_group          | 解散文件夹下的所有清单                  |     |\n\n## 任务管理\n\n| 分类  | 工具                        | 介绍                             | 说明        |\n| --- | ------------------------- | ------------------------------ | --------- |\n| 任务  | create_task               | 创建任务，支持设置标题、描述、日期、优先级、清单、标签等属性 |           |\n|     | batch_add_tasks           | 批量创建任务，并设置每个任务的各字段             |           |\n|     | complete_task             | 完成指定任务                         |           |\n|     | complete_tasks_in_project | 批量完成指定清单中的多个任务                 | 每次最多 20 个 |\n|     | update_task               | 修改任务的标题、描述、日期、优先级等属性           |           |\n|     | move_task                 | 将任务移动到其他清单                     |           |\n|     | batch_update_tasks        | 批量修改多个任务的属性                    |           |\n|     | delete_task               | 将任务移动到垃圾箱                      |           |\n| 评论  | get_comment               | 获取指定任务下的所有评论                   |           |\n|     | add_comment               | 在指定任务下新增评论                     |           |\n|     | delete_comment            | 删除指定评论                         |           |\n| 指派  | assign_task               | 指派任务给其他成员                      |           |\n|     | unassign_task             | 取消任务指派                         |           |\n|     | project_member            | 列出指定共享清单下的所有成员                 |           |\n| 标签  | list_tags                 | 列出所有标签                         |           |\n|     | create_tag                | 创建新标签                          |           |\n|     | rename_tag                | 修改标签名称                          |           |\n|     | update_tag                | 修改标签颜色、其他属性                          |           |\n|     | delete_tag                | 删除指定标签，并从所有任务中移除此标签                          |           |\n\n## 习惯管理\n\n| 工具                    | 介绍             | 说明            |\n| --------------------- | -------------- | ------------- |\n| list_habits           | 获取当前账号中的所有习惯   |               |\n| list_habit_sections   | 获取当前所有的习惯分组    |               |\n| create_habit          | 创建新习惯          |               |\n| update_habit          | 修改习惯的设置        |               |\n| get_habit             | 获取指定习惯的详细信息    |               |\n| get_habit_checkins    | 获取指定习惯的打卡记录    |               |\n| upsert_habit_checkins | 创建或更新某个习惯的打卡记录 | 打卡范围支持最近 90 天 |\n\n## 专注记录管理\n\n| 工具                  | 介绍        | 说明               |\n| ------------------- | --------- | ---------------- |\n| get_focuses_by_time | 按时间查询专注记录 | 一次最多支持查询一个月的专注记录 |\n| get_focus           | 获取指定专注记录  |                  |\n| create_focus        | 添加专注记录    |                  |\n| update_focus       | 修改专注记录     | 专注时间不可修改      |\n| delete_focus        | 删除指定专注记录  |                  |\n\n## 查询纪念日\n\n| 工具              | 介绍      | 说明  |\n| --------------- | ------- | --- |\n| list_countdowns | 获取所有纪念日 |     |\n\n# 如何使用\n\n连接完成后，你可以直接用自然语言向 AI 发起请求。AI 会根据你的指令自动调用滴答清单 MCP 的功能来查询、创建或更新任务。\n\n下面是一些示例指令，帮助你了解可以如何与 AI 交互。\n\n## 任务的查询与回顾\n\n例如：\n\n>  “我今天有哪些任务？”\n\n> “帮我列出这周所有高优先级任务。”\n\n> “上周我完成了哪些任务？”\n\n> “我的备考复习清单中还有哪些未完成任务？”\n\nAI 会根据你的请求返回对应的任务信息，方便你查看安排或进行复盘。\n\n\n\n## 任务的创建与管理\n\n例如：\n\n> “创建一个任务：今天下午 3 点完成汇报 PPT，高优先级。”\n\n> “今天去买绿植，周末去公园看花，下周二庆祝朋友生日，帮我把这些都创建成任务放到‘热爱生活’清单。”\n\n> “把生活清单里的‘买牛奶’和‘买日用品’标记为完成。”\n\n> “帮我把‘去露营’移动到‘户外活动’清单。”\n\nAI 会自动识别任务内容，并提取相关信息、完成对应操作，例如创建任务、更新状态或整理清单。\n\n# 常见问题\n\n::: spoiler 我的客户端不支持 Streamable HTTP，能连接吗？\n目前滴答清单 MCP 仅支持 Streamable HTTP 协议，不支持 SSE。如果你的客户端只支持 SSE，暂时无法直接连接。\n:::\n\n::: spoiler 操作没有按预期执行，比如任务没有被找到，或者创建/更新操作失败？\n可能有几种原因：AI 模型对你的描述理解有偏差、选择了不匹配的工具，或传递的参数不正确。可尝试以下方式：\n- 使用更明确的描述，例如指定任务所在的清单名称、具体日期或优先级\n- 将复杂请求拆分为多步，例如先让 AI 查找任务，确认找到后再执行操作\n:::\n\n::: spoiler 是否支持所有滴答清单中的功能？\n目前主要支持任务、清单、习惯、专注记录以及纪念日的基础操作，其他高级功能暂未支持。\n:::\n\n::: spoiler 每次重启 AI 客户端后需要重新登录吗？\n不需要。OAuth 授权支持 Token 自动刷新，正常情况下无需重复登录。如果长时间未使用或主动撤销授权，才需要重新完成授权流程。\n:::\n", "tags": [""], "hideIndex": true, "favs": 167, "order": 2199023255552, "status": 0, "pinInSearch": true, "sectionId": "feature", "area": "help-center", "createdTime": "2026-03-13T08:01:30.270Z", "modifiedTime": "2026-10-12T22:49:33.319Z", "postId": "7438132116019216384", "__v": 0, "parentId": "7444671678778441728", "shortTitle": ""}, {"_id": "6a339aa06dd5c0432b3bd943", "author": "", "description": "", "title": "搜索任务", "content": "对于任务较多的用户，搜索功能可以帮助你快速查找任务、清单和标签，无需逐个浏览列表。\n\n# 搜索入口\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n在「**设置**」→「**功能模块**」中启用「**搜索**」后，即可通过底部 tab 栏进入搜索页面。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/ead2c2216b075c6db60904751bb0dc1f.png)\n\n::::\n\n::::tab [desktop]\n\n点击侧 tab 栏中的搜索按钮即可进入搜索页面。\n\n![--68.42%](/dida-assets/cdn.dida365.cn/hc/all/2b03a059532f2436f0f7bd3016cd07e4.png)\n\n::::\n\n:::::\n\n# 搜索任务、清单和标签\n\n进入搜索页面后，在顶部搜索框中输入关键词即可开始搜索。\n\n搜索框下方提供「任务」「清单」和「标签」三种搜索类型。选择对应类型后，可以快速查找相关任务、清单或标签。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/b6ad21e5dd07f0a6cebf778d802b867c.png)\n\n# 使用筛选条件搜索\n\n**当选择搜索「任务」时**，你还可以组合筛选条件进一步缩小搜索范围，包括清单、标签、优先级、日期等，更精准地定位目标任务。\n\n如果经常使用同一组筛选条件，可以将当前搜索条件保存为过滤器。保存后，无需重复设置筛选规则，只需打开对应过滤器，即可快速查看符合条件的任务。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/e0bd5e426218f8d011fab04a5b2bad36.png)\n", "tags": [""], "hideIndex": true, "favs": 0, "order": 2199023255552, "status": 0, "pinInSearch": false, "sectionId": "feature", "area": "help-center", "createdTime": "2026-06-18T07:13:36.043Z", "modifiedTime": "2026-06-24T06:17:13.829Z", "postId": "7473271683613196288", "__v": 0, "shortTitle": "", "parentId": "6950652964327391232"}, {"area": "help-center", "_id": "62c544d75084b6294bef613f", "author": "", "description": "番茄工作法：简单高效的时间管理艺术，一种由弗朗西斯科·西里洛提出的高效时间管理方法，通过分割时间增强专注力和生产效率，助你实现目标。", "title": "🍅 番茄专注", "content": "![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/09432fb3da82e277b74dd77e48ee8e5e.jpg)\n\n番茄工作法是一种简单有效的时间管理方法，由意大利人弗朗西斯科·西里洛于1992年提出。\n> 之所以用“番茄”来命名，仅仅是因为他大学时期使用的计时器是番茄形状的。\n\n\n番茄工作法的原理是：将时间分割为数个“番茄钟”，每专注25分钟，就休息5分钟，完成 4 个番茄钟允许你多瘫一会儿。你看，是不是很轻松？\n\n有人会问，就这？？真的会有效果吗？答案是肯定的，这是因为：\n1. 大脑在同一个时间，无法同时处理多件事情。\n2. 大脑的持续注意力时间是有限的，我们很难保持半小时以上的高度专注。\n\n而番茄工作法的核心在于，塑造一种仪式感引导你迅速进入专注状态，并在此期间保持聚焦，直到番茄钟结束。\n\n由于时间不长，你很容易坚持下来，而完成一个番茄钟的成就感会给你带来正反馈，反过来激励你坚持下去，达成更多更难的目标。\n\n[👉 如何开始专注](/articles/6950408124297641984)\n\n[👉 如何保持专注状态](/articles/6950412778679042048)\n", "tags": [""], "hideIndex": true, "favs": 95, "order": 2748779069440, "status": 0, "sectionId": "feature", "createdTime": "2022-07-06T08:16:23.984Z", "modifiedTime": "2026-09-30T09:46:41.438Z", "postId": "6950361797429821440", "__v": 0, "parentId": null, "pinInSearch": false}, {"_id": "62c574521e3a8b2ac64c8122", "author": "", "description": "番茄工作法与白噪音：提升专注与效率的完美结合。探索如何通过结合番茄工作法和各种白噪音，创造出最佳工作环境，以提高专注度和工作效率，让时间管理变得更加高效和愉悦。", "title": "如何保持专注状态", "content": "# 白噪音\n白噪音通常是指那些来自于大自然或者我们日常生活的真实声音，比如雨声、风声、流水声、鸟鸣声、人们在咖啡厅里的谈话声等。\n\n科学研究表明，这些声音能有效帮助我们放松心情、理清思绪，从而提高我们的专注度和办事效率。\n\n为了帮助你在每个番茄工作时间中都更加专注，滴答清单带来了多种番茄白噪音，为你营造舒心而集中的工作环境。\n\n\n:::::tabContainer [移动端|桌面端]\n\n::::tab [移动端]\n开始专注后点击左下方「背景音」图标，进入「背景音」你可以选择你喜欢的背景音。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/fb832eeabcb3e9264bb8ff2cb3dbf637.png)\n\n::::\n\n::::tab [桌面端]\n进入专注页面，点击右上方「声音」图标即可选择不同的背景音。\n\n\n![--73.2%](/dida-assets/cdn.dida365.cn/hc/all/9a0bc03a7bce50e84172777794f5854e.png)\n\n>Web 端暂未开放\n\n::::\n\n:::::\n# 专注沉浸模式 \n\n在专注页面开始专注后，点击屏幕即可进入「简约数字」样式。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/ca4e025fae404cc54c5dc1aedd4fe7d6.png)\n\n向左滑动可切换「翻页钟」样式。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/1cb5e32b8c658855d2c8588631b0a99e.gif)\n\n\n连续左滑动可切换「像素时钟」样式。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/219d10b220e53ce8b513b775ab71d88a.gif)\n\n\n\n::: spoiler 电脑端如何开启沉浸模式？\n专注开始后，点击右上方「...」可选择「沉浸模式」。\n:::\n\n::: spoiler 如何自动进入专注沉浸模式？\n在专注页面右上角「...」-「专注设置」中，启用「自动进入沉浸模式」即可。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/a911a3926d9db0213e9adacd85423962.png)\n\n:::\n\n::: spoiler 沉浸模式如何进行暂停、关联任务等操作？\n点击屏幕即可选择对应操作。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/8977e13384e2790faa4cdcf66a90105d.png)\n\n:::\n\n\n# 屏幕常亮\n目前仅支持移动端，进入专注后，点击右上角「小太阳」图标，开启常亮模式。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/f8536c1db0a4998c4b837fd23c1cb092.png)\n\n# 专注悬浮窗\n目前仅支持移动端，进入专注页面后，点击右上角「...」-「打开悬浮窗」，即可在其他页面查看番茄计时情况。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/6c3bc7586225d5c2b9f8bcef7bb08680.png)\n\n\n# 翻转开始\n目前仅支持移动端，在专注页面点击右上角设置图标，开启「翻转开始」。\n\n翻转模式开启后，只有在屏幕向下的状态，才会计时。当你拿起手机时，专注会自动暂停。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/27d0137e4aaef820b3353f39671642e8.png)\n\n# 严格模式\n控制不住的拿起手机，不自觉的就进入了娱乐模式...\n\n你可以在专注页面点击右上角「...」-「专注设置」，开启「严格模式」能够有效的帮你减少拿起手机的次数。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/53243fba44b3c732301eb6c67a7f6f19.png)\n\n你也可以将一些学习类应用添加到白名单中，这样即便在严格模式下也可以正常使用。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/896ceda084747367409edd872643d253.png)\n\n> 该功能适用于「番茄专注」，「正计时」模式下无效。另外 iOS 需要升级到 iOS 16 及以上系统才支持。\n\n# iOS 16 实时活动\n\niPhone 用户将系统更新至16.1，在专注页面点击右上角设置图标，开启「实时活动」就能够体验在锁屏中看到专注状态。\n\n另外，你可以根据自己的喜好设置颜色和样式。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/52918956404f5a17328aa9a9d29a742f.png)\n\n::: spoiler 根据设置开启后依然没有「实时活动」\n如果无法看到实时活动组组件，可以在系统设置中-滴答清单-打开实时活动按钮。\n:::\n\n\n\n\n# 常见问题\n\n::: spoiler 专注中想使用其它功能怎么办？\n\n在专注页面点击左上角「∨」，可以专注页面将最小化到底部。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/a43a0750bcb79322ddddd1725b0ab43d.png)\n\n:::\n\n::: spoiler macOS 端没有收到番茄结束提醒怎么办？\n\n因为 macOS 端的番茄结束提醒使用的是 Mac 自带的系统通知，所以需要你前往「系统偏好设置」 - 「通知与专注模式」 - 「滴答清单」 - 检查是否已启用「播放通知的声音」\n\n![--103.29%](/dida-assets/cdn.dida365.cn/hc/all/89493c5ca37c53210418c8f6ac0006c0.png)\n\n::: \n", "tags": [""], "hideIndex": true, "favs": 35, "order": 2748779069440, "status": 0, "sectionId": "feature", "createdTime": "2022-07-06T11:38:58.861Z", "modifiedTime": "2026-09-30T01:59:52.771Z", "postId": "6950412778679042048", "__v": 0, "parentId": "6950361797429821440", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c65ae81e3a8b2ac64c83a9", "author": "", "description": "", "title": "设置重复任务", "content": "\n\n写日报、周报、更换隐形眼镜、交房租、保险扣费...  总是有周期重复的事情需要我们记住。   \n\n接下来，把它们都交给滴答清单，设置为重复任务，为大脑减轻负担😎。\n\n\n# 如何设置重复？\n\n首先将所有重复发生的事情都收集起来，逐一创建在滴答清单当中。创建任务后，在「任务详情页」-点击「日期&重复」- 选择「重复」，就可以选择你需要的重复选项。\n\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/32ee6b23db5839167ebb82b74823487d.png)\n\n\n\n\n\n> 滴答清单提供 「 每天 / 每周 / 每月 / 每年 / 法定工作日 / 艾宾浩斯记忆法 / 自定义 」 重复，满足你的各种需求。\n\n\n重复的选项这么多，选哪个？ 可以简单的分为 4 类：\n* 常见重复 （🌈 日常琐事）\n* 工作日&节假日重复 （💼 打工人必备）\n* 农历重复（🥮 传统佳节）\n* 艾宾浩斯记忆法  （📝 学习记忆神器）\n* 自定义重复 （😄 随心所欲）\n\n\n::: spoiler 如何取消重复？\n点击任务进入编辑页，点按**日期**区域进入设置页，找到**重复**选项并点击旁边的 **✖**，即可清除重复设置。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/aa6633a7f1f1aaf4706ba30d7a8030e3.png)\n\n\n\n:::\n\n::: spoiler 编辑重复\n进入任务编辑页，点击**日期**区域，在设置页面中点击 **重复** 修改已有规则即可完成编辑。\n:::\n\n\n#  每天、每周、每月、每年\n\n* 每天（遛狗、慢跑）\n* 每周 （周报、超市购物）\n* 每月（花呗、信用卡账单还款）\n* 每年（家人、朋友生日🎂）\n\n如：每月 31 号信用卡还款，点击「日期&重复」，在日历上点击还款日期 “ 31 ”- 设置「重复」-「每月」即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/9a746da192bf1000785515d41a640be1.png)\n\n\n# 工作日\n\n- 每周工作日（周一到周五）\n\n固定在每周一至周五重复，适合规律性的工作任务。\n\n- 法定工作日\n\n为工作中的任务设置「法定工作日」重复，任务将避开周末和法定节假日，在法定工作日重复，确保你的工作安排永远精准。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/21c2aaf08f23855d815bd0dd4456e7ce.png)\n\n\n# 节假日\n\n- 每周末\n\n固定在每周六和周日重复，适合周末的休闲计划。\n\n- 法定节假日\n\n为休息日专用任务设置「法定节假日」重复，任务将遵循国家放假安排，在法定节假日重复，完美匹配你的放假节奏。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/3d9cd12b56e6ca3950f9b86dc878620f.png)\n\n\n\n# 农历重复\n\n适用于所有按中国传统农历计算的重要日子：\n\n- 农历每年（春节、中秋节、家人农历生日）\n\n- 农历每月（初一/十五祈福）\n\n如：每年庆祝中秋节，将日期设置为今年中秋 ， 然后设置「重复」-「农历重复」- 选择「农历每年」。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/a521d2f4bb56a5b40438a561608485aa.png)\n\n\n# 艾宾浩斯记忆法 \n“艾宾浩斯记忆法”是根据人类大脑的遗忘规律来记忆，在遗忘节点对于记忆内容进行复习巩固，来加深记忆。\n\n\n艾宾浩斯记忆法的重复周期按照 1，2，4，7，15，15，15，15，15，15，15，15…… 循环。\n> 简单来说即为“一二四七”，在学习的当天（一）、第二天（二）、第四天（四）、第七天（七）对所学知识进行复习巩固，在记忆上可事半功倍，达到长久记忆效果。\n\n如：背单词，点击「日期&重复」， 设置「重复」-选择「艾宾浩斯记忆法」\n\n![](/dida-assets/cdn.dida365.cn/hc/all/79b54c84b84d936f2eace03d5b8480bd.png)\n\n\n# 自定义重复\n\n若常见重复中没有你需要的重复周期，你还可以使用「自定义重复」，随心所欲设置你需要的重复周期。\n\n自定义重复，包括 3 种重复类型：到期重复、完成重复、自选日期重复。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/74e9e0f30eeb27458f89e869cc4423a2.png)\n\n\n\n\n##  到期重复\n\n到期重复是指到「设置的时间」就会提醒的重复。\n\n\n如：小明计划每周五 13:00 安排下周的工作\n* 在设定每周五 13：00 的到期重复后，滴答清单将在每周五 13:00 及时发送提醒。\n\n\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/7143161b2e66fe755dff4ecd93df8933.png)\n\n\n\n\n\n## 完成重复\n> 完成重复是指按上次任务完成的时间，再开始计算下次提醒时间，再次提醒的时间会跟随完成时间而变化。\n\n如：小明计划每三天健身一次\n* 当第一次健身是在周二时，第二次将会在周五（隔三天）进行提醒。\n* 但如果小明在周五有事耽搁了，直到周六才完成。那么下一次将会在周二（隔三天）进行提醒。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/997be9b1bfc3ad0f70b78aeab4e42db5.png)\n\n\n\n## 自选日期重复\n\n> 自选日期重复是指自由设置任务的重复时间，可以选择一天，也可以随意选择多天。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/d3bf77417981adf8b21a73bdda736a2c.png)\n\n\n\n# 常见问题 \n::: spoiler 如何结束重复？\n\n常见重复任务默认一直重复。你可通过设置「按日期结束重复」和「按次数结束重复」来自动结束任务的重复。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/1c8df857747b1031fac784307b94e2cd.png)\n\n\n- 按日期结束重复：设置一个重复的截止日期，此“日期”之后不再重复创建此任务。\n- 按次数结束重复：设置一个重复次数，到达“次数”以后不再重复创建此任务。\n:::\n\n\n::: spoiler 到期重复和完成重复有什么区别？\n\n假设你原本设置的任务日期是 1 号，每个月重复。但是这个任务拖延了，3 号才完成。\n\n* 设置到期重复，下个任务提醒时间就还是 1 号。\n* 设置完成重复，下个任务提醒时间将会是 3 号。\n:::\n\n::: spoiler 如何修改重复任务的单个周期？\n可以在日历视图页面，修改重复任务的日期和时间，然后选择弹窗中的「仅此周期」即可。\n:::\n::: spoiler 如何显示未来所有重复周期？\n在日历视图的「显示设置」中，开启「显示未来重复周期」即可。\n:::\n\n", "tags": [""], "hideIndex": true, "favs": 63, "order": 2748779069440, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T04:02:48.260Z", "modifiedTime": "2026-07-20T08:41:50.715Z", "postId": "6950660365923385344", "__v": 0, "parentId": "6950361599374786560", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "638d4bc7a078ed9016ad3b41", "author": "", "description": "", "title": "习惯数据统计", "content": "# 详情页的数据统计\n在习惯详情页的统计中，我们提供了「月度打卡表」和「打卡数据」，你可以随时查看自己的打卡情况。\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n在单个习惯页面中向上滑动就能够看到这个习惯整体的打卡数据。\n![--100%](/dida-assets/cdn.dida365.cn/hc/all/01b70380df1b976437d728b8f6876d37.gif)\n\n::::\n\n::::tab [desktop]\n点击当个习惯就能在右侧查看到习惯整体的打卡数据。\n\n![--58.83%](/dida-assets/cdn.dida365.cn/hc/all/705156aedbf8b669045edce67df3779d.png)\n::::\n\n:::::\n\n## 习惯年度热力图\n在打卡数据中点击「更多」，还能够进入到该习惯的年度热力统计页，方便你回顾这一年的完成情况。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/0b7fdbed441d429a76de6fd88fb0dd05.png)\n\n# 回顾习惯打卡情况\n点击习惯页面中的统计图标，就能够查看到所有习惯的打卡情况。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/5645b386ca6a82b7a32890c7801ed86a.png)\n\n## 周、月视图\n你可以快速查看这周的习惯打卡统计，高级会员还能够直接查看你这一整个月的习惯打卡进度。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/d5ff8be5087693c5f0c890b7ba50b6d3.png)\n\n::: spoiler 如何在电脑端查看周、月视图？\n目前仅支持手机端查看。\n\n:::\n\n## 记录回顾\n在记录中你可以更好的查看到每天习惯的完成情况，点击「>」还能够查看到具体完成的时间轴。\n如果你记录了打卡日志，在时间轴中也能展示出来。\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/1f78e2e1a9528358d2d0f5aa0db25573.png)\n", "tags": [""], "hideIndex": true, "favs": 19, "order": 2748779069440, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2022-12-05T01:39:19.483Z", "modifiedTime": "2026-10-09T04:04:12.066Z", "postId": "7005344825801179136", "__v": 0, "parentId": "6950361641582067712", "area": "help-center", "shortTitle": ""}, {"_id": "6682564f47c89fff9258f132", "author": "", "description": "", "title": "日程视图：以时间串联任务", "content": "滴答清单桌面端提供日程视图，你所有安排好时间的任务会显示在一个时间轴中以线性的方式展示，滚动鼠标滚轮即可轻松查看。\n\n在浏览日程视图中，你可以同时看到过去已完成的任务、当前的进度和未来的计划，有助于你追踪自己每天的时间线，及时调整计划，促进规划和安排。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/c03dbc33d6baaabc498bb3eaa8a5c04e.png)\n\n\n## 如何开启日程视图？\n\n点击日历右上角切换视图的选项，选择“日程视图”。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/527f07a761e980ed83e316983ffec6b4.png)\n\n", "tags": [""], "hideIndex": true, "favs": 4, "order": 2748779069440, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2024-07-01T07:10:07.300Z", "modifiedTime": "2026-05-06T10:35:34.056Z", "postId": "7213438708429619200", "__v": 0, "parentId": "6950361611617959936", "area": "help-center", "shortTitle": ""}, {"_id": "63eaedfd91756bb58846785c", "author": "", "description": "", "title": "常用专注", "content": "或许你也有这样的发现？\n\n在每天的专注时间中，往往是几个常用的任务，比如：\n\n👨🏻‍💻工作党们：工作，学语言，看书阅读\n\n🙇🏻‍♀️学生党们：写作业，背单词，公共课\n\n**「常用专注」** 能够帮助你更聚焦专注事情，简化操作。\n\n#  如何使用常用专注\n你可以将自己日常经常需要专注的事情添加至常用专注中，比如：学习语言，坚持锻炼等。\n\n在需要专注时，打开专注页面点击对应的事项一键快速开启。\n\n## 添加「常用专注」\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n进入专注功能页面，点击右上方「...」号，添加常用专注任务。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/c9b90cce0b56c056757a489454a4d288.png)\n\n\n这样你在需要专注时，按下开启键快速进入专注模式。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/294bb24a367facffb4dc557febe71f88.mp4\n:::\n\n\n> 点击屏幕你可以进入沉浸模式，向右滑动体验不同样式\n\n\n当然你也可以直接将一个任务或者习惯设为常用专注。\n\n操作路径：添加常用专注时，点击关联按钮选择任务或习惯。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/8a7aeeac167da5813ffa0497e1f0835e.png)\n\n::::\n\n::::tab [desktop]\n\n进入专注页面，点击右上方「+」号，添加常用专注任务。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/604514b9794533c0e0c45d51ae65ace6.png)\n\n在你需要专注时，按下开启键即可快速进入专注模式。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/a758b1b15720da34d2f9f7e52e81244d.png)\n\n\n当然你也可以直接将一个任务或者习惯设为常用专注。\n\n操作路径：添加常用专注时，点击关联按钮选择任务或习惯。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/165cc645980ab488b729ea8fa3179bfd.png)\n\n::::\n\n:::::\n\n\n\n## 选择不同的计时模式\n你还可以针对不同专注场景创建不同的计时模式。\n\n比如：需要开始进行一个45分钟的公开课程，或者想要记录一个10分钟睡前冥想。\n\n只要在添加时，选择**番茄计时**模式，以及对应的时长即可。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/c94e5e435eb2c50a1ca569fb5d0397ec.png)\n\n> 每完成一次专注正好就是完成这项的时间，帮助你节省了反复操作的时间。\n\n\n又或者想要开始一个不限时间的沉浸式阅读，这时你也可以选择**正计时**模式。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/3349083cd75d7571a23d7032c3fae29a.png)\n\n\n\n## 查看「专注数据」\n\n除了一键开始专注之外，你还可以在详情页中，查看到周、月、年的数据统计。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/9ae322c83111ac2ac4a1089dddb08c35.mp4\n:::\n\n\n> 如果需要补记专注时间，也可以在这个页面中直接点击「+添加记录」直接补记。\n::: spoiler 如何查看所有任务的专注时间分布情况？\n你可以在专注页面点击左上角数据图标，进入专注统计页面。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/283d567a9c33ac1ce7d05036dd83d65e.png)\n\n\n在专注统计页面，点击「按任务」就能够清晰的看到你所花费时间的饼状图。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/6a0b54faf08fde70c08c5846fac10060.png)\n\n:::\n\n\n## 返回专注界面\n想对临时的事情进行专注，点击底部的「底部专注栏」就可以打开原来的专注界面进行操作。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/e395bd80d4f39dd054e0ab373d30f8a6.mp4\n:::\n\n# 常见问题\n\n::: spoiler 如何绑定任务或习惯为常用专注？\n你可以在添加常用专注时，点击编辑栏关联按钮选择需要绑定的任务或习惯。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/8d0813f33f15c3436065d1759f9a74e5.png)\n\n\n你以前的坚持天数与总专注时长也会统计在常用专注中。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/a6cecff689e5ae3403f2938f4909987c.png)\n\n\n\n:::\n\n:::::: spoiler 如何编辑、归档或删除常用专注？\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入任意一个常用专注，点击右上角「…」，即可进行编辑、归档或删除操作。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/60630c42965df3dbe8ba884ea40dac75.png)\n\n::::\n\n::::tab [desktop]\n右键单击任意一个常用专注，即可进行编辑、添加记录，归档或删除操作。\n\n![--71.47%](/dida-assets/cdn.dida365.cn/hc/all/021fe5247d43b222211db2ee584a6bb8.png)\n\n::::\n\n:::::\n\n::::::\n\n", "tags": [""], "hideIndex": true, "favs": 442, "order": 3023656976384, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2023-02-14T02:12:13.561Z", "modifiedTime": "2026-08-13T09:29:35.584Z", "postId": "7031082644146225152", "__v": 0, "parentId": "6950361797429821440", "area": "help-center", "shortTitle": ""}, {"area": "help-center", "_id": "62c544b25084b6294bef6117", "author": "", "description": "", "title": "⏰ 习惯打卡 ", "content": "![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/e5fddd11efd212bd87ac89fca0e923f2.jpg)\n\n我们想要养成一些习惯，是因为它们能带来改变，让我们成长为更好的自己。\n\n但是养成习惯并不是一件容易的事情：\n* 我们总是很难开始一个习惯，因为拖延或者畏难的情绪。\n* 我们也很难坚持一个习惯，因为我们经常会陷入倦怠期。\n\n而根据《微习惯》一书中提到的方法，为了让这件事情变得简单且易操作，我们不妨真的把它设置的超级简单，简单到你完全无法找理由不做：\n- 如果你想养成“读书”的习惯，那么不妨设置为：“每天读2页书”\n- 如果你想养成“锻炼”的习惯，试试看：“每天做2个俯卧撑”\n- 如果你想养成“背单词”的习惯，那就：“每天背1页单词”\n\n我们也提供了灵活的打卡方式，以及数据回顾，帮助你更好地养成习惯。\n\n👉[ 开始坚持一个习惯](/articles/6950379455722291200)\n\n👉 [更好地完成习惯](/articles/6950379816176582656)\n\n👉 [回顾习惯的完成情况](/articles/7005344825801179136)\n\n", "tags": [""], "hideIndex": true, "favs": 82, "order": 3298534883328, "status": 0, "sectionId": "feature", "createdTime": "2022-07-06T08:15:46.828Z", "modifiedTime": "2026-09-27T06:10:11.345Z", "postId": "6950361641582067712", "__v": 0, "pinInSearch": false}, {"area": "help-center", "_id": "62c54ec75084b6294bef61ee", "author": "", "description": "", "title": "⌨️ 桌面快捷键", "content": "![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/dad6858b11bad3a7830e5d1d8fd4e664.jpg)\n\n使用快捷键和指令菜单来实现应用内操作，无需鼠标，效率更高。\n# 指令菜单\n使用 ⌘+K 或者 Ctrl+K 打开「指令菜单」，输入名称，轻松前往应用内各大功能模块。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/1ec7268334184ae886098139a67732a2.gif)\n\n> Mac 应用程序暂时不支持此功能。\n\n# 快捷键\n用且只用键盘上的某个按键或者多个按键的组合完成某一项操作，节省时间，解放鼠标。\n\n你可以输入「?」，方便的查看快捷键列表。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/93f4e156764e54f42ad08713c4cb29a9.png)\n\n\n# 常见问题\n\n::: spoiler 如何修改快捷键？\n- 在设置里查看快捷键界面，可以修改。\n- 在侧边栏打开快捷键界面，可以修改。\n- 在「指令菜单」-「帮助」-「显示键盘快捷键」打开快捷键界面，可以修改。\n> 显示为灰色的快捷键不能修改。\n:::\n\n\n\n", "tags": [""], "hideIndex": true, "favs": 23, "order": 3298534883328, "status": 0, "sectionId": "special", "createdTime": "2022-07-06T08:58:47.854Z", "modifiedTime": "2026-04-16T06:01:06.497Z", "postId": "6950372467189743616", "__v": 0, "pinInSearch": false}, {"_id": "62c570271e3a8b2ac64c80c8", "author": "", "description": "", "title": "专注数据统计", "content": "\n\n对运动员和职业游戏玩家们来说，复盘几乎和一日三餐一样重要，没有对事件的追踪和记录，你就永远不知道自己错在哪里，永远无法有效率地改进。\n\n因此，在不断刷新番茄记录的同时，也别忘了定期评估自己的历史完成情况，思考下一次是否可以做到。\n\n滴答清单的专注统计中可以看到自己每天的专注时间段以及分布，方便你查看时间分布和及时复盘。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/240f5c130ab58355aa903724f1dd6b85.png)\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/84750cfec802fb28c9329d4d91d2463c.png)\n\n# 专注趋势图\n可以按照年、月、周，查看专注趋势。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/f79365d3841fd3bd498868e8b83cbb21.png)\n\n\n# 专注时间线\n每天的专注时间段以及专注时间长分布一目了然。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/aaa5d6923a62c9bac5ad837daa6d0c63.png)\n\n# 最佳专注时间\n按月统计你的最佳专注时间区域。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/239c1e80340a8488aa2847e736b3debb.png)\n\n# 年度热力图\n总览你一年的专注情况，色块深浅代表每天专注时间的长短。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/785a7ce910ab7fe84eb71e298caad163.png)\n\n\n# 查看统计数据\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n在专注页面，点击左上角「统计图标」，可进入统计页面。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/208f55708ad7cf54df72d61217af5dab.png)\n\n\n在专注统计页面中，你可以查看并管理自己的专注记录。\n\n- 补记专注记录\n\n找到专注记录点击右边「+」，即可补记专注记录。\n\n你也可以点击进入「专注记录」页面，点击左下角的「+」来添加记录。\n\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/8e16f404cd6daa0f1d9c2cc5aadd0c34.png)\n\n- 筛选专注记录\n\n在专注记录页面，你可以点击顶部的日期、时长、关联状态选项，来筛选对应条件的专注记录。\n\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/592e7ec269ec93b17725911a887cfea3.png)\n\n- 删除专注记录\n\n如果要删除某一条专注记录，你可以点击进入这条专注记录，点击底部「删除记录」即可。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/47ae483dc435474004ee28d7a9fb2879.png)\n\n\n- 批量编辑&清空\n\n在专注记录页面点击右上角「...」，可选择「批量编辑」或「清空所有」，快速进行大规模管理。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/4f247eebaec4a2b03732e3c0600e5478.png)\n\n- 查看时间花销\n\n在专注详情区域顶部，可通过切换「日」、「周」、「月」或「自定义」时间段，查看对应的专注数据。在下方的专注排行右侧，你还可以选择按清单、标签或任务查看专注分布，帮助你更好地了解时间投入方向。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/148b7bfcd87525ae832b4dbb05aff864.png)\n::::\n\n::::tab [desktop]\n\n在专注钟页面右侧可查看部分专注统计数据。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/6337d96a88a40fd1cb2e5cde120fc728.png)\n\n在专注钟页面右侧，点击专注记录右侧的+号，即可补记专注记录。\n\n![l--71.41%](/dida-assets/cdn.dida365.cn/hc/all/7cf936368d2ba3dd3b399021965be46f.png)\n\n要查看更多专注统计数据，可以点击头像 - 「统计」，或者点击专注钟页面右上角「...」-「统计」，跳转到网页后，切换至「专注」页面，即可分别按日和按周进行番茄数和专注时长的统计。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/6101ffe03ad42e203c2a480dfcd82268.png)\n\n![l--71.41%](/dida-assets/cdn.dida365.cn/hc/all/b603fe50bea9ed79a1217844d5998bbf.png)\n\n::::\n:::::\n\n\n# 常见问题\n\n::::::: spoiler 如何补计专注记录？\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n- 在番茄专注模块，找到右上角「...」-「添加专注记录」即可快速添加记录。\n\n- 你也可以在专注统计页面，找到专注记录点击右边「+」补记专注记录。\n\n- 你还可以在「专注记录」页面，点击左下角的「+」来添加记录。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/3ac07521a1e7aa61908a91974179670f.png)\n\n::::\n\n::::tab [desktop]\n点击专注页面，你可以在专注记录点击右边「+」补记专注记录。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/f06889e72850dd0c02c55fe2182966a0.png)\n\n::::\n\n::::::: \n\n\n::::::: spoiler 如何删除专注记录？\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n在「专注统计」中进入「专注记录」，进入需要删除的记录，点击最下角 删除记录，即可删除。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/47ae483dc435474004ee28d7a9fb2879.png)\n\n\n\n::::\n\n::::tab [desktop]\n在专注页面点击专注记录中相应的专注任务进入到详情页面，再点击右下角删除按钮，即可删除专注记录。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/c293d912047aa61336b0a9d1fbc14f32.png)\n\n::::\n\n::::::: \n\n\n::: spoiler 如何在日历中显示专注记录？\n在「日历」选择「显示设置」，点击打开「显示专注记录」，就可以在日历视图中同步自己的专注时间块。\n::::\n", "tags": [""], "hideIndex": true, "favs": 25, "order": 3298534883328, "status": 0, "sectionId": "feature", "createdTime": "2022-07-06T11:21:11.155Z", "modifiedTime": "2026-08-04T13:28:59.670Z", "postId": "6950408300395495424", "__v": 0, "parentId": "6950361797429821440", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "62c64f611e3a8b2ac64c8217", "author": "", "description": "", "title": "日历显示设置", "content": "# 农历和节假日\n今年春节是几月几号？国庆节前后哪几天上班？\n\n滴答清单支持显示「农历」和「节假日调休」，帮助你便捷的安排好身边大小事。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n在「设置」-「日期与时间」里开启「显示农历」和「显示节假日调休」即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/b5c17767ced1f5b5019b2f34d5eb4424.png)\n\n\n::::\n\n::::tab [desktop]\n点击头像-「设置」-「日期与时间」里开启「显示农历」和「显示节假日调休」即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/c8cd4161410c863578410513ae77a33d.png)\n\n![](/dida-assets/cdn.dida365.cn/hc/all/2a7a687931289ab20250142feb95253b.png)\n\n::::\n\n:::::\n\n# 颜色\n\n日历中只有一个颜色，不仅显得单调，也不好区分不同的任务、习惯与纪念日。你可以为任务、习惯和纪念日设置不同的显示颜色，一眼区分各类内容。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击日历右上角「**···**」-「**显示设置**」-「**颜色**」，即可设置任务、习惯和纪念日的颜色显示方式和显示颜色。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/6d0b26bc36dc0acd8ceb27e6fad6060a.png)\n\n::::\n\n::::tab [desktop]\n点击日历右上角「**···**」-「**显示设置**」-「**颜色**」，即可设置任务、习惯和纪念日的颜色显示方式和显示颜色。\n\n![--65.64%](/dida-assets/cdn.dida365.cn/hc/all/64dbe58fcc42f98a379b34cb2714e8d6.png)\n::::\n\n:::::\n\n## 任务颜色\n\n任务支持选择「**按清单**」、「**按标签**」、「**按优先级**」显示颜色。选择「按清单」或「按标签」时，可在下方直接自定义清单/标签的颜色，「按优先级」则使用固定优先级颜色。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/01ddbabe9e138bbc5d6f48336975d603.png)\n\n\n## 习惯&纪念日颜色\n\n习惯与纪念日可选择**固定颜色**显示（所有习惯/纪念日使用同一个颜色），或为每个习惯/纪念日**单独设置颜色**，两种方式均可在下方自由选择颜色。\n\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/10296f7b7256ca7968e5a648ccdf89a2.png)\n\n\n# 筛选清单\n清单太多，显示在日历里的任务也太多，怎么找到自己想看的那个任务呢？筛选一下清单吧。\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击日历视图右上方「···」-「显示范围」对显示的清单进行筛选。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/af9e5157c10bfb452c358fe045ca685e.png)\n\n::::\n\n::::tab [desktop]\n点击日历视图左上角图标，对显示的清单进行筛选。\n\n![--66.89%](/dida-assets/cdn.dida365.cn/hc/all/46d1e48040673a83f43c0d77cad9024b.png)\n::::\n:::::\n\n# 样式\n\n想要日历的界面风格更符合你的个人品味？你可以点击日历右上角「**...**」-「**显示设置**」，找到「**样式**」，按喜好选择「**现代**」或「**经典**」样式。\n\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/6749f80d8f89d8b5b6a0fcb230944c6e.png)\n\n\n此外，你还可以在样式中设置「**显示类型图标**」，自由控制是否显示任务、订阅日历、习惯、倒数纪念日等内容的类型图标。\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/769531ca5710f90dbf748aed43dabdbf.png)\n\n\n::::\n\n::::tab [desktop]\n\n![--78.22%](/dida-assets/cdn.dida365.cn/hc/all/c5e2ac79dc9510a70f26610a994a0da6.png)\n\n桌面端隐藏类型图标后，你还可以通过按住 **Alt** 键或 **Option** 键来显示类型图标，方便你快速区分内容类型、快速点击完成任务。\n\n::::\n\n:::::\n\n\n# 辅助时区\n生活中有跨国工作、旅行等场景，需要同时协调多个时区的日程安排，如何让不同时区的时间对照更加直观呢？启用“辅助时区”吧！\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击日历右上角「...」-「显示设置」，找到「辅助时区」并启用。启用后，日历视图的时间轴可以显示多个时区。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/afa01f0af2da4ef354266583a3ef5e83.png)\n\n点击「添加时区」，可以自由选择添加你需要的时区，并为不同的时区设置图标与备注。长按并拖动，可以对你添加的时区进行排序。\n::::\n\n::::tab [desktop]\n点击日历右上角「...」-「显示设置」，找到「辅助时区」并启用。启用后，日历视图的时间轴可以显示多个时区。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/114b6bb63c6f684799405432629b2435.png)\n\n\n点击「辅助时区」下方「时区设置」，可以自由选择添加你需要的时区，并为不同的时区设置图标与备注。\n::::\n\n:::::\n\n提示：多时时区的上限为五个，包含一个当前时区和四个可配置时区。\n\n# 批量操作\n为了帮助你更高效地管理任务安排，现已支持在日历视图中进行批量操作。\n\n操作方式：\n按住 Ctrl（Windows）或 Command（Mac），使用鼠标点选或框选多个任务进行批量操作，包括右键批量完成、删除任务等，以及拖动批量修改任务时间。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/b312c221646caf7f795744e7d3dbfd24.mp4\n:::\n\n该功能适用于临时调整项目计划、周计划优化、清理过期任务等场景，让任务管理更高效、操作更顺畅。\n> Windows & web 已上线，macOS 正在开发中。\n\n# 推迟功能\n新增了「推迟」功能，让你可以批量选择任务，一键将所有任务时间延后1小时，帮你轻松调整被打乱的计划。\n\n操作方式：\n在任务列表或者日历中批量选择任务后，点击“推迟”按钮将被选中的任务的时间进行批量延后。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/a77aed41693d243e153a8984eb593593.mp4\n:::\n\n\n\n无论是临时会议、交通堵塞，还是意外插入的新安排，都能快速应对，保持任务清单井然有序。\n> Windows & web 已上线，macOS 正在开发中。\n# 其他显示选项\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n你可以在日历视图的右上角「···」-「显示设置」中来设置。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/d76ded1e822cc856307977a1a4ffd052.png)\n\n\n- 点击「显示详细」，可以在日历中显示任务的详细属性如时间、所属清单等。\n- 点击「显示已完成」，可以在日历中显示已完成的任务、打卡和订阅的日历事件。\n- 点击「显示检查事项」，可以在日历中显示任务中设置的检查事项。\n- 点击「显示所有重复周期」，设置重复的任务会在日历中按重复周期进行重复显示。\n- 点击「显示打卡」，可以在日历的任务栏里显示打卡。\n- 点击「显示专注记录」，可以在日历中显示专注记录。\n::::\n\n::::tab [desktop]\n\n你可以点击日历视图右上角「···」- 在「显示设置」中进行设置。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/c0c51a6a5239975133c948d41ebbf908.png)\n\n\n- 点击「显示已完成」，可以在日历中显示已完成的任务、打卡和订阅的日历事件。\n- 点击「显示检查事项」，可以在日历中显示任务中设置的检查事项。\n- 点击「显示所有重复周期」，设置重复的任务会在日历中按重复周期进行重复显示。\n- 点击「显示习惯」，可以在日历的任务栏里显示习惯打卡。\n- 点击「显示专注记录」，可以在日历中显示专注记录。\n- 点击「显示倒数纪念日」，可以在日历中显示添加倒数纪念日。\n- 点击「显示课程」，可以在日历中显示课程表。\n::::\n:::::\n\n\n", "tags": [""], "hideIndex": true, "favs": 14, "order": 3298534883328, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T03:13:37.358Z", "modifiedTime": "2026-06-12T09:27:52.887Z", "postId": "6950647988939128832", "__v": 0, "parentId": "6950361611617959936", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "66308f3347c89fff9258e216", "author": "", "description": "", "title": "企业微信、钉钉、飞书等日历", "content": "当你想在滴答清单中查看企业微信、钉钉、飞书、QQ邮箱等日历，你可以通过 CalDav 的方式，轻松实现。\n\n# 企业微信日历\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n**添加日历**\n\n在「设置」-「导入与关联应用」-「日历」，选择 CalDav ，输入企业微信日历的「服务器地址」、「用户名」、「密码」，即可完成同步。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/964fac800b27191fe7098d394eccaeeb.png)\n::::\n\n::::tab [desktop]\n**添加日历**\n\n点击「头像」-「设置」-「关联与导入」-「企业微信日历」，通过 CalDav 方式订阅企业微信日历到滴答清单中显示 ，输入「用户名」、「密码」、「服务器地址」，即可完成同步。\n\n![--75.32%](/dida-assets/cdn.dida365.cn/hc/all/8bffb3981c0f6fe4fbf477c8a3df7d69.png)\n![--75.32%](/dida-assets/cdn.dida365.cn/hc/all/0db81516873470242c79263f88b75ab8.png)\n\n::::\n\n:::::\n\n\n\n**获取账号密码**\n\n在企业微信中，点击「头像」-「设置」-「日程」-「同步至其他日历」\n\n![--66.22%](/dida-assets/cdn.dida365.cn/hc/all/c6b4ecfa81890be710ac38258950b65e.png)\n\n![--66.19%](/dida-assets/cdn.dida365.cn/hc/all/641d660dd0ec24589a79bd7e0b4d7f9b.png)\n\n\n\n![--66.19%](/dida-assets/cdn.dida365.cn/hc/all/e37c792870444bcf3d2ccb58e839e6b1.png)\n\n\n分别将“帐号/用户名、密码、服务器地址”填写到滴答清单 CalDAV 订阅中即可成功订阅。（需要将获取的服务器地址修改为“caldav.wecom.work”）\n\n> 移动端：在企业微信中，点击「日程应用」-「日程设置」-「同步至其他日历」。\n\n\n\n# 钉钉日历\n\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n**添加日历**\n\n在「设置」-「导入与关联应用」-「日历」，选择 CalDav ，输入钉钉日历的「服务器地址」、「用户名」、「密码」，即可完成同步。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/964fac800b27191fe7098d394eccaeeb.png)\n::::\n\n::::tab [desktop]\n**添加日历**\n\n点击「头像」-「设置」-「关联与导入」-「钉钉日历」，通过 CalDav 方式订阅钉钉日历到滴答清单中显示 ，输入「用户名」、「密码」、「服务器地址」，即可完成同步。\n\n![--75.32%](/dida-assets/cdn.dida365.cn/hc/all/3ffdf0ed41593eef0642a1579953a5b3.png)\n![--75.32%](/dida-assets/cdn.dida365.cn/hc/all/ead54e70a199ef10400adae6a1d0876b.png)\n\n\n\n::::\n\n:::::\n\n\n**获取账号密码**\n\n在「日历」-「日历设置」-「同步」中，找到 CalDav 同步，点击「进入配置」。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/a6e29874496c8988d83b08182c4f99f1.png)\n\n\n你可以选择你需要同步到的设备，如“Mac、windows、Android、iPhone、 iPad、other”。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/7c523f07a9ff1b608b0023fa20f58e21.png)\n\n选择好设备后，点击「生成」该设备的「专用密码」，将密码填写到滴答清单「CalDav」中，即可完成对钉钉日历的同步。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/59ac40ccd167ee376b4311aedf9174e3.png)\n\n\n# 飞书日历\n\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n\n**添加日历**\n\n在「设置」-「导入与关联应用」-「日历」，选择 CalDav ，输入飞书日历的「服务器地址」、「用户名」、「密码」，即可完成同步。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/964fac800b27191fe7098d394eccaeeb.png)\n::::\n\n::::tab [desktop]\n**添加日历**\n\n点击「头像」-「设置」-「关联与导入」-「飞书日历」，通过 CalDav 方式订阅飞书日历到滴答清单中显示 ，输入「用户名」、「密码」、「服务器地址」，即可完成同步。\n\n\n![--75.32%](/dida-assets/cdn.dida365.cn/hc/all/4e2b414c5275be192c0bb008f84c4512.png)\n\n\n![--75.32%](/dida-assets/cdn.dida365.cn/hc/all/c286ac1c71962231bba2a2c552cd69a2.png)\n\n::::\n\n:::::\n\n**获取账号密码**\n\n在飞书中，点击「头像」-「设置」-「日历」，找到「CalDav 同步」，点击「进入设置」。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/8137beb3d8de9eb784428b16912deaed.png)\n\n\n你可以选择你需要同步到的设备，如“iPhone、 iPad、Mac、安卓手机、windows电脑、其他设备”。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/c3495a63734fbf44b608234be4758d20.png)\n\n选择好设备后，点击「生成」该设备的「专用密码」，将密码填写到滴答清单「CalDav 」中，即可完成对飞书日历的同步。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/958c8a2fd4c0bc28877898d501e1cebe.png)\n\n# QQ邮箱日历\n\n\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n**添加日历**\n\n在「设置」-「导入与关联应用」-「日历」，选择 CalDav ，输入飞书的「服务器地址」、「用户名」、「密码」，即可完成同步。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/964fac800b27191fe7098d394eccaeeb.png)\n::::\n\n::::tab [desktop]\n点击「头像」-「设置」-「关联与导入」，选择 CalDav ，输入飞书的「服务器地址」、「用户名」、「密码」，即可完成同步。\n\n![--75.32%](/dida-assets/cdn.dida365.cn/hc/all/c118f2015aa161b963ef4b1bbebd21a4.png)\n\n![--81.73%](/dida-assets/cdn.dida365.cn/hc/all/4654ca3d27e780b06235ab5ec0025715.png)\n::::\n\n:::::\n\n**获取账号密码**\n\n\n在「设置」-「账户」-「POP3/IMAP/SMTP/Exchange/CardDAV/CalDAV服务」，开启 CalDav 服务，生成授权码并保存。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/5ceb133a99826dff0ce477915151acfa.png)\n\n>QQ邮箱日历服务器地址：dav.qq.com", "tags": [""], "hideIndex": true, "favs": 3, "order": 3298534883328, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2024-04-30T06:26:59.522Z", "modifiedTime": "2026-05-08T06:49:00.188Z", "postId": "7190959806838996992", "__v": 0, "parentId": "6949998599191134208", "area": "help-center", "shortTitle": ""}, {"_id": "67d245f447c89fff925912e7", "author": "", "description": "", "title": "双重验证", "content": "滴答清单支持双重验证，登录时需要进行额外验证，为你的账户增添额外安全防护。\n\n# 开启双重验证\n:::::tabContainer [mobile|Web]\n\n::::tab [mobile]\n进入 **「设置」-「头像」-「账户信息」** 点击 **「双重验证」**。\n\n点击开启双重验证，需进行安全验证你的身份，验证成功后可添加你想要的双重验证方式。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/f3e8bdc06b3c64fa75111e8e4163fa0c.png)\n\n\n\n\n你可以选择你需要添加的双重验证方式： **「邮箱验证码」、「手机短信验证码」或「身份验证器」**  。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/68eba307d0a07e21e68a0c3b3834573a.png)\n\n\n\n::::\n\n::::tab [Web]\n进入 **「头像」-「设置」-「账户与安全」**，开启 **双重验证**。（Mac、Windows 用户需前往网页端开启）\n\n![](/dida-assets/cdn.dida365.cn/hc/all/249699cdb8d3409b75339fa76de136c5.png)\n\n![](/dida-assets/cdn.dida365.cn/hc/all/09f35ea81fc412de28198f3653a5a351.png)\n\n开启双重验证后，登录时需要进行额外验证，可以提升账号安全性。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/dd47f66449395ba273a3698954be5b3e.png)\n\n你可以选择 **「邮箱验证码」、手机短信验证码」或「身份验证器」** 进行验证，输入验证码并点击添加，即可完成设置。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/e88fc0ecbc4d41e1ea1c4a549baf4353.png)\n\n![](/dida-assets/cdn.dida365.cn/hc/all/3358c88f889527ddd20051d61151315d.png)\n\n\n:::::\n\n\n## 邮箱验证\n1. 选择**邮箱验证码**。\n2. 输入**邮箱地址**，发送**验证码**。\n3. 输入6位验证码，完成邮箱验证。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/128cccbb4d4ceeba7115d872b27f4a3c.png)\n\n\n## 手机短信验证\n1. 选择**手机短信验证码**。\n2. 输入**手机号**，发送**验证码**。\n3. 输入6位验证码，完成手机短信验证。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/208e0502b58559ce8340386a31ab7197.png)\n\n\n\n\n## 身份验证器\n1. 在移动设备上安装**身份验证器应用**（如 Google 或 Microsoft等）。\n2. 打开应用，**扫描二维码/输入代码**进行绑定。\n3. 输入应用中显示的**验证码**，完成验证。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/8727352f97e6d44bbf8376442435d996.png)\n\n\n\n## 备用码\n请务必下载并保存“备用码”，当以上验证方式无法登录时，可以通过备用码进行快捷验证。\n\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/f7d617a1b4a02007f48dcb85bcedb2d9.png)\n\n\n# 使用双重验证\n开启双重验证后，你在进行以下操作时会被要求验证身份：\n- 登录账号\n- 绑定账号\n- 修改绑定账号\n- 删除账号\n\n\n\n\n# 关闭双重验证\n:::::tabContainer [mobile|Web]\n\n::::tab [mobile]\n进入 **「账户信息」-「双重验证」**，点击 **「停用双重验证」-「停用」**，验证身份后验即可停用。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/8edd47d5048304388b2d5f5cb0f501d9.png)\n\n\n::::\n\n::::tab [Web]\n进入 **「头像」-「设置」-「账户与安全」-「双重验证」**，选择 **「停用双重验证」**，通过验证后即可完成停用。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/625b5d079def030eb410b397d77e9659.png)\n\n::::\n\n:::::\n\n# 常见问题\n::: spoiler Mac 端用户如何开启双重验证？\n目前 Mac 端暂未开放入口，需要先在 Web 端开启。\n:::\n::: spoiler Windows 端用户如何开启双重验证？\n目前 Windows 端暂未开放入口，需要先在 Web 端开启。\n:::\n::: spoiler 收不到双重验证验证码，无法登录怎么办？\n\n如果您手机收不到验证码，也没有备用码登录账号，请使用该账户绑定的邮箱，发送邮件至 support@dida365.com。\n\n我们会在核实信息后协助您处理。\n\n为确保账户安全，我们需要确认您是该账户的合法持有人。\n \n请在邮件中提供以下信息：\n- 您是否曾订阅过高级会员；\n- 若已订阅，请附上 **付款截图**（例如来自 App Store、支付宝 或 微信 的订单记录）。\n我们将在核实后尽快为您处理。\n \n如果你的账号**未绑定邮箱**，请在邮件中提供尽可能多的账户信息，例如：\n-  注册手机号\n-  账号昵称/用户名\n-  最近一次成功登录的设备信息\n-  曾订阅过的高级会员付款凭证（如有）\n \n我们会在核实身份后协助你恢复账号或重置验证方式。\n> ⚠️ 为确保账户安全，务必提供真实有效的账号信息，否则可能无法处理请求。\n \n:::\n", "tags": [""], "hideIndex": true, "favs": 4, "order": 3298534883328, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2025-03-13T02:41:56.704Z", "modifiedTime": "2026-08-04T06:05:53.379Z", "postId": "7305780125377757184", "__v": 0, "parentId": "6950657111692935168", "area": "help-center", "shortTitle": ""}, {"_id": "6a156d5192c58e2739c3b194", "author": "", "description": "", "title": "DIDA CLI", "content": "安装 DIDA CLI，在终端中管理你的任务和项目，也可供 AI Agent 调用。\n\n# 快速开始\n## 安装\n需要先安装 Node.js（建议 LTS 版本）。\n\n```\n# 安装\nnpm install -g @suibiji/dida-cli\n\n# 验证安装成功\ndida --help\ndida --version\n```\n\n::: spoiler 如何在 OpenClaw、QClaw 等 AI Agent 中安装？\n在 AI Agent 中，两步即可完成配置：\n\n1.  **安装**\n\n你可以直接在对话框中输入：\n> 帮我安装 dida-cli：https://www.npmjs.com/package/@suibiji/dida-cli\n\n\n2.  **授权**\n\n安装成功后，在对话框中输入\n> 授权登录\n\n跟随引导完成授权登录后，即可通过 AI Agent 管理滴答清单中的任务和项目。\n:::\n\n\n\n\n## 登录认证\n\n推荐通过浏览器 OAuth 登录。\n\n```\n# 浏览器 OAuth 授权登录（推荐）\ndida auth login\n\n# 确认登录状态\ndida auth status\n\n# 清除本地 token\ndida auth logout\n```\n\n如果无法打开浏览器，可获取 Token 并手动配置：\n\n```\n# 直接写入 access token\ndida auth token \u003cYOUR_TOKEN_HERE>\n\n# 确认登录状态\ndida auth status\n\n# 清除本地 token\ndida auth logout\n```\n\n::: spoiler Token 如何获取？\n前往网页版滴答清单，点击「头像」- 「设置」 -「账户与安全」 - 「API 口令」中创建并复制使用。\n:::\n\n# 常用命令\n更多命令说明请参考 [npm 包文档](https://www.npmjs.com/package/@suibiji/dida-cli)。\n\n```\ndida project list                                       # 查看所有清单\ndida task create --title \"任务名称\" --project \u003c清单 ID>   # 创建任务\ndida task complete \u003c清单 ID> \u003c任务 ID>                   # 完成任务\ndida task delete \u003c清单 ID> \u003c任务 ID>                     # 删除任务\n```\n\n# 常见问题\n\n::: spoiler 安装成功但命令无法运行？\nnpm 全局安装目录可能未加入 PATH。可运行` npm bin -g` 查看路径，并将其添加到 `.zshrc` 或 `.bashrc`。\n:::\n\n::: spoiler 是否支持所有滴答清单中的功能？\n目前主要支持任务、清单、习惯、专注记录以及纪念日的基础操作，其他高级功能暂未支持。\n:::", "tags": [""], "hideIndex": true, "favs": 11, "order": 3298534883328, "status": 0, "pinInSearch": false, "sectionId": "feature", "area": "help-center", "createdTime": "2026-05-26T09:52:17.529Z", "modifiedTime": "2026-10-01T14:38:41.452Z", "postId": "7464976698707017728", "__v": 0, "shortTitle": "", "parentId": "7444671678778441728"}, {"_id": "680dfafb1c42a13a390ba095", "author": "", "description": "", "title": "⏳ 倒数纪念日", "content": "在快节奏的生活里，总有一些特别的日子，不想被遗忘，也不愿匆匆应对。滴答清单的「**倒数纪念日**」功能，陪你用心记录每一个重要日子。\n\n🎂 **纪念日**，记住那些值得庆祝的时刻：恋爱、结婚、生日、第一次带宠物回家的那天…… 每一年的这一天，是属于你们的庆祝日。滴答清单会准时提醒，陪你一起迎接这些重要时刻。\n\n⏳ **倒数日**，为每一个期待的瞬间倒数：旅行、考试、演出、目标达成…… 每天看着天数一点点减少，是坚持的动力，也是期待的暖意。滴答清单陪你一起规划好每一步，让准备更从容。\n\n📌 适合这些场景：\n\n- 不想错过重要日子的人\n\n- 喜欢提前安排和准备惊喜的人\n\n- 需要一个倒数激励目标的人\n\n- 想让生活多点仪式感的人\n\n这些日子也许不是最紧急的，但往往是最暖心的。纪念日记录过往，倒数日期待未来。一个帮你记得爱，一个帮你坚持梦想，现在就去添加你的重要日子吧！\n\n👉 [添加倒数纪念日](/dida-help/articles/7321447466803396608)\n\n👉 [打造专属纪念页](/dida-help/articles/7322503597483098112)\n\n👉 [管理倒数纪念日](/dida-help/articles/7322147514604322816)\n", "tags": [""], "hideIndex": true, "favs": 9, "order": 3573412790272, "status": 0, "pinInSearch": false, "sectionId": "feature", "area": "help-center", "createdTime": "2025-04-27T09:38:03.799Z", "modifiedTime": "2026-09-27T02:56:35.046Z", "postId": "7322192298849075200", "__v": 0, "shortTitle": "", "parentId": null}, {"area": "help-center", "_id": "62c650291e3a8b2ac64c8242", "author": "", "description": "", "title": "🤝 共享与协作", "content": "无论是与同事们协作完成某个工作项目，还是和家人朋友一起制定周末出游计划，你们都能使用共享清单进行同步与讨论。以下所有操作需要基于「 共享清单 」完成。\n\n\n**「共享协作的适用场景有哪些？」**\n\n这里安利几个常见的应用场景，供大家参考：\n- 「工作项目」—— 将共享清单中的任务可以指派给各负责人，跟进清单或任务动态，实时了解任务完成的程度。 \n- 「露营计划」—— 决定好露营地点之后，不是立马出发，而是需要列好露营计划清单，将清单共享给三两好友，分配好各自的任务，来保证露营无忧。\n\n👉[如何共享清单](/articles/6950649257581871104)\n\n\n👉[团队如何协作](/articles/6950652002518958080)", "tags": [""], "hideIndex": true, "favs": 19, "order": 3848290697216, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T03:16:57.211Z", "modifiedTime": "2026-09-30T02:00:38.968Z", "postId": "6950648827183366144", "__v": 0, "parentId": null, "pinInSearch": false}, {"_id": "6736ac4347c89fff925901b4", "author": "", "description": "", "title": "关联 Notion", "content": "\n滴答清单现已支持与 Notion 双向同步，开启高效管理新体验！\n\n![--72.41%](/dida-assets/cdn.dida365.cn/hc/all/5d1725e7718e3496e4b63a0b81986b4a.png)\n\n**轻松查看，高效提醒**\n\n你可以轻松将 Notion 数据库的内容同步到滴答清单，轻松在列表、日历中查看，设置提醒，不再错过任何关键节点。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/cb9bd7f65707300158b6f6051fda9911.png)\n\n\n\n**随心编辑，自动更新**\n\n同时在滴答清单中对这些内容的修改也会自动同步到 Notion，及时更新任务最新进展，提升任务管理效率。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/7e2a53e03acc78185b394da3fd673fc4.mp4\n:::\n\n\n\n# 添加关联\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入「设置」-「导入与关联」-「Notion」，点击「添加关联」。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/ca6094cc754dae7e1042ae3b52e6d611.png)\n\n::::\n\n::::tab [desktop]\n点击头像，进入「设置」，找到「导入与关联应用」-「Notion」，然后点击 「添加关联」。\n\n![--66.19%](/dida-assets/cdn.dida365.cn/hc/all/e8f64ca91fba031264bd49f8aeceb043.png)\n\n![--73.72%](/dida-assets/cdn.dida365.cn/hc/all/423e0ca4e6c02743602e733c967e5f37.png)\n\n\n::::\n\n:::::\n\n\n\n\n\n# 登录&授权\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n登录 Notion 账号，点击「下一步」授权滴答清单权限，你可以选择想要的关联方式。\n\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/7b7af7d16a2ccbcfbff0ede8d9e7b0ac.png)\n\n::::\n\n::::tab [desktop]\n登录 Notion 账号，点击「下一步」授权滴答清单权限，你可以选择想要的关联方式。\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/64c90954e3de23ba8229ef567ac44830.png)\n![](/dida-assets/cdn.dida365.cn/hc/all/643df4b571f9d748013d0a29c90d6ef2.png)\n\n\n::::\n\n:::::\n\n- 方式1：选择“使用开发人员提供的模板”后，会新建一个 Notion 数据库，属性自动关联，同步更省心。\n- 方式2：选择“与滴答清单共享页面”后，你可以选择已有的 Notion 数据库，支持自定义数据库属性的同步效果，操作更灵活。\n\n\n# 方式1 使用开发人员提供的模板\n\n\n## 步骤1 选择清单\n\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n选择方式1 使用开发人员提供的模板，你只需在「选择清单页」选择你想要与 Notion 关联的“清单”，点击关联即可关联成功。\n![](/dida-assets/cdn.dida365.cn/hc/all/f2bb9e897b7540cc003908817227ed00.png)\n\n\n![](/dida-assets/cdn.dida365.cn/hc/all/be03a749aaf0fc63d15e3a44c6de56c9.png)\n\n\n::::\n\n::::tab [desktop]\n选择方式1 使用开发人员提供的模板，你只需在「选择清单页」选择你想要与 Notion 关联的“清单”，点击关联即可关联成功。\n\n![--85.19%](/dida-assets/cdn.dida365.cn/hc/all/643df4b571f9d748013d0a29c90d6ef2.png)\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/79987caf1398143f428e17c6d2eb5324.png)\n![l](/dida-assets/cdn.dida365.cn/hc/all/7ba86b06fd8f641ae3a263cd227391b5.png)\n![l](/dida-assets/cdn.dida365.cn/hc/all/7937beae159cb50f2c2c8709d98ca885.png)\n\n::::\n\n:::::\n\n\n\n## 步骤2 关联成功\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n关联成功后， 在 Notion 工作区的私人分组中，将新建一个滴答清单提供的模板页面，清单中的内容将与此数据库实现双向同步：\n\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/1fcd65b8c6be60526e10fa2751bf6d28.png)\n\n::::\n\n::::tab [desktop]\n关联成功后， 在 Notion 工作区的私人分组中，将新建一个滴答清单提供的模板页面，清单中的内容将与此数据库实现双向同步：\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/d2260818700c3a9171658595a5b27092.png)\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/888f73133634509ab038772f358636f3.png)\n\n\n\n::::\n\n:::::\n\n\n- 在数据库中“+新页面”，滴答清单也将自动添加任务。\n- 数据库中“复选框”、“名称”、“日期”和“描述”属性值将对应显示在任务上。（后续你还可以在滴答清单关联数据库的详情页中修改属性的对应关系）\n- 请注意：若删除数据库中的“复选框、名称、日期、描述”属性，将会影响同步效果。\n\n\n# 方式2 与滴答清单共享页面\n## 步骤1 选择共享的页面\n\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n选择「方式2 选择要与 滴答清单 共享的页面」，并勾选允许「滴答清单」访问的页面。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/8b6c8ef89a81303a7833dbf54df0d60b.png)\n\n\n\n::::\n\n::::tab [desktop]\n选择「方式2 选择要与 滴答清单 共享的页面」，并勾选允许「滴答清单」访问的页面。\n\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/0f7b526c426756ef1ecd14bc2c6b65fc.png)\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/4582d13af78e74f0fa6c7c5882a0ad46.png)\n\n\n\n::::\n\n:::::\n\n\n请注意：\n- 只有你允许访问的页面，滴答清单才有权限进行关联。\n- 每一次的关联，除了勾选想要关联的页面，**同时还请勾选已经关联成功的页面，否则之前已关联的数据库滴答清单会由于无权限导致无法继续同步。**\n\n\n## 步骤2 选择同步内容\n\n\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n授权成功后，将会自动跳回「滴答清单」，显示「关联内容页」。\n\n\n在「关联内容页」，点击「选择清单」、「选择数据库」选项，选择你想要建立关联的“清单”和“数据库”，并且点击「下一步」进入「关联配置页」。\n\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/e498db6dca78d476193740a11dd805f6.png)\n\n\n\n::::\n\n::::tab [desktop]\n授权后，你将看到 「关联内容」页面。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/046e09d790c97f6d87733e168d7f1390.png)\n\n在  「关联内容」页面，轻点「选择列表」和 「选择数据库」，选择要集成的列表和数据库。\n\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/29714e3c08f4f6a3dda7144595319092.png)\n![l](/dida-assets/cdn.dida365.cn/hc/all/5fa096d4182a2e69b6f53bba4cce1dd9.png)\n\n\n\n然后，「下一步」进入「关联配置页」。\n\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/ce25cb095aafa7e5157fc896586c9267.png)\n\n\n::::\n\n:::::\n\n::: spoiler 常见问题\n1. **「选择清单」页面清单显示不全？**\n\n只有清单所有者是本人的才可以选择关联。\n \n\n2. **「选择数据库」页面数据库显示不全？**\n\n由于 Notion 的限制，只有已授权的数据库才可以显示在「选择数据库」页面。\n\n你授权后在 Notion 中新增的数据库，需要重新授权才可以显示，可以通过以下2个方式重新授权：\n\n**① 在 Notion 中**\n\n在数据库详情页，点击右上角「···」，找到「连接」，在连接页点击「滴答清单」授权页面即可。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/b18d1df1d13cffb547b650ee7afe4734.png)\n\n**② 在滴答清单中**\n\n进入「设置」-「导入与关联应用」-「Notion」，点击「添加工作区」，重新授权允许滴答清单访问新页面。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/f5ce3500d3dd4848d09f6973886c2e9b.png)\n\n\n3. **选择数据库页面没有内容？**\n\n当你授权的页面中没有数据库时，选择数据库页面则可能没有内容，你可以前往 Notion 添加数据库。添加方式：https://www.notion.com/zh-cn/help/intro-to-databases#create-a-database\n\n:::\n\n\n## 步骤3 选择关联属性\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n在「关联属性页」可以不配置任何选项，直接点击「关联」，即可关联成功。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/9c3e92d3acc73d3f051fd27a2b8db918.png)\n\n::::\n\n::::tab [desktop]\n在「关联属性页」可以不配置任何选项，直接点击「关联」，即可关联成功。\n\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/8c2109464e16505d2949e6e93e93bacb.png)\n\n\n\n\n::::\n\n:::::\n\n\n\n关联成功后\n\n- 数据库中最近编辑的 200 条内容将同步为滴答清单的未完成任务；滴答清单中 200 条未完成任务将同步到 Notion 中 - 新增任务、修改任务名称、删除任务都会双向同步，其他操作将无法同步。\n\n- 同步到滴答清单的任务，任务详情页将会显示数据库中已添加的“文本、数字、单选、多选、状态、日期、人员、复选框”8种属性（最多显示 4 个数据），单向同步，只可查看，不支持编辑。\n\n\n如果还想要有更多内容的双向同步，你可以设置「任务日期」、「任务描述」、「任务状态」选项，关联成功后，将会按照设置的选项双向同步。\n\n\n## 任务日期\n点击「任务日期」选项，选项弹窗将显示你在数据库中所有已添加的「日期」类型属性。选择需要对应显示在滴答清单任务日期的属性即可。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/5cb3222fdad79d01d1aad7db546690f5.png)\n\n关联后，数据库中名称为「日期」的属性将与滴答清单的任务日期对应即可。\n\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/7adae76bb458488f2ba4e5be242e441a.png)\n\n\n## 任务描述\n点击「任务描述」选项，选项弹窗将显示你在数据库中所有已添加的「文本」类型属性。选择需要对应显示在滴答清单任务描述的属性。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/518cb215ffe945b500fbbf68edb11f3b.png)\n\n关联后，数据库中名称为「记录」的属性将与滴答清单的任务描述对应。\n\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/afe3536ca4ff94b19cbea4e8839ad224.png)\n\n\n## 任务状态\n点击「任务状态」选项，选项弹窗将显示你在数据库中所有已添加的「状态」、「复选框」、「单选」的属性。选择需要对应显示为滴答清单任务状态的属性。\n\n**① 选择「复选框」属性**\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/864221d87a23adb305add693c7dd95fd.png)\n\n选择图中命称为“完成情况”的选项（该选项是在 Notion 中添加的复选框属性），该属性状态将与滴答清单的任务状态对应，如下图所示：\n\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/4bff40b5d2b329a60f1a4dc26d4d476a.png)\n\n- 数据库中复选框“未勾选状态”的任务，将在滴答清单中对应为“未完成”任务。\n- 数据库中复选框”勾选状态”的任务，将在滴答清单中对应为“已完成”任务。\n- 在滴答中「完成任务」也将更新 Notion 数据库中「复选框」属性状态。\n\n\n**② 选择「单选」或「状态」属性**\n\n选择图中名称为“状态”的选项（该选项是在 Notion 中添加的状态属性），由于该选项会有多个状态，因此你可以选择哪些状态同步为滴答清单的“未完成任务”和“已完成任务”。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/d05b9aaa5c349ae5154bbc1d4374f7f8.png)\n\n选择未完成选项后，你将在选项下看到“未完成默认值”选项，该选项可以让你定义滴答清单的“未完成任务”同步到 Notion 标记什么属性。已完成同理。\n\n请注意：未选中的选项，默认会同步为滴答清单中的“未完成”任务。\n\n\n\n::: spoiler 怎么添加 Notion 数据库的属性？\n在Notion 数据库详情页中，点击右上角「···」-「属性」-「新建属性」\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/1034df99c454042b2e7931e1efe263a4.png)\n\n:::\n\n\n\n# 关联效果\n\n## 同步内容\n\n关联成功后，滴答清单、Notion 将会按你设置的关联属性进行同步，首次同步范围为最近编辑的 200 条内容（滴答清单的未完成任务也会同步到 Notion 中）。\n\n后续进行新增、修改以及删除等操作的内容，也会自动同步，确保能及时同步你最近编辑的内容。\n\n\n## 查看任务\n\n你可以在滴答清单关联的清单中查看数据库的内容，同时还可以在日历视图中更直观跟踪任务。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/cb9bd7f65707300158b6f6051fda9911.png)\n\n\n点击任务，在任务详情页你将会看到「Notion」的卡片，可以方便地查看重要信息。点击「前往查看」按钮，可以快速跳转 Notion 应用。\n\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/f13036b75529f035c4cfadeca35283d6.png)\n\n- 卡片中会显示数据库中已添加的「文本」、「数字」、「单选」、「多选」、「状态」、「日期」、「人员」、「复选框」”属性，为确保任务详情页其他操作，最多显示的 4 个，在卡片中显示的属性内容和顺序以 Notion 传输过来的为主。只可查看，不支持编辑。\n\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/b5cccae46ed946620d0370a5680866d5.png) \n\n- 以上属性无内容时将不显示在卡片中。\n- 已在「关联配置页」配置的属性，由于已经对应在任务日期、任务描述以及任务状态上，因此将不显示在卡片中。\n\n\n\n## 编辑任务\n在滴答清单已关联的清单中，修改任务名称、以及在「关联配置页」配置成功的内容，将会自动同步到 Notion 数据库中。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/7e2a53e03acc78185b394da3fd673fc4.mp4\n:::\n\n\n## 删除任务\n在滴答清单已关联的清单中，删除任务，会同步删除 Notion 数据库的内容。将任务移动到其他清单（未关联 Notion），该内容也会在 Notion 数据库中删除。\n\n\n\n# 取消关联\n\n**1. 取消关联工作区**\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入「设置」-「导入与关联应用」-「Notion」，点击「工作区」，在详情页下方点击「取消关联」即可成功取消。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/72bee9294d799852da728b98b7c94921.png)\n::::\n\n::::tab [desktop]\n进入「设置」-「导入与关联应用」-「Notion」，点击「工作区」，然后选择要删除的数据库。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/e4bb0ea572a2435bd549b70e4d43f5d4.png)\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/f30c2a6e05d27cc42a5974ee8cfacea9.png)\n\n\n::::\n\n:::::\n\n\n\n- 取消关联后，所有内容将不再双向同步，但已同步的内容仍会保留。\n\n**2.  取消关联数据库**\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n进入「设置」-「导入与关联应用」-「Notion」，点击「工作区」，选择需要点击取消关联的「数据库」，在右上角「···」点击「取消关联」即可成功取消。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/39ed78c64a23992c918673d5e4b66929.png)\n\n::::\n\n::::tab [desktop]\n进入「设置」-「导入与关联应用」-「Notion」，点击「工作区」，选择需要点击取消关联的「数据库」。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/e4bb0ea572a2435bd549b70e4d43f5d4.png)\n![l](/dida-assets/cdn.dida365.cn/hc/all/38a8f34d93d158ccdedd8fa6d0ab3b2f.png)\n\n在右上角「···」点击「取消关联」即可成功取消。\n![--83.07%](/dida-assets/cdn.dida365.cn/hc/all/6ec68b33c2040edd22383bf5e5c7099e.png)\n\n::::\n\n:::::\n\n\n- 取消关联后，所有内容将不再双向同步，但已同步的内容仍会保留。\n\n# 常见问题\n::::: spoiler 1. 如何添加数据库?\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n请打开一个新的或现有的 Notion 页面，点击「+」，找到数据库，点击需要使用的数据库视图类型即可添加成功。\n\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/67bea5dba81086c8e367693d80709583.png)\n::::\n\n::::tab [desktop]\n请打开一个新的或现有的 Notion 页面，输入“/”，然后输入“database”，点击需要使用的数据库视图类型即可添加成功。\n\n![--81.73%](/dida-assets/cdn.dida365.cn/hc/all/dd1cf5cb2615a7855972ce7500ec830c.png)\n\n![--81.73%](/dida-assets/cdn.dida365.cn/hc/all/bba978c7eddb859ffc74cd7cb23ac951.png)\n::::\n\n:::::\n\n\n::: spoiler 2. 数据库属性是什么?\n数据库属性可以协助你更好地管理数据库里的内容，如截止日期、文本等。\n\nhttps://www.notion.com/zh-cn/help/database-properties\n:::\n\n\n::: spoiler 3. 是否可以关联多个 Notion 工作区?\n可以关联多个工作区，最多关联 3 个。\n:::\n\n::: spoiler 4. 是否可以关联多个 Notion 工作区的数据库?\n可以关联多个数据库，最多关联 9 个。\n:::\n\n\n::: spoiler 5. 同步数据比较慢?\n由于国内 Notion 网络限制，可能会导致同步操作比较慢，最终的同步速度以 Notion 网络为主。\n:::\n\n\n\n\n", "tags": [""], "hideIndex": true, "favs": 169, "order": 3848290697216, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2024-11-15T02:04:51.251Z", "modifiedTime": "2026-08-04T06:38:53.813Z", "postId": "7263009022960205824", "__v": 0, "parentId": "6949998557218734080", "area": "help-center", "shortTitle": ""}, {"_id": "6891a3ef5dba685da4cc92b3", "author": "", "description": "", "title": "任务与日历同时显示", "content": "想一边查看任务清单，一边安排日程？在桌面端，你可以试试任务与日历并列显示，帮你快速把“待办”变成“计划”，让任务安排更高效、也更有条理。\n\n这个功能特别适合你在以下场景中使用：\n\n- 有大量无具体时间的任务，需要快速安排到日历中；\n\n- 在排期时，希望保留清单的上下文，便于整体参考与调整。\n\n# 开启任务与日历同时显示\n\n你可以通过以下方式开启并列显示：\n\n- **右键点击任务模块图标**，选择「同时显示日历」：\n\n![--72.07%](/dida-assets/cdn.dida365.cn/hc/all/867bdf94eae026aee2c2a5ac5ecfeead.png)\n\n日历将出现在任务清单的右侧，适合在清单主导的情境下排期。\n\n![--72.07%](/dida-assets/cdn.dida365.cn/hc/all/5769ad719dabb2b9fc10fc9ab857ed75.png)\n\n比如，你今天打开的是“工作”清单，里面有十几个待办事项，此时将日历并列显示，可以边看任务边根据任务的紧急程度或重要性考虑安排时间。\n\n- **右键点击日历模块图标**，选择「同时显示任务」：\n\n![--72.07%](/dida-assets/cdn.dida365.cn/hc/all/184adac2c03caf73fc6078e8446e3041.png)\n\n任务清单会出现在日历右侧，适合从时间安排出发浏览待办。\n\n![--72.07%](/dida-assets/cdn.dida365.cn/hc/all/aeec11d39c20935779489a71c056a80f.png)\n\n比如，你正在浏览今天的日程，看到今天上午空闲，就可以在旁边的任务清单中挑一两个任务拖进去安排上，确保日程既不拥挤也不浪费时间。\n\n::: spoiler 如何关闭任务与日历同时显示？\n\n只需右键单击对应模块图标，选择「关闭同时显示」即可恢复单模块视图。\n\n![--72.07%](/dida-assets/cdn.dida365.cn/hc/all/ceafff749cf5600cf77ded8c84814caf.png)\n\n:::\n\n# 拖动排期，让安排更高效\n\n在任务与日历并列显示的视图中，你可以：\n\n- 将清单中的任务拖入日历：\n\n为任务快速添加日期或具体时间，不需要打开编辑界面，直接拖动即可。\n\n- 将日历中的任务拖入清单详情区域：\n\n任务会从原所属清单迁移到当前查看的清单中，并保留其原有的时间安排。\n\n- 拖动到清单或标签上：\n\n任务会被移动到目标清单，或自动打上相应标签。\n\n- 拖动到智能清单上：\n\n会为任务自动添加该智能清单关联的时间条件，例如“今天”、“本周”等。\n\n::: video /dida-assets/cdn.dida365.cn/hc/all/3c1365e9affad46bfdbd2d73f2b9dcae.mp4\n:::\n\n\n把清单与日历结合使用，让你的安排更方便，计划更清晰！", "tags": [""], "hideIndex": true, "favs": 5, "order": 3848290697216, "status": 0, "pinInSearch": false, "sectionId": "feature", "area": "help-center", "createdTime": "2025-08-05T06:25:51.773Z", "modifiedTime": "2026-10-06T07:29:01.424Z", "postId": "7358382716586295296", "__v": 0, "parentId": "6950361611617959936", "shortTitle": ""}, {"_id": "62c3f28c0223aebb27da257c", "author": "", "description": "", "title": "🔗 导入与关联", "content": "已经在其他日历 App ，或者手机本地日历中，创建了很多事件，该怎么办呢？🤔️\n\n别担心，滴答清单提供了多种导入方式，方便你快速导入。\n\n你也可以将你在其他 App 的事件与任务整合到一起，统一规划。\n\n另外，我们还提供了多种方式关联你的滴答清单账户，快看看有哪些吧\n\n\n[📅 日历订阅](/articles/6949998599191134208)\n\n[🌏 玩转微信](/articles/6949994885164302336)\n\n[💬 SIRI](/articles/6950042073403752448)\n\n[💕 从其他应用迁移到滴答清单](/articles/6950042319731032064)\n\n[📱 导入 Apple 健康数据](/articles/7309849895597244416)\n\n", "tags": [""], "hideIndex": true, "favs": 9, "order": 4398046511104, "status": 0, "sectionId": "feature", "createdTime": "2022-07-05T08:13:00.770Z", "modifiedTime": "2026-10-12T09:01:30.375Z", "postId": "6949998557218734080", "__v": 0, "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"area": "help-center", "_id": "62c573361e3a8b2ac64c8104", "author": "", "description": "", "title": "常见问题", "content": "::: spoiler 如何补计专注记录？\n在「专注统计」中找到「专注记录」，点击右边「+」，即可补记专注记录。\n:::\n::: spoiler 如何删除专注记录？\n在「专注统计」中进入「专注记录」，进入需要删除的记录，点击最下角 删除记录，即可删除。\n:::\n::: spoiler 如何设置应用白名单？\n在专注设置中，将需要的 App 添加到白名单即可。\n\niOS 用户需要升级到 iOS16。\n:::\n::: spoiler 为什么专注不同步？\n\n你可以在专注页面点击右上角「...」-「专注设置」中开启专注多端同步。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/dd76531b5416c4c675ff154341568b6f.png)\n\n:::\n::: spoiler 如何在日历中显示专注记录？\n在「日历」选择「显示设置」，点击打开「显示专注记录」，就可以在日历视图中同步自己的专注时间块，一天的专注时间线一目了然！\n:::\n\n\n", "tags": [""], "hideIndex": true, "favs": 14, "order": 4398046511104, "status": 0, "sectionId": "feature", "createdTime": "2022-07-06T11:34:14.198Z", "modifiedTime": "2026-06-06T06:20:34.027Z", "postId": "6950411584711688192", "__v": 0, "parentId": "6950361797429821440", "pinInSearch": false}, {"_id": "62c650031e3a8b2ac64c8235", "author": "", "description": "", "title": "常见问题", "content": "\n::::::: spoiler 如何在日历视图里添加任务？\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n- 点击右下角「+」号添加任务或者长按全天任务栏添加任务。\n- 在有时间轴的视图中，长按时间轴的某一处，即可在对应的时间点添加任务。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/4dbb585b8cff03bfb861cc054d9357d1.png)\n\n::::\n\n::::tab [desktop]\n- 点击日历视图的日期格子即可添加任务。\n- 在有时间轴的视图中，点击时间轴的某一处，即可在对应的时间点添加任务。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/31e08f593f842763e56a4c339af2cc35.png)\n\n![](/dida-assets/cdn.dida365.cn/hc/all/3da6751b1ce2da519752a387755b7d77.png)\n::::\n:::::::\n\n::::::: spoiler 如何在日历视图里安排任务？\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n- 左滑右侧屏幕边缘，或者点击日历视图右上角「···」-「安排任务」，拖拽到日历中即可。\n- 将全天任务栏里的任务拖拽至时间轴上的对应时间点即可。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/c21a7b722afff6713306479040497f34.png)\n\n> 打卡不可拖动。\n::::\n\n::::tab [desktop]\n- 点击日历右上角「···」- 「安排任务」，将任务拖拽至日历中即可。\n- 将全天任务栏里的任务拖拽至时间轴上的对应时间点即可。\n\n![--75.31%](/dida-assets/cdn.dida365.cn/hc/all/a3cbad60b6fb557932a06abd7a4ac41a.png)\n\n\n\n> 打卡不可拖动。\n::::\n\n::::::::\n\n\n:::::: spoiler 如何更改日历中任务颜色？\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n点击日历视图右上方「···」-「显示设置」-「颜色」-「显示方式」，即可选择任务块按照清单、优先级或者是标签显示颜色。\n\n![--68.32%](/dida-assets/cdn.dida365.cn/hc/all/ca378667819a8db52b4fb77ff2a3c4c2.png)\n\n::::\n\n::::tab [desktop]\n点击日历视图右上角「···」-「显示设置」-「颜色」-「显示方式」，点击清单这一栏，即可选择任务块按照清单、优先级或者标签显示颜色。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/920089cc50b699abf6f07b9ad6e1480b.png)\n\n![](/dida-assets/cdn.dida365.cn/hc/all/9d99624922aa336bb23cfebc7f7548f1.png)\n\n![](/dida-assets/cdn.dida365.cn/hc/all/660d5d46eb2263444f279661d397a7e4.png)\n\n::::::::\n\n:::: spoiler 为什么我的任务在日历视图上没有颜色？\n任务在日历视图上显示的颜色是根据所属清单决定的，创建/管理清单时，记得为不同的清单设置不同的颜色就可以了。\n::::\n\n:::::: spoiler 如何调整时间轴隐藏的时段？\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n展开隐藏的时间段之后，长按上下拖拽该按钮即可。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/ef7e5cb30252f55640275e103405f01f.png)\n\n::::\n\n::::tab [desktop]\n展开隐藏的时间段之后，长按上下拖拽该按钮即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/399b0c7aef1db8da47668a846a144588.png)\n\n::::\n\n::::::::\n::::::spoiler 如何快速调整任务的时间段？\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n长按任务块，直到任务块上下出来两个小点，拖拽即可调整任务时长。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/372fc8ab6746403833c89380d3477f65.png)\n::::\n\n::::tab [desktop]\n将鼠标放置在任务块边缘，出现上下箭头图标后即可拖拽调整任务时长。\n\n![--73.25%](/dida-assets/cdn.dida365.cn/hc/all/dd1bdd6e0d39666f11943ebe86fcfcd9.png)\n::::\n\n::::::::\n\n\n\n:::spoiler 如何开启迷你日历？\n此功能为 Web 、Windows 端独有功能，先点击头像-「设置」-「更多设置」中打开「Mini日历」，然后在侧边栏底部点击小箭头即可开启。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/906ff214e4a3625532a4daba5459431e.png)\n\n![](/dida-assets/cdn.dida365.cn/hc/all/8b5805b02a0005c643c45f8c31cf5332.png)\n\n:::\n:::::: spoiler 如何在日历里显示农历？\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n在「设置」-「日期与时间」里开启「显示农历」即可。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/743402158683d98d902bcd84609353a3.png)\n::::\n\n::::tab [desktop]\n点击头像-「设置」-「日期与时间」里开启「显示农历」和「显示节假日调休」即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/c791a2b5ddb2d09adc8ef4244a9c3815.png)\n\n![](/dida-assets/cdn.dida365.cn/hc/all/ad91db6ea612ac11f9a25705e9aeed02.png)\n::::\n\n\n\n\n:::::::::\n:::::::::spoiler 如何修改日历一周开始？\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n在「设置」-「日期与时间」里修改「星期开始于」即可。\n\n![l](/dida-assets/cdn.dida365.cn/hc/all/de9b77d0983ce8ac5cc2a1a21fe207af.png)\n::::\n\n::::tab [desktop]\n点击头像 -「设置」-「日期与时间」里修改「每周开始于」即可。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/898a7829bccff35bba9318c7dfe50bcc.png)\n\n:::::::::::\n\n\n\n:::: spoiler 为什么在日历视图上看不到子任务和重复任务？\n点击日历视图右上角的「...」- 「显示设置」- 检查一下是否开启了「显示检查事项」和「显示所有重复周期」。\n::::\n\n::: spoiler 日历列表视图，不能看到完整的日历吗？\n在列表视图，手指按住第一排日历，向下拉，即可展开一个小的日历全景。\n:::\n\n\n:::::::::spoiler 在桌面端时间轴里还有哪些操作？\n- 使用笔记本触控板双指缩放可以调节时间轴比例。\n- 按住 Ctrl/Command ，同时滑动鼠标滚轮可调节时间轴比例。\n- 「时间轴」支持隐藏时间段。\n> 点击隐藏的时间段即可展开，点击展开的隐藏时段随便一处即可隐藏。\n> \n> 展开隐藏的时间段之后，长按上下拖拽该按钮即可对其进行调整。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/399b0c7aef1db8da47668a846a144588.png)\n\n:::::::::::::\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n", "tags": [""], "hideIndex": true, "favs": 5, "order": 4398046511104, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T03:16:19.950Z", "modifiedTime": "2026-07-06T08:35:28.199Z", "postId": "6950648670899404800", "__v": 0, "parentId": "6950361611617959936", "pinInSearch": false, "area": "help-center", "shortTitle": ""}, {"_id": "6630a1c947c89fff9258e291", "author": "", "description": "", "title": "URL", "content": "你可以通过 URL 链接，将第三方应用内容订阅到滴答清单中，以便在滴答清单中查看这些事件，并获得提醒。\n\n# 添加日历\n\n:::::tabContainer [mobile|desktop]\n\n::::tab [mobile]\n在「设置」-「导入与关联应用」-「日历」，选择「URL」，输入第三方日历的 URL 链接即可订阅成功。\n\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/e157b64c41fafee873b22fac42ef1755.png)\n::::\n\n::::tab [desktop]\n点击「头像」-「设置」-「关联与导入」，选择「URL」，输入第三方日历的 URL 链接即可订阅成功。\n\n\n![--75.32%](/dida-assets/cdn.dida365.cn/hc/all/0873ece4122a12fc3c76baccfa6249cf.png)\n\n\n![--75.32%](/dida-assets/cdn.dida365.cn/hc/all/c6ec0ac98c8bf5adad914f9ea34cd585.png)\n\n\n::::\n\n:::::\n\n\n\n# 获取 Todoist 清单链接\n右键需要订阅的项目，选择「订阅项目日历」，复制项目链接粘贴到滴答清单订阅 URL 日历输入框中，即可成功订阅。\n\n![--81.73%](/dida-assets/cdn.dida365.cn/hc/all/1968f22adf591d619bcf919cc577ab72.png)\n\n![--81.73%](/dida-assets/cdn.dida365.cn/hc/all/a78466859f3c0151d1d7c9ec62a82d09.png)\n\n# 获取 Google 日历链接\n右键需要订阅的日历，选择「设置和共享」，找到「获取共享链接」，复制日历的功效链接粘贴到滴答清单订阅 URL 日历输入框中，即可成功订阅。\n\n![--81.73%](/dida-assets/cdn.dida365.cn/hc/all/b6f08d4697a9b537156a9c0b6f03febe.png)\n\n![--81.73%](/dida-assets/cdn.dida365.cn/hc/all/77bdc4a979c3dc153294b70ec1a2aad5.png)\n\n\n# 常见问题\n:::::: spoiler 如何退订日历？\n\n:::::tabContainer [mobile|Web|macOS|Windows]\n\n::::tab [mobile]\n在订阅日历的编辑页面，点击取消订阅即可退订日历。\n\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/b1be07c49d71c9299f368db3e8bf3fbc.png)\n\n::::\n\n::::tab [Web]\n在「设置」-「关联与导入」点击想退订日历旁的「编辑」，取消订阅即可。\n\n![--73.2%](/dida-assets/cdn.dida365.cn/hc/all/505f039ba0405d1c793cfb2bdb1a9200.png)\n\n![--73.2%](/dida-assets/cdn.dida365.cn/hc/all/b228036bf6d600c2ae2320a5c4fbba4b.png)\n\n\n::::\n\n::::tab [macOS]\n\n在「日历订阅」左侧栏中选择想要退订的日历，点击「-」，即可退订。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/22afed3bd85d402a4ce876d3443db44b.png)\n\n::::\n\n::::tab [Windows]\n在「设置」-「日历订阅」点击一下要退订的日历，点击「取消订阅」，即可退订。\n\n\n![--57.06%](/dida-assets/cdn.dida365.cn/hc/all/4b0551d4c6f5dd182bcadce8c3978262.png)\n\n::::\n\n:::::\n", "tags": [""], "hideIndex": true, "favs": 2, "order": 4398046511104, "status": 0, "pinInSearch": false, "sectionId": "feature", "createdTime": "2024-04-30T07:46:17.714Z", "modifiedTime": "2026-05-08T06:49:07.208Z", "postId": "7190979764138541056", "__v": 0, "parentId": "6949998599191134208", "area": "help-center", "shortTitle": ""}, {"_id": "68789cb05dba685da4cc9013", "author": "", "description": "", "title": "🖱️ 桌面快捷操作", "content": "除了快捷键之外，滴答清单还支持一系列组合键操作，只需搭配鼠标使用，就能轻松完成更多高频操作，管理任务和日程更加高效。\n# ✅ 任务模块\n## 多选任务并批量处理\n\n当你需要一次性修改多个任务时，不必逐个勾选，你可以：\n\n- 按住 **Ctrl** ，点击选择多个任务；\n\n- 按住 **shift** ，点击前后两个任务快速选中中间的一整段任务；\n\n- 按住 **Shift** + **↑** / **↓**，快速选中多个任务；\n\n- **鼠标拖动框选**多个任务。\n\n![--66.93%](/dida-assets/cdn.dida365.cn/hc/all/dd2bb7a95cafc47d0c20f8d301bd5ffd.png)\n\n多选任务后，右侧会出现编辑菜单，你可以对它们的日期、优先级、清单、标签等进行批量设置，或者使用快捷键对任务进行批量操作，比如：Ctrl + 0 将日期设为今天。\n\n> 更多快捷键可以前往桌面端应用左下角「？」-「快捷键」查看。\n\n## 快速切换任务或清单\n\n如何快速切换浏览不同的清单和任务？其实只要按方向键 **↑** 或 **↓**，就能在任务间、清单间快速切换，切换浏览更加丝滑。\n\n## 快速整理任务\n\n当你想把某个任务从一个清单迁移到另一个清单，你可以将光标覆盖在任务上，按住并拖动任务前方的小图标（汉堡图标），拖动到另一清单上，任务就能瞬间移动到指定清单。\n\n![--66.93%](/dida-assets/cdn.dida365.cn/hc/all/f2e7a027f50a4661e5f6a2a3c3e2fed1.png)\n\n拖动到智能清单或标签同理，任务将自动打上智能清单对应的日期或者自动添加上标签，无需打开任务详情，也不必切换视图，非常高效。\n\n> 选中多个任务时，也支持拖动设置清单、标签等。\n\n## 快速形成主子任务关系\n\n想要快速梳理任务等级？只需把一个任务拖到另一个任务右下方，即可快速创建主子任务等级关系。\n\n![--66.93%](/dida-assets/cdn.dida365.cn/hc/all/514d97f4704a199c5b1323d80a792dab.png)\n\n\n如果想取消，只需将子任务从主任务中拖出缩进层级即可，操作简单，层次清晰。\n\n## 沉浸书写模式\n\n需要专注编辑任务内容？按下 **Ctrl + Alt + 0**（**Mac：Command + Shift + 0**），即可进入沉浸书写页面，让你全屏编辑，码字更畅快。\n\n## 快速插入任务链接\n\n需要在任务详情中引用某个任务，但不想在一个任务中复制任务链接、再进入另一个任务粘贴链接？你也可以直接在任务详情中输入【【，即可快速插入任务链接。\n\n![--66.93%](/dida-assets/cdn.dida365.cn/hc/all/3368a418c375e8569c87578cd5e759cd.png)\n\n\n## 快速设置段落样式\n\n在任务详情区域，输入 **/** 即可唤起指令菜单，配合 ↑ / ↓ 键和 Enter 快速设置多级标题、无序列表等段落样式，让你一边输入一边设置，不必反复切换鼠标打断输入灵感。\n\n![--66.93%](/dida-assets/cdn.dida365.cn/hc/all/a1062978c8108227be015b0778ff62e2.png)\n\n\n## 精准选择文字\n\n在编辑任务详情内容时，使用 **Shift** + **←** / **→** 可以精准选中文字，使用 **Ctrl** + **Shift** + **←** / **→** 还能按词快速选中，让你的编辑更高效。\n\n# 📅 日历模块\n\n## 快速复制任务\n\n有时，你的任务不是规律重复的，但是又是需要多次进行的。此时，你只需按住 **Ctrl**（或 Mac 上的 **Option**），再拖动任务到目标时间，就能完成复制。无需右键、无需菜单，就像复制文件一样直观。\n\n![--62.4%](/dida-assets/cdn.dida365.cn/hc/all/e1ff82ad6404936a12d2348ec07248de.png)\n\n> 如果是在 Mac 上使用 web 端，按住 command 拖动复制任务。\n\n\n## 批量选中并编辑\n\n需要一次性修改多个任务？你只需要按住 **Ctrl**，可以点击多个任务进行多选。或者，你也可以直接在日视图、周视图和多日视图的时间轴上拖动鼠标框选多个任务，批量移动、编辑、或删除等。\n\n![--62.4%](/dida-assets/cdn.dida365.cn/hc/all/b957b22f4790e8fc8d8482e134763637.png)\n\n> Windows 和 web 端支持，Mac 端暂不支持。\n\n## 显示任务复选框\n\n在日历中如何快速勾选完成任务？按住 **Alt**（Windows）或 **Option**（Mac），任务前方将显示复选框，配合鼠标，不必进入任务详情就能完成勾选。\n\n![--62.4%](/dida-assets/cdn.dida365.cn/hc/all/e9dcf73f95bebc7092413500f7d7da30.png)\n\n\n\n## 快速切换日期\n\n使用方向键 **↑  ↓** 或者 **← →** ，可以快速切换日历显示的范围，无需使用鼠标点击即可轻松切换浏览范围。\n\n## 快速切换日/周视图中的日期\n\n在日视图、周视图或者多日视图中，按住 **Shift** 并滚动鼠标滚轮，就能快速左右切换日历显示的日期范围，像翻书一样查看前后的安排。\n\n## 缩放时间轴\n\n想让日历时间区块更密集，或更宽松？按住 **Ctrl**（或 Mac 上的 **Command**）再滚动鼠标滚轮，即可缩放日视图或周视图中的时间轴，方便查看全天任务。\n\n## 调整界面字号\n\n使用 **Ctrl** 加 **+** / **-**（或 **Command** 加 **+** / **-**）可放大 / 缩小字体，**Ctrl** + **0**（或 **Command** + **0**）可恢复默认字号，轻松找到适合你屏幕分辨率的字号大小。\n\n# 浏览器插件\n## 下载\n在滴答清单[下载中心](https://dida365.com/download)安装插件。\n\n![--54.63%](/dida-assets/cdn.dida365.cn/hc/all/5e1273cd35d227e1246a639653baccaa.jpg)\n\n你可以在下载 Chrome、Microsoft Edge、Firefox、Gmail、Outlook 浏览器中滴答清单插件，轻松管理任务。\n\n![--59.9%](/dida-assets/cdn.dida365.cn/hc/all/0d08b554f26d45613e67809dd0f1f1ce.jpg)\n\n## 安装\n1. 将下载的 dida.zip 解压可以得到一个 dida.crx\n\n![--53.96%](/dida-assets/cdn.dida365.cn/hc/all/93ed26178a5a285430f04b140e372754.jpg)\n\n\n2. 将 dida.crx 的后缀修改为.zip格式。\n\n![--54.11%](/dida-assets/cdn.dida365.cn/hc/all/a96df419166910a4938f439464431982.jpg)\n\n3. 并再次解压，可以得到如图的文件夹\n\n![--53.85%](/dida-assets/cdn.dida365.cn/hc/all/8b8e2bcdb602d8b79e0f4d42fef8d26c.png)\n\n4. 在浏览器右上角选择更多工具 扩展程序\n\n![--54.02%](/dida-assets/cdn.dida365.cn/hc/all/5250b63be083fcce3f25ff67bbf3aad7.png)\n\n5.  打开开发者模式 点击「加载已解压的扩展程序」，然后选择你解压后的文件夹即可安装\n\n![--54.12%](/dida-assets/cdn.dida365.cn/hc/all/2d758a96003cfc7086ba8b95b921b791.jpg)\n\n![--54.18%](/dida-assets/cdn.dida365.cn/hc/all/91f7cdf0afe4974b266a82a1d2050b5f.jpg)\n\n注：文件夹请不要删除，删除后不能正常使用插件。\n\n# 常见问题\n\n::: spoiler 为什么我找不到文章里提到的快捷键？我用的是 Mac / Windows，快捷键是不是不一样？\n\n是的，不同操作系统的快捷键名称和按键会有所不同，常见对应关系如下：\n\nWindows 上的 Ctrl 键 = Mac 上的 Command (⌘) 键；\n\nWindows 上的 Alt 键 = Mac 上的 Option (⌥) 键。\n\n请根据你的系统，替换成相应的按键即可。\n:::\n\n\n熟练掌握以上组合键和快捷操作后，你会发现任务管理更顺手，日历排程更灵活。", "tags": [""], "hideIndex": true, "favs": 0, "order": 4398046511104, "status": 0, "pinInSearch": false, "sectionId": "special", "area": "help-center", "createdTime": "2025-07-17T06:48:16.178Z", "modifiedTime": "2025-11-03T12:33:24.364Z", "postId": "7351502985995747328", "__v": 0, "shortTitle": "", "parentId": null}, {"_id": "6a3a49176dd5c0432b3bd9b7", "author": "", "description": "", "title": "滴答清单 × AI 使用案例", "content": "AI 不仅可以帮助创建任务。随着任务和项目越来越多，AI 还可以帮助整理任务、规划时间、生成清单、拆解目标，甚至参与回顾与复盘。\n\n下面分享一些实用的 AI 使用案例分享，你可以根据自己的工作习惯进行调整。\n\n::: spoiler ⚠️ 前置准备\n\n本文案例需 AI 平台能读写你的滴答清单数据。请提前配置好以下任一连接：\n\n- 滴答清单 MCP：[参考文档](/dida-help/articles/7438132116019216384)\n\n- DIDA CLI：[参考文档](/dida-help/articles/7464976698707017728)\n:::\n\n\n# 一、用 AI 管理任务\n很多人刚开始使用 AI 时，最先想到的是：帮我创建一个任务。但随着任务越来越多，你会发现，真正耗费时间的往往不是记录任务，而是管理任务。\n\n事实上，大多数任务系统失效，并不是因为记录得不够多，而是因为缺少持续整理和维护。这也是 AI 特别适合发挥价值的地方。相比手动逐个检查任务，AI 更擅长快速分析整个任务系统，帮助你整理与组织。\n\n下面分享几个适合日常使用的场景。\n\n## 整理收集箱\n\n收集箱最大的价值，是帮助你快速记录。无论是突然冒出的想法、临时事项，还是暂时没有决定是否执行的计划，都可以先放进收集箱。\n\n但如果长期不整理，收集箱很容易变成一个堆积区。随着任务不断增加，模糊任务越来越多，一些任务长期没有处理，很多事项甚至已经忘记为什么记录下来... 久而久之，收集箱里的内容越来越多，却越来越难以真正开始执行。\n\n这时，可以尝试让 AI 帮你完成一次系统整理。\n\n![--56.3%](/dida-assets/cdn.dida365.cn/hc/all/4f870d04fe6c4b7a571d32eedad6f8c7.png)\n\n**可复制参考的 Prompt：**\n\n```\n\n帮我整理收集箱中的任务。\n\n请按以下步骤进行：\n\n1. 检查收集箱中的新任务、未安排时间的任务、最近新增任务以及长期未处理任务。\n\n2. 识别无法直接执行的模糊任务，并推荐更具体的行动描述。\n\n3. 根据任务内容推荐：\n- 所属清单\n- 标签\n- 优先级\n\n4. 判断哪些任务需要安排时间：\n- 优先级较高或有明确时间要求的任务，推荐安排到今天或本周\n- 暂时没有明确时间要求的任务，继续保留在收集箱中\n\n5. 识别长期未处理任务，并建议：\n- 保留\n- 延后\n- 归档\n- 删除\n\n最后输出：\n\n① 建议修改的任务\n② 推荐移动的任务\n③ 推荐安排时间的任务\n④ 建议归档或删除的任务 \n```\n\n## 制定今日计划\n\n很多时候真正让人感到压力的，是不知道应该先做什么。面对几十条待办事项，大脑会不断在各种任务之间切换，反而更难进入工作状态。\n\n这时，可以让 AI 帮你完成当天的规划。\n\n![--56.3%](/dida-assets/cdn.dida365.cn/hc/all/0cb1e294fe0d75f2656d316088e3a038.png)\n\n**可复制参考的 Prompt：**\n\n```\n帮我规划今天的任务安排。\n\n请先分析：\n\n- 今天已有时间的任务及固定安排\n- 逾期任务\n- 收集箱中的新任务\n\n然后：\n\n1. 推荐今天最重要的任务\n2. 建议延期或放弃低价值任务\n3. 判断今天还能承载多少任务\n4. 根据优先级和任务时长生成时间安排\n5. 保留适当缓冲时间\n\n最后输出：\n\n① 今日重点任务\n② 建议延期任务\n③ 今日时间安排\n④ 今日注意事项\n```\n\n## 清理长期积压任务\n\n任务系统最容易出现的问题之一，就是积压。有些任务已经存在几个月，却始终没有推进。每次看到它们都会产生压力，但又迟迟没有行动。\n\n这时，可以让 AI 帮你进行一次任务大清理。\n\n**可复制参考的 Prompt：**\n\n```\n帮我清理长期未处理任务。\n\n请检查：\n\n- 超过30天未更新任务\n- 多次延期任务\n- 长时间未完成任务\n\n对于每个任务，请判断：\n\n- 保留\n- 重新拆分\n- 延后\n- 归档\n- 删除\n\n并说明原因。\n\n最后输出：\n\n① 建议保留任务\n② 建议重新拆分任务\n③ 建议归档任务\n④ 建议删除任务\n```\n\n## 检查任务系统健康度\n\n任务系统并不是建立一次就结束了。随着时间推移，系统会不断产生新的任务、新的项目和新的积压事项。\n\n因此，定期维护系统同样重要。\n\n**可复制参考的 Prompt：**\n\n```\n请帮我检查当前任务系统的健康状态。\n\n请分析：\n\n- 收集箱积压情况\n- 未安排时间任务数量\n- 模糊任务比例\n- 长期未完成任务\n- 当前任务负荷\n\n然后告诉我：\n\n1. 当前系统最大的风险是什么\n2. 哪些地方最需要整理\n3. 哪些任务应该优先处理\n4. 哪些任务应该删除或归档\n\n最后给出一份系统维护建议。\n```\n\n# 二、用 AI 复盘与总结\nAI 不仅可以帮助你创建任务、安排计划，也可以帮助你回顾已经完成的事情。\n\n当你持续使用滴答清单记录任务、安排日程、管理项目和追踪习惯后，这些数据本身就会成为一份有价值的个人记录。\n\n相比手动翻看任务列表、统计完成数量和整理项目进展，AI 更擅长从大量任务记录中提取重点，帮助你看清自己的完成情况、推进节奏和时间投入。\n\n下面分享 3 个适合日常使用的 AI 复盘场景。\n\n## 每日复盘：回顾今天完成了什么\n\n每天结束时，我们常常只记得自己很忙，却不一定清楚今天真正完成了什么。\n\n这时，可以让 AI 根据当天的任务记录，帮你快速生成一份今日复盘。\n\n它可以帮你总结今天完成了哪些任务、哪些事情被延期、今天的任务主要集中在哪些方面，以及明天应该优先处理什么。\n\n**可以直接复制使用的 Prompt：**\n\n```\n帮我复盘今天的任务完成情况。\n\n请分析：\n\n- 今天完成了多少任务\n- 主要完成了哪些事情\n- 哪些任务没有完成或被延期\n- 今天的任务主要集中在哪些方面\n- 明天有哪些需要优先处理的事项\n\n最后输出：\n\n1. 今日完成概况\n2. 重点完成事项\n3. 未完成与延期任务\n4. 今日状态总结\n5. 明日建议\n```\n\n## 本周总结：回顾这一周的推进情况\n\n一周结束后，单看每天的任务记录，很难判断这一周整体推进得怎么样。\n\nAI 可以把过去一周的任务、项目和完成情况整理在一起，帮你看清这一周主要完成了什么、哪些项目推进最多、哪些事情被延期，以及下周需要继续关注什么。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/28de4a885071b97eea9bf7eb0fcb17bb.png)\n\n**可以直接复制使用的 Prompt：**\n\n```\n\n帮我总结本周的任务完成情况。\n\n请分析：\n\n- 本周完成了多少任务\n- 本周主要推进了哪些项目或事项\n- 哪些项目投入最多\n- 有哪些重要进展\n- 哪些任务被延期或仍未完成\n- 下周需要继续关注什么\n\n最后输出：\n\n1. 本周完成概况\n2. 主要推进事项\n3. 重点项目进展\n4. 延期与遗留任务\n5. 下周关注重点\n\n```\n\n## 时间投入分析：看清长期重心\n\n很多时候，我们以为自己把时间花在了某些重要事情上，但真实情况未必如此。\n\n如果你长期使用清单、标签、日程、习惯或专注记录来管理工作和生活，AI 可以帮助你分析一段时间内的时间投入结构。\n\n它可以帮你看到哪些项目占用了最多精力，哪些事情出现得最频繁，哪些目标被持续推进，哪些方向投入很多但产出不明显。\n\n![](/dida-assets/cdn.dida365.cn/hc/all/803a140452a74cb685adb3641bd05d75.png)\n\n\n**可以直接复制使用的 Prompt：**\n\n```\n\n帮我分析最近一个月的时间投入情况。\n\n请分析：\n\n- 这段时间主要投入在哪些项目或清单\n- 不同类别的任务数量和占比\n- 哪些事项投入最多\n- 哪些任务完成率较高\n- 哪些方向投入较多但推进不明显\n- 是否有长期目标被持续推进\n\n最后输出：\n\n1. 时间投入概况\n2. 主要投入方向\n3. 时间投入排行榜\n4. 投入与产出分析\n5. 后续优化建议\n\n```\n\n你也可以根据需要替换时间范围，例如：\n- 帮我分析这个月的时间投入情况\n- 帮我复盘最近三个月的健身记录\n- 帮我总结过去半年的任务记录\n- 帮我分析最近一个月的习惯坚持情况\n\n\nAI 复盘的价值，不只是帮你统计完成了多少任务。\n\n更重要的是，它可以帮助你从每天的记录中发现状态，从一周的任务中看清推进节奏，从长期的投入中理解重心变化。\n\n当任务记录持续积累后，滴答清单不只是一个待办工具，也会成为你的个人工作记录、时间投入记录和成长记录。", "tags": [""], "hideIndex": true, "favs": 18, "order": 4398046511104, "status": 0, "pinInSearch": false, "sectionId": "feature", "area": "help-center", "createdTime": "2026-06-23T08:51:35.754Z", "modifiedTime": "2026-09-30T07:04:22.731Z", "postId": "7475108284236562432", "__v": 0, "shortTitle": "", "parentId": "7444671678778441728"}, {"area": "help-center", "_id": "62c657e01e3a8b2ac64c8356", "author": "", "description": "", "title": "🔑 账号与安全", "content": "滴答清单的用户可以分成两种类型：\n\n- 普通用户 ：任何人都可以免费创建滴答清单帐号。\n- 高级会员 ：升级到高级会员后，就可以解锁超多实用的会员功能👉[会员专享功能](https://www.dida365.com/about/upgrade)\n\n从注册开始，开启你的滴答清单之旅，创建任务、成立清单... 让你的生活更加井井有条。👉[注册与登录](/articles/6950691508324401152)\n\n害怕数据丢失？想在一个应用中使用多个应用的数据？我们也为你提供合多为一的选择。👉[数据备份与迁移](/articles/6950691573587771392)\n\n使用双重验证，为你的账户增添额外安全防护。👉[双重验证](/articles/7305780125377757184)", "tags": [""], "hideIndex": true, "favs": 16, "order": 4947802324992, "status": 0, "sectionId": "feature", "createdTime": "2022-07-07T03:49:52.392Z", "modifiedTime": "2026-08-10T08:31:50.029Z", "postId": "6950657111692935168", "__v": 0, "parentId": null, "pinInSearch": false}, {"area": "help-center", "_id": "62c41b13c3bb3bd197e6e93b", "author": "", "description": "", "title": "Siri", "content": "你可以将一些常见的操作添加到 Siri 作为语音指令，\n\n以后只需要对 Siri 说活就能自动执行，听起来是不是很酷！\n\n如果你习惯每天早上检视一遍今天的任务，\n\n就可以把「查看\"今天\"」添加到 Siri 捷径并录制语音指令（比如录制：“今天做什么？”），\n\n那么以后只要对 Siri 说：“今天做什么？”，Siri 就会帮忙自动打开滴答清单的智能清单“今天”了。\n\n\n\n# Siri 创建任务\n在「设置」-「Siri」中开启「通过 Siri 添加任务」，即可通过 Siri 创建任务。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/f65e1a2cfe233d9e360eccdd1e3fb7eb.png)\n\n# Siri 快捷指令\n你可以将常见操作添加到Siri作为语音指令，设置成功后，只需对Siri发出语音指令，Siri就能帮你自动执行。\n\n![m](/dida-assets/cdn.dida365.cn/hc/all/214f69ce2b71b0d315ce15dc9ee50522.png)", "tags": [""], "hideIndex": true, "favs": 9, "order": 5497558138880, "status": 0, "sectionId": "feature", "createdTime": "2022-07-05T11:05:55.836Z", "modifiedTime": "2026-05-08T06:49:30.217Z", "postId": "6950042073403752448", "__v": 0, "parentId": "6949998557218734080", "pinInSearch": false}, {"_id": "62c54f035084b6294bef6200", "author": "", "description": "", "title": "🌻 课表导入 ", "content": "![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/8b3efb578f18158fe9ca2443578a7cfb.jpg)\n\n上不完的课程、跑错教室的无奈、拿错课本的尴尬...\n想必大部分学生老师都能懂。\n\n如果你是学生或者老师，那这个功能简直就是宝藏！\n\n使用我们的「课表视图」功能，能够帮你清楚地了解课程安排、上课时间、教室、任课老师等等。也能够在常规日历中显示你的课表，方便你有条不紊地管理好学习和生活。\n\n实用功能+1！\n\n话不多说，一起来看看如何使用～\n\n\n\n\n# 开启课表视图\n点击「设置」-「导入与关联应用」，找到「课表」，点击按钮即可体验「课表」功能。\n\n![l--98.39%](/dida-assets/s3.cn-north-1.amazonaws.com.cn/dida-hc/hc/all/b4b7ea89050449df8be159f5a63ca8f8.png)\n\n# 查看课表视图\n当开启课表视图后，在日历模块中会增加一个课表视图的入口，找到点击即可切换。\n\n![m--216.42%](/dida-assets/s3.cn-north-1.amazonaws.com.cn/dida-hc/hc/all/b6a16d1f12dea08b9b5cf6e51efbab07.png)\n\n# 添加课程\n\n在课表视图点击加号键，输入课程相关信息即可添加课程。课程信息包含课程名称、周数、节数、教室以及老师。\n\n![l--101.63%](/dida-assets/s3.cn-north-1.amazonaws.com.cn/dida-hc/hc/all/d78914ab7d1954986670d7e7e2460453.png)\n\n# 导入课程\n\n## 方式一：图片导入\n\n**操作步骤**\n\n1. 在日历的课表视图，选择 「立即导入」-「图片导入」。\n\n2. 点击 「立即开始」，选择或拍摄一张课表图片进行识别。\n\n3. 等待识别完成后，在 「课表预览」 页面检查并修改结果。\n\n4. 确认无误后，点击 「导入」 完成操作。\n\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/ef656997384258cd28571492e7533860.png)\n\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/46fb7d356e10725d43b675754eb2d67d.png)\n\n\n\n**上传图片要求**\n\n为确保系统能够准确识别课表，请在上传前注意以下事项：\n\n1. **拍摄**\n\n- 确保照片亮度充足、均匀，避免阴影或反光。\n\n- 保持画面清晰，避免模糊。\n\n- 课表在照片中保持正向，避免过度倾斜或扭曲。\n\n- 照片完整呈现课表内容，不遗漏边缘。\n\n2. **截图**\n\n- 截图内容清晰，文字完整、可读，避免模糊。\n\n- 完整截入课表信息，不遗漏上下或左右部分。\n\n- 避免截入通知栏、聊天窗口等无关信息。\n\n- 确保截图中的课表内容直立、规范，不出现扭曲或倾斜。\n\n**推荐课表样式**\n\n1. **标准表格型**\n\n课表以表格形式呈现，列为星期（如周一至周五）、行为节数，每个单元格包含相应的课程信息（课程名称、教师或教室等）。表格边界清晰，内容完整且排列整齐，便于系统识别。\n\n![--63.98%](/dida-assets/cdn.dida365.cn/hc/all/c5beea5d2bf2215dc5c212c9ae8bf532.png)\n\n2. **标准列表型**\n\n课表以列表形式呈现，第一行为表头，包含课程名称、上课周次、上课节次、上课地点等信息，后续每行对应一堂课程，确保每条课程信息完整且排版整齐，便于系统识别。\n\n![--43.2%](/dida-assets/cdn.dida365.cn/hc/all/5194f41e93e84212628ff302e052ff02.png)\n\n**常见识别失败原因**\n\n以下情况的图片可能无法被系统准确识别：\n\n1. **非课表图片**：不是课表图片，图片中没有课程名称、上课周数、上课节次等关键字段的。\n\n2. **关键信息缺失**：课程名称、上课周数、上课节次等其他关键信息不完整，被遮挡或截断的。\n\n3. **多余或干扰信息**：图片中包含与课表无关的内容。\n\n4. **课表方向不正确**：课表旋转或倒置，未保持正向的。\n\n5. **非常规样式或样式不规范**：课表布局过于特殊或文字排版混乱。\n\n\n::: spoiler 一次可以识别多张课表图片吗？\n目前不支持批量识别。请一次上传一张完整的课表图片进行识别。如果您的课表分多张图，请尝试将它们拼接成一张完整的图片后再上传。\n:::\n::: spoiler 导入的课程会包含哪些信息？\n通常包括课程名称、上课周次、上课节次、上课地点和上课老师。系统会尽可能地从图片中提取这些字段，最终导入取决于
