-66.19%](/dida-assets/cdn.dida365.cn/hc/all/fe56beffd4d079171e455aba8620d101.png)\\n\\n点击输入框右侧的下拉选项，可以快速设置优先级、添加附件、选择从模板添加等，你还可以点击「输入框设置」切换输入框样式。\\n\\n![--66.19%](/dida-assets/cdn.dida365.cn/hc/all/177d19949119047988e7507d05be029f.png)\\n\\n:::::\\n\\n\\n\\n::: spoiler 什么是普通清单、智能清单？\\n清单是一种常用的任务整理归类方式。\\n- 普通清单：你自己创建的清单。\\n- 智能清单：根据一定条件智能筛选显示相应任务的清单。（如：所有、今天、明天、最近7天...）\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/4047f0191f0f96cf19756348fa339aa5.png)\\n\\n:::\\n\\n# 智能识别时间\\n滴答清单支持识别任务里的日期和时间，你只需要在输入内容里加上日期、时间，我们将会为你自动设置好提醒时间，极大简化了操作步骤。\\n\\n如：输入“1月10号下午两点补油漆”\\n\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/d6e2d85f12aadf6b82ade6673789a0eb.png)\\n\\n\\n\\n当你不需要识别时间时，只需要按键盘上「删除」，或者点击「已识别的时间」，就能取消识别。\\n\\n\\n::: spoiler 如何关闭智能识别功能？\\n打开应用 - 「设置」-「更多设置」-「智能识别」-「智能识别日期」，即可关闭智能识别功能。\\n:::\\n\\n# 任务默认值\\n任务默认值是指在添加新任务时，会自动填充的任务属性。你可以为新任务预设**日期、清单、优先级**等内容。\\n\\n**如何设置？**\\n\\n点击 **「头像」 -「设置」 -「更多设置 」-「任务默认值」** 进行配置。\\n\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/2dba651066e7b6606c9a1d71d2a396ba.png)\\n\\n\\n\\n# 语音添加任务\\n\\n在不方便打字时，使用语音输入来快速添加任务吧！\\n\\n## 长按模式\\n\\n1. 长按「+」按钮启动语音输入。\\n2. 当界面显示“说出你要做的事”时，直接说出任务内容，松手即可完成任务创建。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/4f741decc3350535cab6b2d047e6a26b.png)\\n\\n\\n> - 新用户首次使用语音输入功能时，按住「+」可能会触发系统权限请求，选择允许即可。\\n> - 语音输入时，内容包含时间等特殊信息会被智能识别成为任务的截止日期与提醒时间。例如：明早十点开会。\\n>  - iOS 用户可以体验实时转写功能，Android 用户暂时不支持该功能。\\n\\n## 录音模式\\n1. 长按「+」按钮并向左/向右拖动，切换到录音模式。\\n2. 进入录音模式后即可松手继续输入，不用一直按住加号键。\\n3. 输入完成后，点击停止按钮即可结束录音，保存文字内容。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/d0e6da0319e86280b3bed1f9b8df0af2.png)\\n\\n>- 录音时长上限为 30分钟，到达上限将自动保存。\\n>- 如果你希望同时保存录音和文字，需要升级至Pro会员。\\n>- iOS 需要 iOS17 及以上可以使用。\\n\\n# 小组件添加任务\\n滴答清单还支持通过「小组件」添加任务，你可以点击小组件上的「+」，直接进入添加任务界面，即可快速添加任务。\\n\\n\\n:::::tabContainer [Android|iOS|Windows]\\n\\n::::tab [Android]\\n在小组件上找到「+」，点击后进入到添加任务界面，打字输入可以直接在这里进行。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/5ff49deeeb3a0689c6072f450edf3f1e.png)\\n\\n\\n::: spoiler 如何添加滴答清单小部件？\\n在主屏幕空白处长按 2s 左右 ，点击出现在屏幕下方的“添加工具”，在新窗口中找到「滴答清单」，选择需要的小部件，点击「添加小组件」即可添加成功。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/bca97f56981d84cb94fcbe63975c2d74.png)\\n\\n::::\\n\\n::::tab [iOS]\\n在小组件上找到「+」，点击后能快速打开 App 的「任务添加条」，输入想创建的任务。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/c8eb831d47caa4b7bed0909796b1513b.png)\\n\\n\\n::: spoiler 如何添加滴答清单小部件？\\n在主屏幕空白处长按 2s 左右进入屏幕编辑状态，点击左上角的「+」，搜索「滴答清单」，点击需要的小部件即可添加成功。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/0435ee9c6b1e8fab0148e5aba2ca1e40.png)\\n::::\\n\\n::::tab [Windows]\\n点击输入框输入任务标题，回车即可创建。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/82bddaa43f9d2dbc22156df7aa33965e.png)\\n\\n::: spoiler 如何添加滴答清单小部件？\\n可以在屏幕右下角系统托盘右键点击「滴答清单」图标,选择想要添加的小部件即可。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/6efe3ea6b87018718a062eeffad63f4b.png)\\n:::\\n::::\\n\\n:::::\\n\\n\\n\\n\\n\\n# 桌面端全局添加快捷键\\n\\n滴答清单为Windows 、 Mac用户提供了「全局添加」的快捷键（ **Ctrl / Cmd + Alt + A** ）。\\n\\n无论你现在是在用钉钉回复工作消息，还是在浏览B站课程，只需轻松按下快捷键，就可以一键调出「任务添加条」。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/604de751699c0fd218762e8f3ae8790c.png)\\n\\n\\n\\n#  使用微信添加任务\\n滴答清单支持在「微信」中“**发送消息**”创建任务。\\n\\n![60%](/dida-assets/cdn.dida365.cn/hc/all/e17cdaf929d81327ccf78fbdfefc3d68.png)\\n\\n微信扫一扫，关注「滴答清单」微信公众号，像聊天一样，发送文字、语音或者图片，直接就能创建任务。\\n\\n![s](/dida-assets/cdn.dida365.cn/hc/all/6c813e24aacd976ae6064c2689d5b0d4.jpg)\\n\\n\\n###\\n::: spoiler 如何在滴答清单app中找到微信功能？\\n打开应用 - 「设置」-「导入与关联」-「微信」中关注「公众号」和添加「小助手」即可。\\n:::\\n\\n### \\n\\n还有更多高能玩法 👉🏻 [特色功能 - 玩转微信](/articles/6949994885164302336)\\n\\n# 用手表添加任务\\n\\n如果你是手表用户，可以直接点击手表屏幕中「+」实现快速添加任务。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/a3e54403914e9f46cf9b681bd8549b75.png)\\n\\n### \\n点击查看更多手表功能 [👉🏻 ⌚️ 手表](/dida-help/external/articles/7069931247773941760)\\n\\n# 更多方式添加任务\\n## 使用邮件添加任务\\n\\n在你的工作中，是否会使用邮件来协作沟通呢？邮件要是来不及处理，可以将这封邮件转成一个任务，确保不会遗忘这件事。\\n\\n\\n登录滴答清单网页版，点击「头像」-「设置」-「关联与导入」，找到「其他」-「邮件创建任务」。\\n\\n![l--84.29%](/dida-assets/cdn.dida365.cn/hc/all/667a32c3bd07014cee1163eafa3db0cb.png)\\n\\n- 第一个：你的专属邮箱链接 (每个人的专属邮箱链接是不同的）\\n- 第二个：todo@mail.dida365.com\\n\\n::: spoiler 这两个邮箱地址有什么区别？\\n- 第一个：你的专属邮箱链接，使用“任何邮箱账户”向专属邮箱地址发送邮件时，它们都能被保存成任务。\\n- 第二个：todo@mail.dida365.com，你需要使用滴答清单的注册邮箱向此邮箱地址发送邮件，才能将邮件保存成任务。\\n\\n所以，如果你会同时使用多个邮箱，建议你将第一个邮箱地址保存到联系人里；如果你的常用工作邮箱只有一个，并且这个邮箱就是你的滴答账户邮箱的话，建议你将第二个邮箱地址保存到联系人里。\\n\\n以后遇到没时间立即处理的邮件，就转发给正确的邮箱地址，就能保存到滴答清单了。\\n:::\\n\\n ## iOS Siri 添加任务\\niOS 用户在滴答清单中开启「Siri 」功能，可以直接使用 Siri 添加任务。\\n\\n打开应用 - 「设置」-「导入与关联应用」- 找到「Siri」，选择开启。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/058dac02acfd28db0f1e5859b9824c57.png)\\n\\n###\\n开启“通过 Siri 添加任务”后，即可对 Siri 说:\\n- 添加“明天去图书馆”到滴答清单。\\n- 打开滴答清单app后，即可看到刚刚添加的任务。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/c46710a4f79503a98dac6af3184b5600.png)\\n\\n###\\n你还能使用更简单的句式，你需要开启「**从提醒事项自动导入**」，即可对 Siri 说：**提醒我“明天去图书馆”**。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/43742bbd87cb7aec1cce1c53e40939f0.png)\\n\\n- 开启后，滴答清单将在每次打开时自动导入“提醒事项”默认列表中的任务。\\n> 为避免任务在两个应用中同时提醒，每次导入后，“提醒事项”中的原任务会被删除。\\n\\n\\n## 剪贴板添加单个任务\\n如果你复制的内容中带有时间等特殊信息，可以通过滴答清单的「剪贴板添加任务」功能，快速将其添加为一个任务。\\n\\n- 在「设置」-「高级选项」- 开启「剪贴板添加任务」。\\n\\n选择开启后，如果剪贴板的内容包含“时间信息”时，打开应用后会在下方询问“**你可能想添加任务...**”，点击添加，即可创建成功。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/c2d784c8de92d5aa17ac962985693675.jpg)\\n\\n\\n> 如果当前剪贴板中无内容，或者内容中无可被识别的信息时，将不会获得询问。\\n###\\n\\n## 复制添加多个任务\\n复制多个换行文本，打开app后将会询问：“是否将每一行文本添加为独立的任务”，选择「添加」即可完成多个任务的创建。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/3d5f264332ee9ffd4073a7e1a4fef4f3.png)\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":151,\"order\":-1099511627776,\"status\":0,\"sectionId\":\"feature\",\"createdTime\":\"2022-07-07T03:56:53.362Z\",\"modifiedTime\":\"2026-10-03T18:06:35.030Z\",\"postId\":\"6950658877373284352\",\"__v\":0,\"parentId\":\"6950361599374786560\",\"pinInSearch\":false,\"area\":\"help-center\",\"shortTitle\":\"\"},{\"_id\":\"6638417f47c89fff9258e401\",\"author\":\"\",\"description\":\"\",\"title\":\"本地日历\",\"content\":\"如果你想要在滴答清单中显示当前设备中的日历事件，你可以通过订阅本地日历的方式轻松实现。\\n\\n\\n# 添加日历\\n:::::tabContainer [mobile|macOS]\\n\\n::::tab [mobile]\\n在「设置」-「导入与关联应用」-「本地日历」，开启「开关」即可在日历中查看本地日历。\\n\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/ff4f73344b6536b723ab4e049761a89d.png)\\n\\n\\n::::\\n\\n::::tab [macOS]\\n点击「头像」，选择「设置」-「导入与关联」-「本地日历」，开启「开关」即可在日历中查看本地日历。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/349dfb516dd992a54093a360c5d0205c.png)\\n![](/dida-assets/cdn.dida365.cn/hc/all/5c985e1e2ec1a3637f84c01192616f67.png)\\n\\n\\n\\n你还可以对本地日历进行设置「显示」、「仅日历中显示」、「隐藏」状态。\\n\\n::::\\n\\n:::::\\n\\n> 目前仅安卓、iOS、Mac 客户端可设置本地日历。\\n\\n\\n# 查看日历事件\\n订阅成功后可以在侧边栏「订阅日历」中查看日历事件。\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":3,\"order\":-1099511627776,\"status\":0,\"pinInSearch\":false,\"sectionId\":\"feature\",\"createdTime\":\"2024-05-06T02:33:35.217Z\",\"modifiedTime\":\"2026-05-08T06:48:30.911Z\",\"postId\":\"7193075395720118272\",\"__v\":0,\"parentId\":\"6949998599191134208\",\"area\":\"help-center\",\"shortTitle\":\"\"},{\"_id\":\"62c65c2d1e3a8b2ac64c83f8\",\"author\":\"\",\"description\":\"\",\"title\":\"任务详情\",\"content\":\"# 常用功能\\n\\n## 日期和时间段\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n进入任务详情页，点击 「日期 & 重复」，即可为任务设置日期。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/4b7efede00e18e9360db358ef67e4cc7.png)\\n\\n\\n\\n如果需要为任务添加具体的时间段，可以在日期选择框中切换到 「时间段」，然后选择「开始时间」和「结束时间」，你可以：\\n\\n- 设置单日时间段：例如 9:00–12:00。\\n\\n- 设置跨天时间段：点击 「全天」 按钮，即可将任务扩展为跨天或多天时间段。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/25a52a3542389fa39c408c8b0d527350.png)\\n\\n\\n\\n::::\\n\\n::::tab [desktop]\\n\\n右键单击任务，点击「日期」，即可为任务设置今天、明天、下周或者自定义时间。\\n\\n![--65.44%](/dida-assets/cdn.dida365.cn/hc/all/98703d56fa4ff3605b9b4fc55bec552d.png)\\n\\n\\n或者点击任务详情区域「设置日期」，即可为任务设置日期与时间。\\n\\n![--60.29%](/dida-assets/cdn.dida365.cn/hc/all/d4e23bc9ee11c0a4f405abbd6e253962.png)\\n\\n\\n如果需要为任务添加具体的时间段，可以在日期选择框中切换到 「时间段」，然后选择「开始时间」和「结束时间」，你可以：\\n\\n- 设置单日时间段：例如 9:00–12:00。\\n\\n- 设置跨天时间段：点击 「全天」 按钮，即可将任务扩展为跨天或多天时间段。\\n\\n![--60.29%](/dida-assets/cdn.dida365.cn/hc/all/a87f39a8759a7d3d2c80b77c13364044.png)\\n\\n::::\\n\\n:::::\\n\\n\\n关于如何设置提醒以及重复，我们为你准备了更详细的内容：\\n\\n👉 [ 如何为任务设置提醒](/articles/6950660229746917376)\\n\\n👉  [如何为任务设置重复](/articles/6950660365923385344)\\n\\n\\n\\n## 移动清单\\n\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n当任务越来越多，希望按照工作、生活、学习的方式分类整理？点击详情页上方的「清单」，即可快速将任务移至其他清单，你还可以输入清单名快速搜索清单。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/d8f8af2d5d0c73aa578d1b99ebcf6fb5.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n右键单击任务选择「移动到」，或者点击任务详情区域底部的「清单」，即可快速将任务移至其他清单，你还可以输入清单名快速搜索清单。\\n\\n![--68.56%](/dida-assets/cdn.dida365.cn/hc/all/abc03967118be6c586754cf26002f1da.png)\\n\\n::::\\n\\n:::::\\n\\n\\n\\n## 优先级\\n\\n\\n滴答清单为任务提供了4个优先级：高、中、低、无优先级，你可以根据任务的重要程度为其设置优先级。每天优先完成「高优先级任务」，让任务完成的井井有条。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/60326f6e9562f1a6f3eca984a7d2aa48.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n\\n![--68.56%](/dida-assets/cdn.dida365.cn/hc/all/64a7865c24e43186d71108fe76de0e97.png)\\n\\n::::\\n\\n:::::\\n\\n\\n## 正文（样式和Markdown）\\n\\n\\n:::::tabContainer [mobile|desktop]\\n\\n当你需要记录任务要点或补充更多详细信息时，可以在任务详情中进行编辑。\\n\\n- 方式 1：使用编辑工具\\n选中文本后，可通过底部编辑工具设置「标题」、「加粗」、「高亮」、「斜体」、「下划线」等格式。选中格式即可生效，取消选中即可移除对应格式。\\n\\n- 方式 2：使用 Markdown 语法\\n输入 Markdown 语法，并在语法后添加空格，即可触发对应的文本样式。\\n\\n\\n你还可以使用不同颜色的高亮标记重点内容，并通过标题展开与折叠快速浏览和整理长文。\\n\\n::::tab [mobile]\\n\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/84d1567e9c406120822604b8aeff1116.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/57a6b1eb92e49783771a3c44121a9183.png)\\n\\n\\n\\n还可以通过输入“/”，可以快速设置样式、添加标题、列表、附件、子任务等内容。\\n\\n::::\\n\\n:::::\\n\\n\\n\\n## 标签\\n\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n给任务添加标签，可以帮助我们更加便捷地管理任务。点击左下角的图标，就可以直接选择已有的标签，或者创建新标签。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/5f4b3bc2f37a26e076a809a8127d73f2.png)\\n\\n::::\\n\\n::::tab [desktop]\\n右键单击任务或者点击任务详情区域右下角「...」-「标签」，就可以直接选择已有的标签，或者创建新标签。\\n\\n![--68.56%](/dida-assets/cdn.dida365.cn/hc/all/94a093f304c678e21b154daf162f765f.png)\\n\\n::::\\n\\n:::::\\n\\n\\n\\n## 检查事项\\n\\n\\n滴答清单支持「任务文本内容」和「检查事项」之间进行切换。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n点击紧贴键盘上方右边的的切换按钮，即可切换。在检查事项模式下，换行即可创建一条新的检查事项。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/cb3826a371f5431fbdfb3c8c8f5b7973.png)\\n\\n::::\\n\\n::::tab [desktop]\\n点击任务详情区域右上方的切换按钮，即可切换。在检查事项模式下，换行即可创建一条新的检查事项。\\n\\n![--66.32%](/dida-assets/cdn.dida365.cn/hc/all/340de25e2b0163535bde01590186f31b.png)\\n\\n::::\\n\\n:::::\\n\\n编辑和管理检查事项：\\n- 选择一条检查事项，可以直接进行编辑；\\n- 点击检查事项右侧的「删除」按钮，可将整条检查事项删除；\\n- 长按右边的「≡」可以对检查事项进行拖动排序；\\n- 在检查事项编辑状态下键盘上方点击时钟按钮可以对检查事项设置提醒时间。\\n\\n\\n## 附件\\n\\n\\n在做笔记、写日志、整理资料时，我们常常需要插入图片，辅助记录。目前滴答清单已支持插入图片、录音、文件、视频等，码字如行云流水，笔记体验加倍流畅。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/910bca05a8d9f8b001450ddf7a7d7af5.png)\\n\\n::::\\n\\n::::tab [desktop]\\n\\n在电脑端，你还可以直接将附件拖入任务详情区域，完成快速上传。\\n\\n::::\\n\\n:::::\\n\\n>- 付费用户每天可上传 199 个附件，单个任务的附件限制为 39 个，每个附件大小不得超过 20 M。\\n>\\n> - 普通用户每天可上传 1 个附件，每个附件大小不得超过10M。\\n\\n## 进度\\n\\n对于需要持续推进的任务，可以记录任务的完成百分比，随时了解任务目前的进度。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n长按任务复选框，或者长按任务详情页的「日期与提醒」区域，即可设置任务进度。\\n\\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/18868490babb3dde76a111e3ee43f2d4.png)\\n\\n::::\\n\\n::::tab [desktop]\\n将鼠标悬停在「设置日期」下方的横线上，即可设置任务进度。\\n\\n![--62%](/dida-assets/cdn.dida365.cn/hc/all/e3a5315e9fe68716aa8b97f721055c8c.png)\\n\\n::::\\n\\n:::::\\n\\n> 如果任务包含检查事项，进度会根据已完成的检查事项自动计算。例如，一个任务包含 4 条检查事项，完成其中 1 条后，任务进度会自动更新为 25%。\\n\\n\\n## 在锁屏显示重要任务\\n\\n:::::tabContainer [iOS|鸿蒙]\\n\\n\\n::::tab [iOS]\\n重要任务一到时间就怕忘？点击「添加到实时活动」，把它固定在锁屏上，让任务一直可见，不用反复打开 App 也能持续关注重要事项。\\n\\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/44a09b4c77a6b44289d53de6a94519a7.png)\\n::::\\n\\n::::tab [鸿蒙]\\n重要任务一到时间就怕忘？点击「添加到实况窗」，把它固定在锁屏上，让任务一直可见，不用反复打开 App 也能持续关注重要事项。\\n\\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/cba032408aadf17e84a69d9e5a2e635c.png)\\n::::\\n\\n:::::\\n\\n\\n#  更多功能\\n\\n## 置顶\\n\\n高优先级任务过多，怎么快速找到最重要的任务？你可以将重要任务「置顶」，让其始终展示在列表的最前端，看一眼就心中有数。 \\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/632389039701e6fb546b7f4fa3d460e0.png)\\n\\n\\n\\n## 分享\\n\\n你可以将你的任务/笔记以文本、图片以及日程的方式分享给朋友、同事。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/d0645c892dd50abdbe60247fe4071ccb.png)\\n\\n\\n\\n## 放弃\\n\\n在处理任务时，总会有一些事情不想做了，但是又不想删除，希望以后回顾时还能看到怎么办？你可以选择「放弃」这个任务。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/457a81839d86dd41a19df39e0e341e39.png)\\n\\n\\n所有放弃的任务都会在侧边栏「已放弃」清单中统一查看和管理，同时可以在任务列表中的「已完成&已放弃」分组里显示。\\n\\n为了应对不确定的情况，已放弃的任务还可以标记重新开始，计划临时有变也没关系。\\n\\n\\n## 评论\\n\\n\\n在共享清单中，我们可以在任务下进行评论用于团队协作。在自己专属的清单里，你也可以将评论用作备注。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/2a715d7454f397daaf2f99c1e906e09f.png)\\n\\n\\n## 复制链接\\n\\n\\n将一个任务的链接复制粘贴至另一个任务中，点击链接即可实现任务跳转。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/a95101ea4f9fe686fc72e5cc3a4d919b.png)\\n\\n\\n\\n## 创建副本\\n\\n\\n如果你希望复制一个一样的任务，在原来的基础上做修改，可以直接点击创建副本。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/69b833b0a59cd4d1e38d45817a222930.png)\\n\\n\\n\\n\\n\\n\\n## 保存为模板\\n\\n\\n新功能文档发布、线下活动会场布置、宣传视频制作投放…… 日常工作中有不少定期循环的常规任务，我们应有意识地将这些经验总结沉淀为个人方法论，建立自己的规则秩序，再次遇到同类事情时、直接遵循之前的方法即可。\\n\\n进入任务详情页，点击右上角「···」-「保存为模板」， 利用模板功能，将常规工作流程保存下来，为往后的行动提供参考。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/8f6c69d919648bdb333d58befbd0ba84.png)\\n\\n\\n:::::: spoiler 如何使用任务模板？\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n\\n添加任务时，点击任务输入弹窗下方的「...」按钮，选择「模板」即可从模板添加任务。\\n\\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/3d6820abd9bacbab6896e6709733a66a.png)\\n\\n::::\\n\\n::::tab [desktop]\\n\\n点击任务输入框后，点击下拉按钮，选择「从模板添加」。\\n\\n![--66.19%](/dida-assets/cdn.dida365.cn/hc/all/c5c0c6d38c4ab38763b4d2c5e4c657e7.png)\\n\\n或者在输入框输入 “ / ” 打开斜杠菜单，选择「从模板添加」。\\n\\n![--67.58%](/dida-assets/cdn.dida365.cn/hc/all/71585814dc1669dfa23043771c64362d.png)\\n\\n::::\\n\\n:::::\\n\\n::::::\\n\\n## 任务动态\\n\\n辛苦编辑好的文字不小心被删除？共享协作时不清楚任务被谁修改？遇到这样的情况，可以在「任务动态」中查看历史信息。\\n\\n进入任务详情页，点击右上角「...」-「更多」「任务动态」，就可以查看任务的历史修改信息。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/99ea56c618307e07bd76ecedf54be7b1.png)\\n\\n\\n## 转换为笔记/任务\\n\\n\\n有时候做着做着越发觉得一个任务更像是一篇笔记？不用担心，滴答清单支持任务与笔记互相转换。\\n\\n进入任务详情页，点击右上角「...」-「转为为笔记」，即可完成转换。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/e4b6280b6d618d62cf90567bfdd95d1d.png)\\n\\n## 开启专注\\n\\n\\n在「专注模块」里开启「专注」后，无需切换至番茄专注页面，在任务详情页即可快速专注任务。\\n\\n进入任务详情页，点击右上角「...」-「开始专注」，在专注窗口选择时间并「开始番茄专注」。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/0911e2497cf88827f789db9f1f54f67e.png)\\n\\n\\n## 如何编辑详情操作菜单？\\n\\n\\n在任务详情页或者弹窗中点击右上角「...」-「更多」，找到左下角「编辑」即可自定义任务详情操作菜单。\\n\\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/de0bbb0f425b1a507630e02681385e99.png)\\n\\n点击「-」取消置顶，点击「+」进行置顶，长按右侧图标上下拖动即可对各操作进行排序。\\n\\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/efb19f828e29dccb1464d79e349eab72.png)\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":44,\"order\":-824633720832,\"status\":0,\"sectionId\":\"feature\",\"createdTime\":\"2022-07-07T04:08:13.835Z\",\"modifiedTime\":\"2026-09-18T10:11:37.765Z\",\"postId\":\"6950661731483910144\",\"__v\":0,\"parentId\":\"6950361599374786560\",\"pinInSearch\":false,\"area\":\"help-center\",\"shortTitle\":\"\"},{\"_id\":\"6aacfbba035abcbe8d77e172\",\"author\":\"\",\"description\":\"\",\"title\":\"编辑与排版\",\"content\":\"滴答清单编辑器支持 **Markdown** 和可视化编辑工具，你可以在任务、笔记等内容中使用不同的文本格式，帮助你更清晰地记录、整理和查看内容。\\n\\n# 设置文本格式\\n## 使用编辑工具栏\\n你可以直接通过编辑工具栏设置文字格式，无需记忆 Markdown 符号。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n\\n编辑内容时，可以使用底部工具栏选择对应的文本格式。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/16f092c977f11bc64f47baba41e6be83.png)\\n\\n::::\\n\\n::::tab [desktop]\\n编辑内容时，可以使用底部工具栏、编辑菜单。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/cc8d6c8eb8b204304e0f7cf87ef7cea4.png)\\n\\n输入 `/` 打开快捷菜单，选择需要的格式。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/aa1fb7c61f8881bec0e3f25938377534.png)\\n\\n::::\\n\\n:::::\\n\\n\\n## 使用 Markdown\\n如果你习惯使用 Markdown，也可以直接输入对应的 Markdown 符号，快速设置文本格式。\\n> 注意： 部分 Markdown 格式需要在符号后输入空格，才能触发对应的样式。\\n\\n| 输入方式          | 效果      |\\n| ------------- | ------- |\\n| `#` + 空格      | 一级标题    |\\n| `##` + 空格     | 二级标题    |\\n| `-` + 空格      | 无序列表    |\\n| `1.` + 空格     | 有序列表    |\\n| `- [ ]` + 空格  | 待办列表    |\\n| `>` + 空格      | 引用      |\\n| ``` + 换行      | 代码块     |\\n| `**文字**` + 空格 | **加粗**  |\\n| `==文字==` + 空格 | 高亮      |\\n| `*文字*` + 空格   | *斜体*    |\\n| `~~文字~~` + 空格 | ~~删除线~~ |\\n| `---`         | 水平分割线   |\\n\\n\\n## 修改或取消格式\\n在编辑内容时，你可以随时修改已有格式，也可以取消不需要的格式。不同格式还可以组合使用，让重点更加清晰。\\n\\n**切换已有格式**\\n\\n如果已经设置了某种格式，但后来想换成其他样式，可以选中文字后直接选择新的格式。\\n\\n> 例如：将「项目截止时间」设置为**加粗**，后来希望它更加醒目，可以选中这段文字，将其改为**高亮**，也可以同时使用加粗和高亮。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/a91d06dd384f79f6837cc9ed528ea045.png)\\n\\n这样可以根据内容的重要程度，随时调整文字的展示方式。\\n\\n**取消格式**\\n\\n如果不再需要某种格式，可以选中文字后，通过编辑工具栏取消对应格式，让文字恢复为普通文本。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/5638d6893b444e755b7486d6e1f64ca2.png)\\n\\n**组合使用多种格式**\\n\\n不同格式可以组合使用，用于突出不同类型的信息。\\n\\n例如：\\n- 加粗 + 高亮：突出重要信息\\n- 斜体 + 高亮：强调补充说明\\n- 加粗 + 删除线：突出已修改或取消的内容\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/3c8e4311cab08d430930fc9045f77e15.png)\\n\\n你可以根据内容需要组合使用不同的文本格式，让重点更加清晰。\\n\\n# 组织和丰富内容\\n当内容比较多时，可以使用列表、图片、文件、日期、链接等内容，让信息更有层次，也方便后续查看。\\n## 使用列表整理内容\\n根据内容的不同，可以使用有序列表、无序列表或待办列表。\\n\\n### **有序列表**\\n\\n适合整理有明确**先后顺序**的内容，例如操作步骤、工作流程或旅行计划。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n选中内容后，在底部工具栏中选择「有序列表」。 \\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/d3bc161de350779ec099d436705f3f12.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n选中内容后，在底部工具栏或编辑菜单中选择「有序列表」。 \\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/54d77197d5b5454d4446b50c3807b9f6.png)\\n\\n\\n\\n::::\\n\\n:::::\\n\\n\\n> 也可以使用 Markdown：输入 `1`. 后加空格，即可开始有序列表。 \\n\\n### **无序列表**\\n\\n适合整理没有固定先后顺序的并**列信息或要点**，例如会议记录、灵感、购物清单等。\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n选中内容后，在底部工具栏中选择「无序列表」。 \\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/74951f5938171f53405aa417126e4dca.png)\\n\\n::::\\n\\n::::tab [desktop]\\n选中内容后，在底部工具栏或编辑菜单中选择「无序列表」。 \\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/982c3573fbb8f0059d7b20dbeebd7591.png)\\n\\n::::\\n\\n:::::\\n\\n> 也可以使用 Markdown：输入 `-` 后加空格，即可开始无序列表。 \\n\\n### **待办列表**\\n适合整理需要逐项完成的事项，例如工作任务、活动准备、旅行准备等。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n在底部工具栏中选择「待办列表」。 \\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/0e4ea92a1fe1c9913917e2cda4907516.png)\\n\\n::::\\n\\n::::tab [desktop]\\n在编辑工具栏或编辑菜单中选择「待办列表」。 \\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/7ceabee5b8ae5291efb0998eabada8f9.png)\\n\\n\\n::::\\n\\n:::::\\n\\n\\n> 也可以使用 Markdown：输入` - [ ]` 后加空格，即可创建待办列表。 \\n\\n\\n## 添加其他内容\\n除了文字和列表，你还可以在内容中添加图片、文件、日期、链接和代码块，让一条内容包含更完整的信息。\\n\\n### **图片和文件**\\n\\n当文字不足以说明问题时，可以添加图片或文件作为补充。\\n\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/a37f9b32be9ae8ccfccd715133577dac.png)\\n\\n### **日期**\\n\\n如果内容与具体时间有关，可以添加日期，方便记录和查看。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/d4a7341fbdb35b8c864223fd1be4cc5c.png)\\n\\n\\n### **链接**\\n\\n如果需要引用网页或在线资料，可以直接添加链接。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/58871766263352f93e71748f8dd267cf.png)\\n\\n### **代码块**\\n\\n如果需要记录代码、命令或其他需要保持原有格式的文本，可以使用代码块。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/e83348545b88ac7d3739f25f8e264010.png)\\n\\n## 折叠较长内容\\n当一条内容包含较多信息时，可以使用不同等级的标题划分内容，并折叠暂时不需要查看的部分，让内容结构更清晰，也方便快速浏览。\\n\\n### 使用标题组织内容\\n可以根据内容结构，使用不同等级的标题。\\n在 Markdown 中：\\n- `#` + 空格：一级标题\\n- `## `+ 空格：二级标题\\n- `###` + 空格：三级标题\\n\\n以此类推，可以根据内容的层级和复杂程度添加不同等级的标题。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/d0a7b50fbcce6c63d715cdd84f3139b5.png)\\n\\n### **折叠 / 展开标题下的内容**\\n\\n创建标题后，可以点击标题旁的折叠按钮，将该标题下的内容暂时收起；再次点击即可展开。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/834009f86950551fa7f5c3890f3b5a94.png)\\n\\n# 复制和粘贴内容\\n为了减少粘贴后的手动排版，编辑器会保留支持的富文本格式，并识别纯文本中的部分 Markdown 写法。**其他应用独有的样式不支持识别** ，粘贴后的显示可能与原内容不同。\\n\\n**常见复制粘贴场景**\\n\\n|           **复制来源**           | **粘贴后的效果**                                    |\\n| :--------------------------: | :-------------------------------------------- |\\n|      在滴答清单编辑器中复制，再粘贴回编辑器     | 保留原有格式和内容结构                                   |\\n| 从部分 AI 工具、Notion、飞书等复制带格式的文字 | 按富文本处理，保留支持的格式，如加粗、斜体、链接等                     |\\n|         从记事本等纯文本工具复制         | 保留文字和换行，并识别部分 Markdown 语法                     |\\n|          复制其他应用特有的格式         | 不识别不支持的特殊格式                                   |\\n|         从滴答清单复制到其他应用         | 格式是否保留取决于目标应用；如果目标应用仅支持纯文本，文字样式、待办勾选状态等信息可能丢失 |\\n\\n\\n**纯文本的特殊识别**\\n\\n为了减少重复设置格式，粘贴纯文本时，编辑器会识别以下写法并进行转换：\\n\\n|    **粘贴内容**    | **处理结果**         |\\n| :------------: | :--------------- |\\n|     `# 标题`     | 转换为标题            |\\n| `- 项目`、`1. 项目` | 转换为对应列表          |\\n|     `> 引用`     | 转换为引用            |\\n|       网址       | 自动识别为链接          |\\n|    `**文字**`    | 转换为加粗            |\\n|     `*文字*`     | 保留 `*` 符号，不转换为斜体 |\\n\\n::: spoiler 为什么保留单星号？\\n有些文本中的 `*` 是内容本身，并不是斜体标记。为避免误识别、改变原文，编辑器不会将 `文字` 自动转换为斜体。从其他应用复制的实际斜体文字，仍可通过富文本格式保留。也可以在粘贴后选中文字，通过编辑工具栏设置斜体。\\n:::\\n# 常见问题\\n\\n::: spoiler 从其他应用复制内容后，为什么部分格式发生了变化？\\n不同应用支持的文本格式不同，复制到滴答清单时会根据内容进行转换，因此部分特殊格式可能无法完全保留。\\n\\n桌面端支持从 Notion、Bear、飞书，以及 ChatGPT、Claude、Gemini、DeepSeek、Kimi、通义千问、豆包等常见应用复制内容。\\n:::\\n\\n::: spoiler 为什么完成框复制到其他应用后变成了无序列表？\\n\\n完成框在复制到其他应用时，会转换为无序列表样式。这是正常的复制行为。\\n:::\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":0,\"order\":-687194767360,\"status\":0,\"pinInSearch\":false,\"sectionId\":\"feature\",\"area\":\"help-center\",\"createdTime\":\"2026-09-18T08:52:10.132Z\",\"modifiedTime\":\"2026-09-18T10:11:14.377Z\",\"postId\":\"7506636172735545344\",\"__v\":0,\"shortTitle\":\"\",\"parentId\":\"6950361599374786560\"},{\"_id\":\"62c65ac71e3a8b2ac64c8397\",\"author\":\"\",\"description\":\"\",\"title\":\"超强大的提醒功能\",\"content\":\"当你的任务设置了「提醒」，将会根据你设置的提醒时间，按时提示你，帮助你高效完成各个任务。\\n\\n# 如何设置提醒\\n\\n\\n在任务详情页，点击任务标题上方的「日期&重复」按钮，选择「设置提醒」。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/8f1aeba4fb5dbad765b095d5e92df7af.png)\\n\\n\\n\\n你还可以为任务设置「多个提醒」。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/08e87e88f224982a5bceaafb0639ef22.png)\\n\\n\\n\\n\\n\\n::: spoiler 如何自定义提醒时间？\\n在设置提醒时选择 **自定义**，即可自由选择所需的提醒时间。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/06cd9612202fd3607be3d8d085641e44.png)\\n\\n\\n:::\\n\\n::: spoiler 如何为任务设置同样的提醒？\\n你可以通过修改「任务默认值」，在「设置」-「更多设置」-「任务默认值」-「默认提醒」中选择常用的提醒，将它设置为默认提醒。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/b7a42b128fc51bdfc8e7de87fb2c6895.png)\\n\\n\\n\\n- 你还可以为任务设置「默认日期」、「默认优先级」、「默认清单」等等。\\n:::\\n\\n\\n# 提醒弹窗\\n\\n为任务设置好提醒时间后，到时间滴答清单会准时提醒你完成这个任务。\\n\\n将会弹出「提醒弹窗」提醒你处理任务。你可以根据自己的实际情况，选择「忽略」、「开始专注」、「完成」以及「稍后提醒」。\\n\\n除了在应用内收到提醒，你还可以在应用外以及锁屏时收到提醒弹窗。\\n\\n\\n::: spoiler 为什么没有收到提醒？\\n可以在「设置」-「声音、提醒与通知」中开启通知权限。\\n\\n:::\\n\\n::: spoiler 为什么任务没有准时提醒？\\n因为安卓系统限制的原因，部分手机需要在「设置」- 「声音、提醒与通知」中，开启「闹钟模式」。\\n:::\\n\\n# 微信提醒\\n除此之外，滴答清单还支持「微信提醒」，当你的任务设置了提醒，将会根据你设置的提醒时间，同步在「微信」中给你提示。\\n\\n![60%](/dida-assets/cdn.dida365.cn/hc/all/889f5123e6d03c77bae1394ef930dbd9.gif)\\n\\n::: spoiler 如何开启微信提醒？\\n👉🏻在「设置」-「声音、提醒与通知中」-「微信提醒」中完成微信绑定，开启微信提醒。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/62d0cced8830ab920163085c5aea3dee.png)\\n\\n:::\\n\\n\\n# 更多场景下的任务提醒\\n## 农历生日提醒\\n及时的生日祝福不仅能够增加与他人亲密友好关系，也会让我们自己感到快乐和满足。在滴答清单中设置「农历生日提醒」，再也不用担心会忘记家人朋友的生日。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n在「设置」-「显示农历」开启后，选择农历日期对应的阳历日期，点击「设置重复」，选择「农历每年重复」即可。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/6709b85a51f449704dc8b3defc47b19c.png)\\n\\n\\n如果你需要农历每月提醒，在「设置」-「显示农历」开启后，选择农历日期对应的阳历日期，点击「设置重复」，选择「农历重复」-「农历每月」重复即可。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/d5c8490c84b1e4cb0a79103608b08863.png)\\n\\n\\n\\n::::\\n\\n::::tab [desktop]\\n\\n1. 可以在「设置」-「日期与时间」- 开启「显示农历」，然后就可以选择对应的阳历日期。\\n\\n2. 或者在「设置」-「更多设置」-「智能识别」- 开启「日期识别」后，可以直接输入农历日期。\\n\\n![--65.44%](/dida-assets/cdn.dida365.cn/hc/all/4a79b34c72a0514ceb3c83d1cca38efb.png)\\n\\n::::\\n\\n:::::\\n\\n\\n\\n## 艾宾浩斯提醒\\n我们经常在学习一项新的内容时发现忘得特别快，比如背单词。滴答清单支持「艾宾浩斯重复」，能有效帮你科学安排学习周期，提高你的学习效率。\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n进入任务详情页，点击「日期&重复」-「重复」-「艾宾浩斯记忆法」。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/42892f7bebb88f936782d4a9bb235158.png)\\n\\n\\n\\n设置后，该任务就会按记忆曲线添加到你未来的日程中。你还可以根据背诵效果，选择「按日期结束重复」或「按次数结束重复」。\\n::::\\n\\n::::tab [desktop]\\n进入任务详情页，点击「日期&重复」-「设置重复」-「艾宾浩斯记忆法」。\\n\\n![--77.82%](/dida-assets/cdn.dida365.cn/hc/all/1777a02e3dacfd9ae266b65917f78b78.png)\\n\\n设置后，该任务就会按记忆曲线添加到你未来的日程中。你还可以根据背诵效果，选择「按日期结束重复」或「按次数结束重复」。\\n\\n::::::\\n\\n##  位置提醒\\n\\n你是否有些事项是需要到达具体的地点才能做成的，比如“去打印店复印公司文化宣传册\\\"，然后现实却是，路过打印店时，完全把这件事忘在脑后......\\n\\n而「位置提醒」功能，能够帮你一招搞定这些烦恼。\\n\\n- 创建任务例如 “到店复印公司文化宣传册”，进入任务详情页，点击右上角「…」-「位置」，输入打印店位置。\\n- 设置成功后，当你到达打印店位置，滴答清单就会自动提醒你。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/1b3d72d402ef6f61ab96fdf491e3b217.png)\\n\\n\\n> 「位置提醒」暂时只支持在iOS应用使用。\\n\\n\\n\\n\\n## 结束时间提醒\\n当你有一个会议或活动安排时，如何轻松知道活动何时结束，不错过任何截止期限呢？通过设置结束时间提醒，你可以在活动接近尾声时得到提醒，确保任务按时结束。\\n\\n在设置任务时间段后，选择「提醒」，勾选「结束时」即可。设置后，你将会在该任务的结束时间收到提醒。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/a3093aabb095da69654a3534deb1f248.png)\\n\\n\\n\\n# 如何设置提醒铃声\\n为任务设置好提醒时间后，你可以在「设置」-「声音、提醒与通知」-「提醒铃声」中选择自己喜欢的铃声。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/4f7c2680a9dc6005b64b6510bea84dc4.png)\\n\\n\\n如果你想为“不同优先级的任务“设置”不同的提示铃声”：时间一到，不用打开手机也能通过铃声来分辨任务的优先级，你可以开启「按优先级设置提醒」。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/efaf06c64f3a81aafe328e3eb5717e89.png)\\n\\n\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":73,\"order\":-549755813888,\"status\":0,\"sectionId\":\"feature\",\"createdTime\":\"2022-07-07T04:02:15.794Z\",\"modifiedTime\":\"2026-08-04T08:56:31.558Z\",\"postId\":\"6950660229746917376\",\"__v\":0,\"parentId\":\"6950361599374786560\",\"pinInSearch\":true,\"area\":\"help-center\",\"shortTitle\":\"\"},{\"_id\":\"68ca846c146cefaafc2f3116\",\"author\":\"\",\"description\":\"\",\"title\":\"持续提醒\",\"content\":\"重要会议、考试、抢票等重要的事情，不容错过！持续提醒会一直提醒你，直到你进行处理，让你再也不用担心遗漏重要事项。\\n\\n# 开启方式\\n:::::tabContainer [iOS|Android]\\n\\n\\n::::tab [iOS]\\n为任务设置提醒时间后，开启 「持续提醒」 开关即可。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/59428d3d4450d25804dc6a7a385f34fc.png)\\n\\n\\n**提醒方式说明（iOS 26 及以上）**\\n\\n如果你已升级至 iOS 26，在开启「持续提醒」后，可以选择以下两种提醒方式之一：\\n \\n* **闹钟提醒**：以系统闹钟形式持续提醒\\n \\n \\n* **通知提醒**：以系统通知形式持续提醒\\n \\n ![l](/dida-assets/cdn.dida365.cn/hc/all/2ab900ae297512ce7e1f5d4d2992e8ce.png)\\n\\n**权限说明**\\n\\n如选择 **闹钟提醒**，需要先授权滴答清单使用 **系统闹钟权限**，否则该提醒方式将无法启用。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/3d3173141b3a930fea941f82bd09ac44.png)\\n\\n::::\\n\\n::::tab [Android]\\n为任务设置提醒时间后，开启 「持续提醒」 开关即可。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/962103a9b2fc9efa5ef8484adfc68902.png)\\n\\n::::\\n\\n:::::\\n\\n\\n\\n# 开启效果\\n\\n:::::tabContainer [iOS|Android]\\n\\n::::tab [iOS]\\n**系统闹钟提醒(iOS 26)**\\n\\n当到达提醒时间时，你将会收到闹钟提醒，会持续提醒直到你进行处理。\\n- 全屏强提醒：锁屏界面全屏显示。\\n- 不受勿扰/静音模式限制：即使你的设备开启了静音、勿扰模式或睡眠焦点模式，系统闹钟也会强制响铃和振动。\\n- 不受 App 状态限制：即使滴答清单 App 已被关闭或从后台划掉，闹钟提醒依然会准时响起。\\n\\n\\n![m--205.17%](/dida-assets/cdn.dida365.cn/hc/all/d48077abaa4e5f8b8e1ac849a844c18a.jpg)\\n\\n- 点击“稍后提醒”，可前往应用设置稍后提醒时长。\\n- 点击“关闭”，则不再提醒。\\n- 按“电源键”或“音量键”，自动设置 9 分钟后再次提醒（同系统闹钟一致）。\\n\\n**稍后提醒**\\n\\n设置稍后提醒后，还可以看到稍后提醒的倒计时实时活动，倒计时结束时你将再次收到提醒。\\n\\n![l--101.62%](/dida-assets/cdn.dida365.cn/hc/all/7c862b976a87082e0b0962b7ca07160f.png)\\n\\n>  实时活动：需 iOS 16 及以上系统版本，并授权“实时活动”权限（前往 iOS 「系统设置」>「App」>「滴答清单」>「实时活动」，允许实时活动）。\\n\\n\\n\\n::: spoiler 为什么没有闹钟提醒效果？\\n1. 检查系统版本：确保你的 iPhone 已升级到 iOS 26 或更高版本。此功能是 iOS 26 的新特性。\\n2. 检查权限：请确保你已为滴答清单授予“闹钟”系统权限。可以在「系统设置」 > 「App」> 「滴答清单」中检查并开启“闹钟”权限。\\n\\n![l--101.62%](/dida-assets/cdn.dida365.cn/hc/all/cb23a7ece5c1912ee1d993c83860c78a.png)\\n:::\\n\\n\\n::: spoiler 授权闹钟权限后，持续提醒一定会响铃吗？\\n一定会响铃和振动。这是系统级闹钟的核心特性，能够突破所有静音和勿扰模式限制，提供 100% 可靠的强提醒。\\n:::\\n\\n\\n::: spoiler 如果我有多个任务同时提醒，闹钟提醒效果是什么？\\n受iOS系统限制，闹钟界面同一时间只全屏显示一个任务。但所有任务的应用通知都会正常发送并在通知中心显示，你不会错过任何提醒。\\n:::\\n\\n\\n\\n::: spoiler 旧版“持续提醒”的提醒效果还有吗？\\n仍然保留。如果你未授权\\\"闹钟\\\"权限，应用将自动降级使用旧版应用通知效果进行提醒。\\n:::\\n\\n\\n**应用通知提醒(iOS 18 及以下)**\\n\\n若未授权“闹钟”权限或 iOS 26 以下系统版本，应用将自动降级使用旧版应用通知效果进行提醒。\\n- 1min 内 2 次提醒，直到你进行处理。\\n\\n![m--218.06%](/dida-assets/cdn.dida365.cn/hc/all/a71b1db04c7831f5884e100daaa26f7a.png)\\n\\n\\n::::\\n\\n\\n\\n::::tab [Android]\\n\\n当到达提醒时间时，你将会收到应用通知提醒，提醒会以“响 30 秒、停 30 秒”的节奏循环播放，持续 5 分钟，直到你处理该提醒。\\n\\n![m--218.06%](/dida-assets/cdn.dida365.cn/hc/all/8f6252a166a4928f9267bd8f93836916.png)\\n\\n::::\\n\\n:::::\\n\\n\\n\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":3,\"order\":-412316860416,\"status\":0,\"pinInSearch\":false,\"sectionId\":\"feature\",\"area\":\"help-center\",\"createdTime\":\"2025-09-17T09:50:36.801Z\",\"modifiedTime\":\"2026-05-04T13:03:53.443Z\",\"postId\":\"7374016921986924544\",\"__v\":0,\"shortTitle\":\"\",\"parentId\":\"6950361599374786560\"},{\"_id\":\"692eb783fd36d294de7a7152\",\"author\":\"\",\"description\":\"\",\"title\":\"推荐任务\",\"content\":\"待处理的任务还有很多，却不知道该从哪些任务开始时，试试「**推荐任务**」。它会根据任务的时间、修改频率、到期时间等因素，对任务进行归类展示，帮助你更快决定“今天做什么”。\\n\\n# 推荐任务入口\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n在「今天」智能清单中，点击右上角的「💡」-「**推荐任务**」即可查看推荐任务。\\n\\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/2d196518afc9b5ce3cc495737d6dcd95.png)\\n\\n::::\\n\\n::::tab [desktop]\\n在「今天」智能清单中，点击右上角的「**推荐任务**」按钮即可查看推荐任务。\\n\\n![--65.64%](/dida-assets/cdn.dida365.cn/hc/all/815b0bb6eeb5849a64182bf8c2e1512d.png)\\n\\n::::\\n\\n:::::\\n\\n# 查看推荐任务\\n\\n根据任务的创建时间、修改记录、创建时间和截止日期，我们帮你整理出了四类推荐任务。\\n\\n## 最近添加\\n\\n担心忘记那些刚添加、但没有安排时间的任务？在「最近添加」分组中，你可以查看**刚刚**、**今天**、**昨天**添加、未设定时间的新任务。快速回顾这些新任务，并将需要尽快处理的安排到「今天」。\\n\\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/8e9874481da0eb0e18e139abca082bc6.png)\\n\\n\\n## 多次修改时间\\n\\n你是否有些任务一拖再拖却始终没有完成？在「多次修改」分组中，任务会按修改时间的次数顺序从高到低排序。点击「多次修改」进入详情页，查看修改**超过 5 次**、**超过 3 次**、**超过 2 次**的任务，选择并优先处理那些拖延很久的任务。\\n\\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/22010adf7cdbbc8c3a5d2c99d27eb50c.png)\\n\\n\\n## 长时间未完成\\n\\n有些任务创建了很久却一直没有完成？在「长时间未完成」分组中，你可以查看那些被搁置已久的任务，比如：创建**超过7天**、**超过14天**、**超过30天**未完成的任务。浏览这些久未行动的事项，挑选还要继续推进的任务安排到今天。\\n\\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/7a0e553cae2dbd95944f7ca9ad703a36.png)\\n\\n\\n## 即将到来\\n\\n今日的任务都已经完成，还有剩余时间？在「即将到来」分组中，你可以查看**明天**、**后天**到期的任务。选择即将到期任务安排到今天提前处理，让你的执行节奏更加从容。\\n\\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/1167a944335efd3dea9db8b0b31e3e0a.png)\\n\\n\\n# 添加到「今天」\\n\\n从推荐任务列表中，挑选你想今天执行的任务，点击右侧的 「**+**」 按钮，即可快速将任务添加到「今天」，无需手动复制或编辑。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n\\n![m--216.42%](/dida-assets/cdn.dida365.cn/hc/all/3c49450b36df1c366845e187d2f6aaef.png)\\n\\n\\n\\n::::\\n\\n::::tab [desktop]\\n\\n![--65.64%](/dida-assets/cdn.dida365.cn/hc/all/6d313f74a434c8b2262ed746aaee7471.png)\\n\\n\\n::::\\n\\n:::::\\n\\n\\n# 常见问题（FAQ）\\n\\n::: spoiler 1. 推荐任务会在我所有任务中进行推荐吗？推荐范围是什么？\\n\\n推荐任务将筛选所有无重复、非今天的未完成任务，再根据一定的条件进行分类推荐。\\n\\n:::\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":2,\"order\":-343597383680,\"status\":0,\"pinInSearch\":false,\"sectionId\":\"feature\",\"area\":\"help-center\",\"createdTime\":\"2025-12-02T09:55:15.369Z\",\"modifiedTime\":\"2026-08-04T09:01:32.325Z\",\"postId\":\"7401559568137846784\",\"__v\":0,\"shortTitle\":\"\",\"parentId\":\"6950361599374786560\"},{\"_id\":\"64a50fcc31d66f601dcba1d0\",\"author\":\"\",\"description\":\"\",\"title\":\"固定时间与固定时区\",\"content\":\"滴答清单提供了「时区」功能，协助经常出国的用户们应对时区变化。\\n# 开启时区\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n点击「设置」 -「日期与时间」 - 开启「时区」开关。开启后，在为任务设置时间时，即可选择「固定时区」或「固定时间」。\\n\\n![l--101.62%](/dida-assets/cdn.dida365.cn/hc/all/d773beba12919c62d01128b613948ac1.png)\\n::::\\n\\n::::tab [desktop]\\n点击「头像」-「设置」 - 「日期与时间」- 开启「时区」开关。开启后，在为任务设置时间时，即可选择「固定时区」或「固定时间」。\\n\\n![--60.29%](/dida-assets/cdn.dida365.cn/hc/all/3215d383c245f611cbd22b628ffab3ea.png)\\n\\n::::\\n:::::\\n\\n# 设置时区\\n\\n\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n可以在任务「日期弹窗」-「时间」- 选择「固定时区」或者「固定时间」。\\n\\n![l--101.62%](/dida-assets/cdn.dida365.cn/hc/all/ff3c01d07170a6ba325f23cb502d6dc0.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n可以在任务「日期弹窗」-「时间」- 选择「固定时区」或者「固定时间」。\\n\\n![--63.65%](/dida-assets/cdn.dida365.cn/hc/all/d3e01d83ea944499021d6b19e1278d40.png)\\n\\n::::\\n:::::\\n\\n# 固定时区\\n\\n选择「固定时区」，即意味着任务的时间会随着所在时区的不同而改变。\\n\\n- 示例 1： 如果你从北京飞到莫斯科，那么北京时间上午 11 点的任务，将会显示为莫斯科时间上午6点。\\n\\n当某件事情的时间是基于某一个时区的（比如北京时间上午 9 点抢春运火车票），那么即便你在国外，也可以使用「固定时区」来自动计算对应的当地时间。\\n\\n另外，「固定时区」不仅能应对个人出国的情况，还对跨时区协作有所帮助：\\n\\n- 示例 2： 在伦敦的同事通知你伦敦时间上午10点开会，你只需要在添加任务后：选择「固定时区」- 选择伦敦时间 - 将任务时间设置为上午10点。任务就会自动计算在北京时间18点提醒你进行会议了。\\n\\n# 固定时间\\n\\n选择「固定时间」，即意味着不论所处时区如何变化，任务的时间都会保持一致。\\n\\n- 示例： 你习惯每天早上7点进行晨跑，只需要将任务时间设置为上午7点并选择「固定时间」。\\n\\n这样一来，不论你是在洛杉矶出差，还是在巴塞罗那旅游，滴答清单都会在当地时间上午7点提醒你早起运动。\\n\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":5,\"order\":-274877906944,\"status\":0,\"pinInSearch\":false,\"sectionId\":\"feature\",\"createdTime\":\"2023-07-05T06:38:04.281Z\",\"modifiedTime\":\"2026-08-04T09:21:41.377Z\",\"postId\":\"7082246235360329728\",\"__v\":0,\"parentId\":\"6950361599374786560\",\"area\":\"help-center\",\"shortTitle\":\"\"},{\"area\":\"help-center\",\"_id\":\"62c3f2960223aebb27da2583\",\"author\":\"\",\"description\":\"\",\"title\":\"日历订阅\",\"content\":\"日历已经成为我们生活中不可或缺的一部分，能有效地帮助我们规划时间，安排任务，及时提醒我们即将临近的重要事件。\\n\\n订阅日历是一种日历共享的方式，将第三方日历订阅显示在滴答清单中，可轻松实现日历事件的自动更新和同步，显著提高时间管理和日程安排的效率。\\n\\n![--50.37%](/dida-assets/cdn.dida365.cn/hc/all/3af1d24b41d14ad6959139cbb55e40b2.png)\\n\\n- [本地日历](/articles/7193075395720118272)\\n- [Google 日历](/articles/6950000554735042560)、[iCloud 日历](/articles/7190959639616290816)\\n- [Outlook 日历](/articles/7190959706343473152)、[Exchange 日历](/articles/7193074856341012480)\\n- [企业微信、钉钉、飞书、QQ 邮箱日历](/articles/7190959806838996992)\\n- [URL ](/articles/7190979764138541056)\\n\\n\\n\\n除此之外，我们也支持将滴答清单，订阅到其他应用中 →[在第三方日历中订阅滴答清单\\n](/articles/6950000444106080256)\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":7,\"order\":0,\"status\":0,\"sectionId\":\"feature\",\"createdTime\":\"2022-07-05T08:13:10.777Z\",\"modifiedTime\":\"2026-08-29T04:11:31.731Z\",\"postId\":\"6949998599191134208\",\"__v\":0,\"parentId\":\"6949998557218734080\",\"pinInSearch\":false},{\"_id\":\"62c3f4690223aebb27da25b3\",\"author\":\"\",\"description\":\"\",\"title\":\"Google 日历\",\"content\":\"\\n如果你使用的第三方日历是 Google 日历，可以选择“从 Google 日历订阅”或“关联到 Google 日历”。\\n\\n**从 Google 日历订阅**\\n\\n当你希望能够在滴答清单中处理你所有大大小小的事情，你可以试试“从 Google 日历订阅”，将 Google 日历事件显示在滴答清单中。\\n\\n![--50.15%](/dida-assets/cdn.dida365.cn/hc/all/cec8b3cb45376b31883109cd36b9175f.png)\\n> 你可以在滴答清单中添加、修改、删除日历事件，这些操作也会同步到 Google 日历。\\n\\n**关联到 Google 日历**\\n\\n当你希望能在 Google 日历中看到滴答清单中的任务，你可以试试“关联到 Google 日历”，清单中的“任务”将显示在 Google 日历中。\\n\\n![--98.66%](/dida-assets/cdn.dida365.cn/hc/all/61987c817d92abf560f70d9c510abc46.png)\\n\\n> 你可以在 Google 日历中添加、修改、删除，这些操作也会同步到滴答清单中。\\n\\n\\n请注意：关联到 Google 日历功能需要升级到“安卓&iOS v7200 、Windows&Mac&Web v5500 版本“。\\n\\n# 从 Google 日历订阅\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n进入「设置」-「导入与关联应用」-「日历」-「Google」，选择“从 Google 日历订阅”，进行 Google 日历账号登录授权。\\n\\n![--65.93%](/dida-assets/cdn.dida365.cn/hc/all/22a62c3e7bc404576ae81800949861c1.png)\\n\\n\\n授权成功后，你可以在页面中看到订阅成功的日历。同时，在侧边栏「订阅日历」分组中还可以查看此日历账号中的所有日历事件。\\n\\n![--65.93%](/dida-assets/cdn.dida365.cn/hc/all/cea9be5e191c4f9afc7f224341fecf1a.png)\\n\\n> 这些日历事件还会智能显示在今天、最近 7 天智能清单和日历视图中。\\n\\n你还可以在订阅日历列表中点击「+」添加日程，添加成功后，也会同步到 Google 日历中。 \\n\\n![--65.93%](/dida-assets/cdn.dida365.cn/hc/all/fc92862c7af614d14b482914bbeb647d.png)\\n> 添加、修改、删除等操作都会与 Google 日历双向同步。\\n\\n::::\\n\\n::::tab [desktop]\\n点击头像 -「设置」-「关联与导入」-「Google」，选择“从 Google 日历订阅”，进行 Google 日历账号登录授权。\\n\\n![--83.12%](/dida-assets/cdn.dida365.cn/hc/all/69586577a481ab368f8495eb775ca7dc.png)\\n\\n![--83.12%](/dida-assets/cdn.dida365.cn/hc/all/2a71e6c4f6e2d27ca1fe1a30122dbcec.png)\\n\\n授权成功后，你可以在页面中看到订阅成功的日历账号。\\n\\n![--83.12%](/dida-assets/cdn.dida365.cn/hc/all/b696edebc8e03c9fbc924a214712ca4d.png)\\n\\n同时，在侧边栏「订阅日历」分组中还可以查看此日历账号中的所有日历事件。\\n\\n![--50.37%](/dida-assets/cdn.dida365.cn/hc/all/8d9464f518373afd645c42e078e65337.png)\\n\\n\\n你还可以在订阅日历列表中点击「输入框」添加日程，添加成功后，也会同步到 Google 日历中。\\n\\n![--50.37%](/dida-assets/cdn.dida365.cn/hc/all/8695d39cd4c3ab733fc8de7ef5ad6051.png)\\n> 添加、修改、删除等操作都会与 Google 日历双向同步。\\n> \\n::::\\n\\n:::::\\n\\n\\n\\n# 关联到 Google 日历\\n该功能需升级到““安卓&iOS v7200 、Windows&Mac&Web v5500 版本“。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n进入「设置」-「导入与关联应用」-「日历」-「Google」，选择“关联到 Google 日历”，进行 Google 日历账号登录授权。\\n\\n![--65.93%](/dida-assets/cdn.dida365.cn/hc/all/22a62c3e7bc404576ae81800949861c1.png)\\n\\n\\n**授权成功后，在「关联到 Google 日历」页面，你可以设置关联选项**\\n\\n1. **选择关联的清单、日历**\\n\\n点击「选择清单」和「选择日历」，选择你想要双向同步的清单（滴答清单）、日历（Google 日历）。\\n\\n![--65.97%](/dida-assets/cdn.dida365.cn/hc/all/7780ee9f794a9c99a1029d6187e00dc4.png)\\n\\n- 选择清单中设置时间属性的任务都将同步为关联的 Google 日历中的日历事件。\\n\\n- 在关联的日历中，添加日历事件也会同步为选择清单中的任务。\\n\\n\\n2. **设置任务默认属性**\\n\\n为了更好地管理从 Google 中添加的日历事件，我们提供了“默认标签”你可以自定义日历事件同步到滴答清单中后将标记的标签。\\n\\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/05222544315199f2336a5c1a0676c48f.png)\\n\\n若你选择清单为「所有」时，你还可以设置“默认清单”，自定义 Google 日历事件同步显示到哪个清单中。\\n\\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/74a8fae9ecca6e8d2c3928085ee264ad.png)\\n\\n\\n3. **关联成功**\\n\\n点击“关联”，即可添加关联成功，在页面中可以看到关联成功的账号，点击账号可以查看关联的详情。\\n\\n![--65.93%](/dida-assets/cdn.dida365.cn/hc/all/824f4fc24ccb0a5603fed0907a05a58d.png)\\n::::\\n\\n::::tab [desktop]\\n点击头像 -「设置」-「关联与导入」-「Google」，选择“关联到 Google 日历”，进行 Google 日历账号登录授权。\\n\\n\\n![--83.12%](/dida-assets/cdn.dida365.cn/hc/all/69586577a481ab368f8495eb775ca7dc.png)\\n\\n![--83.12%](/dida-assets/cdn.dida365.cn/hc/all/2a71e6c4f6e2d27ca1fe1a30122dbcec.png)\\n\\n**授权成功后，在「关联到 Google 日历」页面，你可以设置关联选项**\\n\\n1. **选择关联的清单、日历**\\n\\n点击「选择清单」和「选择日历」，选择你想要双向同步的清单（滴答清单）、日历（Google 日历）。\\n\\n![--80.6%](/dida-assets/cdn.dida365.cn/hc/all/fd61adb80734da08f21822329a904d17.png)\\n\\n- 选择清单中设置时间属性的任务都将同步为关联的 Google 日历中的日历事件。\\n\\n- 在关联的日历中，添加日历事件也会同步为选择清单中的任务。\\n\\n\\n\\n2. **设置任务默认属性**\\n\\n为了更好地管理从 Google 中添加的日历事件，我们提供了“默认标签”你可以自定义日历事件同步到滴答清单中后将标记的标签。\\n\\n![--81.73%](/dida-assets/cdn.dida365.cn/hc/all/d98ed3b74b47184338361815103042aa.png)\\n\\n若你选择清单为「所有」时，你还可以设置“默认清单”，自定义 Google 日历事件同步显示到哪个清单中。\\n\\n![--81.73%](/dida-assets/cdn.dida365.cn/hc/all/e5e0f08dddd41d5623076bc895101299.png)\\n\\n3. **关联成功**\\n\\n点击“关联”，即可添加关联成功，在日历页面中将看到关联成功的日历，点击进去可以查看具体的关联情况。\\n\\n- 关联后，清单中的任务将会始终显示在谷歌日历中，并标记来源滴答清单，请谨慎操作。\\n\\n![--83.12%](/dida-assets/cdn.dida365.cn/hc/all/cbd8e3a951cad67c08bc268bbf7db750.png)\\n\\n::::\\n\\n:::::\\n\\n4. **关联效果**\\n\\n关联后，建立关联关系的“清单”和“日历”的内容将会进行双向同步。\\n\\n- **清单 ➡️  Google 日历**：清单中“所有有时间的任务”都将同步显示为 Google 日历的“日历事件”\\n- **清单 ⬅️  Google 日历**：Google 日历中的日历事件将会同步为清单中的任务（包括设置“今天或未来时间“的已创建/新添加的日历事件，都将同步为滴答清单中的“任务”。\\n\\n\\n任何你在清单中对任务做的调整，都会同步到 Google 日历中。同样，在 Google 日历中做出的调整也将会同步到滴答清单中。\\n\\n请注意以下数据内容无法进行双向同步：\\n\\n- Google 日历中创建的工作地点事件\\n- Google 日历中创建的外出办公事件\\n- Google 日历中关联之前创建的日期为今天以前的日历事件 \\n\\n\\n\\n5. **取消关联**\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n\\n进入「设置」-「导入与关联应用」-「日历」，点击「已关联账号」前往详情页，点击需要取消关联的选项，进入「编辑页面」，在页面下方点击「取消关联」，即可取消成功。\\n\\n![--65.93%](/dida-assets/cdn.dida365.cn/hc/all/0dee8fcbccdcc1b7b10cdc7fca9acf6b.png)\\n::::\\n\\n::::tab [desktop]\\n进入「设置」-「导入与关联应用」-「日历」，点击「已关联账号」前往详情页，点击需要取消关联的选项，点击左下角「取消关联」，即可取消成功。\\n\\n![--83.12%](/dida-assets/cdn.dida365.cn/hc/all/c66d42d752a41d1ba2de166873d11a42.jpg)\\n\\n![--83.12%](/dida-assets/cdn.dida365.cn/hc/all/3f606948c58ce115697db21190e62705.jpg)\\n\\n![--83.12%](/dida-assets/cdn.dida365.cn/hc/all/538540a803ff7a06cde7918884f1e827.png)\\n::::\\n\\n:::::\\n\\n请注意，当你取消了关联，但在你之前建立关联关系的 Google 日历和清单中，已同步到的内容依然会显示。以下是如何移除它们：\\n\\n- 若你想删除同步到 Google 日历中的滴答任务，可以在 Google 日历中找到来源为「滴答清单」的日历事件，并逐个删除。\\n\\n- 若你想删除滴答清单中同步到的 Google 日历事件，你可以在滴答清单中，找到标签“GCal”（默认值） 的任务，点击标签，批量选中任务并删除。\\n\\n\\n\\n# 常见问题\\n\\n::: spoiler 从 Google 日历订阅和关联到 Google 日历有什么区别？\\n1. **使用场景不同**\\n\\n\\t从 Google 日历订阅：将日历事件集中在滴答清单中管理，并获得提醒。\\n\\t\\n\\t关联到 Google 日历：将滴答清单中的任务显示在 Google 日历中，集中查看。\\n\\n2. **同步到滴答清单显示的类型不同**\\n\\n\\t订阅 Google 日历：同步为日历事件\\n\\t\\n\\t关联到 Google 日历：同步为任务\\n\\n3. **同步的范围不同**\\n\\n\\t订阅 Google 日历：可订阅账号中所有的日历\\n\\t\\n\\t关联到 Google 日历：每次只可与一个日历进行关联\\n:::\\n\\n::: spoiler 关联账号中是否可以关联多个日历？\\n可以关联多个，前往「关联账号详情页」-「添加关联」，即可再次关联，每个日历账号下可关联 9 个日历。\\n:::\\n\\n::: spoiler 在 Google 中如何设置任务优先级等属性？\\n你可以在 Google 日历事件的标题中输入快捷符号，当事件同步到滴答清单中，将会自动识别快捷符号并设置好任务属性。\\n\\n1. **优先级：**“空格!1”或“空格!高优先级”\\n\\n2. **标签：**“空格#标签名称”\\n\\n3. **添加到清单：**“空格～清单名称”（仅关联滴答清单“所有”时，才可识别成功）\\n:::\\n\\n\\n::: spoiler 是否可以修改已关联的清单和日历？\\n避免同步内容发生异常，暂时不支持修改关联的清单和日历，你可以取消关联，重新添加新的关联。\\n:::\\n\\n\\n::: spoiler 是否可以关联多个 Google 账号？\\n可以关联多个。\\n\\n但请注意为了避免数据重复同步，已有账号与滴答清单的“所有”清单建立关联关系时，将无法再关联新的账号。\\n\\n:::\\n\\n\\n\\n# CalDAV 日历同步\\n你可以通过 CalDAV 同步「企业微信」、「飞书」、「钉钉」、「QQ邮箱」等日历。\\n\\n:::::tabContainer [mobile|Web|macOS|Windows]\\n\\n::::tab [mobile]\\n在「设置」-「导入与关联应用」-「日历」-「添加日历」-「CalDav」，输入第三方日历的「服务器地址」、「用户名」、「密码」。\\n\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/afedd1f0747ce1017fc2fcc52b28d32f.png)\\n\\n::::\\n\\n::::tab [Web]\\n点击头像 - 设置 - 关联与导入 - 日历订阅 - 添加日历 - CalDav\\n\\n![--73.2%](/dida-assets/cdn.dida365.cn/hc/all/f1ba67d30437d7c155efd6ebd1ad097b.png)\\n\\n输入需要第三方日历的「用户名」、「密码」、「服务器地址」、「名称」，即可完成同步。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/66dd304a7e1cb1565221ab25e4a8ebb7.png)\\n\\n::::\\n\\n::::tab [macOS]\\n点击「头像」-「设置」-「日历订阅」，点击左下角「+」添加「CalDav」即可完成同步。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/a545bbc889f3d42e907d933c0906dbd6.png)\\n\\n输入需要订阅的日历「服务器地址」、「用户名」、「密码」、「名称」，即可完成同步。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/209a20df69bc0399a5cf47a00b1422ff.png)\\n\\n::::\\n\\n::::tab [Windows]\\n点击头像 - 设置 - 日历订阅 - 添加日历 - CalDav\\n\\n![--57.06%](/dida-assets/cdn.dida365.cn/hc/all/f1929a391bba22b904a2f99f559e22f8.png)\\n\\n输入需要订阅的日历「用户名」、「密码」、「服务器地址」、「名称」，即可完成同步。\\n\\n![--57.06%](/dida-assets/cdn.dida365.cn/hc/all/0c00b22cb0d4cacc0ff31bbeb9eecfd7.png)\\n::::\\n\\n:::::\\n\\n## 企业微信\\n\\n桌面端：在企业微信中，点击「头像」-「设置」-「日程」-「同步至其他日历」\\n\\n![--66.22%](/dida-assets/cdn.dida365.cn/hc/all/c6b4ecfa81890be710ac38258950b65e.png)\\n\\n![--66.19%](/dida-assets/cdn.dida365.cn/hc/all/641d660dd0ec24589a79bd7e0b4d7f9b.png)\\n\\n需要将获取的服务器地址修改为“caldav.wecom.work”，帐号/用户名、密码不变，填写到滴答清单 CalDAV 订阅中即可成功订阅。\\n\\n![--66.19%](/dida-assets/cdn.dida365.cn/hc/all/e37c792870444bcf3d2ccb58e839e6b1.png)\\n\\n\\n> 移动端：在企业微信中，点击「日程应用」-「日程设置」-「同步至其他日历」。\\n\\n## 飞书日历\\n\\n在飞书中，点击「头像」-「设置」-「日历」，找到「CalDav 同步」，点击「进入设置」。\\n\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/8137beb3d8de9eb784428b16912deaed.png)\\n\\n\\n你可以选择你需要同步到的设备，如“iPhone、 iPad、Mac、安卓手机、windows电脑、其他设备”。\\n\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/c3495a63734fbf44b608234be4758d20.png)\\n\\n选择好设备后，点击「生成」该设备的「专用密码」，将密码填写到滴答清单「CalDav 」中，即可完成对飞书日历的同步。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/958c8a2fd4c0bc28877898d501e1cebe.png)\\n\\n## 钉钉日历\\n在「日历」-「日历设置」-「同步」中，找到 CalDav 同步，点击「进入配置」。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/a6e29874496c8988d83b08182c4f99f1.png)\\n\\n\\n你可以选择你需要同步到的设备，如“Mac、windows、Android、iPhone、 iPad、other”。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/7c523f07a9ff1b608b0023fa20f58e21.png)\\n\\n选择好设备后，点击「生成」该设备的「专用密码」，将密码填写到滴答清单「CalDav」中，即可完成对钉钉日历的同步。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/59ac40ccd167ee376b4311aedf9174e3.png)\\n\\n## QQ邮箱日历\\n在「设置」-「账户」-「POP3/IMAP/SMTP/Exchange/CardDAV/CalDAV服务」，开启 CalDav 服务，生成授权码并保存。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/5ceb133a99826dff0ce477915151acfa.png)\\n\\n>QQ邮箱日历服务器地址：dav.qq.com\\n\\n\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":18,\"order\":0,\"status\":0,\"sectionId\":\"feature\",\"createdTime\":\"2022-07-05T08:20:57.015Z\",\"modifiedTime\":\"2026-06-09T09:44:12.583Z\",\"postId\":\"6950000554735042560\",\"__v\":0,\"parentId\":\"6949998599191134208\",\"pinInSearch\":false,\"area\":\"help-center\",\"shortTitle\":\"\"},{\"area\":\"help-center\",\"_id\":\"62c544a85084b6294bef6102\",\"author\":\"\",\"description\":\"\",\"title\":\"✅ 任务\",\"content\":\"![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/7b52ea2411cb8c8407f7b459913dbe0e.jpg)\\n\\n生活中我们经常会忘记重要的信息，常常感到不堪重负，那是否有什么方法可以最简单、最直观地帮助我们打理生活？\\n\\n交给「滴答清单」👇\\n\\n- 将你要做的、想做的事情，一条一条的创建成任务，减轻大脑记忆的压力。👉 [添加任务](/articles/6950658877373284352)\\n\\n- 如果有一些重要日子怕忘记的话，为它们设置提醒，绝不会错过。👉 [给任务添加提醒](/articles/6950660229746917376)\\n\\n- 周报、交房租、这些时间固定的任务，设置成重复任务一次解决。👉 [设置重复任务](/articles/6950660365923385344)\\n\\n\\n在不断完成任务的过程中，我们可以积攒对自身能力的确信，还能享受持续进步的快感 ，用心生活，达成更多 ❤️。\\n\\n\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":201,\"order\":0,\"status\":0,\"sectionId\":\"feature\",\"createdTime\":\"2022-07-06T08:15:36.765Z\",\"modifiedTime\":\"2026-10-05T23:09:17.161Z\",\"postId\":\"6950361599374786560\",\"__v\":0,\"pinInSearch\":false},{\"area\":\"help-center\",\"_id\":\"62c5492c5084b6294bef61a3\",\"author\":\"\",\"description\":\"\",\"title\":\"💻 全平台支持\",\"content\":\"![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/038f485da25d95a71cbe78092de29597.jpg)\\n\\n目前「滴答清单」应用支持全平台下载使用。不管是手机、电脑还是手表，几乎所有用得到的设备和操作系统，滴答清单都支持。\\n\\n- 坐在办公室里，不管你是用的 Windows 还是 Mac 系统，都可以下载客户端使用；\\n- 上下班路上，可以拿出手机看看有没有什么要做的事情；\\n- 出门运动，不方便使用手机？没关系，可以用手表接收提醒；\\n- 躺在床上，可以用 Pad 回顾一天的事情；\\n- 出差在外，不能用自己的电脑，打开网页端使用，同样方便快捷；\\n\\n你可以点击这里，下载使用相应的版本 → [下载滴答清单](https://www.dida365.com/about/download)\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":239,\"order\":0,\"status\":0,\"sectionId\":\"special\",\"createdTime\":\"2022-07-06T08:34:52.623Z\",\"modifiedTime\":\"2026-10-07T03:40:11.406Z\",\"postId\":\"6950366447398813696\",\"__v\":0,\"pinInSearch\":false},{\"_id\":\"62c567381e3a8b2ac64c8022\",\"author\":\"\",\"description\":\"\",\"title\":\"如何使用四象限\",\"content\":\"\\n# 认识四象限\\n\\n1954年，前美国总统艾森豪威尔在一次大学演讲中，引用了一位校长的发言，提到了「重要不紧急」、「紧急不重要」的概念。 \\n![l](/dida-assets/cdn.dida365.cn/hc/all/180161b29ea4e4de803ffaf639b4beb6.png)\\n\\n而在这之后，斯蒂芬·柯维在《高效能人士的7个习惯》介绍了四象限，根据**重要和紧急两个维度**，分成4个象限，然后将所有要做的事情放到象限中，再根据每个象限的原则完成他们。\\n\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/a488d5c3aafb964a70fc9f9f572c840d.png)\\n\\n# 在滴答清单中使用四象限\\n\\n## 开启四象限模块\\n你可以在移动端或桌面端开启「四象限」功能，开启后即可按紧急与重要程度对任务进行分类管理。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n\\n前往「设置」>「功能模块」，开启「四象限」功能。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/ba60fa0e7d14908bb486c736c79892af.png)\\n\\n\\n\\n::::\\n\\n::::tab [desktop]\\n点击头像进入「设置」>「功能模块」，开启「四象限」功能。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/ea40ab78ede07059ff3bc6ae5ced6ff9.png)\\n\\n::::\\n\\n:::::\\n\\n\\n我们会根据你对任务设置的优先级，自动将任务放入到对应的象限中。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/cab767a6d0c0b586efa3674f5b4a3176.gif)\\n\\n开启了「四象限」之后，你完全可以保留原来的使用习惯。例如你在「今天」、「工作」等清单中创建的任务，会自动在「四象限」中显示出来，不需要做额外的操作。 \\n\\n\\n\\n\\n\\n## 添加任务\\n**当然你也可以直接往「四象限」里创建任务。拖动加号键到任意象限，就可以添加任务。**\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/05cd8664f85b2a1d0c7bede505ebde4f.gif)\\n\\n我们会根据对应象限的规则，自动为你的任务添加属性。例如往“重要紧急”象限创建的任务，会自动设置为今天、高优先级。当然你也可以在「收集箱」和「今天」清单中，看到这条任务。\\n\\n\\n\\n\\n## 编辑象限规则\\n看到这里，可能有些时间管理达人会问： \\n- 我原本就已经用优先级实践四象限，现在能兼容吗？ \\n- 我希望在四象限中看到「工作」的任务，但是并不想看到「生活」的任务，能够实现吗？\\n\\n当然，这些需求都能完美实现！\\n\\n只要进入象限编辑界面，你可以根据自己的需求，随心所欲定制每个象限的规则。\\n![m](/dida-assets/cdn.dida365.cn/hc/all/60bed9878478ca5797a6a99cb5126683.gif)\\n\\n::: spoiler 如何编辑象限规则？\\n\\n你可以在四象限页面点击右上角的「...」图标，选择「编辑」，进入象限规则编辑页。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/ab7256a8a305b035bf2b300059ba3701.png)\\n\\n在编辑页中，你可以为每个象限设置对应的**清单、标签、日期、优先级或任务类型**，系统将根据这些规则自动归类任务。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/23e92ccb894a0049c564d7dc0a7c916e.png)\\n\\n:::\\n\\n\\n\\n\\n::: spoiler 桌面端如何编辑象限规则？\\n将鼠标移动至任一象限，点击右上角的「...」按钮，选择「编辑」，即可进入象限规则编辑页。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/d0d02ac8f6312d1cbf6682ca9fc040d4.png)\\n\\n:::\\n\\n\\n## 象限中的操作\\n点击任一象限后，点击右上角的「...」按钮，可以执行以下操作：\\n**编辑象限、显示详细、显示已完成、显示检查事项、排序、分享、打印、批量编辑**等。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/cb3fa1171a125d6033576e9229698cc0.png)\\n\\n\\n::: spoiler 桌面端如何进行象限操作？\\n目前桌面端仅支持**排序**操作，你可以将鼠标移动至象限中，点击右上角的「...」按钮，选择「排序」调整任务顺序。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/0d2b1676ef163e5472d1d86321d5ec87.png)\\n\\n\\n\\n:::\\n\\n\\n👉 [如何编辑四象限规则](/articles/6950381682822217728)\\n\\n# 如何用四象限管理我们的生活\\n\\n现在，我们已经在滴答清单中看到了四象限，我又应该如何使用呢？ \\n四象限其实已经给了我们答案。 \\n\\n1. 重要且紧急的任务——立马去做。 \\n2. 重要不紧急的任务——重点关注，计划安排。 \\n3. 紧急不重要的任务——低能量时做，或者委派他人做。 \\n4. 不重要不紧急的任务——尽可能不要做。\\n\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/21e90c08998d8357896193fd2651bc8a.png)\\n\\n相信很多人，可能都遇到过这样的情况：明明知道一个任务非常重要，但是想着时间还早，于是先放一放，结果快到截止时间了，发现来不及了，于是特别焦虑，熬夜加班，匆匆忙忙完成。不仅质量不高，身体也非常疲惫。\\n\\n**这可能就是在「重要不紧急」的任务上，关注不够，没有合理安排计划带来的问题。**\\n\\n还有很多人，遇到的是另外一种情况：每天从早忙到晚，工作、学习、生活总是不断有事情找上门来。但是到了总结的时候却发现，好像并没有什么成果。 \\n\\n**这可能就是在「紧急不重要」的任务上，花费了太多的时间和精力。**\\n\\n而四象限视图，实际上给我们提供了一个新的视角。帮我们从重要和紧急两个维度，决定我们对任务的应对方式。\\n\\n当我们精力充沛、相对空闲的时候，就可以看看「重要不紧急」的任务中，是否有任务可以安排和计划。\\n而当我们没什么状态的时候，就可以处理「紧急不重要」的任务，或者将这些任务委派给其他人完成。\\n\\n**而当我们发现任务需要调整象限时，也完全可以通过拖动任务来进行调整。**\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/ae420d5ba7ddcd1c1b38f1b82df69bad.gif)\\n\\n\\n# 常见问题\\n:::: spoiler 如何开启四象限？\\n在“设置-功能模块”中开启「四象限」。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/ba60fa0e7d14908bb486c736c79892af.png)\\n\\n:::: \\n\\n\\n\\n\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":900,\"order\":0,\"status\":0,\"sectionId\":\"feature\",\"createdTime\":\"2022-07-06T10:43:04.675Z\",\"modifiedTime\":\"2026-10-13T12:47:19.074Z\",\"postId\":\"6950398710203285504\",\"__v\":0,\"parentId\":\"6950361734683033600\",\"pinInSearch\":true,\"area\":\"help-center\",\"shortTitle\":\"\"},{\"_id\":\"62c656ce1e3a8b2ac64c82f2\",\"author\":\"\",\"description\":\"\",\"title\":\"过滤器：随心所欲筛选你想看的任务\",\"content\":\"#  用过滤器筛选任务\\n首先结合自己的使用场景建立任务清单，例如设置下周的学习计划或工作任务。在建立任务的时候，要尽可能的为任务添加「时间」、「标签」、「优先级」等属性，方便过滤器进行多维度筛选。\\n\\n\\n## 添加过滤器\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n\\n在「侧边栏」点击左下角「添加」选择「过滤器」，即可添加过滤器。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/81ed8f6e10df22dcc70e948253e2bfa2.png)\\n\\n\\n\\n或者在「侧边栏」点击右下角「清单设置」-进入「清单管理页」，选择「添加过滤器」。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/5fc524b6367c3509d17af588dbeb6930.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n使用前，确认侧边栏中是否已经开启显示过滤器，开启后，标签将显示在清单下面。\\n\\n![--68.81%](/dida-assets/cdn.dida365.cn/hc/all/9f8182508f2d58cda7406fc5db8ad739.png)\\n\\n如果过滤器未在侧边栏中显示，点击头像进入「设置」-「智能清单」，找到「过滤器」设置为「显示」即可。\\n\\n![--68.81%](/dida-assets/cdn.dida365.cn/hc/all/76b27303e9130546a6dc58bbc5590834.png)\\n\\n将光标覆盖在「过滤器」上，点击右侧的+号，即可新建过滤器。\\n\\n![--68.81%](/dida-assets/cdn.dida365.cn/hc/all/4a0121bad2d6f6d6900b172d6ea48103.png)\\n\\n::::\\n\\n:::::\\n\\n\\n\\n在为过滤器设置筛选条件时，有两种方法：普通筛选和高级筛选。\\n\\n## 普通筛选\\n按照清单名称、标签、日期等属性进行多维度筛选，还可以按照关键词做内容筛选。\\n\\n如：通过设置条件，建立一个筛选「今天英语听力学习任务」的过滤器，之后就可以通过选择过滤器快速找到对应的任务。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/6e5b5dd96a070e0ddd815e14ffb4c564.png)\\n\\n\\n## 高级筛选\\n\\n如果你想同时选择多个相同的属性，建议你使用高级筛选。\\n\\n高级筛选通过逻辑词：“或”、“且”以及清单、日期、优先级、标签等筛选条件可以进行多语句查询。\\n\\n- 将筛选条件设置为：明天的英语或高数学习安排，就可以通过高级筛选快速找出符合条件的任务。\\n\\n- 如果不确定自己的筛选条件设置的是否合理，也可以点击「预览模式」查看显示效果哦，更方便快速进行修改。\\n\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/d00359a472367ef3146e49f6d4e12087.png)\\n\\n\\n你还可以使用“且”逻辑、“或”逻辑来关联前后两个筛选条件。并且，在同一个筛选条件（仅标签支持）内，也可以选择使用“且”逻辑、“或”逻辑。\\n\\n![--39.35%](/dida-assets/cdn.dida365.cn/hc/all/a70365fe4a729c9d3336ef9b68e18b99.png)\\n\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":22,\"order\":0,\"status\":0,\"sectionId\":\"feature\",\"createdTime\":\"2022-07-07T03:45:18.056Z\",\"modifiedTime\":\"2026-09-18T03:29:54.826Z\",\"postId\":\"6950655961044353024\",\"__v\":0,\"parentId\":\"6950652964327391232\",\"pinInSearch\":false,\"area\":\"help-center\",\"shortTitle\":\"\"},{\"area\":\"help-center\",\"_id\":\"62c657351e3a8b2ac64c8309\",\"author\":\"\",\"description\":\"\",\"title\":\"不同的视图查看任务\",\"content\":\"滴答清单提供了三种视图查看任务：列表视图、看板视图、时间线视图。你可以根据自己的需求，选择适合的视图。\\n\\n想要查看清单里所有的任务，使用列表视图一目了然👉[列表视图](/articles/6950656708259610624)\\n\\n\\n复杂的项目分工如何简单的呈现，每个都任务都想掌握，使用看板视图👉[看板视图](/articles/6950656501543337984)\\n\\n长线任务需要“从月到天”来制定详细的计划？「时间线视图」不容错过👉[时间线视图](/articles/6950656549178048512)\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":162,\"order\":0,\"status\":0,\"sectionId\":\"feature\",\"createdTime\":\"2022-07-07T03:47:01.698Z\",\"modifiedTime\":\"2026-10-12T09:09:16.303Z\",\"postId\":\"6950656395750408192\",\"__v\":0,\"parentId\":\"6950361599374786560\",\"pinInSearch\":false},{\"_id\":\"62c657801e3a8b2ac64c8341\",\"author\":\"\",\"description\":\"\",\"title\":\"列表视图\",\"content\":\"列表视图将任务以垂直列表的形式呈现在我们眼前，通过上下滑动可以快速浏览清单内的待办事项。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/e7b0c15ce65f70c10f2a30c94d6204b9.png)\\n\\n\\n\\n# 排序\\n\\n目前，在任务列表页，滴答清单为你提供了多种排序方式，你可以根据自己的需求选择不同的排序方式。\\n\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/537f7af7106921fa5eedba218155b77c.png)\\n\\n\\n# 拖动排序\\n\\n你还可以自已手动拖动任务的顺序，让任务排序更灵活。\\n\\n按住任务，自由选择放置任务的位置。多种操作，一“指”搞定。\\n\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n\\n::: video /dida-assets/cdn.dida365.cn/hc/all/4ec77cd73e39fb4a740b3467ac901281.mp4\\n:::\\n\\n\\n::::\\n\\n::::tab [desktop]\\n\\n![--66.66%](/dida-assets/cdn.dida365.cn/hc/all/b310b4d49b4338e8adeb5dfb39ec6c1a.png)\\n\\n::::\\n\\n:::::\\n\\n\\n# 拖动生成子任务\\n\\n滴答清单不仅支持拖动调整任务排序，你还可以用拖动来实现「任务」➡️「子任务」的转换。\\n\\n长按任务，将其拖至另一个任务右下方，即可将这个任务转换成子任务。\\n\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/316162fc2255870e6f334194eff533c0.png)\\n\\n# 置顶\\n\\n滴答清单还贴心提供了置顶功能，你可以将重要信息「置顶」，让其始终展示在列表的最前端，看一眼就能心中有数。\\n\\n点击任务详情页右上角「···」，选择「置顶」即可设置成功。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/5f071b78417dde1a0e13960f7021142f.png)\\n\\n# 滑动操作\\n\\n在任务列表页可以通过滑动单条任务进行快速操作。\\n\\n将任务向左短滑，可以看到任务右侧出现了三个选项，它们分别代表：「移动任务」、「删除任务」、「修改日期」，根据需要点击对应的选项进行操作。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/f0ce6701f7a9c40e5ac2d5be33678ec2.png)\\n\\n\\n向右滑动分别为「完成」、「置顶」。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/a1210517d0048027a2e51077747fdfe2.png)\\n\\n还可以在「设置」 - 「更多设置」- 「滑动操作」中，进行自定义配置，根据自己的偏好习惯来设置更顺手的滑动方式。\\n\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/7a8d8944c679d52e12c76d5bb0f1b9f4.png)\\n\\n# 批量编辑任务\\n:::::tabContainer [iOS|Android|desktop]\\n\\n::::tab [iOS]\\n在任务列表页点击右上角的「...」图标 - 「批量编辑」 - 选中多个任务后，即可在下方选项中根据需要选择为任务进行：编辑新日期、编辑新所属清单、删除，甚至进行优先级、分享和合并任务的操作。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/de8a34287d26202c674dd832444402b7.png)\\n\\n\\n\\n::::\\n\\n::::tab [Android]\\n安卓用户需要长按住一条任务切换到批量选择界面，然后选择多个任务，在右下角的选项中根据需要为任务进行：编辑新日期、编辑新所属清单、删除，甚至进行优先级、分享和合并任务的操作。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/347cfae0a4560d666f982f3b52dfb48d.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n桌面端按住Shift同时，选择多个任务，或者选择首尾任务即可进行批量操作。\\n\\n![--59.6%](/dida-assets/cdn.dida365.cn/hc/all/5f77a6a36707104cb09178f124c98efb.png)\\n\\n::::\\n\\n:::::\\n\\n\\n# 视图多端独立配置\\n你可以为手机端和桌面端分别设置清单视图，不同设备的视图设置互不影响。\\n> 仅支持 Android 和网页端。\\n\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n进入对应清单 → 「显示设置」 → 「视图跨设备同步」。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/6fd744207ab3c8973928040b853cbc3f.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n进入对应清单 → 「显示设置」 → 「视图跨设备同步」。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/3d470f31f74df04d651e79057407dc3b.png)\\n\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/ec5252f2ae92d389ee750c264162ed22.png)\\n\\n::::\\n\\n:::::\\n\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":182,\"order\":0,\"status\":0,\"sectionId\":\"feature\",\"createdTime\":\"2022-07-07T03:48:16.206Z\",\"modifiedTime\":\"2026-10-06T04:16:19.681Z\",\"postId\":\"6950656708259610624\",\"__v\":0,\"parentId\":\"6950656395750408192\",\"pinInSearch\":false,\"area\":\"help-center\",\"shortTitle\":\"\"},{\"_id\":\"680b454d1c42a13a390b9fc6\",\"author\":\"\",\"description\":\"\",\"title\":\"添加倒数纪念日\",\"content\":\"时间悄然流逝，那些重要的纪念日、值得期待的瞬间，是否曾因忙碌而被遗忘？添加倒数纪念日，让重要日子不再错过。\\n\\n# 开启功能模块\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n进入「设置」-「功能模块」中，找到「倒数纪念日」，点击前方加号即可开启模块。\\n开启后，你将在底部导航栏看到「倒数纪念日」功能。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/9fa44fa595cdfac93f98050dfd13b36b.png)\\n\\n\\n\\n::::\\n\\n::::tab [desktop]\\n点击头像，进入「设置」-「功能模块」中，找到「倒数纪念日」，点击开关启用模块。\\n开启后，你将在侧边导航栏看到「倒数纪念日」功能。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/a0275ee3b673db565abf82a483180d86.png)\\n\\n::::\\n\\n:::::\\n\\n# 添加重要日子\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n在底部导航栏找到「倒数纪念日」并点击进入，点击页面右下角的「+」号，即可添加新的倒数纪念日。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/27613c64a61796f7b6d2af9fb05fb704.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n在侧边导航栏找到「倒数纪念日」并点击进入，点击页面右上角的「+」号，即可添加新的倒数纪念日。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/89886d42c2fab3877ea98a3813e03d99.png)\\n::::\\n\\n:::::\\n\\n在倒数纪念日中，你可以选择添加以下 4 种类型的重要日子：\\n\\n- **节日**：记录春节、元旦、端午节、中秋节等法定或传统节日。\\n\\n- **生日**：为亲朋好友或重要人物添加生日提醒。\\n\\n- **纪念日**：保存个人的重要时刻，比如结婚纪念、恋爱纪念、入职纪念等。\\n\\n- **倒数日**：自定义任何值得期待或规划的重要日子，如考试、旅行、演出、目标达成日等。\\n\\n\\n## 推荐\\n\\n不知道该记录哪些日子？ 这里有一些常用的倒数日、纪念日和节日，帮你快速上手。\\n\\n只需要在添加倒数日、纪念日、节日时，点击名称输入框右侧的「推荐」按钮，即可一键选用推荐内容。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/66a7e151d3161829aff92f837ca0bb9e.png)\\n\\n\\n\\n## 图标\\n\\n点击顶部的图标，你可以为你的每个倒数纪念日设置专属图标。我们提供了丰富的「推荐图标」供你选用，让不同日子可以被一眼识别。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n我们提供了丰富的「图标」供你选用，你可以向左滑动查看更多并选择喜欢的图标。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/0577af6ccf3ad2a45dcb53be29d529bb.png)\\n\\n\\n或者你也可以切换选择 emoji 或文字来自定义你的个性化图标。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/cd7dacb7b51d4628aca2cd087efbb977.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n点击输入框左侧的图标按钮即可设置图标。我们提供了丰富的默认图标，你也可以切换为 emoji 或文字模式，满足你的个性化需求。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/3351260de11ea47beabe787d836add32.png)\\n\\n::::\\n\\n:::::\\n\\n## 日期\\n\\n为纪念日设置具体日期，是精准倒计时的基础，你可以记录已经过去的重要时刻，也可以为未来的目标开启倒数：\\n\\n- 添加纪念日「入职纪念日」后，设置你加入公司的日期，即可快速查看你已经入职多少天了。\\n- 添加倒数日「发工资」后，设置未来最近一次的发薪日期，即可快速查看距离发薪日还有多少天。\\n\\n点击日期，可选择设置为公历或农历。设置完成后，系统会自动显示距离该日期已过/还有多少天。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/abbe323b3032b5367a6359e52b43d873.png)\\n\\n\\n\\n> 添加**生日**类型的日子时，如果不知道对方的出生年份或者你不需要记录年份，可以选择「忽略年份」。\\n\\n\\n# 不再错过日子\\n\\n## 提醒\\n\\n担心错过重要节点？为纪念日添加提醒时间，你将会被准时推送通知。点击「提醒」，你可以灵活勾选多个提醒时间，或自定义设置提前几天、具体几点的提醒。 \\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/4fe091baaf44ef3d45bb17f9875bc349.png)\\n\\n\\n例如：\\n\\n- 将「发工资」设置为提前3天提醒，便于你提前规划还款、储蓄或购物安排。\\n\\n- 将「生日」设置为提前7天提醒，便于你拥有充足的时间提前为寿星准备生日礼物。\\n\\n\\n\\n\\n## 重复\\n\\n有些日子是每年、每月都会重复出现的，比如生日、周年纪念、发工资等。此时，你可以点击「重复」为倒数纪念日设置重复规则，无需反复手动添加。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/af5caa412486518babd32f7512d02225.png)\\n\\n\\n> 生日和节日默认每年重复，不支持自定义。\\n\\n## 类型\\n选错了类型？别担心！点击添加页的 「类型」按钮，你可随时将「倒数日」改为「纪念日」（或任意切换其他类型），已输入的内容无需返回重填。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/c6bbc93d4390915d5ceaac3692a042a1.png)\\n\\n## 计时方式\\n想自定义纪念日的计时方式？对于**过去日期**且设置了**重复**的日子（如每年重复的恋爱纪念日），你可以点击「计时方式」按钮选择模式：\\n- 倒计时模式：显示「距离XX还有XX天」（例：距离恋爱纪念日还有100天）\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/1cebceecfb5a848dabd8deef36de2a20.png)\\n\\n\\n- 正计时模式：显示「XX已经XX天」（例：恋爱已经100天）\\n\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/455dbf205c254e801effc29248f6604f.png)\\n\\n::: spoiler 为什么我没有「计时方式」选项？\\n当某个倒数纪念日被设置为 **未来日期**（如明年的考试）或 **未设置重复** 时，「计时方式」选项将会被隐藏。\\n:::\\n\\n## 天数计算方式\\n\\n想按照自己的习惯来计算天数？对于「纪念日」类型的日子，你会看到一个「天数计算方式」的选项。你可以选择是否将当天计为第 1 天，让计数更加符合你心中的标准。\\n\\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/b5711e20e69f787c6a5935f6afa8ecfd.png)\\n\\n\\n\\n\\n## 显示岁数\\n想快速知道长辈几岁、孩子多大？在添加「生日」类型的日子时，你会看到一个「显示岁数」的开关。开启它，就能在纪念日上直接看到对应的岁数，方便又直观。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/51c50b0f84bb4e0025b0d2e9b5a91117.png)\\n\\n## 在智能清单中显示\\n\\n想让重要日子更自然地融入日常？倒数纪念日支持同步到智能清单中，与日常计划一同展示，提升提醒效果，使安排更高效。点击进入「在智能清单显示」，你可以根据需要，设置在智能清单中的显示方式：\\n\\n- 当天显示\\n\\n- 提前 3 天显示\\n\\n- 提前 7 天显示\\n\\n- 一直显示\\n\\n- 不显示\\n\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/230f363d9967b17f124b80159a70aad0.png)\\n\\n\\n\\n## 在日历中显示\\n\\n倒数纪念日既在倒数日列表提醒，也支持在日历中查看。无论是家人的生日、结婚纪念日、项目截止日期，都能日程无缝融合，方便你协调时间分配。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n\\n在日历页面，点击右上角「...」-「显示设置」，开启「显示倒数纪念日」选项，就能在日历中直观查看你的纪念日安排，让重要日子自然融入日常计划。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/51dab6bec4f12c09e52965691c88937d.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n\\n点击日历右上角「...」，进入「显示设置」，开启「显示倒数纪念日」，即可在日历中查看你的倒数纪念日，让特别的日子在忙碌的生活日程中清晰可见。 \\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/c0a0628460dc8e9d9c3275b424d7c6a9.png)\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/d05db497b9ead20b90bd63c5c2f94b6d.png)\\n\\n::::\\n\\n:::::\\n\\n## 在桌面查看\\n\\n重要的日子，值得随时可见。通过桌面小组件将倒数纪念日添加到手机桌面，让特别的日子始终在你眼前，时刻提醒、随时期待。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/6b274cb84c89d3d1aaa4f1885ff04073.png)\\n\\n\\n[如何添加小组件？](/dida-help/articles/6950366960659988480#%E5%A6%82%E4%BD%95%E6%B7%BB%E5%8A%A0%E5%B0%8F%E7%BB%84%E4%BB%B6%EF%BC%9F)\\n\\n\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":8,\"order\":0,\"status\":0,\"pinInSearch\":false,\"sectionId\":\"feature\",\"area\":\"help-center\",\"createdTime\":\"2025-04-25T08:18:21.996Z\",\"modifiedTime\":\"2026-08-04T13:49:42.561Z\",\"postId\":\"7321447466803396608\",\"__v\":0,\"shortTitle\":\"\",\"parentId\":\"7322192298849075200\"},{\"_id\":\"62c549a65084b6294bef61bc\",\"author\":\"\",\"description\":\"\",\"title\":\"🌮 小组件\",\"content\":\"![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/3becb59d0b9d8f4eb4024959084d1be6.jpg)\\n\\n滴答清单为大家准备了超级多“好看又实用”的小组件，除了能够让你的手机颜值加满，还能帮助你提高效率！\\n\\n各种任务、日历、专注、习惯小组件，一起看看怎么用吧！👇\\n\\n\\n# 小组件\\n:::::tabContainer [iOS|Android|鸿蒙|macOS|Windows]\\n\\n::::tab [iOS]\\n\\n**锁屏小组件**\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/eccd4e6332565b81951b4c1f8d3dcd4d.gif)\\n\\n\\n::: spoiler 如何添加“锁屏小组件”\\n\\n> iOS 系统需升级到 iOS 16，并将滴答清单更新到 6360 版本及以上。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/ae8944e2c288c15fe40a9f94a5d45ef3.png)\\n\\n1. 在锁屏状态下，长按屏幕进入设置模式，点击「自定」。\\n2. 点击屏幕中间的「添加小组件」，找到「滴答清单」。\\n3. 选择需要的小组件类型，点击或拖移即可添加。\\n:::\\n::: spoiler 如何添加 iPad 锁屏小组件？\\n你需将iPadOS升级到 iPadOS 17，并将滴答清单更新到 6700 版本及以上。\\n1. 锁屏后长按屏幕，出现自定义按钮，点击自定义。\\n2. 在屏幕左侧栏点击添加小组件，找到滴答清单选择需要的小组件。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/2b3e4f241099878603d47830ff388ba7.png)\\n\\n\\n:::\\n\\n\\n **桌面小组件**\\n\\n滴答清单为大家准备了各功能模块的专属小组件，添加到手机桌面上，即可快速查看任务、日历、习惯等信息，提高效率。\\n\\n> iOS 27 及以上系统中，部分小组件还支持全新的超大尺寸。\\n\\n**1. 任务**\\n\\n我们提供「任务」、「任务完成统计」、「添加任务」3款小组件。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/26f3c12d43e8d7d882720f865816f6c4.png)\\n\\n\\n- 「任务」：你可以查看、访问任务列表，了解每日的任务安排。\\n- 「任务完成统计」：你可以查看近30天内，每天完成的任务数量。\\n- 「添加任务」：你可以快速打开 App 添加任务。\\n\\n\\n**2. 日历**\\n\\n我们提供「今日日历」、「日视图」、「月视图」3款小组件。\\n\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/b6be35be269fe237ebc68778f3acb9dc.png)\\n\\n\\n\\n- 「今日日历」： 你可以查看“本月日历”和“今日任务”，点击任务还可以快速访问「今天」智能清单。\\n\\n- 「日视图」：你可以实时看到最近的任务安排，快速定位当前任务，高效专注地完成它。\\n\\n- 「月视图」：本月所有事情即刻呈现，轻松扫一眼即可知晓何时忙碌、何时空闲。\\n\\n\\n\\n**3. 四象限**\\n\\n- 你可以在四象限中查看你的任务，并且将更多精力聚焦在重要且紧急的事情上。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/a73e784351b3aefc6e0e10f78bb50ece.png)\\n\\n\\n\\n\\n**4. 习惯**\\n\\n我们提供「今日习惯」、「本周习惯」、「习惯热力图」、「习惯周进度」4款小组件。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/bc1f2010e08114a07fea622590ccea74.png)\\n\\n\\n\\n- 「今日习惯」：你可以一目了然地查看每天要养成的习惯，更有目标性地培养好习惯。\\n- 「本周习惯」：你可以查看本周需要打卡的习惯进度，更方便地追踪完成情况。\\n- 「习惯热力图」：你可以一目了然地追踪本月中每一天的完成情况、整月的进度，帮助你养成好习惯。\\n- 「习惯周进度」：你可以快速查看单个习惯的一周打卡情况。\\n\\n\\n**5. 番茄专注**\\n\\n我们提供「今日专注」、「专注时间分布」、「常用专注」3款小组件。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/13384993878b382390e23846b336a882.png)\\n\\n\\n- 「今日专注」：你可以查看每日的专注时间，把握时间，提高效率。\\n- 「专注时间分布」：你可以快速查看本周内每天的专注时长，帮助你更好对一周内的时间分配复盘。\\n- 「常用专注」：你可以快速在桌面开启常用专注。\\n\\n**6. 倒数纪念日**\\n\\n我们提供「倒数纪念日」小组件，将重要日子的倒数信息添加至桌面，随时查看及时提醒。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/45f18fb8767298f129005db57a395aca.png)\\n\\n**其他 iOS 小组件**\\n\\n**1. StandBy 小组件**\\n\\niOS 17 新增了 StandBy 功能。在充电状态下，将 iPhone 横放即可进入 StandBy 模式，以翻页钟等形式展示信息。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/83b76e0694db0ae55a58689b07ab8197.png)\\n> 可以根据自己喜好切换成不同的小组件显示，比如：任务列表、今日习惯、今日专注等。\\n::: spoiler 如何在 StandBy 使用小组件？\\n1. 将手机系统升级至iOS 17后，在充电状态下锁定手机再将手机旋转成横屏放在支架上。\\n2. 进入 StandBy 模式后，长按时钟或者日历根据提示解锁手机。\\n3. 在屏幕左上角点击➕图标添加滴答清单小组件。\\n:::\\n::: spoiler iPad 如何进入 StandBy 小组件？\\n目前iPad 还不支持 StandBy小组件。\\n:::\\n::: spoiler StandBy 支持实时活动\\n\\n现在支持在 StandBy 中显示专注、任务、习惯等实时活动，无需打开滴答清单即可查看当前状态。\\n\\n![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/b0ac79c9acc9989024d2e266b624debc.png)\\n\\n:::\\n\\n\\n**2. 控制中心**\\n\\n从 iOS 18 开始，你可以在「控制中心」中添加滴答清单控件，根据自己的需求打造更高效的快捷操作。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/848c0c08dec8d6c50b5ab1b9790a25a3.gif)\\n\\n\\n滴答清单一共带来了8个控件，分别是：添加任务、今日任务、番茄专注、正计时、打开日历、打开四象限、打开专注、打开习惯。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/95893d0da0563d399bd83e99227138a8.png)\\n> 通过这些控件，你可以快速开启专注模式或者快速跳转至指定页面中。\\n\\n::: spoiler 如何添加控件？\\n向下滑动拉出控制中心，点击上角“+”号进入编辑状态，再点击最下方“添加控制”，找到“滴答清单”就可以添加滴答清单控件。\\n![l](/dida-assets/cdn.dida365.cn/hc/all/a4c96eb4e793f8f7c6fa1912fd52a5f5.png)\\n:::\\n\\n如果你想要更大一点的控件，你可以拖动图标右下角进行调整。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/a40fa8429e168bd205170839e825fea2.gif)\\n\\n> 比如：常用的番茄专注，打开日历，可以调整为大一点的控件方便查看和点击。\\n\\n::: spoiler 如何修改控制配置？\\n目前，添加任务、番茄专注、正计时、打开日历，这4个控件支持配置，可以进入编辑模式指定到不同的清单。\\n\\n操作方式：向下滑动拉出控制中心，点击上角“+”号进入编辑状态，点击对应控件进入编辑状态，更改配置。\\n:::\\n\\n**3. Watch 小组件**\\n\\n\\n\\n表盘小组件，你可以在 Apple Watch 表盘上添加任务和习惯小组件，方便查看和管理。\\n\\n![--56.25%](/dida-assets/cdn.dida365.cn/hc/all/b098f67090b2ab89a8419a4780664783.png)\\n\\n::: spoiler 如何添加 Apple Watch 小组件？\\n1. 打开手机中的 手表 App，进入表盘设置。\\n2. 在“复杂功能”中选择想要添加小组件的区域。\\n3. 找到并选择“滴答清单”小组件。\\n:::\\n\\n\\n\\nwatchOS 10 新增叠放组件，滚动表冠能够快速查看任务或者习惯的完成情况。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/5bec42bfe00f655f76f771992e9e71d6.png)\\n\\n::: spoiler 如何添加叠放组件？\\n1. 转动表冠进入叠放组件。\\n2. 长按其中一个组件，点击左上角+号找到滴答清单进行添加。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/9a49e8522dd9965843428e41b0785f52.png)\\n\\n目前，表盘和智能堆栈中的任务和习惯小组件都支持点击完成，让任务管理更简单高效。\\n\\n:::\\n\\n\\n\\n\\n\\n::::\\n\\n::::tab [Android]\\n**1. 任务**\\n\\n我们提供「任务」、「添加任务」、「任务完成统计」3款小组件。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/bbde6e90625f6845ec098e7d94b340b2.png)\\n\\n\\n- 「任务」：你可以查看、访问任务列表，了解每日的任务安排。\\n- 「添加任务」：你可以快速添加任务。\\n- 「任务完成统计」：你可以查看近30天内，每天完成的任务数量。\\n\\n\\n**2. 日历**\\n\\n我们提供「时间轴」、「周」、「月」、「日历周视图」、「今日日历」5款小组件。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/50eece07c719f3332bdea63aad48471f.png)\\n\\n- 「日视图」：你可以实时看到最近的任务安排，快速定位当前任务，高效专注地完成它。（可以随心切换“日”、“3日”视图）\\n\\n- 「周视图」：你可以查看、访问本周的任务，有条不紊的进行本周计划。\\n\\n- 「月视图」：本月所有事情即刻呈现，轻松扫一眼即可知晓何时忙碌、何时空闲。\\n\\n\\n![35%](/dida-assets/cdn.dida365.cn/hc/all/caf59489bb52b0779fe9362cc631af28.png)\\n\\n\\n- 「日历周视图」：本周事项以任务块的形式呈现在日历中，一眼清晰一周任务安排及其分类。\\n\\n- 「今日日历」： 你可以查看“本月日历”和“今日任务”，点击任务还可以快速访问「今天」智能清单。\\n\\n\\n**3. 四象限**\\n\\n- 你可以在四象限中查看你的任务，并且将更多精力聚焦在重要且紧急的事情上。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/1f8c8f1102689b579bfb35ed9513a726.png)\\n\\n\\n**4. 习惯**\\n\\n我们提供「今日习惯」、「本周习惯」、「习惯热力图」、「习惯周进度」4款小组件。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/61c39d45a275e738e058e2e3a104736b.png)\\n\\n- 「今日习惯」：你可以一目了然地查看每天要养成的习惯，更有目标性地培养好习惯。\\n- 「本周习惯」：你可以查看本周需要打卡的习惯进度，更方便地追踪完成情况。\\n- 「习惯热力图」：你可以一目了然地追踪本月中每一天的完成情况、整月的进度，帮助你养成好习惯。\\n- 「习惯周进度」：你可以快速查看单个习惯的一周打卡情况。\\n\\n\\n**5. 番茄专注**\\n\\n我们提供「番茄」、「今日专注」、「专注时间分布」、「常用专注」4款小组件。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/ab64e80052f64fc7b8399366f1ddecdc.png)\\n\\n- 「番茄」：你可以在桌面上开始专注，聚焦当下需要完成的事情。\\n\\n- 「今日专注」：你可以查看每日的专注时间，把握时间，提高效率。\\n\\n- 「专注时间分布」：你可以快速查看本周内每天的专注时长，帮助你更好对一周内的时间分配复盘。\\n\\n- 「常用专注」：你可以快速在桌面开启常用专注。\\n\\n**6. 倒数纪念日**\\n\\n你可以随时看到重要日子的倒计时，让每一个值得期待或纪念的时刻都更有仪式感。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/ea62d283b52d4a3956c46618eb35b299.png)\\n\\n\\n::: spoiler MIUI 小部件\\nMIUI 系统中提供了两款小部件「任务」、「习惯」。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/2976235bfe3b99a299a18538740f08e8.png)\\n:::\\n\\n::::\\n\\n::::tab [鸿蒙]\\n\\n**锁屏卡片**\\n\\n添加滴答清单锁屏卡片，无需解锁手机即可在锁屏界面查看今日任务、快速添加任务。\\n\\n![m--216.54%](/dida-assets/cdn.dida365.cn/hc/all/7c020eec488e445fa3e42346804363fa.png)\\n\\n::: spoiler 如何添加锁屏卡片？\\n\\n1. 在锁屏界面双指捏合，进入锁屏编辑状态；\\n2. 点击卡片添加位；\\n3. 在列表中找到滴答清单，选择需要的卡片添加至锁屏即可。\\n\\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/1131701fbf63b4963f7274b54264ef29.png)\\n:::\\n\\n\\n**桌面小组件**\\n\\n**1. 任务**\\n\\n目前提供 5种不同大小的「任务」小组件，方便你快速查看和管理任务。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/102cfe88640b7537dccbd647eaafb605.png)\\n\\n**2. 日历**\\n\\n我们提供「日历+任务」、「日历月视图」2款小组件。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/588e359511fbda7de35e077073145d59.png)\\n- **日历+任务**：你可以查看“本月日历”和“今日任务”，点击任务还可以快速访问「今天」智能清单。\\n- **日历月视图**：提供两款不同大小月视图，本月所有事情即刻呈现，轻松扫一眼即可知晓何时忙碌、何时空闲。\\n\\n**3. 四象限**\\n\\n你可以在四象限中查看你的任务，并且将更多精力聚焦在重要且紧急的事情上。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/cc3e01e6c0e7d843ebae8b969ceba7d7.png)\\n\\n**4. 倒数纪念日**\\n\\n你可以随时看到重要日子的倒计时，让每一个值得期待或纪念的时刻都更有仪式感。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/55d1545fd431243b1d3b7bbf747f5fea.png)\\n\\n**5. 习惯**\\n\\n你可以一目了然地查看每天要养成的习惯，更有目标性地培养好习惯。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/954e933193c8c0893ee30199a6b26ac1.png)\\n\\n\\n\\n\\n::::\\n\\n\\n::::tab [macOS]\\n\\n我们提供五种不同小组件：「任务」、「四象限」、「今日习惯」、「今日日历」、「日历月视图」、「倒数纪念日」。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/3202d7c29bbc77af072290ef10b8ef15.png)\\n\\n- 「任务」：你可以查看、访问任务列表，了解每日的任务安排。\\n- 「四象限」：你可以在四象限中查看你的任务，并且将更多精力聚焦在重要且紧急的事情上。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/57004434bb1f4a8c077e64f9299fdf55.png)\\n\\n- 「今日习惯」：你可以实时看到最近的任务安排，快速定位当前任务，高效专注地完成它。\\n- 「今日日历」： 你可以查看“本月日历”和“今日任务”。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/8c897df693c1cc6dd1d9c81f414dcac5.png)\\n\\n- 「日历月视图」：本月所有事情即刻呈现，轻松扫一眼即可知晓何时忙碌、何时空闲。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/19b7fdb8e687d8a9b2dc8a29d61a4efb.jpg)\\n\\n- 「倒数纪念日」：将重要日子的倒数信息添加至桌面，随时查看及时提醒。\\n::::\\n\\n::::tab [Windows]\\n\\n我们提供六种不同小组件：「任务」、「日历」、「四象限」、「番茄专注」、「习惯」、「倒数纪念日」。\\n\\n- 「任务」：你可以查看、访问任务列表，了解每日的任务安排。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/189c0539268ed9a80c98e9c2d029a139.png)\\n\\n\\n- 「日历」： 你可以在日历中轻松查看日程安排。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/2cb04c40e7f2d30d8be7fa49ea98152e.png)\\n\\n\\n- 「四象限」：你可以在四象限中查看你的任务，并且将更多精力聚焦在重要且紧急的事情上。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/41e8d13802b836233d4bfdaf9421ed51.png)\\n\\n\\n- 「番茄专注」：你可以在桌面上开始专注，聚焦当下需要完成的事情。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/ae27e49198fb342b83a562b918fef551.png)\\n\\n- 「习惯」：查看习惯并完成打卡，记录每日打卡进度。\\n\\n- 「倒数纪念日」：查看重要日子的倒数天数，随时了解距离纪念日还有多久。\\n\\n![--70.21%](/dida-assets/cdn.dida365.cn/hc/all/3176439f72c3a47e1fbde68b1b4a897a.png)\\n\\n::::\\n:::::\\n\\n\\n\\n\\n\\n# 如何添加小组件？\\n:::::tabContainer [iOS|Android|鸿蒙|macOS|Windows]\\n\\n::::tab [iOS]\\n**添加“锁屏小组件”**\\n\\n> iOS 系统需升级到 iOS 16，并将滴答清单更新到 6360 版本及以上。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/ae8944e2c288c15fe40a9f94a5d45ef3.png)\\n\\n1. 在锁屏状态下，长按屏幕进入设置模式，点击「自定」。\\n2. 点击屏幕中间的「添加小组件」，找到「滴答清单」。\\n3. 选择需要的小组件类型，点击或拖移即可添加。\\n\\n\\n> 如果在锁屏小组件列表内，没有找到滴答清单，可以尝试以下两种方法：\\n> \\n> 1.如果你刚升级应用，请先打开重新打开一次 APP，然后再进行添加。\\n> \\n> 2.如果还没有找到，重启手机后再进行添加（或者在「设置」-「通用」-「语言与地区」中切换语言，实现快速重启）。\\n\\n\\n\\n\\n**桌面小组件**\\n\\niOS 15以上系统添加滴答清单小组件，长按屏幕点击左上角「+」，搜索滴答清单，就能选择你需要的小组件。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/1b9e331dce9f5b61023b5519008b5090.png)\\n::::\\n\\n::::tab [Android]\\n由于各安卓手机品牌「添加小部件」的方式各有不同，你可以根据手机品牌在下方找到相应的添加方法。\\n\\n**华为**\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/dc5b5f648babb1303bb8e0c34426e4ba.png)\\n\\n1. 长按桌面空白处或双指缩放屏幕，进入桌面编辑状态，点击下方「窗口小工具」。\\n2. 找到「滴答清单」，选择需要的小部件。\\n3. 添加成功\\n\\n**小米**\\n\\n**「添加小米小部件」**\\n\\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/383879a59d8d1fab59310c210cef50f4.png)\\n\\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/e2d35729683ea0ceb7956231115b6817.png)\\n\\n\\n1. 长按桌面空白处或双指缩放屏幕，进入桌面编辑状态，点击下方的「小部件」。\\n2. 进入「全部应用」或者「搜索」，找到「滴答清单」，选择需要的小部件。\\n3. 点击「添加到桌面」按钮，即可添加成功。\\n\\n**「添加安卓小部件」**\\n\\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/383879a59d8d1fab59310c210cef50f4.png)\\n\\n![l--101.54%](/dida-assets/cdn.dida365.cn/hc/all/f0849163e0facf454462f89ead4a5ad5.png)\\n\\n1. 长按桌面空白处或双指缩放屏幕，进入桌面编辑状态，点击下方的「小部件」。\\n2. 进入「全部应用」或者「搜索」，点击底部的「安卓小部件」。\\n3. 找到「滴答清单」，选择需要的小部件，点击即可添加成功。\\n\\n**MIUI 12**\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/e539e742e7aafa8616ac779366dc1f10.png)\\n\\n1. 长按桌面空白处或双指缩放屏幕，进入桌面编辑状态，点击下方的「添加工具」。\\n2. 找到「滴答清单」，选择需要的小部件。\\n3. 点击即可添加成功。\\n\\n**OPPO**\\n\\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/6d231a9e0a09eaccea46184493ea398c.png)\\n\\n\\n1. 长按桌面空白处或双指缩放屏幕，进入桌面编辑状态，点击下方「卡片」。\\n2. 在「卡片中心」页面滑动到底，找到「插件」入口，点击进入。\\n3. 在「插件」页面找到滴答清单，选择需要的小组件即可添加。\\n\\n\\n**VIVO**\\n\\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/c2ae5746868c4f20237d07af97f1dcac.png)\\n\\n![l--101.59%](/dida-assets/cdn.dida365.cn/hc/all/fe35b0ca839631d96cc824a8e716d854.png)\\n\\n\\n1. 长按桌面空白处或双指缩放屏幕，进入桌面编辑状态，点击下方「组件」。\\n2. 在「原子组件」弹窗滑动到底，找到「应用挂件」入口，点击进入。\\n3. 在「应用挂件」弹窗找到滴答清单，点击进入选择需要的小组件即可添加。\\n\\n**三星**\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/8ff37c0f05b16c2ae95270bebdad7347.png)\\n\\n1. 长按桌面空白处或双指缩放屏幕，进入桌面编辑状态，点击下方「小组件」。\\n2. 搜索「滴答清单」，选择需要的小部件。\\n3. 点击「添加」，即可添加成功。\\n::::\\n\\n::::tab [鸿蒙]\\n\\n\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/4e44985b9812c437ded48546e24f85fa.png)\\n\\n1. 在桌面长按 滴答清单 图标，选择 **卡片**。\\n2. 选择所需的小组件样式并**添加到桌面**。\\n3. 长按小组件即可拖动，调整到合适的位置。\\n\\n::::\\n\\n::::tab [macOS]\\n点击桌面右上角的时间，滑动到最下面点击「编辑小组件」，搜索滴答清单，选择你需要的小组件。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/d9b5405455cca559f218f092fe60a1c5.png)\\n\\n::::\\n\\n::::tab [Windows]\\n通过任务栏右击滴答清单图标添加桌面小组件。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/d81021f264fc035f47d925fbea2b2e54.png)\\n\\n或者在屏幕右下角的系统托盘，通过右键点击「滴答清单」图标添加桌面小组件。\\n\\n![l--78.26%](/dida-assets/cdn.dida365.cn/hc/all/6bb47a0303e4f47a7471b70d5d6fa36d.png)\\n\\n你还可以进入「设置」 → 「桌面小部件」 → 选择并添加需要的小部件。\\n::::\\n\\n:::::\\n\\n\\n\\n# 常见问题\\n::: spoiler iOS 小组件为什么不能支持点击完成任务？\\niOS桌面小组件已支持交互，需要将系统升级至 iOS 17，滴答清单升级为最新版本，即可体验。\\n:::\\n\\n::: spoiler Mac 如何把小组件放在桌面上？\\n目前 macOS 14.0 已经支持将小组件放在桌面上，并且支持交互。需要将系统升级至 macOS 14.0 ，在编辑小组件时将小组件拖拽至桌面即可。\\n:::\\n\\n\\n::: spoiler 如何编辑小组件？\\n在桌面长按小组件，可以对小组件的“主题”、“显示内容”、“夜间模式”等等进行配置。\\n:::\\n::: spoiler 安卓为什么没有日视图？\\n安卓端的日视图叫做时间轴，你可以长按小部件，选择「编辑小部件」进入到「配置桌面小部件」进行设置。\\n:::\\n::: spoiler 有没有四象限小组件？\\n我们已支持四象限小组件，你可以向左滑动寻找。\\n\\n:::\\n\\n\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":646,\"order\":549755813888,\"status\":0,\"sectionId\":\"special\",\"createdTime\":\"2022-07-06T08:36:54.994Z\",\"modifiedTime\":\"2026-10-12T06:13:50.439Z\",\"postId\":\"6950366960659988480\",\"__v\":0,\"parentId\":null,\"pinInSearch\":false,\"area\":\"help-center\",\"shortTitle\":\"\"},{\"area\":\"help-center\",\"_id\":\"66308f0b47c89fff9258e204\",\"author\":\"\",\"description\":\"\",\"title\":\"iCloud 日历\",\"content\":\"当你想在滴答清单中查看 iCloud 日历，你可以通过订阅 iCloud 的方式，轻松实现。\\n\\n# 添加日历\\n\\n进入「设置」-「导入与关联应用」-「日历」，点击「iCloud」，添加 iCloud 账号。\\n\\n![--65.93%](/dida-assets/cdn.dida365.cn/hc/all/b7f83aea9b0fe8a8ebd971872f8e61e8.png)\\n\\niCloud 要求需要有 App 专用的密码才能连接账号。\\n\\n# 获取专用密码\\niCloud 要求生成一个App专用的密码才能连接账号，点击「生成 App 专业密码」选项，前往 Apple 网站。在页面中登录你的 Apple ID后，选择 App 专用密码生成密码。将获取到的密码，输入滴答清单中完成添加账号。\\n\\n\\n![--65.93%](/dida-assets/cdn.dida365.cn/hc/all/841d480c912aadd06eb0beae02201a0c.png)\\n\\n\\n# 添加日历事件\\n\\n订阅成功后，你可以在滴答清单中订阅日历中看到日历，并且点击「+」，可添加日程。添加成功后，也会同步到 iCloud 日历中。 \\n\\n![--65.93%](/dida-assets/cdn.dida365.cn/hc/all/87599015c3eda8492853319e98e8ccc8.png)\\n\\n\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":3,\"order\":549755813888,\"status\":0,\"pinInSearch\":false,\"sectionId\":\"feature\",\"createdTime\":\"2024-04-30T06:26:19.653Z\",\"modifiedTime\":\"2026-05-08T06:48:41.774Z\",\"postId\":\"7190959639616290816\",\"__v\":0,\"parentId\":\"6949998599191134208\"},{\"_id\":\"680f1ce71c42a13a390ba1ae\",\"author\":\"\",\"description\":\"\",\"title\":\"打造专属纪念页\",\"content\":\"每个倒数纪念日都承载着独特的意义，为重要的日子设计专属的视觉印记，让每一天的等待都充满温度与期待。\\n\\n# 设置样式入口\\n\\n倒数纪念日支持设置样式，你可以为你每个倒数纪念日挑选一款心仪的样式，让它在你的列表中更加醒目、有仪式感。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n进入一个倒数纪念日页面，点击右下角的「样式」按钮，即可开始为这个纪念日挑选样式。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/987d5c8a6a4ca038ed1ba999deb57f0e.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n将鼠标悬停在某个倒数纪念日卡片上，点击右上角的「...」-「样式」按钮，即可进入样式设置界面。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/9c8c63a9251b0ae70127e843a4ecea86.png)\\n\\n\\n\\n::::\\n\\n:::::\\n\\n# 超多样式\\n滴答清单提供了丰富多样的样式选项，满足你对不同重要日子的表达需求。无论是简洁大方、温暖治愈，或者是萌趣卡通、热情多巴胺......都可以找到契合心情的风格。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/0a6e46a4c8822469b996a31a40f929cf.png)\\n\\n\\n\\n# 自定义颜色\\n\\n挑选样式后，还可以为它配置专属颜色。 通过自定义颜色，让每个倒数纪念日更具个人特色，也更容易一眼识别。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/037f34b4a2be374353816a1290f1d866.png)\\n\\n::::\\n\\n::::tab [desktop]\\n\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/9c1be8d2adab288df2c96000fbcd2ef2.png)\\n\\n\\n\\n::::\\n\\n:::::\\n\\n# 自定义图片\\n\\n当你选择了「图片样式」后，还可以进一步替换背景图片，赋予每个纪念日独一无二的故事和情感。\\n\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n选择图片样式后，切换到「图片」选项，即可替换图片或者上传心仪的背景图，让每一个纪念日更加生动有趣。\\n\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/18f99e3f02e5d71247cd24dc9087b2ca.png)\\n\\n::::\\n\\n::::tab [desktop]\\n\\n在样式编辑窗口，点击「切换图片」，可以上传新的背景图片，让每一个纪念日更加生动有趣。\\n\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/3393ec38036fdecceed5d78f3dd179cf.png)\\n\\n\\n\\n\\n为每个倒数纪念日设置样式后，你的页面会变得更加丰富而有温度。\\n\\n::::\\n\\n:::::\\n\\n## 天周年显示切换\\n当你看到「已经恋爱 2000 天」，是不是也想知道这是多少年，或是多少周？\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n点进一个倒数纪念日，在倒数纪念日详情页中，点击中间的天数，就能在**天、年、周**三种单位间快速切换，用不同的单位更直观地感受时间的流逝。\\n\\n::: video /dida-assets/cdn.dida365.cn/hc/all/784e823b98a662369220bb5a62bf123b.mp4\\n:::\\n\\n\\n::::\\n\\n::::tab [desktop]\\n点击倒数纪念日卡片上的天数，就能在**天、年、周**三种单位间快速切换，用不同的单位更直观地感受时间的流逝。\\n\\n![](/dida-assets/cdn.dida365.cn/hc/all/4bdb06441f15809607d5a83729d6fc2b.png)\\n::::\\n\\n:::::\\n\\n# 添加备注\\n想记录关于这一天的小故事，或者留下一些提醒信息？在纪念日详情页中，你可以点击左下角的「备注」按钮，为这个日子添加一段文字记录。\\n\\n写备注时，点击左下角的「**插入时间**」按钮可以快速插入当前时间；你还可以设置备注是否「**在详情页中显示**」，让重要信息一眼就能看到。\\n\\n![--66.01%](/dida-assets/cdn.dida365.cn/hc/all/67d568a445fe4f6c376a89678ede8794.png)\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":2,\"order\":549755813888,\"status\":0,\"pinInSearch\":false,\"sectionId\":\"feature\",\"area\":\"help-center\",\"createdTime\":\"2025-04-28T06:15:03.177Z\",\"modifiedTime\":\"2026-05-08T06:47:32.360Z\",\"postId\":\"7322503597483098112\",\"__v\":0,\"shortTitle\":\"\",\"parentId\":\"7322192298849075200\"},{\"_id\":\"62c3ef210223aebb27da24ce\",\"author\":\"\",\"description\":\"\",\"title\":\"玩转微信\",\"content\":\"# 微信公众号\\n通过绑定滴答清单的微信服务号，你可以直接与服务号对话，无论是输入文字还是发送语音，滴答清单都能自动识别并保存为任务，并可设置提醒，确保你的待办不被遗漏。\\n\\n这一方式省去了在应用间切换和复制粘贴的麻烦，让你随时随地快速记录灵感与事务。\\n\\n## 操作说明\\n\\n**1. 关注滴答清单服务号（didalist）**\\n\\n微信扫描下方二维码，或者搜索“滴答清单”公众号。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/e34dda37b796acd4b76f151b560de294.png)\\n\\n\\n**2. 绑定滴答清单账号**\\n\\n你需要先在滴答清单中绑定微信账号，操作方法如下：\\n:::::tabContainer [mobile|desktop]\\n\\n::::tab [mobile]\\n进入「账户信息」页面，在「第三方账户」中绑定微信。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/ef06d3a65f8c57a506a77b84ef8aca50.png)\\n\\n\\n::::\\n\\n::::tab [desktop]\\n前往网页版滴答清单的「设置 > 账户安全」，完成微信绑定。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/eb06f9308fd09e78cb421da5ce99debc.png)\\n\\n\\n::::\\n\\n:::::\\n\\n**3. 在服务号中直接输入任务内容**，支持文字、图片、语音、网页（文件暂不支持）\\n\\n**4. 建议将服务号置顶，便于随手添加任务**\\n> 例如输入 “买牛奶 🥛” 或发送一张购物清单截图，即可自动保存为任务，默认保存在「收集箱」中。\\n\\n\\n## 配置滴答清单公众号\\n1. 关注「滴答清单」微信公众号\\n2. 进入公众号菜单栏，点击「更多功能」 > 「配置公众号」\\n3. 按照页面提示，完成相关功能配置\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/da2c67fd93bcf7c62993c63f246d3f2d.png)\\n\\n\\n\\n::: spoiler 如何解绑/更换？\\n进入「账户信息」页面，在「第三方账户」栏目中，点击「微信」旁的解除绑定按钮，即可完成解绑操作。\\n\\n解绑后，你可以使用新的微信账号重新绑定。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/47274892350fb0e0ff1be11705474ad3.png)\\n\\n\\n:::\\n\\n\\n# 滴答小助手\\n你可以在微信聊天中，将需要保存的文字、图片、网页等信息转发给「滴答小助手」，内容将自动同步到滴答清单 App 中，帮你快速收集待办，轻松管理琐事灵感。\\n\\n## 绑定滴答小助手\\n- 进入「设置 > 导入与关联应用 > 微信」\\n- 选择「添加小助手」并保存二维码 → 添加为微信好友即可。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/1b684b4968c7d4a054610c061e954abf.png)\\n\\n\\n>💡 若尚未绑定滴答清单账号，请先关注公众号「滴答清单」，在「更多功能 > 我的账户」中完成账号绑定。\\n\\n\\n## 使用方法\\n成功添加并绑定后，只需将微信中的文字、图片、网页、聊天记录等转发给「滴答小助手」，内容会自动采集至滴答清单 App。\\n\\n![l](/dida-assets/cdn.dida365.cn/hc/all/3fac01f079494067111fad67dadb984a.png)\\n\\n\\n## 在滴答清单中查看\\n所有转发内容会统一保存至标签：#微信采集，你可以：\\n- 进入任务后进一步编辑内容\\n- 对不再需要的任务进行删除整理\\n- 重新归类或添加更多标签，便于后续管理\\n\\n\\n# 常见问题\\n::: spoiler 微信公众号和滴答小助手有什么区别？\\n\\n\\n滴答清单服务号更加适合用于**创建任务**，可支持文字/语音并且自动识别时间创建任务，同时也会回复你：创建任务成功。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/331ff981f94a6d7c84bb4de25bbb33f5.png)\\n\\n\\n而「滴答小助手」则更适合「转发消息」，你可以将所有想要收藏的内容转发给ta，小助手会将你所有发送的消息都将直接保存至滴答清单中，不会给你任何回复。\\n\\n![m](/dida-assets/cdn.dida365.cn/hc/all/de1727a8f8cd9864fc239be46f31239a.png)\\n\\nPS. 助手不支持语音识别的哦，会将语音文件保存至滴答清单中。\\n\\n\\n:::\\n\\n::: spoiler 如果被滴答小助手删除好友怎么办？\\n由于添加小助手有人数限制，太久没有使用会被系统清理，如果需要使用需要再次添加。\\n\\n具体操作步骤如下：\\n\\n1.删除滴答小助手联系人；\\n\\n2.确认是否删除成功，微信中搜索滴答小助手，没有对应的联系人；\\n\\n3.重新扫码添加滴答小助手（免验证通过的，无需我们做任何操作）。\\n\\n\\n\\n![s](/dida-assets/cdn.dida365.cn/hc/all/fcba0321b52710ff3b7c93f8e20f538f.png)\\n\\nPS.滴答小助手为高级会员功能\\n:::\\n\",\"tags\":[\"\"],\"hideIndex\":true,\"favs\":22,\"order\":1099511627776,\"status\":0,\"sectionId\":\"feature\",\"createdTime\":\"2022-07-05T07:58:25.283Z\",\"modifiedTime\":\"2026-05-08T06:49:17.644Z\",\"postId\":\"6949994885164302336\",\"__v\":0,\"parentId\":\"6949998557218734080\",\"pinInSearch\":false,\"area\":\"help-center\",\"shortTitle\":\"\"},{\"_id\":\"62c544ab5084b6294bef6109\",\"author\":\"\",\"description\":\"\",\"title\":\"📆 日历 \",\"content\":\"![--56.33%](/dida-assets/cdn.dida365.cn/hc/all/1e29d2b607e71b556fea2e46830ec0a5.jpg)\\n\\n时间管理的关键，不仅在于高效地利用眼前的每分每秒，更在于有一个好的规划。我们应该清楚地知道，在一段的时间里应该做哪些事、完成哪些长远的目标 🎯。\\n\\n所以，我们为你提供了多个日历视图，方便你更好的安排规划。 \\n\\n👉 [周视图：轻松安排周计划](/articles/6950641140068515840)\\n\\n👉 [月视图：这个月做了什么一目了然](/articles/6950640298334617600)\\n\\n👉 [年视图：查看年度任务完成情况](/articles/7397517843383713792)\\n\\n👉 [列表视图：按天查看任务](/articles/6950643979079647232)\\n\\n\\n除此之外，我们也提供了丰富的显示设置，包括农历、节假日、筛选部分清单等功能。\\n👉 [日历显示设置](/
