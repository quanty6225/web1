    <script type="text/javascript">
      (function() {
          var loadingTheme = {
              isNightTheme: false,
              currentTheme: ""
          };
          try {
              var darkThemeScreenBackgroundColors = {
                  night: "#1c1c1c",
                  darkcyan: "#171a23",
                  darkgreen: "#1c2123",
                  darkyellow: "#23201e",
                  darkpink: "#1d191c",
                  darkpurple: "#1c191d",
                  darkcustom: "#1c1c1c"
              };
              var currentTheme = "grey";
              var autoDarkThemeSetting = "true";
              try {
                  if (autoDarkThemeSetting === "true") {
                      if (
                          typeof window.matchMedia === "function" &&
                          window.matchMedia("(prefers-color-scheme: dark)").matches
                      ) {
                          currentTheme = "night" || "night";
                      }
                  } else if (window.localStorage) {
                      var appTheme = window.localStorage.getItem("appTheme");
                      if (appTheme) {
                          currentTheme = appTheme;
                      }
                  }
              } catch (error) {
                  // 浏览器禁止访问系统主题或本地存储时，使用服务端返回的主题。
              }
              var screenBackgroundColor = darkThemeScreenBackgroundColors[currentTheme];
              if (screenBackgroundColor) {
                  loadingTheme.isNightTheme = true;
                  loadingTheme.currentTheme = currentTheme;
              }
          } catch (error) {
              // 主题初始化异常时保留默认浅色 loading，不影响应用脚本加载。
          }
          window.__webappLoadingTheme = loadingTheme;
      })();
    </script>
