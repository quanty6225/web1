<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="5 3 41 41">
  <!-- Onboarding Guide category icon: rocket in the help site's blue line style -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- motion lines -->
    <path d="M6 33 L13 26" stroke="#B9CFF5" stroke-width="2"/>
    <path d="M9 41 L18 32" stroke="#B9CFF5" stroke-width="2"/>
    <path d="M17 44 L24 37" stroke="#B9CFF5" stroke-width="2"/>
    <g transform="rotate(45 27 23)">
      <!-- fins -->
      <path d="M20.5 25 L15.5 32 L20.5 31.5 Z" fill="#3F6AD8" stroke="#3F6AD8" stroke-width="1.5"/>
      <path d="M33.5 25 L38.5 32 L33.5 31.5 Z" fill="#3F6AD8" stroke="#3F6AD8" stroke-width="1.5"/>
      <!-- body -->
      <path d="M27 4 C33.5 9.5 35.5 18 34 31 L20 31 C18.5 18 20.5 9.5 27 4 Z" fill="#D6E3FA" stroke="#3F6AD8" stroke-width="2"/>
      <!-- nose band -->
      <path d="M22.3 12.5 C25.5 11.6 28.5 11.6 31.7 12.5" stroke="#3F6AD8" stroke-width="1.5"/>
      <!-- window -->
      <circle cx="27" cy="19.5" r="3.6" fill="#FFFFFF" stroke="#3F6AD8" stroke-width="2"/>
      <!-- nozzle -->
      <path d="M23.5 31 L24.5 34 L29.5 34 L30.5 31" fill="#3F6AD8" stroke="#3F6AD8" stroke-width="1.5"/>
      <!-- flame -->
      <path d="M24.5 35.5 C25 40 26 42.5 27 44 C28 42.5 29 40 29.5 35.5 Z" fill="#9DBBF2" stroke="#9DBBF2" stroke-width="1"/>
    </g>
  </g>
</svg>
