<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Continue to Reclaim</title><style>body{margin:0;background:#f7f7fc;color:#22232b;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{background:white;border:1px solid #e4e4ed;border-radius:18px;width:360px;max-width:85vw;padding:36px}h1{font-size:24px;margin:0 0 8px}p{color:#70707e;line-height:1.5}label{display:block;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #dddde9;border-radius:8px;font:inherit}button{background:#5a5aff;color:white;border:0;margin-top:18px;cursor:pointer}a{color:#5a5aff}[role=alert]{color:#bb3457}</style></head><body><main><h1>Continue to Reclaim</h1><p>Verify your local {{PROVIDER}} account by email.</p><form id="email-form"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email"><button>Continue</button></form><form id="code-form" hidden><p>Check your email for a login link or code.</p><label for="code">Login code</label><input id="code" required autocomplete="one-time-code"><button>Verify and continue</button><button type="button" id="resend">Resend email</button></form><p id="error" role="alert"></p><a href="/login">Back to login</a></main><script>const csrf='{{CSRF}}';async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Reclaim-CSRF':csrf},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||d.detail);return d}async function send(){await api('/local/auth/challenge',{email:document.querySelector('#email').value});document.querySelector('#email-form').hidden=true;document.querySelector('#code-form').hidden=false;document.querySelector('#code').focus()}document.querySelector('#email-form').onsubmit=async e=>{e.preventDefault();try{await send()}catch(e){document.querySelector('#error').textContent=e.message}};document.querySelector('#code-form').onsubmit=async e=>{e.preventDefault();try{await api('/local/auth/verify',{code:document.querySelector('#code').value});const next=sessionStorage.getItem('reclaim-invite-return');location.href=next&&/^\/team-invite\/[A-Za-z0-9_-]+$/.test(next)?next:'/planner'}catch(e){document.querySelector('#error').textContent=e.message}};document.querySelector('#resend').onclick=()=>send().catch(e=>document.querySelector('#error').textContent=e.message);</script></body></html>
