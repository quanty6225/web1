<body class="edit_identity identity_validation" data-local-page="fef3bd64fec67753" data-local-auth="false" data-source-comment-total="0">

<div id="header" class="masthead clearfix">

  <a class="masthead__lp-logo" href="/launchpad/">Launchpad</a>

  <ul class="nav">

<div class="balloon">
  


  <form class="identity_form" id="edit_identity_28796252" data-validation-url="/identity/validate" enctype="multipart/form-data" action="/identity" accept-charset="UTF-8" method="post"><input type="hidden" name="utf8" value="✓"><input type="hidden" name="_method" value="patch"><div class="avatar-upload avatar-upload--unhinted txt--center">
      <div class="avatar-upload__photo avatar-upload__photo--small flush--top">
        <img src="/api/avatar.svg" loading="eager">
      </div>

      <label for="identity_avatar">Upload your photo…</label>
      <br>
      <input type="file" name="identity[avatar]" id="identity_avatar">
    </div>

    <div class="field field--validated">
      <label class="field__label" for="name">Name</label>
      <input tabindex="1" id="name" class="input--text" placeholder="e.g. Julie Young" type="text" value="Dee" name="identity[name]">
      <p class="field__hint field__hint--invalid"></p>
    </div>

    <div class="field field--validated">
      <label class="field__label" for="email_address">Email address</label>
      <input tabindex="3" id="email_address" class="input--text" placeholder="e.g. julie.young@hey.com" data-validation-alias="username" type="text" value="demo@basecamp.offline.invalid" name="identity[email_address]">
      <p class="field__hint field__hint--invalid"></p>
    </div>

    <div class="field">
      <label class="field__label">Login &amp; security</label>
      <p>
        You currently log in with
          your password.
        <a class="decorated" href="/identity/login_option">Change this</a>
      </p>
    </div>


    
    <input type="hidden" name="proceed_to" id="proceed_to" value="/identity/edit">
    <input type="hidden" name="return_to" id="return_to" value="/identity/edit">

    <input type="submit" name="commit" value="Save my changes" tabindex="8" class="action_button primary push_half--bottom" data-disable-with="Save my changes">


</form></div>



<script defer src="/static/local.js"></script></body></html>
